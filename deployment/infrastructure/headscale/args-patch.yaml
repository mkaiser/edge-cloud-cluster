# Wrenix headscale chart v0.3.2 has two incompatibilities with headscale v0.28:
#   1. args: ["headscale","serve"] — but v0.28 images use ENTRYPOINT, so the actual
#      command becomes "/ko-app/headscale headscale serve" → "unknown command" crash.
#   2. No extraVolumes/extraVolumeMounts support → can't mount OIDC client secret.
#
# This Sync-phase job patches both after every sync.
# Sync hooks run before ArgoCD waits for app health, breaking the deadlock where
# PostSync would never run (PostSync requires healthy state, but the pod can only
# become healthy after the OIDC volume is mounted by this patch).
# ignoreDifferences in the ArgoCD Application suppresses the resulting drift.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-args-patch
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-args-patch
  namespace: headscale
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-args-patch
  namespace: headscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headscale-args-patch
subjects:
- kind: ServiceAccount
  name: headscale-args-patch
  namespace: headscale
---
apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-args-patch
  namespace: headscale
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: headscale-args-patch
      restartPolicy: OnFailure
      containers:
      - name: patch
        image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          DEPLOY=headscale
          NS=headscale

          # 0. Force Recreate strategy. headscale's data PVC is ReadWriteOnce (Longhorn),
          # but the chart's Deployment defaults to RollingUpdate — so any pod-template change
          # (e.g. a config/extra_records edit) spins up a NEW pod that can't attach the PVC
          # until the OLD one releases it → "Multi-Attach error" → rollout deadlocks forever
          # (0/1 new replicas available) and the resync hangs. Recreate terminates the old
          # pod first, so the new one attaches cleanly. /spec/strategy is in the Application's
          # ignoreDifferences, so this patch doesn't fight ArgoCD.
          STRATEGY=$(kubectl get deployment $DEPLOY -n $NS \
            -o jsonpath='{.spec.strategy.type}' 2>/dev/null || true)
          if [ "$STRATEGY" != "Recreate" ]; then
            echo "Patching strategy: $STRATEGY -> Recreate (RWO PVC, avoid Multi-Attach)"
            kubectl patch deployment $DEPLOY -n $NS --type=json -p \
              '[{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}}]'
          else
            echo "Strategy already Recreate."
          fi

          # 1. Fix args: chart hardcodes ["headscale","serve"] but v0.28 images use ENTRYPOINT
          ARGS=$(kubectl get deployment $DEPLOY -n $NS \
            -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null)
          if echo "$ARGS" | grep -q '"headscale"'; then
            echo "Patching args: $ARGS -> [serve]"
            kubectl patch deployment $DEPLOY -n $NS --type=json \
              -p '[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["serve"]}]'
          else
            echo "Args already correct: $ARGS"
          fi

          # 2. Add OIDC client secret volume if missing (chart has no extraVolumes support)
          VOLUMES=$(kubectl get deployment $DEPLOY -n $NS \
            -o jsonpath='{.spec.template.spec.volumes[*].name}' 2>/dev/null)
          if echo "$VOLUMES" | grep -q 'oidc-client-secret'; then
            echo "OIDC volume already present."
          else
            echo "Adding OIDC client secret volume and mount..."
            kubectl patch deployment $DEPLOY -n $NS --type=json -p '[
              {
                "op": "add",
                "path": "/spec/template/spec/volumes/-",
                "value": {
                  "name": "oidc-client-secret",
                  "secret": {
                    "secretName": "headscale-oidc-client-secret",
                    "items": [{"key": "client-secret", "path": "oidc_client_secret"}]
                  }
                }
              },
              {
                "op": "add",
                "path": "/spec/template/spec/containers/0/volumeMounts/-",
                "value": {
                  "name": "oidc-client-secret",
                  "mountPath": "/etc/headscale/oidc",
                  "readOnly": true
                }
              }
            ]'
            echo "OIDC volume patched."
          fi

          # 3. Inject HEADSCALE_DATABASE_POSTGRES_PASS from headscale-pg-user secret.
          # headscale uses viper: HEADSCALE_DATABASE_POSTGRES_PASS overrides database.postgres.pass.
          if kubectl get secret headscale-pg-user -n $NS >/dev/null 2>&1; then
            ENV_NAMES=$(kubectl get deployment $DEPLOY -n $NS \
              -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}{"\n"}{end}' 2>/dev/null || true)
            if echo "$ENV_NAMES" | grep -qx "HEADSCALE_DATABASE_POSTGRES_PASS"; then
              echo "DB password env already present."
            else
              echo "Injecting HEADSCALE_DATABASE_POSTGRES_PASS from headscale-pg-user..."
              PW='{"name":"HEADSCALE_DATABASE_POSTGRES_PASS","valueFrom":{"secretKeyRef":{"name":"headscale-pg-user","key":"password"}}}'
              HAS_ENV=$(kubectl get deployment $DEPLOY -n $NS \
                -o jsonpath='{.spec.template.spec.containers[0].env[0].name}' 2>/dev/null || true)
              if [[ -n "$HAS_ENV" ]]; then
                kubectl patch deployment $DEPLOY -n $NS --type=json \
                  -p "[{\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/env/-\",\"value\":$PW}]"
              else
                kubectl patch deployment $DEPLOY -n $NS --type=json \
                  -p "[{\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/env\",\"value\":[$PW]}]"
              fi
              echo "DB password injected."
            fi
          fi
          echo "Done."
