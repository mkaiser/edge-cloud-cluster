# Authentik blueprint: Headscale/Headplane OIDC provider + dashboard tile.
#
# Per-app blueprint — shipped by THIS app's ArgoCD Application into the authentik
# namespace and mounted optionally into the Authentik worker
# (deployment/infrastructure/authentik/values.yaml → worker.volumes: bp-headscale).
# If headscale is removed from the sync waves, this ConfigMap is never created,
# the optional mount stays empty, and no Headscale tile appears.
#
# client_secret comes from the authentik-secrets sealed bundle (!Env) and must
# match the headscale OIDC client secret. Redirect URIs use the cluster
# subdomain — rewritten by updateConfigFromProjectSettings.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-headscale
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  headscale.yaml: |
    version: 1
    metadata:
      name: app-headscale
    entries:
      - id: provider-headscale
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: headscale
        attrs:
          client_type: confidential
          client_id: headscale
          client_secret: !Env HEADSCALE_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://vpn.ecc135.cape-project.eu/oidc/callback
            - matching_mode: strict
              url: https://headplane.ecc135.cape-project.eu/admin/oidc/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
      - model: authentik_core.application
        identifiers:
          slug: headscale
        attrs:
          name: Headscale VPN
          group: Infrastructure
          provider: !KeyOf provider-headscale
          meta_launch_url: https://headplane.ecc135.cape-project.eu/admin/oidc/start
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/headscale.svg
      # Access control: this tile launches the headplane ADMIN UI and is grouped
      # under Infrastructure → restrict to employees-extended + admins (infra-view),
      # NOT all employees. Broaden to access-employee-apps if rank-and-file staff
      # need VPN self-enrollment here.
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, headscale]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, access-infra-view]]
        attrs:
          order: 0
          enabled: true
