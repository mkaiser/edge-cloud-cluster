# ArgoCD core Helm values — managed via GitOps (self-managed ArgoCD pattern).
#
# This file covers only ArgoCD infrastructure: server, controller, redis, ingress.
#
# NOT included here (injected by Pulumi bootstrap only):
#   global.domain          — resolved from Pulumi stack config
#   configs.secret.*       — admin password hash + server secret key
#
# To upgrade ArgoCD: bump targetRevision in deployment/argocd/argocd-self.yaml,
# then manually sync the argocd-self Application.

global:
  domain: argocd.ecc135.cape-project.eu
  env:
    - name: TZ
      value: "Europe/Berlin"

configs:
  cm:
    timeout.reconciliation: "5m"
    # Authentik's ingress cert is Let's Encrypt STAGING (untrusted CA) while testing,
    # so ArgoCD's OIDC client can't verify it. Skip verification for the OIDC provider.
    # updateConfigFromProjectSettings.sh flips this to "false" when certIssuerType is
    # letsencrypt-prod (real, trusted certs → verification must stay on).
    oidc.tls.insecure.skip.verify: "true"
    oidc.config: |
      name: Authentik
      issuer: https://id.ecc135.cape-project.eu/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc-client-secret:oidc.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups

  rbac:
    # Authentik group → ArgoCD role:
    #   argocd-admins / authentik-admins → full admin
    #   employees-extended               → read-only (infra view-only)
    # policy.default "" = no access for anyone not matched (employees/external).
    # App access is also gated in Authentik (access-infra-view policy binding).
    policy.csv: |
      g, argocd-admins, role:admin
      g, authentik-admins, role:admin
      g, employees-extended, role:readonly
    policy.default: ""

  # argocd-notifications-cm — email service + templates + triggers.
  # Env vars (SMTP_HOST etc.) are injected into the notifications controller
  # via notifications.extraEnv below and referenced here with the $VAR notation.
  notifications:
    service.email: |
      host: $SMTP_HOST
      port: $SMTP_PORT
      username: $SMTP_USERNAME
      password: $SMTP_PASSWORD
      from: $NOTIFY_FROM

    # Templates for different event types
    template.app-sync-succeeded: |
      email:
        subject: "[ArgoCD] {{.app.metadata.name}} sync succeeded"
        body: |
          Application: {{.app.metadata.name}}
          Status:      Sync Succeeded
          Sync Time:   {{.app.status.operationState.finishedAt}}

          {{if .app.status.operationState.syncResult}}
          {{range .app.status.operationState.syncResult.resources}}
          - {{.kind}}/{{.name}}: {{.status}}
          {{end}}
          {{end}}

          https://argocd.ecc135.cape-project.eu/applications/{{.app.metadata.name}}

    template.app-sync-failed: |
      email:
        subject: "[ArgoCD] ⚠️  {{.app.metadata.name}} sync FAILED"
        body: |
          Application: {{.app.metadata.name}}
          Status:      Sync Failed

          {{if .app.status.operationState.syncResult}}
          {{range .app.status.operationState.syncResult.resources}}
          - {{.kind}}/{{.name}}: {{.status}} {{.message}}
          {{end}}
          {{end}}

          Error: {{.app.status.operationState.phase}} — {{.app.status.operationState.message}}

          https://argocd.ecc135.cape-project.eu/applications/{{.app.metadata.name}}

    template.app-health-degraded: |
      email:
        subject: "[ArgoCD] ⚠️  {{.app.metadata.name}} is DEGRADED"
        body: |
          Application: {{.app.metadata.name}}
          Health:      {{.app.status.health.status}}
          Message:     {{.app.status.health.message}}

          Resources:
          {{range .app.status.resources}}
          - {{.kind}}/{{.name}}: {{.health.status}} — {{.health.message}}
          {{end}}

          https://argocd.ecc135.cape-project.eu/applications/{{.app.metadata.name}}

    template.app-sync-running: |
      email:
        subject: "[ArgoCD] {{.app.metadata.name}} sync started"
        body: |
          Application: {{.app.metadata.name}}
          Status:      Sync In Progress

          https://argocd.ecc135.cape-project.eu/applications/{{.app.metadata.name}}

    # Triggers
    trigger.on-sync-failed: |
      - when: app.status.operationState.phase in ['Error', 'Failed']
        oncePer: app.status.operationState.finishedAt
        send: [app-sync-failed]

    trigger.on-sync-succeeded: |
      - when: app.status.operationState.phase == 'Succeeded'
        oncePer: app.status.operationState.finishedAt
        send: [app-sync-succeeded]

    trigger.on-sync-running: |
      - when: app.status.operationState.phase in ['Running', 'Terminating']
        send: [app-sync-running]

    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        oncePer: app.status.health.status
        send: [app-health-degraded]

    trigger.on-sync-operation-failed: |
      - when: app.status.operationState.phase in ['Error']
        send: [app-sync-failed]

    # Subscribe all apps by default — send critical alerts to ops
    defaultTriggers: |
      - on-sync-failed
      - on-health-degraded

    subscriptions: |
      - recipients:
          - email:$NOTIFY_TO
        triggers:
          - on-sync-failed
          - on-health-degraded
          - on-sync-succeeded

  params:
    # haproxy handles TLS termination; ArgoCD serves plain HTTP internally
    server.insecure: "true"

server:
  replicas: 2 # project-settings: ha.argocdServer
  # Soft spread across nodes when HA scales replicas up. ScheduleAnyway so the single
  # replica stays schedulable when HA is off. No-op at replicas:1.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
  service:
    type: ClusterIP
  extraArgs:
    - --insecure
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
      namespace: prometheus
  ingress:
    enabled: true
    ingressClassName: haproxy
    hosts:
      - argocd.ecc135.cape-project.eu
    annotations:
      haproxy-ingress.github.io/ssl-redirect: "true"
      external-dns.alpha.kubernetes.io/exclude: "true"
    tls:
      - secretName: infra-wildcard-tls
        hosts:
          - argocd.ecc135.cape-project.eu
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

controller:
  replicas: 2 # project-settings: ha.argocdController
  # Soft spread the (already 2) controller shards across nodes.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-application-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
      namespace: prometheus
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
      namespace: prometheus
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

notifications:
  enabled: true
  replicas: 1 # project-settings: ha.argocdNotifications (singleton controller; pinned 1)
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
      namespace: prometheus
  # Inject SMTP credentials from the existing smtp-credentials secret so
  # the notifications controller can send email without a separate secret.
  extraEnv:
    - name: SMTP_HOST
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: host
    - name: SMTP_PORT
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: port
    - name: SMTP_USERNAME
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: username
    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: password
    - name: NOTIFY_FROM
      value: "no-reply@cape-project.eu"
    - name: NOTIFY_TO
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: sendBootstrapFinishMailRecipient
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"


