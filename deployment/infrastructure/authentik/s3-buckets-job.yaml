# Sync Job: ensure Authentik's S3 bucket exists.
# Ownership of this bucket moved from Pulumi (src/storage.ts ensure-s3-bucket loop)
# to the app that uses it (CNPG barman backups → s3://edgecloudinfra-authentik).
# Idempotent (head-bucket || create-bucket). NOT deleted on app removal (data-safe);
# full-teardown wipe lives in scripts/environment/deleteS3Buckets.sh (discovers all
# live buckets).
#
# Uses the authentik-s3-secret sealed secret (Hetzner S3 keys, ACCESS_KEY_ID /
# SECRET_ACCESS_KEY). Hook: Sync (NOT PreSync, NOT PostSync) + sync-wave -1:
#   - Sync (not PreSync): the sealed secret is a normal synced resource, absent
#     during PreSync — a PreSync job's secretKeyRef can't resolve and deadlocks.
#   - wave -1 (not PostSync): the bucket must exist BEFORE the CNPG cluster starts
#     archiving WAL (PostSync runs only after the app is Healthy — too late, and can
#     deadlock if Health depends on backups). wave -1 runs during Sync, before the
#     app's own resources.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-s3-buckets
  namespace: authentik
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ensure-buckets
          image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: authentik-s3-secret
                  key: ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-s3-secret
                  key: SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: "nbg1"
            - name: AWS_PAGER
              value: ""
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ENDPOINT="https://nbg1.your-objectstorage.com"
              for BUCKET in edgecloudinfra-authentik; do
                if aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" 2>/dev/null; then
                  echo "Bucket $BUCKET already exists."
                else
                  echo "Creating bucket $BUCKET ..."
                  aws s3api create-bucket --bucket "$BUCKET" \
                    --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION"
                  echo "Created $BUCKET."
                fi
              done
              echo "Authentik S3 buckets ready."
