# PostSync Job: create/update test users with credentials and group memberships.
# Runs after each sync. Idempotent: creates users on first run, patches on re-runs.
#
# All values are read from the authentik-secrets sealed secret:
#   CLUSTER_ADMIN_USERNAME / CLUSTER_ADMIN_PASSWORD / CLUSTER_ADMIN_EMAIL
#   TEST_USER_USERNAME     / TEST_USER_PASSWORD     / TEST_USER_EMAIL
#
# Group memberships are assigned via the Authentik API using group names defined
# in blueprint-groups.yaml. This job is AUTHORITATIVE — it overwrites each user's
# group list, so any group the bootstrap users need (incl. mfa-exempt) must be in
# ADMIN_GROUPS / USER_GROUPS below.
#
# MFA: enforced for authentik-admins + employees-extended via blueprint-mfa.yaml.
# The bootstrap users are kept in mfa-exempt here so they skip it during testing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-set-passwords
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "6"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-set-passwords
  namespace: authentik
  annotations:
    argocd.argoproj.io/hook: PostSync
    # HookSucceeded (not BeforeHookCreation): keep a FAILED job/pod around so a
    # silent password miss is visible (ArgoCD shows the hook red) and the pod logs
    # survive for debugging. A succeeded run is pruned normally on the next sync.
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  # Retry on transient failures (API not ready, DB mid-bootstrap). With backoffLimit:0
  # a single early flake left the user password-less FOREVER (hook pruned, app Healthy,
  # never re-fired). Retries + the verify step below make this self-healing.
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: authentik-set-passwords
      restartPolicy: Never
      containers:
        - name: set-passwords
          image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
            - name: CLUSTER_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: CLUSTER_ADMIN_USERNAME
            - name: CLUSTER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: CLUSTER_ADMIN_PASSWORD
            - name: CLUSTER_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: CLUSTER_ADMIN_EMAIL
            - name: TEST_USER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: TEST_USER_USERNAME
            - name: TEST_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: TEST_USER_PASSWORD
            - name: TEST_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: TEST_USER_EMAIL
          command: ["/bin/sh", "-ec"]
          args:
            - |
              API="http://authentik-server.authentik.svc.cluster.local/api/v3"
              AUTH="Authorization: Bearer ${AUTHENTIK_TOKEN}"

              echo "Waiting for Authentik API..."
              i=0
              while [ "$i" -lt 60 ]; do
                if curl -fsS -H "$AUTH" "$API/core/users/?username=akadmin" >/dev/null 2>&1; then
                  echo "Authentik API ready."
                  break
                fi
                echo "  waiting... ($i/60)"; sleep 10; i=$((i+1))
              done
              if [ "$i" -ge 60 ]; then echo "ERROR: Authentik API never became ready"; exit 1; fi

              # Return the PK for a group by name, or empty string if not found.
              get_group_pk() {
                curl -fsS -H "$AUTH" "$API/core/groups/?name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote('$1'))")" \
                  | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print(r[0]['pk'] if r else '')" 2>/dev/null || true
              }

              # Build a JSON array of group PKs from a list of group names.
              resolve_groups() {
                PKLIST="[]"
                for gname in "$@"; do
                  GPK=$(get_group_pk "$gname")
                  if [ -n "$GPK" ]; then
                    PKLIST=$(python3 -c "import json,sys; lst=$PKLIST; lst.append('${GPK}'); print(json.dumps(lst))")
                  else
                    echo "  WARNING: group '${gname}' not found in Authentik — skipping" >&2
                  fi
                done
                echo "$PKLIST"
              }

              # Create or update a user; returns the user PK.
              ensure_user() {
                USERNAME="$1"; DISPLAY_NAME="$2"; EMAIL="$3"; GROUPS_JSON="$4"
                PAYLOAD=$(python3 -c "
              import json
              print(json.dumps({
                'username': '${USERNAME}',
                'name': '${DISPLAY_NAME}',
                'email': '${EMAIL}',
                'is_active': True,
                'path': 'users',
                'groups': json.loads('${GROUPS_JSON}'),
              }))
              ")
                EXISTING=$(curl -fsS -H "$AUTH" "$API/core/users/?username=${USERNAME}" \
                  | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print(r[0]['pk'] if r else '')" 2>/dev/null || true)
                if [ -z "$EXISTING" ]; then
                  PK=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                    -d "$PAYLOAD" "$API/core/users/" \
                    | python3 -c "import json,sys; print(json.load(sys.stdin)['pk'])")
                  echo "  Created user '${USERNAME}' (pk=${PK})" >&2
                else
                  PK="$EXISTING"
                  curl -fsS -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
                    -d "$PAYLOAD" "$API/core/users/${PK}/" >/dev/null
                  echo "  Updated user '${USERNAME}' (pk=${PK})" >&2
                fi
                echo "$PK"
              }

              set_password() {
                PK="$1"; PASSWORD="$2"
                curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                  -d "{\"password\": \"${PASSWORD}\"}" \
                  "$API/core/users/${PK}/set_password/" >/dev/null
              }

              # Verify the password actually persisted. set_password can return 2xx yet
              # leave the user usable-password-less if it raced cluster bootstrap — that
              # silent miss is the bug this whole guard exists to catch. The REST
              # serializer doesn't expose has_usable_password, but it does expose
              # `password_change_date`, which Authentik populates only when a usable
              # password is set. A null/empty value => set_password did not stick =>
              # return non-zero so the Job retries (backoffLimit) and, if it never
              # succeeds, the hook stays red instead of going silently Healthy.
              verify_password() {
                USERNAME="$1"
                PCD=$(curl -fsS -H "$AUTH" "$API/core/users/?username=${USERNAME}" \
                  | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print(r[0].get('password_change_date') or '' if r else '')" 2>/dev/null || echo "")
                if [ -z "$PCD" ]; then
                  echo "ERROR: '${USERNAME}' has no usable password after set_password (password_change_date empty) — failing for retry" >&2
                  return 1
                fi
                echo "  verified '${USERNAME}' password persisted (password_change_date=${PCD})" >&2
              }

              echo "Resolving group PKs..."
              # This job is AUTHORITATIVE for the bootstrap users' group membership — it
              # PATCHes the full groups list, overwriting the blueprint. So mfa-exempt
              # MUST be included here, else these test users get forced MFA. (Keep in
              # sync with blueprint-initial-users.yaml.)
              ADMIN_GROUPS=$(resolve_groups authentik-admins employees-extended argocd-admins xwiki-oidc-admins gitlab-admins rocketchat-admins mfa-exempt)
              USER_GROUPS=$(resolve_groups employees mfa-exempt)

              echo "Configuring cluster admin: ${CLUSTER_ADMIN_USERNAME}..."
              ADMIN_PK=$(ensure_user "$CLUSTER_ADMIN_USERNAME" "Cluster Admin" "$CLUSTER_ADMIN_EMAIL" "$ADMIN_GROUPS")
              set_password "$ADMIN_PK" "$CLUSTER_ADMIN_PASSWORD"
              verify_password "$CLUSTER_ADMIN_USERNAME"

              echo "Configuring test user: ${TEST_USER_USERNAME}..."
              USER_PK=$(ensure_user "$TEST_USER_USERNAME" "Test User" "$TEST_USER_EMAIL" "$USER_GROUPS")
              set_password "$USER_PK" "$TEST_USER_PASSWORD"
              verify_password "$TEST_USER_USERNAME"

              echo "Test user credentials configured and verified."
