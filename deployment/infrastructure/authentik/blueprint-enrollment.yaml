# Authentik blueprint: self-service enrollment with email verification + admin approval.
#
# Flow (designation: enrollment, slug: enrollment):
#   1. prompt-first   — username + password + password (repeat)
#   2. prompt-second  — name + email
#   3. user-write     — create the account as INACTIVE (create_users_as_inactive)
#   4. email-verify   — send a confirmation link; activate_user_on_success: FALSE,
#                       so the account stays inactive (email proven, not yet allowed in)
#   The flow ends with no user-login stage — an inactive user gets no session.
#
# "Approval" = an admin sets the user active in Authentik (Directory → Users →
# toggle "Is active"). Once active, normal SSO + per-app auto-provisioning applies.
#
# The flow is exposed as a "Sign up" link on the login page by setting it as the
# enrollment_flow of the default identification stage (last entry).
#
# Email verification uses the global SMTP settings (authentik.email.* in values.yaml
# + AUTHENTIK_EMAIL__PASSWORD from the authentik-smtp sealed secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-enrollment
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  enrollment.yaml: |
    version: 1
    metadata:
      name: self-service-enrollment
    entries:
      - id: flow
        model: authentik_flows.flow
        identifiers:
          slug: enrollment
        attrs:
          name: Self-service enrollment
          title: Request an account
          designation: enrollment
          authentication: require_unauthenticated

      # ---- prompt fields ----
      - id: field-username
        model: authentik_stages_prompt.prompt
        identifiers:
          name: enrollment-field-username
        attrs:
          field_key: username
          label: Username
          type: username
          required: true
          placeholder: Username
          order: 0
      - id: field-password
        model: authentik_stages_prompt.prompt
        identifiers:
          name: enrollment-field-password
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 1
      - id: field-password-repeat
        model: authentik_stages_prompt.prompt
        identifiers:
          name: enrollment-field-password-repeat
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          order: 2
      - id: field-name
        model: authentik_stages_prompt.prompt
        identifiers:
          name: enrollment-field-name
        attrs:
          field_key: name
          label: Full name
          type: text
          required: true
          placeholder: Full name
          order: 0
      - id: field-email
        model: authentik_stages_prompt.prompt
        identifiers:
          name: enrollment-field-email
        attrs:
          field_key: email
          label: Email
          type: email
          required: true
          placeholder: Email
          order: 1

      # ---- domain whitelist: only company-email addresses may register ----
      # Validates the submitted email when the second prompt is sent. On a foreign
      # domain it shows a message and blocks the flow (stacks with email-verify +
      # admin-approval). The domain is templated from baseDomain in project_settings.ts
      # by updateConfigFromProjectSettings.sh (placeholder __ENROLL_EMAIL_DOMAIN__).
      - id: policy-enroll-domain
        model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: enrollment-email-domain
        attrs:
          expression: |
            email = request.context.get("prompt_data", {}).get("email", "")
            if email.split("@")[-1].lower() != "cape-project.eu":
                ak_message("Registration is only available for company members.")
                return False
            return True

      # ---- prompt stages ----
      - id: prompt-first
        model: authentik_stages_prompt.promptstage
        identifiers:
          name: enrollment-prompt-first
        attrs:
          fields:
            - !KeyOf field-username
            - !KeyOf field-password
            - !KeyOf field-password-repeat
      - id: prompt-second
        model: authentik_stages_prompt.promptstage
        identifiers:
          name: enrollment-prompt-second
        attrs:
          fields:
            - !KeyOf field-name
            - !KeyOf field-email
          # Runs on submit, with the entered email in prompt_data → rejects non-company domains.
          validation_policies:
            - !KeyOf policy-enroll-domain

      # ---- create the user as INACTIVE (pending admin approval) ----
      - id: user-write
        model: authentik_stages_user_write.userwritestage
        identifiers:
          name: enrollment-user-write
        attrs:
          user_creation_mode: always_create
          create_users_as_inactive: true
          user_path: "users"

      # ---- invitation (optional): lets admins invite users via a link ----
      # Admin creates an Invitation (Directory → Invitations) bound to this enrollment
      # flow (optionally with fixed_data to prefill email/name) and shares the link.
      # continue_flow_without_invitation: true keeps open self-service signup working
      # too (an invitation just pre-fills / pre-authorises). NOTE: Authentik does not
      # auto-email invitations — the admin sends the generated link.
      - id: invitation
        model: authentik_stages_invitation.invitationstage
        identifiers:
          name: enrollment-invitation
        attrs:
          continue_flow_without_invitation: true

      # ---- email verification (does NOT activate; admin approval still required) ----
      - id: email-verify
        model: authentik_stages_email.emailstage
        identifiers:
          name: enrollment-email-verification
        attrs:
          use_global_settings: true
          activate_user_on_success: false
          subject: "Confirm your email — cape-project"
          template: email/email-account-confirmation.html
          token_expiry: minutes=30

      # ---- bindings ----
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf invitation
          order: 5
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf prompt-first
          order: 10
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf prompt-second
          order: 20
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf user-write
          order: 30
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf email-verify
          order: 40

      # ---- expose as a "Sign up" link on the login page ----
      # !Find (not !KeyOf) — resolves the flow by slug from the DB; the flow entry
      # above is committed earlier in this same apply so the lookup succeeds, and
      # this also tolerates the identification stage being a pre-existing managed
      # object created by another blueprint.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          # user_fields must be repeated — the blueprint serializer validates the
          # whole stage ("at least one source must be selected" otherwise). Matches
          # the existing stage (login by email or username).
          user_fields:
            - email
            - username
          enrollment_flow: !Find [authentik_flows.flow, [slug, enrollment]]
