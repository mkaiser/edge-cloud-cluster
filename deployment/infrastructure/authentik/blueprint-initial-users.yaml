# Authentik blueprint: test users.
# Creates testadmin and testuser with group memberships. Passwords and emails
# are NOT set here — the PostSync job postsync-set-passwords.yaml sets them via
# the Authentik API using values from the authentik-secrets sealed secret.
#
#   testadmin (CLUSTER_ADMIN_USERNAME) → authentik-admins + employees-extended + argocd-admins + xwiki-oidc-admins + gitlab-admins + rocketchat-admins + mfa-exempt  (full rights, no forced MFA)
#   testuser     → employees + mfa-exempt                                 (default user, no forced MFA)
#
# NOTE: both bootstrap users are in `mfa-exempt` so they skip forced MFA while you
# test. Remove them from that group (or delete the users) once real accounts exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-initial-users
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  test-users.yaml: |
    version: 1
    metadata:
      name: test-users
    entries:
      - model: authentik_core.user
        identifiers:
          username: !Env CLUSTER_ADMIN_USERNAME
        attrs:
          name: Cluster Admin
          is_active: true
          path: users
          groups:
            - !Find [authentik_core.group, [name, authentik-admins]]
            - !Find [authentik_core.group, [name, employees-extended]]
            - !Find [authentik_core.group, [name, argocd-admins]]
            - !Find [authentik_core.group, [name, xwiki-oidc-admins]]
            - !Find [authentik_core.group, [name, gitlab-admins]]
            - !Find [authentik_core.group, [name, rocketchat-admins]]
            - !Find [authentik_core.group, [name, mfa-exempt]]
      - model: authentik_core.user
        identifiers:
          username: !Env TEST_USER_USERNAME
        attrs:
          name: Test User
          is_active: true
          path: users
          groups:
            - !Find [authentik_core.group, [name, employees]]
            - !Find [authentik_core.group, [name, mfa-exempt]]
