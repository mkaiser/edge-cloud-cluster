# Authentik Helm values — identity provider (OIDC) for the cluster.
# Applied by the wave6-authentik Application via $values valueFiles.
#
# Secrets (NOT in git) come from the sealed secret `authentik-secrets`:
#   AUTHENTIK_SECRET_KEY              — Authentik session/signing key
#   AUTHENTIK_POSTGRESQL__PASSWORD    — DB password (authentik app side)
#   AUTHENTIK_BOOTSTRAP_TOKEN         — API token for akadmin (used by PostSync job)
#   AUTHENTIK_BOOTSTRAP_PASSWORD      — initial akadmin password
#   password / postgres-password      — consumed by the bundled postgresql subchart
#   <client>_OIDC_CLIENT_SECRET       — OIDC client secrets, referenced by blueprints via !Env

authentik:
  error_reporting:
    enabled: false
  postgresql:
    host: authentik-pg-rw
    name: authentik
    user: authentik
    # password supplied via AUTHENTIK_POSTGRESQL__PASSWORD env (envFrom below)
  redis:
    host: authentik-redis
  # Outgoing SMTP (enrollment email-verification + notifications) is NOT set here.
  # The ENTIRE email config — host, port, username, from, use_tls, use_ssl,
  # timeout AND password — is injected at runtime from the authentik-smtp sealed
  # secret as AUTHENTIK_EMAIL__* env vars (global.envFrom below), so nothing about
  # the mail relay appears in git. Seal/rotate via sealSecrets.sh (sources the
  # values from Pulumi config). updateConfigFromProjectSettings.sh does not touch these.

# Inject all secret env vars (secret key, DB password, bootstrap token, OIDC client secrets).
# Recent authentik charts moved env injection under `global` — top-level env/envFrom
# is deprecated and errors out during `helm template`.
global:
  # AUTHENTIK_HOST: public base URL used in outgoing email links (recovery, invitation).
  # Without this Authentik falls back to the internal pod hostname and emails contain
  # http://authentik-server.authentik.svc.cluster.local/… links that users cannot reach.
  # Updated automatically by updateConfigFromProjectSettings.sh on subdomain change.
  env:
    - name: AUTHENTIK_HOST
      value: "https://id.ecc135.cape-project.eu"
  envFrom:
    - secretRef:
        name: authentik-secrets
    # Full SMTP relay config → AUTHENTIK_EMAIL__{HOST,PORT,USERNAME,PASSWORD,
    # FROM,USE_TLS,USE_SSL,TIMEOUT} (enrollment email verification + notifications).
    - secretRef:
        name: authentik-smtp
  # Custom branding: mount CAPE logo into Authentik's media storage.
  # The FileBackend serves files from /data/media/public/{name} at /files/media/public/{name}?token=...
  # Kubernetes creates the mount-point directory, so no initContainer is needed.
  volumes:
    - name: cape-branding
      configMap:
        name: authentik-branding
  volumeMounts:
    - name: cape-branding
      mountPath: /data/media/public/branding
      readOnly: true
    # Email templates: server pod renders templates synchronously before handing
    # off to worker for delivery, so /templates must be mounted on the server too.
    - name: cape-branding
      mountPath: /templates/email/email-password-reset.html
      subPath: email-password-reset.html
      readOnly: true
    - name: cape-branding
      mountPath: /templates/email/email-account-confirmation.html
      subPath: email-account-confirmation.html
      readOnly: true

server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: haproxy
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
      haproxy-ingress.github.io/ssl-redirect: "true"
      haproxy-ingress.github.io/timeout-server: "300s"
    hosts:
      - id.ecc135.cape-project.eu
    tls:
      - hosts:
          - id.ecc135.cape-project.eu
        secretName: authentik-tls
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
      namespace: prometheus

worker:
  replicas: 1
  # Per-app blueprints (config-as-code tiles) for the toggleable OIDC apps.
  # Each app ships its own ConfigMap (authentik-blueprint-<app>) from its own
  # ArgoCD Application into the authentik namespace. They are mounted OPTIONALLY
  # here: optional=true lets the worker boot at wave 6 even though these apps
  # deploy later (headscale w8, nextcloud/xwiki w12, gitlab w14, zulip w16) — or
  # not at all if disabled. The worker's filesystem watcher picks up each file
  # under /blueprints (default blueprints_dir) as soon as the ConfigMap appears
  # (hourly discovery cron is the backstop), so the tile shows shortly after the
  # app syncs. A disabled app ships no ConfigMap → empty mount → no tile.
  volumes:
    - name: bp-headscale
      configMap: { name: authentik-blueprint-headscale, optional: true }
    - name: bp-nextcloud
      configMap: { name: authentik-blueprint-nextcloud, optional: true }
    - name: bp-xwiki
      configMap: { name: authentik-blueprint-xwiki, optional: true }
    - name: bp-zulip
      configMap: { name: authentik-blueprint-zulip, optional: true }
    - name: bp-gitlab
      configMap: { name: authentik-blueprint-gitlab, optional: true }
    - name: bp-rallly
      configMap: { name: authentik-blueprint-rallly, optional: true }
    - name: bp-windows
      configMap: { name: authentik-blueprint-windows, optional: true }
  volumeMounts:
    - name: bp-headscale
      mountPath: /blueprints/apps/headscale
      readOnly: true
    - name: bp-nextcloud
      mountPath: /blueprints/apps/nextcloud
      readOnly: true
    - name: bp-xwiki
      mountPath: /blueprints/apps/xwiki
      readOnly: true
    - name: bp-zulip
      mountPath: /blueprints/apps/zulip
      readOnly: true
    - name: bp-gitlab
      mountPath: /blueprints/apps/gitlab
      readOnly: true
    - name: bp-rallly
      mountPath: /blueprints/apps/rallly
      readOnly: true
    - name: bp-windows
      mountPath: /blueprints/apps/windows
      readOnly: true

# Blueprints mounted at worker startup via the chart (config-as-code).
# These ConfigMaps ship WITH authentik (wave 6) so they always exist at boot:
#   groups       — permission groups (incl. xwiki-oidc-admins, gitlab-admins)
#   apps         — shared scope, always-on infra (argocd, grafana), proxy/outpost
#   test-users   — clusteradmin / testuser (passwords set by PostSync job)
# Per-app OIDC tiles (headscale, nextcloud, xwiki, zulip, gitlab) are mounted
# optionally via worker.volumes above, shipped from each app's own folder.
blueprints:
  configMaps:
    - authentik-blueprint-groups
    - authentik-blueprint-apps
    - authentik-blueprint-initial-users
    - authentik-blueprint-enrollment
    - authentik-blueprint-mfa
    - authentik-blueprint-recovery
    - authentik-blueprint-branding

# PostgreSQL + Redis are self-managed (postgres.yaml, redis.yaml in this folder),
# using official upstream images — NOT the chart's bundled bitnami postgresql
# subchart (Chart.yaml depends on oci://registry-1.docker.io/bitnamicharts, whose
# images moved to the unmaintained bitnamilegacy catalog). The authentik app is
# pointed at them via authentik.postgresql.host / authentik.redis.host above;
# the DB password comes from authentik-secrets (AUTHENTIK_POSTGRESQL__PASSWORD).
postgresql:
  enabled: false
