apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "86.2.2" # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
    helm:
      values: |
        prometheusOperator:
          # Restrict operator to prometheus namespace only.
          # Prevents conflict with Ryax's bundled prometheus-operator in ryaxns.
          namespaces:
            releaseNamespace: true
            additional: []
          admissionWebhooks:
            # Admission webhook Jobs use Helm hooks that ArgoCD cannot track reliably —
            # the Job completes and is GC'd before ArgoCD polls it, causing a permanent
            # stuck sync. cert-manager handles TLS for webhooks instead.
            enabled: false
            patch:
              enabled: false
          tls:
            enabled: false
        grafana:
          admin:
            existingSecret: kube-prometheus-stack-grafana
            userKey: admin-user
            passwordKey: admin-password
          envFromSecret: grafana-oidc-secret
          grafana.ini:
            server:
              root_url: https://grafana.ecc135.cape-project.eu
            users:
              allow_sign_up: false
            auth:
              disable_login_form: true
              disable_initial_admin_creation: false
              signout_redirect_url: https://id.ecc135.cape-project.eu/application/o/grafana/end-session/
            auth.generic_oauth:
              enabled: true
              auto_login: true
              name: Authentik
              allow_sign_up: true
              client_id: grafana
              client_secret: $__env{GRAFANA_OIDC_CLIENT_SECRET}
              scopes: openid email profile
              auth_url: https://id.ecc135.cape-project.eu/application/o/authorize/
              token_url: https://id.ecc135.cape-project.eu/application/o/token/
              api_url: https://id.ecc135.cape-project.eu/application/o/userinfo/
              # clusteradmins (our authentik-admins group, or the built-in superuser
              # group) → Grafana Admin; everyone else (incl. employees-extended) → Viewer
              # (infra view-only). Local login form is disabled above (OIDC-only);
              # break-glass = temporarily set auth.disable_login_form=false here.
              role_attribute_path: (contains(groups[*], 'authentik-admins') || contains(groups[*], 'authentik Admins')) && 'Admin' || 'Viewer'
              use_pkce: true
              # Authentik ingress uses the LE staging CA (untrusted) while testing,
              # so Grafana's backend token/userinfo calls must skip TLS verify.
              # updateConfigFromProjectSettings.sh flips this to false on prod certs.
              tls_skip_verify_insecure: true
            security:
              disable_initial_admin_password_change: true
          sidecar:
            dashboards:
              searchNamespace: ALL  # discover dashboard ConfigMaps from all namespaces
          # Dashboards imported from grafana.com — check each gnetId for latest revision
          dashboards:
            default:
              argocd:
                gnetId: 14584
                revision: 10
                datasource: Prometheus
              external-dns:
                gnetId: 15038
                revision: 3
                datasource: Prometheus
              cert-manager:
                gnetId: 20842
                revision: 2
                datasource: Prometheus
              haproxy-ingress:
                gnetId: 12693
                revision: 2
                datasource: Prometheus
              headscale:
                gnetId: 20614
                revision: 1
                datasource: Prometheus
              gitlab-overview:
                gnetId: 2662
                revision: 4
                datasource: Prometheus
              longhorn:
                gnetId: 16888
                revision: 9
                datasource: Prometheus
              nextcloud:
                gnetId: 20347
                revision: 1
                datasource: Prometheus
              authentik:
                gnetId: 14837
                revision: 2
                datasource: Prometheus
          ingress:
            enabled: true
            ingressClassName: haproxy
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-staging"
              haproxy-ingress.github.io/ssl-redirect: "true"
            hosts:
              - grafana.ecc135.cape-project.eu
            tls:
              - hosts:
                  - grafana.ecc135.cape-project.eu
                secretName: grafana-tls
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
        # ServiceMonitors for components deployed by Pulumi (or wave-1 apps).
        # These live here (not in Pulumi/wave-1) because the CRD doesn't exist until
        # the kube-prometheus-stack Helm chart is deployed.
        additionalServiceMonitors:
          - name: external-dns
            namespace: prometheus
            selector:
              matchLabels:
                app.kubernetes.io/name: external-dns
            namespaceSelector:
              matchNames:
                - external-dns
            endpoints:
              - port: http
                interval: 30s
          - name: cert-manager
            namespace: prometheus
            selector:
              matchLabels:
                app.kubernetes.io/name: cert-manager
                app.kubernetes.io/component: controller
            namespaceSelector:
              matchNames:
                - cert-manager
            endpoints:
              - port: http-metrics
                path: /metrics
                interval: 60s
          - name: haproxy-ingress
            namespace: prometheus
            selector:
              matchLabels:
                app.kubernetes.io/name: haproxy-ingress
            namespaceSelector:
              matchNames:
                - haproxy-ingress
            endpoints:
              - port: stat
                path: /metrics
                interval: 30s
          - name: headscale
            namespace: prometheus
            selector:
              matchLabels:
                app.kubernetes.io/instance: headscale
                app.kubernetes.io/name: headscale
            namespaceSelector:
              matchNames:
                - headscale
            endpoints:
              - port: http
                path: /metrics
                interval: 30s
          - name: longhorn
            namespace: prometheus
            selector:
              matchLabels:
                app: longhorn-manager
            namespaceSelector:
              matchNames:
                - longhorn-system
            endpoints:
              - port: manager
                path: /metrics
                interval: 60s
          - name: nextcloud
            namespace: prometheus
            selector:
              matchLabels:
                app.kubernetes.io/name: nextcloud
                app.kubernetes.io/component: metrics
            namespaceSelector:
              matchNames:
                - nextcloud
            endpoints:
              - port: metrics
                path: /metrics
                interval: 60s

        prometheus:
          # The chart's own ingress is disabled: prometheus has no native auth, so
          # access is fronted by Authentik instead. See prometheus-oidc-ingress.yaml
          # (routes prometheus.subdomain → Authentik embedded outpost → this server).
          ingress:
            enabled: false
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"

        alertmanager:
          # The full alertmanager config (incl. SMTP creds + recipient) is supplied
          # as the sealed secret 'alertmanager-config' (key alertmanager.yaml),
          # rendered from the Pulumi stack by deployment/secrets/sealSecrets.sh.
          # No SMTP server, credentials, or recipient are committed in this manifest.
          # Routing rules are kept readable in alertmanager-config.yaml.template.
          # configSecret must sit under alertmanagerSpec — at the top level the chart
          # silently ignores it and Alertmanager falls back to its default (null) config.
          alertmanagerSpec:
            configSecret: alertmanager-config

        additionalPrometheusRulesMap:
          argocd:
            groups:
              - name: argocd
                rules:
                  # App stuck out of sync (OutOfSync / Unknown) for a while.
                  # Metric exported by argocd-application-controller (ServiceMonitor
                  # enabled in argocd-infra/values.yaml).
                  - alert: ArgoCDAppNotSynced
                    expr: |
                      argocd_app_info{sync_status!="Synced"} == 1
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "ArgoCD app {{ $labels.name }} not synced"
                      description: "Application {{ $labels.name }} (project {{ $labels.project }}) sync_status={{ $labels.sync_status }} for >15m."
                  # App unhealthy: failed sync, degraded workload, missing resources.
                  - alert: ArgoCDAppUnhealthy
                    expr: |
                      argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
                    for: 15m
                    labels:
                      severity: critical
                    annotations:
                      summary: "ArgoCD app {{ $labels.name }} unhealthy"
                      description: "Application {{ $labels.name }} health_status={{ $labels.health_status }} for >15m."
          longhorn-backup:
            groups:
              - name: longhorn.backup
                rules:
                  - alert: LonghornBackupJobFailed
                    expr: |
                      kube_job_status_failed{
                        namespace="longhorn-system",
                        job_name=~"backup-daily-.*"
                      } > 0
                      unless kube_job_status_active{
                        namespace="longhorn-system",
                        job_name=~"backup-daily-.*"
                      } > 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Longhorn daily backup failed"
                      description: "Job {{ $labels.job_name }} in longhorn-system has failed pods."

  # Prometheus CRD (>= kube-prometheus-stack 60.x / prometheus-operator 0.73+) has
  # spec.hostNetwork which ArgoCD's schema cache may not know about, causing the
  # structured-merge-diff calculation to fail with "field not declared in schema".
  # Workaround: skip SMD for monitoring.coreos.com CRs by ignoring their spec fields.
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: Prometheus
      jqPathExpressions:
        - .spec.hostNetwork
    - group: monitoring.coreos.com
      kind: Alertmanager
      jqPathExpressions:
        - .spec.hostNetwork
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
