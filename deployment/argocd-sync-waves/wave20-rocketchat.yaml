# ArgoCD Application: Rocket.Chat (RocketChat/helm-charts).
# Accessible at https://rocketchat.ecc135.cape-project.eu
# OIDC via Authentik as a Custom OAuth service, configured through the Rocket.Chat
# REST API (oauth-config.yaml). Authentik provider + tile created/removed via the
# Authentik API (authentik-provider.yaml). MongoDB bundled (replica set).
# All config lives in deployment/apps/rocketchat. Wave 16 (Messaging, with zulip).
#
# Multi-source:
#   1. rocketchat Helm chart
#   2. ref source for $values
#   3. Git directory for authentik provider jobs, oauth-config job, sealed secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rocketchat
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    placement.ecc/tier: flex
spec:
  project: default
  sources:
    - repoURL: https://rocketchat.github.io/helm-charts
      chart: rocketchat
      targetRevision: "7.0.0" # renovate: datasource=helm depName=rocketchat registryUrl=https://rocketchat.github.io/helm-charts
      helm:
        releaseName: rocketchat
        valueFiles:
          - $values/deployment/apps/rocketchat/values.yaml

    - repoURL: git@github.com:paraXent/infra.git
      targetRevision: main
      ref: values

    - repoURL: git@github.com:paraXent/infra.git
      targetRevision: main
      path: deployment/apps/rocketchat
      directory:
        exclude: "{values.yaml,*.sh,*.template}"

  destination:
    server: https://kubernetes.default.svc
    namespace: rocketchat
  # bundled mongodb is a StatefulSet; k8s mutates immutable volumeClaimTemplates
  # with defaults ArgoCD can't reconcile → ignore to avoid perpetual OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
