apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-upgrade-plan-save-cordoned-nodes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:paraXent/infra.git
    targetRevision: main
    path: deployment/infrastructure/k3s-upgrade-plan-save-cordoned-nodes
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
