# ArgoCD Application: headscale + headplane (moved from wave 12).
# Self-hosted Tailscale-compatible VPN via Wrenix headscale helm chart.
# Accessible at https://vpn.subdomain.domain.tld (headscale) and https://headplane.subdomain.domain.tld/admin (GUI)
# Issues its own cert via cert-manager (letsencrypt-staging, DNS-01 Hetzner).
#
# OIDC via Authentik (provider registered by Authentik blueprint-apps).
# The headscale-oidc-client-secret sealed secret must match the value sealed
# into authentik-secrets (deployment/authentik/sealSecrets.sh).
#
# Multi-source:
#   1. Helm chart from Codeberg git repo (avoids OCI registry auth issues)
#   2. Git repo directory for plain manifests (headplane, jobs, sealed secrets)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headscale
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  sources:
    # Helm chart from git: Renovate tracks Forgejo tags (chart tags like headscale-v1.0.15).
    - repoURL: https://codeberg.org/wrenix/helm-charts.git
      targetRevision: "main" # renovate: datasource=forgejo-tags depName=wrenix/helm-charts registryUrl=https://codeberg.org versioning=regex:^headscale-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
      path: headscale
      helm:
        valuesObject:
          image:
            # Debug variant required: chart's headscale-keys hook runs `sh` inside this image.
            # Production v0.28.0 is distroless (no sh); debug build includes shell tooling.
            tag: "0.28.0-debug" # renovate: datasource=docker depName=ghcr.io/juanfont/headscale

          # Disable chart-generated TLS cert (defaults to example.com/letsencrypt-prod).
          # Gated on headscale.certmanager.enabled (not tls.enabled).
          # grpc_allow_insecure=true: headplane uses REST API, not gRPC, so no cert needed.
          # config must be nested under headscale.config — chart secret template uses .Values.headscale.config
          headscale:
            certmanager:
              enabled: false
            config:
              server_url: "https://vpn.ecc135.cape-project.eu"
              grpc_allow_insecure: true
              prefixes:
                v4: "10.0.10.0/23" # project-settings: network.meshRange (edge VPN pool 10.0.10.1–10.0.11.255)
                allocation: sequential
              database:
                type: postgres
                postgres:
                  host: headscale-pg-rw
                  port: 5432
                  name: headscale
                  user: headscale
                  # pass injected via HEADSCALE_DATABASE_POSTGRES_PASS env by args-patch.yaml
                  pass: ""
              dns:
                magic_dns: true
                base_domain: "ts.internal"
                override_local_dns: false
                extra_records:
                  # k3s API endpoint for edge nodes: the CP tailscale/mesh IPs, NOT the
                  # kube-vip private VIP (10.0.0.100). Edge nodes resolve this name and
                  # connect to the API over the tailscale mesh; they cannot reach 10.0.0.100
                  # (cp0 doesn't forward 10.0.0.0/23 off tailscale0). We publish ONE A record
                  # per control-plane (cp0/cp1/cp2 = .1/.2/.3, sequential mesh allocation) so
                  # the k3s-agent client-LB fails over across live CPs when one dies — cp0 is
                  # no longer a single point of failure for name resolution. Kept in sync with
                  # project_settings.ts network.cpMeshIps by updateConfigFromProjectSettings.sh.
                  - name: "k3s-api.ts.internal"
                    type: "A"
                    value: "10.0.10.1" # project-settings: network.cpMeshIps[0]
                  - name: "k3s-api.ts.internal"
                    type: "A"
                    value: "10.0.10.2" # project-settings: network.cpMeshIps[1]
                  - name: "k3s-api.ts.internal"
                    type: "A"
                    value: "10.0.10.3" # project-settings: network.cpMeshIps[2]
              tls_cert_path: ""
              tls_key_path: ""
              oidc:
                issuer: "https://id.ecc135.cape-project.eu/application/o/headscale/"
                client_id: "headscale"
                client_secret_path: "/etc/headscale/oidc/oidc_client_secret"
                scope: ["openid", "profile", "email"]
                only_start_if_oidc_is_available: false

          # Move the embedded-DERP STUN listener off the default 3478/UDP.
          # On this single-node cluster k3s ServiceLB (klipper) hostPort-binds the
          # LoadBalancer port on the node, and jitsi's coturn (STUN/TURN) needs the
          # standard 3478/UDP for browser WebRTC clients. Two services can't share
          # 3478 on one node, so headscale yields. This single value feeds the
          # container port, the headscale-derp LoadBalancer port AND the config's
          # derp.server.stun_listen_addr (chart templates all three from it), so the
          # embedded derpmap advertises 3479 to clients automatically.
          #
          # STUN REACHABILITY: klipper binds this UDP port on 0.0.0.0 (all node
          # interfaces incl. public IP — the private EXTERNAL-IP shown by `kubectl
          # get svc headscale-derp` is cosmetic). For STUN to actually work, the
          # Hetzner firewall MUST allow inbound UDP 3479 (+ 41641 for the direct
          # WireGuard data path) — see src/network.ts productionFirewallRules. Without
          # those open, clients get "no IPv4 STUN response", no direct path forms, and
          # everything falls back to the single embedded DERP relay over 443/TCP.
          service:
            derp:
              port: 3479

          persistence:
            enabled: true
            storageClass: "longhorn-cloud"
            size: 1Gi

          ingress:
            enabled: true
            className: "haproxy"
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-staging"
              haproxy-ingress.github.io/ssl-redirect: "true"
              haproxy-ingress.github.io/timeout-server: "3600s"
              haproxy-ingress.github.io/timeout-client: "3600s"
            hosts:
              - host: vpn.ecc135.cape-project.eu
                paths:
                  - path: /
                    pathType: ImplementationSpecific
            tls:
              - hosts:
                  - vpn.ecc135.cape-project.eu
                secretName: headscale-tls

    # Second source: plain manifests (headplane, jobs, sealed secrets)
    - repoURL: git@github.com:paraXent/infra.git
      targetRevision: main
      path: deployment/infrastructure/headscale
      directory:
        exclude: '{*.template,*.sh,deployment.yaml}'

  destination:
    server: https://kubernetes.default.svc
    namespace: headscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: headscale
      namespace: headscale
      jsonPointers:
        - /spec/storageClassName
    - group: apps
      kind: Deployment
      name: headscale
      namespace: headscale
      jsonPointers:
        - /spec/strategy
        - /spec/template/spec/containers/0/args
        - /spec/template/spec/containers/0/env
        - /spec/template/spec/containers/0/volumeMounts
        - /spec/template/spec/volumes
    - group: ""
      kind: Secret
      name: headscale-keys
      namespace: headscale
      jsonPointers:
        - /data
