# Wave 9 Sync barrier: waits until wave-8 Applications (headscale, headplane) are
# Synced+Healthy AND the headscale-preauthkey-cloud secret exists (created by the
# headscale PostSync job) before advancing to wave 10 (mesh-gateway needs it).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wave9-barrier
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave9-barrier
  annotations:
    argocd.argoproj.io/sync-wave: "9"
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave9-barrier
  annotations:
    argocd.argoproj.io/sync-wave: "9"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave9-barrier
subjects:
- kind: ServiceAccount
  name: wave9-barrier
  namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wave9-barrier
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: wave9-barrier
      restartPolicy: Never
      containers:
      - name: barrier
        image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
        command: ["/bin/sh", "-ec"]
        args:
        - |
          echo "Wave-9 barrier: discovering applications with sync-wave=8..."

          APPS=$(kubectl get applications -n argocd -o json | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for item in data['items']:
              ann = item.get('metadata', {}).get('annotations', {})
              wave = ann.get('argocd.argoproj.io/sync-wave', '')
              tracking = ann.get('argocd.argoproj.io/tracking-id', '')
              parent = tracking.split(':')[0] if tracking else ''
              if parent == 'argocd-main-app' and wave == '8':
                  print(item['metadata']['name'])
          ")

          echo "Waiting for: $(echo $APPS | tr '\n' ' ')"

          MARKER="wave9-barrier-done"
          if kubectl get configmap "$MARKER" -n argocd >/dev/null 2>&1; then
            echo "Barrier already passed (ConfigMap $MARKER exists) — skipping."
            exit 0
          fi

          i=0
          while [ "$i" -lt 120 ]; do
            PENDING=""
            for APP in $APPS; do
              SYNC=$(kubectl get application "$APP" -n argocd \
                -o jsonpath="{.status.sync.status}" 2>/dev/null || true)
              HEALTH=$(kubectl get application "$APP" -n argocd \
                -o jsonpath="{.status.health.status}" 2>/dev/null || true)
              PHASE=$(kubectl get application "$APP" -n argocd \
                -o jsonpath="{.status.operationState.phase}" 2>/dev/null || true)
              if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ] && \
                 { [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "SyncOk" ] || [ -z "$PHASE" ]; }; then
                : # ready
              else
                PENDING="${PENDING} ${APP}(sync=${SYNC},health=${HEALTH},phase=${PHASE})"
              fi
            done

            if [ -z "$PENDING" ]; then
              echo "All wave-8 Applications Synced+Healthy."
              break
            fi

            echo "Attempt $i/120 — waiting for:${PENDING}"
            sleep 10
            i=$((i+1))
          done

          if [ -n "$PENDING" ]; then
            echo "ERROR: timed out waiting for:${PENDING}"
            exit 1
          fi

          echo "Waiting for headscale-preauthkey-cloud secret (consumed by mesh-gateway)..."
          i=0
          while [ "$i" -lt 60 ]; do
            if kubectl get secret headscale-preauthkey-cloud -n headscale >/dev/null 2>&1; then
              kubectl create configmap "$MARKER" -n argocd \
                --from-literal=status=done \
                --from-literal=timestamp="$(date -Iseconds)" \
                2>/dev/null || true
              echo "headscale-preauthkey-cloud present — releasing wave 10."
              exit 0
            fi
            echo "  waiting for headscale-preauthkey-cloud... ($i/60)"
            sleep 10
            i=$((i+1))
          done
          echo "ERROR: headscale-preauthkey-cloud secret never appeared"
          exit 1
