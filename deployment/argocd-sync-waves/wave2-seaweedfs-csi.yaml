# ArgoCD Application: SeaweedFS CSI driver — provides the `seaweedfs` StorageClass.
# Wave 2: runs after the wave-1 barrier confirms the SeaweedFS cluster (wave 0) is
# Healthy, so the filer it connects to is guaranteed up. Available well before any
# consumer (essential apps from wave 6, flex apps from wave 20).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://seaweedfs.github.io/seaweedfs-csi-driver/helm
      chart: seaweedfs-csi-driver
      targetRevision: "0.2.26" # renovate: datasource=helm depName=seaweedfs-csi-driver registryUrl=https://seaweedfs.github.io/seaweedfs-csi-driver/helm
      helm:
        valueFiles:
          - $values/deployment/infrastructure/seaweedfs-csi-driver/values.yaml
    - repoURL: git@github.com:paraXent/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
