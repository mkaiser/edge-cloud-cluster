# Wave 18 Sync barrier: waits until all infrastructure applications are Synced+Healthy
# before advancing to wave 19 (notify) and wave 20 (general apps).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wave18-barrier
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave18-barrier
  annotations:
    argocd.argoproj.io/sync-wave: "18"
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave18-barrier
  annotations:
    argocd.argoproj.io/sync-wave: "18"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave18-barrier
subjects:
- kind: ServiceAccount
  name: wave18-barrier
  namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wave18-barrier
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: wave18-barrier
      restartPolicy: Never
      containers:
      - name: barrier
        image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
        command: ["/bin/sh", "-ec"]
        args:
        - |
          echo "Wave-18 barrier: discovering applications with sync-wave=10..."

          APPS=$(kubectl get applications -n argocd -o json | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for item in data['items']:
              ann = item.get('metadata', {}).get('annotations', {})
              wave = ann.get('argocd.argoproj.io/sync-wave', '')
              tracking = ann.get('argocd.argoproj.io/tracking-id', '')
              parent = tracking.split(':')[0] if tracking else ''
              if parent == 'argocd-main-app' and wave == '10':
                  print(item['metadata']['name'])
          ")

          echo "Waiting for: $(echo $APPS | tr '\n' ' ')"

          MARKER="wave18-barrier-done"
          if kubectl get configmap "$MARKER" -n argocd >/dev/null 2>&1; then
            echo "Barrier already passed (ConfigMap $MARKER exists) — skipping."
            exit 0
          fi

          i=0
          while [ "$i" -lt 120 ]; do
            PENDING=""
            for APP in $APPS; do
              SYNC=$(kubectl get application "$APP" -n argocd \
                -o jsonpath="{.status.sync.status}" 2>/dev/null || true)
              HEALTH=$(kubectl get application "$APP" -n argocd \
                -o jsonpath="{.status.health.status}" 2>/dev/null || true)
              PHASE=$(kubectl get application "$APP" -n argocd \
                -o jsonpath="{.status.operationState.phase}" 2>/dev/null || true)
              if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ] && \
                 { [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "SyncOk" ] || [ -z "$PHASE" ]; }; then
                : # ready
              else
                PENDING="${PENDING} ${APP}(sync=${SYNC},health=${HEALTH},phase=${PHASE})"
              fi
            done

            if [ -z "$PENDING" ]; then
              echo "All wave-(<18) Applications Synced+Healthy."
              break
            fi

            echo "Attempt $i/120 — waiting for:${PENDING}"
            sleep 10
            i=$((i+1))
          done

          if [ -n "$PENDING" ]; then
            echo "ERROR: timed out waiting for:${PENDING}"
            exit 1
          fi

          kubectl create configmap "$MARKER" -n argocd \
            --from-literal=status=done \
            --from-literal=timestamp="$(date -Iseconds)" \
            2>/dev/null || true
          echo "All wave-(<18) Applications Synced+Healthy — releasing wave 19."
