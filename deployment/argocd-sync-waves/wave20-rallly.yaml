# ArgoCD Application: Rallly (lukevella/rallly).
# Accessible at https://rallly.ecc135.cape-project.eu
# Group availability polling tool (Doodle replacement).
# OIDC via Authentik; provider + tile created by authentik-blueprint.yaml.
# PostgreSQL self-managed (postgres.yaml). Wave 20 (user apps).
#
# Plain manifests only (no Helm chart):
#   deployment.yaml, postgres.yaml, ingress.yaml, authentik-blueprint.yaml,
#   rallly-secrets-sealed.yaml, oidc-client-secret-sealed.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rallly
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    placement.ecc/tier: flex
spec:
  project: default
  source:
    repoURL: git@github.com:paraXent/infra.git
    targetRevision: main
    path: deployment/apps/rallly
    directory:
      exclude: "*.sh"
  destination:
    server: https://kubernetes.default.svc
    namespace: rallly
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
