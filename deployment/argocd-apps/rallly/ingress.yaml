# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway),
# so there is no tls block here and no ssl-redirect — the HTTP→HTTPS redirect is
# handled once, cluster-wide, by argocd-infra/gateway/redirect-to-https.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rallly
  namespace: rallly
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - rallly.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rallly
          port: 3000
