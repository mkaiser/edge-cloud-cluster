# CloudNativePG cluster for Open WebUI (chat history, users, settings).
# MESH-storage CNPG: data on longhorn-unibi-hclab — the ONLY mesh-scope CNPG cluster;
# all others use longhorn-cloud (doc/cloud-mesh-architecture.md "Databases (CNPG)").
# Because that storage only exists after `make provision-mesh-node`, the PreSync gate
# presync-wait-mesh-storage.yaml blocks this Cluster from being applied until a
# unibi-hclab Longhorn disk is Ready+Schedulable (CNPG's initdb has no retry knob — a
# premature bootstrap latches the cluster "unrecoverable" permanently; ecc148).
#
# App connects via the CNPG read-write service `open-webui-pg-rw` (see
# deployment.yaml DATABASE_URL). Bootstrap creates the `open-webui` database +
# owner from open-webui-pg-user (username/password), password kept equal to
# open-webui-secrets:db-password so the app and CNPG share one credential.
#
# Backup: barman S3 WAL archiving + scheduled base backups (cadence in the ScheduledBackup
# spec.schedule below) to the dedicated edgecloudinfra-open-webui-pg bucket. Credentials
# from open-webui-s3-secret (ACCESS_KEY_ID/SECRET_ACCESS_KEY). PITR restore = new Cluster
# with bootstrap.recovery + externalClusters — see doc/backup-restore.md.
#
# DO NOT EDIT directly for the user secret — open-webui-pg-user-sealed.yaml is
# generated by sealSecrets.sh; this manifest only references it.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: open-webui-pg
  namespace: open-webui
  annotations:
    # open-webui-pg-user sealed secret syncs at wave -1 (see sealSecrets.sh) so it
    # exists before CNPG reconciles this Cluster.
    argocd.argoproj.io/sync-wave: "0"
spec:
  priorityClassName: standard
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18 # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql

  # Flex placement: data lives on the unibi-hclab mesh storage, but the pod is not
  # pinned to a site — tolerate the mesh taint so CNPG CAN place it on a mesh node
  # (volume-local), while still allowing cloud scheduling (cross-tier over WireGuard).
  # Kept off the GPU node by NOT tolerating ecc/gpu=true:NoSchedule below: a Postgres
  # has no business spending GPU-node RAM, and CNPG is exactly the workload that used
  # to brick on a bad Thor placement (initdb burns its backoffLimit, then the cluster
  # latches "unrecoverable" — happened twice). Thor CAN attach Longhorn since
  # the kernel rebuild; the taint now enforces the placement instead.
  affinity:
    tolerations:
      - key: ecc/mesh  # automatically updated from project-settings:applicationPlacements.labels.mesh
        operator: Equal
        value: "true"
        effect: NoSchedule

  # Metrics for this Cluster. CNPG's instances always expose the exporter on :9187; this flag
  # is what makes CNPG create the PodMonitor that gets it scraped. Without it the databases
  # behind every app were entirely unmonitored — measured 2026-09-03: 7 live Clusters, 0
  # PodMonitors, so a DB could be unreachable, failing to archive WAL, or missing every base
  # backup with nothing to notice. Alert rules on these series live in the `cnpg` group in
  # argocd-infra/prometheus/kube-prometheus-stack/prometheus.yaml.
  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: longhorn-unibi-hclab  # automatically updated from project-settings:applicationPlacements.meshStorageClass
    size: 8Gi

  bootstrap:
    initdb:
      database: open-webui
      owner: open-webui
      secret:
        name: open-webui-pg-user

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  backup:
    barmanObjectStore:
      destinationPath: "s3://edgecloudinfra-open-webui-pg" # automatically updated from project-settings:{general.name,storage.objectStorage.buckets}
      endpointURL: "https://nbg1.your-objectstorage.com" # automatically updated from project-settings:storage.objectStorage.baseEndpoint
      s3Credentials:
        accessKeyId:
          name: open-webui-s3-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: open-webui-s3-secret
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"

---
# Scheduled base backup daily (WAL archiving provides PITR between base backups)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: open-webui-pg-backup
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 0 2 * * *"
  # Take a base backup as soon as this resource is CREATED, not only at the next scheduled
  # hour. ⚠ At creation — adding this field to a ScheduledBackup that already exists does
  # NOT retrofit one (verified 2026-09-03: the flag went live on all 8 clusters and no Backup
  # object appeared), so it protects every future cluster and not the one you are looking at.
  # For an existing cluster, create a Backup resource by hand.
  # WAL archiving alone cannot restore anything — PITR replays WAL ON TOP of a base backup —
  # so between cluster creation and the first scheduled run there is no recoverable copy at
  # all. Measured 2026-09-03: this cluster was 2.5 h old with 7 ScheduledBackups, ZERO Backup
  # objects and cnpg_collector_last_available_backup_timestamp at 0; the daily 02:00 schedule
  # left a ~10 h hole, and at a ~3-day recreate cadence every recreate reopens it.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: open-webui-pg
