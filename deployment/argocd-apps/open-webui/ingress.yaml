# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway),
# so there is no tls block here and no ssl-redirect — the HTTP→HTTPS redirect is
# handled once, cluster-wide, by argocd-infra/gateway/redirect-to-https.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - ai.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Chat completions stream — raise the timeout so they aren't cut off.
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: open-webui
          port: 8080
