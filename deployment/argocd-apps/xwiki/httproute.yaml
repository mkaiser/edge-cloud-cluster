# Hand-written HTTPRoute: the xwiki chart (1.7.0) has no Gateway API support —
# only an Ingress template — so its ingress is disabled in values.yaml and the
# route lives here instead.
#
# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway);
# the HTTP→HTTPS redirect is handled once by argocd-infra/gateway.
#
# Backend: the chart's Service is `xwiki.fullname` on service.externalPort. With
# releaseName xwiki and chart name xwiki that resolves to xwiki:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xwiki
  namespace: xwiki
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - wiki.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: xwiki
          port: 80
