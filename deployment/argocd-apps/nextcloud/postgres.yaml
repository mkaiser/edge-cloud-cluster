# CloudNativePG cluster for Nextcloud (cloud-side CNPG conversion — see
# doc/cloud-mesh-architecture.md "Databases (CNPG)"). Replaces the previous plain
# postgres:18 StatefulSet so Nextcloud's DB is a CNPG-managed Cluster: the
# prerequisite for the deferred cross-tier replica-cluster mobility (async edge
# replica + `kubectl cnpg promote` cutover) once edge nodes exist.
#
# App connects via the CNPG-managed read-write service `nextcloud-pg-rw` (see
# values.yaml externalDatabase.host). Bootstrap creates the `nextcloud` database +
# owner from the nextcloud-pg-user secret (username/password keys). The app keeps
# using its own nextcloud-db secret (db-username/db-password) with the SAME user
# (`nextcloud`) + password, so both authenticate identically.
#
# Backup: barman S3 WAL archiving + scheduled base backups (cadence in the ScheduledBackup
# spec.schedule below) to a dedicated pg-backup bucket (edgecloudinfra-nextcloud-pg —
# separate from the nextcloud file bucket, edgecloudinfra-nextcloud-files). Credentials
# from nextcloud-s3-secret (ACCESS_KEY_ID/SECRET_ACCESS_KEY). For PITR restore, create a
# new Cluster with bootstrap.recovery + externalClusters pointing at this store — see
# doc/backup-restore.md.
#
# DO NOT EDIT directly for the user secret — nextcloud-pg-user-sealed.yaml is
# generated by sealSecrets.sh; this manifest only references it.
# Image versions: https://github.com/cloudnative-pg/postgres-containers/releases
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-pg
  namespace: nextcloud
  annotations:
    # nextcloud-pg-user sealed secret syncs at wave -1 (see sealSecrets.sh) so it
    # exists before CNPG reconciles this Cluster.
    argocd.argoproj.io/sync-wave: "0"
spec:
  priorityClassName: high
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18 # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql

  # Metrics for this Cluster. CNPG's instances always expose the exporter on :9187; this flag
  # is what makes CNPG create the PodMonitor that gets it scraped. Without it the databases
  # behind every app were entirely unmonitored — measured 2026-09-03: 7 live Clusters, 0
  # PodMonitors, so a DB could be unreachable, failing to archive WAL, or missing every base
  # backup with nothing to notice. Alert rules on these series live in the `cnpg` group in
  # argocd-infra/prometheus/kube-prometheus-stack/prometheus.yaml.
  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: longhorn-cloud-db
    size: 8Gi

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-pg-user

  backup:
    barmanObjectStore:
      destinationPath: "s3://edgecloudinfra-nextcloud-pg" # automatically updated from project-settings:{general.name,storage.objectStorage.buckets}
      endpointURL: "https://nbg1.your-objectstorage.com" # automatically updated from project-settings:storage.objectStorage.baseEndpoint
      s3Credentials:
        accessKeyId:
          name: nextcloud-s3-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: nextcloud-s3-secret
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"

---
# Scheduled base backup daily (WAL archiving provides PITR between base backups)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-pg-backup
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 0 2 * * *"
  # Take a base backup as soon as this resource is CREATED, not only at the next scheduled
  # hour. ⚠ At creation — adding this field to a ScheduledBackup that already exists does
  # NOT retrofit one (verified 2026-09-03: the flag went live on all 8 clusters and no Backup
  # object appeared), so it protects every future cluster and not the one you are looking at.
  # For an existing cluster, create a Backup resource by hand.
  # WAL archiving alone cannot restore anything — PITR replays WAL ON TOP of a base backup —
  # so between cluster creation and the first scheduled run there is no recoverable copy at
  # all. Measured 2026-09-03: this cluster was 2.5 h old with 7 ScheduledBackups, ZERO Backup
  # objects and cnpg_collector_last_available_backup_timestamp at 0; the daily 02:00 schedule
  # left a ~10 h hole, and at a ~3-day recreate cadence every recreate reopens it.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: nextcloud-pg
