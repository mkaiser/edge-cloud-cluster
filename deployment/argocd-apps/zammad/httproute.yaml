# Hand-written HTTPRoute: the zammad chart (17.0.1) has no Gateway API support —
# only an Ingress template — so its ingress is disabled in values.yaml and the
# route lives here instead.
#
# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway);
# the HTTP→HTTPS redirect is handled once by argocd-infra/gateway. Single-label
# host, so the existing wildcard-tls covers it — no per-app cert.
#
# Backend: the chart's nginx Service (`zammad-nginx`) on service.port 8080. nginx
# fronts both the Rails app and the /ws websocket path, so one route suffices;
# the Service carries appProtocol kubernetes.io/ws.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zammad
  namespace: zammad
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - zammad.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Long timeouts: Zammad holds long-lived websocket connections.
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: zammad-nginx
          port: 8080
