# ConfigMap: LE staging CA chain for Zammad's server-side GitLab API calls.
#
# Zammad talks to GitLab over the PUBLIC endpoint with verify_ssl: true (see
# postsync-gitlab-integration.yaml for why the endpoint must be public). Its
# HTTP layer (lib/user_agent.rb) never sets ca_file, so verification uses
# OpenSSL's default trust store — which does NOT contain the LE staging roots.
# Mounting this bundle and pointing SSL_CERT_FILE at it is the only lever.
#
# Chain: end-entity -> Ersatz Emmer YR2 -> Yonder Yam Root YR -> Pretend Pear X1
# All three CA certs are required; Pretend Pear X1 is self-signed (the root).
#
# Only needed for letsencrypt-staging. With letsencrypt-prod the chain uses the
# standard ISRG Root X1, so SSL_CERT_FILE is pointed back at the system bundle
# and this ConfigMap becomes inert (but is still mounted).
# updateConfigFromProjectSettings.sh flips SSL_CERT_FILE in values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-ca-bundle
  namespace: zammad
data:
  ca-bundle.pem: |
