# Sync hook (wave -1): deletes Helm-auto-generated secrets so the
# SealedSecret controller can take ownership.
#
# ROOT CAUSE OF CONFLICT:
#   The GitLab Helm chart's shared-secrets PreSync job auto-generates plain
#   Secrets for gitlab-root-password and gitlab-rails-secrets. Running our
#   cleanup as PreSync is too early — shared-secrets fires after us and
#   recreates them. Running as a Sync hook at wave -1 means: all PreSync
#   hooks (including shared-secrets) finish first, then we delete the plain
#   secrets, then the SealedSecrets (wave 0) are applied.
#
# FIX:
#   Sync hook at wave -1 deletes the Helm-generated secrets right before
#   the SealedSecrets (wave 0) are applied. The sealed-secrets controller
#   then creates them cleanly with correct ownership.
#   Safe on re-syncs — delete --ignore-not-found is a no-op if absent.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-cleanup-hook
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-cleanup-hook
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: [""]
  resources: ["secrets", "namespaces"]
  verbs: ["get", "delete", "create", "apply"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-cleanup-hook
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-cleanup-hook
subjects:
- kind: ServiceAccount
  name: gitlab-cleanup-hook
  namespace: gitlab
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-cleanup-helm-secret
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 2000
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is already covered by
  # hook-delete-policy: BeforeHookCreation (the next sync deletes this Job before
  # recreating it), so a TTL buys nothing and COSTS the post-mortem: it deletes the
  # pod, and with it the only copy of the logs.
  #
  # Alloy/Loki does not save you here — its pod discovery is a poll, so a short-lived
  # Job can finish and be deleted before it is ever scraped, leaving Loki with zero
  # lines for it. A failed hook Job is exactly what you most need logs for after a
  # recreate.
  template:
    spec:
      serviceAccountName: gitlab-cleanup-hook
      restartPolicy: Never
      containers:
      - name: cleanup
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        command: ["/bin/sh", "-ec"]
        args:
        - |
          echo "Deleting Helm-generated secrets (if present)..."
          kubectl delete secret gitlab-root-password   -n gitlab --ignore-not-found=true
          kubectl delete secret gitlab-rails-secrets   -n gitlab --ignore-not-found=true
          echo "Done. SealedSecret controller will create them with correct ownership."
