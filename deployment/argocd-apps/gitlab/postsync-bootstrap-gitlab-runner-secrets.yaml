---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-secrets-bootstrap
  namespace: gitlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-runner-secrets-bootstrap
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "create"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-runner-secrets-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-secrets-bootstrap
subjects:
- kind: ServiceAccount
  name: gitlab-runner-secrets-bootstrap
  namespace: gitlab
---
# PostSync: creates/updates THREE runner-token secrets + gitlab-runner-cache-s3
# in the gitlab-runner namespace — fully automated, no sealed secrets needed.
#
# Three runner profiles, one glrt- token each (GitLab 16+ binds TAGS AT CREATION,
# so each tag profile needs its own token → its own [[runners]] block / chart install):
#
#   suffix       secret                       tags                  run_untagged  placement
#   (default)    gitlab-runner-token          (none)                true          cloud
#   thor         gitlab-runner-token-thor     arm64,thor,buildah    false         Thor GPU node
#   mesh         gitlab-runner-token-mesh     mesh                  false         mesh (excl. GPU)
#
# App-SPECIFIC / self-contained runner tokens are minted BY their own runner app, not
# here, so runner + token come and go together. The shared [eda] EDA builder token
# (gitlab-runner-token-eda) is minted by app-of-apps/presync-runner-token-eda.yaml
# next to app-of-apps/gitlab-runner-eda.yaml — no dependency on this gitlab app's sync.
#
# Runner token flow (GitLab 18.0+):
#   1. Read root password from gitlab-root-password secret (managed by SealedSecret);
#      root email comes from the ROOT_EMAIL env (project_settings.ts senderEmail)
#   2. If no users exist (migrations pod restarted and skipped seeding), seed root
#   3. Create a PAT via rails runner (once, reused for all three profiles)
#   4. Per profile: call /api/v4/user/runners → get glrt- token → write its secret
#
# Idempotency: the GitLab API has NO upsert — re-running /user/runners registers a
# NEW dead runner every time. So SKIP a profile whose secret already holds a
# runner-token. A create failure fails the Job (no pipe/subshell swallowing exit 1).
#
# S3 cache credentials are read from the gitlab-s3-connection secret.
# Idempotent: safe to re-run on every sync / domain change.
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-runner-secrets-bootstrap
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # ⚠ must exceed the in-container 30m GitLab wait, else the deadline kills the Job
  # mid-wait and the retry budget is never spent.
  activeDeadlineSeconds: 2400
  backoffLimit: 2
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is already covered by
  # hook-delete-policy: BeforeHookCreation (the next sync deletes this Job before
  # recreating it), so a TTL buys nothing and COSTS the post-mortem: it deletes the
  # pod, and with it the only copy of the logs.
  #
  # Alloy/Loki does not save you here — its pod discovery is a poll, so a short-lived
  # Job can finish and be deleted before it is ever scraped, leaving Loki with zero
  # lines for it. A failed hook Job is exactly what you most need logs for after a
  # recreate.
  template:
    spec:
      serviceAccountName: gitlab-runner-secrets-bootstrap
      restartPolicy: OnFailure
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: bootstrap
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        env:
        - name: GITLAB_URL
          value: "http://gitlab-webservice-default.gitlab.svc.cluster.local:8080"
        - name: ROOT_EMAIL
          value: "no-reply@your-domain.tld" # automatically updated from project-settings:mail.senderEmail
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          DST_NS="gitlab-runner"

          echo "Ensuring namespace ${DST_NS} exists..."
          kubectl get namespace "${DST_NS}" >/dev/null 2>&1 || kubectl create namespace "${DST_NS}"

          echo "Reading root credentials..."
          ROOT_PASS=$(kubectl -n gitlab get secret gitlab-root-password \
            -o jsonpath='{.data.password}' | base64 -d)
          if [ -z "$ROOT_EMAIL" ]; then
            echo "ERROR: ROOT_EMAIL env empty — check the mail.senderEmail anchor"
            exit 1
          fi

          # ⚠ MUST outlast GitLab's cold start on a cluster recreate, and MUST FAIL (not fall
          # through) when it does not. Measured 2026-08-30 (ecc186→ecc187): a 10m wait expired
          # while GitLab was still starting; the old loop then `break`ed and carried on, turning
          # "GitLab never came up" into a misleading downstream error.
          echo "Waiting for GitLab API (up to 30m)..."
          i=1
          ready=0
          while [ "$i" -le 180 ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${GITLAB_URL}/-/readiness")
            if [ "$code" = "200" ]; then ready=1; break; fi
            echo "Try ${i}/180: GitLab not ready (HTTP ${code}), retrying in 10s..."
            i=$((i + 1)); sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "ERROR: GitLab API not ready after 30m — refusing to continue." >&2
            exit 1
          fi

          # --- Ensure root user exists ---
          # When the migrations pod restarts, gitlab:db:configure skips db:seed, leaving
          # no users. In GitLab 18.x, Users::CreateService requires organization_id; plain
          # User.new + save or db:seed do not work. Use CreateService directly.
          USER_COUNT=$(kubectl -n gitlab exec deploy/gitlab-toolbox -c toolbox -- \
            gitlab-rails runner "puts User.count" 2>/dev/null | tail -1 | tr -d ' \r\n')
          if [ "${USER_COUNT:-0}" = "0" ]; then
            echo "No users found — creating root user via Users::CreateService..."
            kubectl -n gitlab exec deploy/gitlab-toolbox -c toolbox -- \
              gitlab-rails runner \
              "org=Organizations::Organization.default_organization; r=Users::CreateService.new(User.new(admin:true),{username:'root',name:'Administrator',email:'${ROOT_EMAIL}',password:'${ROOT_PASS}',password_confirmation:'${ROOT_PASS}',admin:true,skip_confirmation:true,organization_id:org.id,organization_access_level: :owner}).execute; puts r.success? ? 'created' : r.message" \
              2>/dev/null | tail -1
          else
            echo "Found ${USER_COUNT} user(s), skipping creation."
          fi

          # --- Create PAT via rails runner ---
          echo "Creating PAT via toolbox..."
          PAT_NAME="runner-bootstrap-$(date +%s)"
          API_TOKEN=$(kubectl -n gitlab exec deploy/gitlab-toolbox -c toolbox -- \
            gitlab-rails runner \
            "u=User.find_by(admin:true)||User.find_by(username:'root'); t=u.personal_access_tokens.create!(name:'${PAT_NAME}',scopes:['api'],expires_at:1.year.from_now); puts t.token" \
            2>/dev/null | tail -1)

          if [ -z "$API_TOKEN" ]; then
            echo "ERROR: Could not obtain API token"
            exit 1
          fi
          echo "API token obtained."

          # --- Create instance runners via API (one per tag profile) ---
          # ⚠ access_level=ref_protected: GitLab withholds protected CI variables from a
          # runner left at the default `not_protected`, EVEN when the variable's own
          # protected flag matches the ref. Both gates must pass. A runner without this
          # silently receives empty strings for every protected variable — see the fuller
          # explanation in gitlab-runner-eda/presync-runner-token.yaml.
          # Profile fields: secret|description|tag_list|run_untagged. Tags are bound
          # at creation (GitLab 16+ token auth ignores tag_list at register time).
          # Iterate WITHOUT a pipe so a failure's `exit 1` fails the Job (a `| while`
          # subshell would swallow it and leave the Job "succeeded").
          create_runner() {
            SECRET_NAME="$1"; DESC="$2"; TAGS="$3"; RUN_UNTAGGED="$4"

            # Idempotent: skip if the secret already holds a runner-token. The API has
            # no upsert, so re-creating would register a duplicate dead runner.
            EXISTING=$(kubectl -n "${DST_NS}" get secret "${SECRET_NAME}" \
              -o jsonpath='{.data.runner-token}' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              echo "  ${SECRET_NAME} already has a runner-token — skipping creation."
              return 0
            fi

            echo "  creating runner '${DESC}' (tags=[${TAGS}] run_untagged=${RUN_UNTAGGED})..."
            RESP=$(curl -sf -X POST "${GITLAB_URL}/api/v4/user/runners" \
              -H "PRIVATE-TOKEN: ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"runner_type\":\"instance_type\",\"description\":\"${DESC}\",\"tag_list\":[${TAGS}],\"run_untagged\":${RUN_UNTAGGED},\"access_level\":\"ref_protected\"}" 2>/dev/null || true)

            TOKEN=$(echo "$RESP" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' | head -1)
            if [ -z "$TOKEN" ]; then
              echo "  ERROR: could not create runner '${DESC}'. Response: $RESP"
              return 1
            fi
            echo "  token obtained (${TOKEN:0:10}...); writing ${DST_NS}/${SECRET_NAME}..."
            kubectl -n "${DST_NS}" create secret generic "${SECRET_NAME}" \
              --from-literal=runner-registration-token="" \
              --from-literal=runner-token="${TOKEN}" \
              --dry-run=client -o yaml | kubectl apply -f -
          }

          echo "Creating instance runners via API..."
          # tag_list values are JSON string elements (quoted); empty = untagged runner.
          create_runner gitlab-runner-token        "k8s-instance-runner"      ""                        true  || exit 1
          create_runner gitlab-runner-token-thor   "k8s-thor-gpu-runner"      '"arm64","thor","buildah"' false || exit 1
          create_runner gitlab-runner-token-mesh   "k8s-mesh-runner"          '"mesh"'                   false || exit 1
          # App-specific / self-contained runner tokens (e.g. the shared [eda] EDA
          # builder, gitlab-runner-token-eda) are minted by their OWN runner app's
          # presync job, not here — so the runner + its token share one lifecycle.

          # --- S3 cache credentials from gitlab-s3-connection ---
          echo "Reading S3 credentials from gitlab-s3-connection..."
          S3_CONN=$(kubectl -n gitlab get secret gitlab-s3-connection \
            -o jsonpath='{.data.connection}' | base64 -d)

          ACCESS_KEY=$(echo "$S3_CONN" | sed -n 's/.*aws_access_key_id:[[:space:]]*//p' | head -1 | tr -d '"')
          SECRET_KEY=$(echo "$S3_CONN" | sed -n 's/.*aws_secret_access_key:[[:space:]]*//p' | head -1 | tr -d '"')

          if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
            echo "ERROR: Could not parse S3 keys"
            exit 1
          fi

          echo "Creating/updating ${DST_NS}/gitlab-runner-cache-s3..."
          kubectl -n "${DST_NS}" create secret generic gitlab-runner-cache-s3 \
            --from-literal=accessKey="${ACCESS_KEY}" \
            --from-literal=secretKey="${SECRET_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "GitLab Runner bootstrap completed successfully."
