# Sync Job: ensure Zulip's S3 buckets exist.
# Ownership of these buckets moved from Pulumi (src/storage.ts ensure-s3-bucket loop)
# to the app that uses them. Idempotent (head-bucket || create-bucket). NOT deleted on
# app removal (data-safe); full-teardown wipe lives in scripts/environment/deleteS3Buckets.sh.
# Uses the zulip-s3 sealed secret (Hetzner S3 keys). Hook: Sync + sync-wave -1
# (NOT PreSync, NOT PostSync):
#   - Sync (not PreSync): the sealed secret is a normal synced resource, absent during
#     PreSync — a PreSync job's secretKeyRef can't resolve and deadlocks.
#   - wave -1 (not PostSync): the buckets exist before Zulip boots (consistent with the
#     other app bucket jobs); Zulip's S3 uploads come later regardless.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zulip-s3-buckets
  namespace: zulip
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is already covered by
  # hook-delete-policy: BeforeHookCreation (the next sync deletes this Job before
  # recreating it), so a TTL buys nothing and COSTS the post-mortem: it deletes the
  # pod, and with it the only copy of the logs.
  #
  # Alloy/Loki does not save you here — its pod discovery is a poll, so a short-lived
  # Job can finish and be deleted before it is ever scraped, leaving Loki with zero
  # lines for it. A failed hook Job is exactly what you most need logs for after a
  # recreate.
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ensure-buckets
          image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zulip-s3
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zulip-s3
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: "nbg1" # automatically updated from project-settings:storage.objectStorage.baseEndpoint
            - name: AWS_PAGER
              value: ""
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ENDPOINT="https://nbg1.your-objectstorage.com" # automatically updated from project-settings:storage.objectStorage.baseEndpoint
              for BUCKET in edgecloudinfra-zulip edgecloudinfra-zulip-avatars; do # automatically updated from project-settings:{general.name,storage.objectStorage.buckets}
                if aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" 2>/dev/null; then
                  echo "Bucket $BUCKET already exists."
                else
                  echo "Creating bucket $BUCKET ..."
                  aws s3api create-bucket --bucket "$BUCKET" \
                    --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION"
                  echo "Created $BUCKET."
                fi
              done
              echo "Zulip S3 buckets ready."
