# PostSync: create the "sync-bot" Zulip user (admin bot) and write its credentials
# into the zulip-sync-bot Secret consumed by cronjob-sync-users.
#
# Idempotent: if the bot already exists its API key is read and the secret is
# patched in-place. No manual steps required at cluster creation.
#
# The bot is given realm-admin rights so it can deactivate / pre-provision users
# via the Zulip REST API (admin-only endpoints).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zulip-create-sync-bot
  namespace: zulip
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zulip-create-sync-bot
  namespace: zulip
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zulip-create-sync-bot
  namespace: zulip
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zulip-create-sync-bot
subjects:
- kind: ServiceAccount
  name: zulip-create-sync-bot
  namespace: zulip
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zulip-create-sync-bot
  namespace: zulip
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is already covered by
  # hook-delete-policy: BeforeHookCreation (the next sync deletes this Job before
  # recreating it), so a TTL buys nothing and COSTS the post-mortem: it deletes the
  # pod, and with it the only copy of the logs.
  #
  # Alloy/Loki does not save you here — its pod discovery is a poll, so a short-lived
  # Job can finish and be deleted before it is ever scraped, leaving Loki with zero
  # lines for it. A failed hook Job is exactly what you most need logs for after a
  # recreate.
  template:
    spec:
      serviceAccountName: zulip-create-sync-bot
      restartPolicy: OnFailure
      containers:
      - name: create-bot
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        env:
        - name: BOT_EMAIL
          value: "sync-bot@zulip.subdomain1.your-domain.tld" # automatically updated from project-settings:{general.subdomain,general.domain}
        - name: BOT_NAME
          value: "Sync Bot"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu

          echo "Waiting for Zulip pod to be Ready..."
          for i in $(seq 1 60); do
            ZULIP_POD=$(kubectl -n zulip get pods \
              -l app.kubernetes.io/name=zulip \
              --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$ZULIP_POD" ]; then
              READY=$(kubectl -n zulip get pod "$ZULIP_POD" \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
              [ "$READY" = "True" ] && { echo "Zulip pod $ZULIP_POD is Ready."; break; }
            fi
            echo "  Attempt $i/60 — waiting for Ready pod..."
            sleep 10
          done
          [ -n "$ZULIP_POD" ] || { echo "ERROR: no running Zulip pod after timeout"; exit 1; }
          echo "Using pod: $ZULIP_POD"

          MANAGE="/home/zulip/deployments/current/manage.py"

          # Create or retrieve the sync bot and grant realm-admin rights.
          # IMPORTANT: manage.py refuses to run as root ("should not be run as
          # root. Use su zulip"), so the script is piped on stdin into
          # `su zulip -c "... manage.py shell"`. Feeding the code via stdin (not
          # `shell -c "..."`) also avoids a second layer of shell quoting around
          # the Python, which itself contains single quotes.
          # API names current as of the zulip 11.x image:
          #   - do_create_user (NOT the low-level create_user_profile, whose
          #     signature changed and dropped realm_creation/is_mirror_dummy);
          #   - UserProfile.DEFAULT_BOT (SERVICE_BOT no longer exists);
          #   - role=ROLE_REALM_ADMINISTRATOR (is_realm_admin is a read-only
          #     property now, not a filterable/assignable field).
          # The realm is served at EXTERNAL_HOST (zulip.<tld>) with
          # ROOT_DOMAIN_LANDING_PAGE=False, so it uses the empty string_id (root
          # subdomain). Nothing else creates it; without it the site shows 'no
          # organization found' and OIDC auto-signup has no realm to attach to.
          OUT=$(kubectl -n zulip exec -i "$ZULIP_POD" -- su zulip -c "python3 $MANAGE shell" 2>&1 <<PYEOF
          from zerver.models import UserProfile, Realm
          from zerver.actions.create_realm import do_create_realm
          from zerver.actions.create_user import do_create_user
          realm = Realm.objects.filter(string_id='').first()
          if realm is None:
              realm = do_create_realm('', 'Zulip')
          user = UserProfile.objects.filter(delivery_email='${BOT_EMAIL}', realm=realm).first()
          if user is None:
              user = do_create_user('${BOT_EMAIL}', None, realm, '${BOT_NAME}',
                                    bot_type=UserProfile.DEFAULT_BOT,
                                    role=UserProfile.ROLE_REALM_ADMINISTRATOR,
                                    bot_owner=None, acting_user=None)
          elif user.role != UserProfile.ROLE_REALM_ADMINISTRATOR:
              user.role = UserProfile.ROLE_REALM_ADMINISTRATOR
              user.save(update_fields=['role'])
          # Creating users via the REST API requires the separate can_create_users
          # permission — realm-admin role alone is NOT enough ("User not authorized
          # to create users"). The sync-users CronJob pre-provisions accounts, so
          # the bot needs this flag.
          if not user.can_create_users:
              user.can_create_users = True
              user.save(update_fields=['can_create_users'])
          print(user.api_key)
          PYEOF
          )
          API_KEY=$(echo "$OUT" | tail -1)
          # The bot api_key is a 32-char token; anything longer means we captured a
          # traceback / banner line instead — fail loudly with the full output.
          case "$API_KEY" in
            ?????????????????????????????????*) API_KEY="" ;;
            "") ;;
          esac
          [ -n "$API_KEY" ] || { echo "ERROR: failed to create/get bot API key:"; echo "$OUT"; exit 1; }
          echo "Bot API key obtained."

          # Write credentials into the zulip-sync-bot Secret (create or patch)
          if kubectl -n zulip get secret zulip-sync-bot >/dev/null 2>&1; then
            kubectl -n zulip patch secret zulip-sync-bot \
              --type='json' \
              -p="[
                {\"op\":\"replace\",\"path\":\"/data/bot-email\",\"value\":\"$(echo -n "$BOT_EMAIL" | base64)\"},
                {\"op\":\"replace\",\"path\":\"/data/bot-api-key\",\"value\":\"$(echo -n "$API_KEY" | base64)\"}
              ]" 2>/dev/null || \
            kubectl -n zulip patch secret zulip-sync-bot \
              -p "{\"data\":{\"bot-email\":\"$(echo -n "$BOT_EMAIL" | base64)\",\"bot-api-key\":\"$(echo -n "$API_KEY" | base64)\"}}"
            echo "Secret zulip-sync-bot updated."
          else
            kubectl -n zulip create secret generic zulip-sync-bot \
              --from-literal="bot-email=$BOT_EMAIL" \
              --from-literal="bot-api-key=$API_KEY"
            echo "Secret zulip-sync-bot created."
          fi

          echo "Done."
