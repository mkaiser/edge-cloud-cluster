# Vivado 2024.1 CONTAINER module image build — recover-or-rebuild.
#
# SOURCE OF TRUTH: this file lives in the infra repo
# (deployment/argocd-apps/eda/xilinx-2024-1/.gitlab-ci.yml). The build-trigger
# (postsync-build-image.yaml) MIRRORS it (+ Dockerfile + install_config.txt + module.yaml)
# into the in-cluster GitLab project
# deployments/infrastructure/eda/modules/xilinx-2024-1; ArgoCD then TRIGGERS this
# pipeline. Do NOT hand-edit it in GitLab — overwritten on the next mirror.
#
# Its own GitLab project, NOT .../modules/vivado (which is 2026.1's): one project per app,
# so two triggers can never overwrite each other's mirror. module.yaml's `image:` key points
# the broker at this repo.
#
# Runs on unibi-hclab-pcie-tb-s via tags:[eda]. The 2024.1 media (115 GB .tar.GZ) lives on the
# TrueNAS NFS export, mounted READ-WRITE at /artifacts by the [eda] runner (static PV,
# gitlab-runner-eda/nfs-installers-pv.yaml) — see $MEDIA_DIR below. It was moved off the
# SMB share because that read at ~11.5 MB/s, i.e. ~2.8 h before the first install step; this
# export measured ~126 MB/s. buildah bind-mounts the extracted tree BUILD-TIME only (never
# committed to a layer).
stages: [build]

workflow:
  auto_cancel:
    on_new_commit: interruptible

build-xilinx-2024-1:
  stage: build
  tags: [eda]                     # -> pcie-tb-s [eda] runner (gitlab-runner-token-eda)
  # ⚠ THE SHARED CI BUILD IMAGE, not quay.io/buildah/stable: buildah to BUILD plus skopeo
  # for the registry gate below, which quay's image has never shipped. Built by
  # deployment/argocd-apps/ci-build-image — read its README before changing this line.
  # ⚠ The tag must equal that app's IMAGE_TAG; remote-desktop/check-image-invariants.sh
  # fails the commit if they drift. A consumer pinned to a tag that was never built simply
  # never starts its build pod.
  image: $CI_REGISTRY/deployments/infrastructure/ci/build-image:v1.43.2-skopeo-r1
  # Serialize rebuilds of THIS app. resource_group is PROJECT-scoped; the 115 GB extraction
  # on /build-scratch is additionally guarded by an flock (see the extract step below).
  resource_group: xilinx-2024-1-build
  interruptible: true
  # ── MEASURED COSTS ───────────────────────────────────────────────────────────────────
  # Phase timings for a trimmed device set (6 families):
  #     extract 115 GB from NFS   15:40 -> 15:57   ~17 min
  #     buildah bud (xsetup)      15:57 -> 16:21   ~25 min
  #     push to registry          16:21 -> 17:36   ~75 min   (22.8 GB compressed)
  #     archive to NFS            17:36 -> 17:45   ~9 min    (40.2 GB uncompressed tar)
  #     TOTAL                                      ~125 min
  # The FULL module set (#46, all 17 modules, EnableDiskUsageOptimization=0) installs
  # longer and pushes more; budget ~3 h end to end rather than 2.
  #
  # DISK on /build-scratch — MEASURED, not estimated:
  #     extracted installer tree                 110 GB
  #     buildah storage, trimmed set (peak)      224 GB
  #     buildah storage, full set (mid-install)  275 GB and still climbing
  #     => peak ~450 GB for the full set; the guards below are set from these numbers.
  # ⚠ The extraction is kept by the .extract-done marker, so a retry skips the 17 min
  # re-read entirely.
  #
  # SIZES for capacity planning, for the FULL module set (a trimmed set is roughly half of
  # each):
  #     registry tag (compressed)   42.8 GB   <- what a pull costs, and what the blob
  #                                              store on datapool/images holds
  #     uncompressed image          86.8 GB   <- what a pull expands to on disk
  #     installed tree              53 GB /opt/Xilinx + 29 GB /xilinx-data
  #
  # ⚠ TIMING, also from #71: total 203 min, of which the PUSH alone was 135 min (05:50→08:05)
  # and the install only 8. The 6h timeout is therefore NOT generous for the full set — a
  # slower push or one retry would exceed it. Raise it before adding anything to Modules=.
  timeout: 6h
  variables:
    FORCE_REBUILD: "0"                 # set to "1" for a ONE-SHOT rebuild of the same tag after a
                                       # Dockerfile/install_config fix (IMAGE_TAG is the user-facing
                                       # module version and must not be bumped); reset to 0 once published
    IMAGE_TAG: "2024.1"                # the MODULE version (module load xilinx/2024.1)
    IMAGE: $CI_REGISTRY_IMAGE:$IMAGE_TAG
    # ⚠ REPO PATH ONLY — no host, and NO :TAG. `${IMAGE#*/}` strips the host but LEAVES
    # the tag, so a /v2/<repo>/manifests/<tag> URL built from it asks for a repository
    # literally named "…/<name>:<tag>", which cannot exist -> 404 forever. The gate is
    # fail-open, so that 404 reads as "not in the registry" and rebuilds from installer
    # media every single time, silently. Measured on ecc188: the buggy form returned 404
    # and this form returned 200 against the same tag.
    # A `docker://` push destination is the opposite case — it MUST keep the tag, so those
    # still use ${IMAGE#*/}.
    IMAGE_REPO: $CI_PROJECT_PATH
    # ── installer media on the NFS export ────────────────────────────────────────────
    # ONE FLAT DIRECTORY per vendor on the fast export, mounted rw at /artifacts by the
    # [eda] runner (static PV, gitlab-runner-eda/nfs-installers-pv.yaml). Both xilinx
    # versions' media sit side by side in it, next to unrelated PetaLinux .run installers.
    # MEDIA ONLY: container images are not archived here — the registry blob store is the
    # only copy.
    MEDIA_DIR: /artifacts/xilinx
    #
    # ⚠ NAMED IN FULL, not globbed. $MEDIA_DIR is shared with 2026.1 and with the PetaLinux
    # installers, so `ls $MEDIA_DIR/*.tar.gz | head -1` would be a lottery the moment a
    # second .tar.gz lands there — and the loser builds silently against the wrong media,
    # publishing it under this app's user-facing module tag. The extension alone is not a
    # discriminator either: 2026.1's media is an uncompressed .tar today, but nothing
    # guarantees that stays true. Update this when the media file is replaced.
    MEDIA_TAR: FPGAs_AdaptiveSoCs_Unified_2024.1_0522_2023.tar.gz
    #
    # Module identity on the module share, for the recreate-skip in the build trigger.
    # Declared separately from IMAGE_TAG on purpose: the two coincide today, but a tag that
    # ever diverged from the module version would silently check the wrong module.
    MODULE_NAME: "xilinx"
    MODULE_VERSION: "2024.1"
    REGISTRY_TLS_VERIFY: "true" # automatically updated from project-settings:{tls.certIssuerType,tls.registryTlsVerify}
    STORAGE_DRIVER: overlay
    BUILDAH_ROOT: /build-scratch/buildah-storage
    BUILDAH_RUNROOT: /build-scratch/buildah-run
    # ⚠ THE LAB-LOCAL REGISTRY, not GitLab's. EDA module images are published here and
    # ONLY here; GitLab's registry stays the home for everything else (remote-desktop
    # base, vLLM, …). See deployment/argocd-apps/image-registry/README.md.
    #
    # WHY: registry-preferclose only kept the CLIENT HOP on the LAN — the registry behind
    # it still wrote through to Hetzner S3 in Nuremberg, which is the ~5.3 MB/s that made
    # a 31 GB push take 16 min. image-registry stores to the TrueNAS export on the lab LAN
    # (~92 MB/s write / ~126 MB/s read), so S3 leaves the path entirely.
    #
    # ⚠ AUTHENTICATED (htpasswd) and TLS from a PRIVATE in-cluster CA. Both are
    # required, not hardening: what this registry serves is executed AS ROOT by the
    # remote-desktop broker, whose allowed() gate authorises by <repo>:<tag> and never
    # checks the CONTENT at that tag. The credential arrives as masked CI variables and
    # the CA as IMAGE_REGISTRY_CA, both published by this app's build-trigger.
    # Still ClusterIP-only — the CA is private, so an external client could not verify
    # it; never give this an ingress.
    INTERNAL_REGISTRY: image-registry.image-registry.svc.cluster.local:5000
  script:
    # Trust the image-registry CA. containers/image reads
    # /etc/containers/certs.d/<host>:<port>/*.crt automatically, so writing it here
    # means every later buildah call verifies TLS with NO per-call flag — and a missing
    # CA fails loudly at handshake instead of silently downgrading.
    - |
      mkdir -p "/etc/containers/certs.d/${INTERNAL_REGISTRY}"
      printf '%s\n' "$IMAGE_REGISTRY_CA" > "/etc/containers/certs.d/${INTERNAL_REGISTRY}/ca.crt"
      # ⚠ NOT openssl — quay.io/buildah/stable is Fedora-based and does NOT ship it
      # (verified by probing the image). python3 IS present, and a stdlib-only parse keeps
      # the fail-loud intent with no package install and no network at build time.
      python3 - "/etc/containers/certs.d/${INTERNAL_REGISTRY}/ca.crt" <<'CACHECK' \
        || { echo "ERROR: IMAGE_REGISTRY_CA is not a valid certificate"; exit 1; }
      import base64, re, sys
      raw = open(sys.argv[1], "rb").read().decode("utf-8", "replace")
      m = re.search(r"-----BEGIN CERTIFICATE-----(.+?)-----END CERTIFICATE-----", raw, re.S)
      if not m:
          sys.exit("no PEM CERTIFICATE block")
      try:
          der = base64.b64decode("".join(m.group(1).split()), validate=True)
      except Exception as exc:
          sys.exit(f"base64 decode failed: {exc}")
      # 0x30 = ASN.1 SEQUENCE, the first byte of every X.509 certificate.
      if len(der) < 64 or der[0] != 0x30:
          sys.exit("does not parse as a DER certificate")
      print(f"image-registry CA OK ({len(der)} bytes DER)")
      CACHECK
    - |
      # Recover-or-rebuild: skip if the tag already exists in the registry.
      #
      # IMAGE_TAG is the USER-FACING module version (`module load xilinx/2024.1`), so it
      # cannot be bumped just to force a rebuild after a Dockerfile fix — that would rename
      # the module. Set FORCE_REBUILD=1 (pipeline variable, or here) to rebuild the same tag
      # in place; the push overwrites it.
      if [ "${FORCE_REBUILD:-0}" = "1" ]; then
        echo "FORCE_REBUILD=1 — rebuilding $IMAGE even though it may already exist."
      # ⚠ ASK THE REGISTRY WE ACTUALLY PUSH TO — not GitLab's API.
      #
      # Do NOT query $CI_API_V4_URL/.../registry/repositories: EDA module images are
      # published to the lab-local $INTERNAL_REGISTRY, not GitLab's registry, so GitLab's
      # API reports the tag ABSENT forever — the gate would never short-circuit and EVERY
      # pipeline would rebuild from installer media (hours of Xvfb) instead of skipping.
      #
      # `skopeo inspect --raw` is how to ask. One command performs the registry's auth
      # dance, sends the Accept header for every manifest media type, and verifies TLS
      # against /etc/containers/certs.d/<host>/ca.crt — the file the step above writes,
      # which is why THAT STEP MUST STAY FIRST (enforced by
      # remote-desktop/check-image-invariants.sh). skopeo is present because this pipeline
      # now runs on the CI build image (deployment/argocd-apps/ci-build-image). It is NOT in
      # quay.io/buildah/stable — do not point this job back at that image.
      #
      # Nor buildah: `inspect` errors with 'unsupported transport "docker" for looking up
      # local images' (it only reads LOCAL storage), `manifest inspect` likewise, and `pull`
      # would download tens of GB merely to test presence. All measured, not assumed.
      #
      # ${IMAGE#*/} strips the registry host from $IMAGE, leaving repository AND tag — the
      # same derivation the push below uses, so the two can never disagree about WHICH tag
      # was checked. (A /v2/ URL is the opposite case and must NOT carry the tag.)
      #
      # Still FAIL-OPEN: anything but a clean success means "treat as absent and build",
      # which costs a rebuild, never a wrong image.
      else
        # ⚠ PRINT WHAT WENT WRONG. This gate is fail-open by design, so every failure mode
        # otherwise looks identical to "not in the registry" and costs a multi-hour rebuild
        # with no error anywhere. A discarded stderr hid three separate defects: a `skopeo`
        # that was not in the image, a CA file written after this check, and empty
        # credentials from an unprotected variable on a protected ref. skopeo's own message
        # distinguishes them (authentication required = credential, manifest unknown =
        # genuinely absent, x509 = CA, dial tcp = DNS/connect).
        #
        # Credentials empty is NOT a soft failure — it means the CI variables did not reach
        # this pipeline (see the protected=true note in this app's build trigger), so every
        # run would rebuild forever. Fail loudly instead of silently burning hours.
        if [ -z "${IMAGE_REGISTRY_USER:-}" ] || [ -z "${IMAGE_REGISTRY_PASSWORD:-}" ]; then
          echo "ERROR: IMAGE_REGISTRY_USER/PASSWORD are empty in this pipeline."
          echo "       The registry gate cannot run, so this build would restore nothing and"
          echo "       rebuild from installer media (hours) on EVERY run."
          echo "       Cause: the CI variables are published unprotected while this ref is"
          echo "       protected (CI_COMMIT_REF_PROTECTED=${CI_COMMIT_REF_PROTECTED:-unset})."
          echo "       Fix: publish them with protected=true in this app's build trigger."
          exit 1
        fi
        # ⚠ REPORT THE REF THAT WAS ACTUALLY CHECKED. $IMAGE names the GitLab registry,
        # but module images live ONLY in $INTERNAL_REGISTRY (image-registry) — printing
        # $IMAGE here claimed the tag was in a registry this gate never asked, which is
        # exactly the wrong hint to leave in a recreate post-mortem.
        _gate_ref="${INTERNAL_REGISTRY}/${IMAGE#*/}"
        set +e
        _gate_out=$(skopeo inspect --raw \
                 --creds "$IMAGE_REGISTRY_USER:$IMAGE_REGISTRY_PASSWORD" \
                 "docker://${_gate_ref}" 2>&1)
        _gate_rc=$?
        set -e
        if [ "$_gate_rc" -eq 0 ]; then
          echo "$_gate_ref already exists — skipping build."
          exit 0
        fi
        case "$_gate_out" in
          *"manifest unknown"*|*"name unknown"*|*"was not found"*)
            echo "registry gate: tag not present in $INTERNAL_REGISTRY — building." ;;
          *"authentication required"*|*"unauthorized"*)
            echo "registry gate: AUTH REJECTED by $INTERNAL_REGISTRY. The credential is wrong,"
            echo "  not the tag. Building anyway (fail-open), but the recreate-survival path is"
            echo "  NOT working — fix the credential."
            echo "  skopeo: $_gate_out" ;;
          *x509*|*certificate*)
            echo "registry gate: TLS verification failed against $INTERNAL_REGISTRY. Is"
            echo "  IMAGE_REGISTRY_CA the CA of the CURRENT cluster? A recreate mints a new one."
            echo "  skopeo: $_gate_out" ;;
          *)
            echo "registry gate: unexpected failure — treating as absent, building."
            echo "  skopeo: $_gate_out" ;;
        esac
      fi
      echo "Building $IMAGE on $(uname -m) at $(date -u +%F' '%T)..."
    - |
      # The SDI tarball lives on the NFS export ($MEDIA_DIR); extract onto node-local
      # /build-scratch, because buildah needs a writable tree and node-local disk is still
      # faster than any network mount for the millions of small files xsetup then reads.
      # Idempotent: marker + xsetup presence, with the marker written LAST so a
      # partial/aborted extraction is redone.
      #
      # ⚠ THE FLOCK IS NOT redundant with resource_group, which is scoped to ONE GitLab
      # project. Today only this project uses $EXTRACT, so nothing contends for it; the lock
      # stays because the failure mode if a second consumer is ever added is severe and
      # SILENT — a concurrent job's `rm -rf "$EXTRACT"` deletes the tree out from under an
      # in-flight tar ("Cannot open: No such file or directory" for every payload member),
      # and a build can end up reading another's media. Any second consumer must also read
      # the same $MEDIA_DIR/$MEDIA_TAR, or one tree gets populated from two sources.
      #
      # NOTE the media differs from 2026.1's in two ways: it is a FLAT file (not under an
      # install_files/ subdir) and it is GZIPPED (.tar.gz, hence -xzf).
      set -e
      TAR=$MEDIA_DIR/$MEDIA_TAR
      EXTRACT=/build-scratch/xilinx-2024-1-extracted
      LOCK=/build-scratch/.xilinx-2024-1-extract.lock
      touch "$LOCK"
      # 4 h: long enough to wait out a full extraction by a lock holder, short enough to fail the
      # job rather than sit until the pipeline timeout with no diagnostic.
      flock -w 14400 "$LOCK" sh -euc '
        EXTRACT="$1"; TAR="$2"; MEDIA_DIR="$3"
        if [ -f "$EXTRACT/.extract-done" ] && [ -n "$(find "$EXTRACT" -maxdepth 2 -name xsetup -type f 2>/dev/null)" ]; then
          echo "Installer already extracted at $EXTRACT (by this job or its twin)."
          exit 0
        fi
        [ -f "$TAR" ] || {
          echo "ERROR: installer media not found at $TAR — has it been staged onto the NFS"
          echo "       export, and does \$MEDIA_TAR still name the file that is there?"
          ls -la "$MEDIA_DIR" 2>&1 | head -20; exit 1; }
        avail_gb=$(df -BG --output=avail /build-scratch | tail -1 | tr -dc "0-9")
        # MEASURED on a trimmed-set build: 110G extraction + 224G buildah storage = ~334G
        # peak, on a 1.8T disk. The full module set (every family + Vitis + Model Composer +
        # PDM + DocNav, EnableDiskUsageOptimization=0) grows the storage side, hence 500G —
        # a threshold sized for the trimmed set passes silently into a wall.
        # ⚠ This is a WARN, not a gate: it never fails the job. Deliberate (a tight-but-
        # sufficient disk should still build) but it means the message is the only signal.
        [ "$avail_gb" -ge 500 ] || echo "WARN: only ${avail_gb}G free on /build-scratch — measured peak for the FULL module set is ~450-500G (110G extraction + 340G+ storage). This build may fail on ENOSPC."
        echo "[$(date -u +%F" "%T)] extracting $TAR (115 GB at the measured ~126 MB/s NFS read — expect ~15 min, plus gunzip)..."
        rm -rf "$EXTRACT"; mkdir -p "$EXTRACT"
        tar -xzf "$TAR" -C "$EXTRACT"
        find "$EXTRACT" -maxdepth 2 -name xsetup -type f | grep -q . || { echo "ERROR: no xsetup in extracted tar"; exit 1; }
        touch "$EXTRACT/.extract-done"
        echo "[$(date -u +%F" "%T)] extraction done."
      ' sh "$EXTRACT" "$TAR" "$MEDIA_DIR"
      # Re-assert outside the lock: if the twin extracted it, this is what we build against.
      [ -f "$EXTRACT/.extract-done" ] || { echo "ERROR: $EXTRACT/.extract-done missing after the extract step"; exit 1; }
      avail_gb=$(df -BG --output=avail /build-scratch | tail -1 | tr -dc '0-9')
      # 340G: the trimmed set measured 224G of buildah storage; the full set is larger and
      # EnableDiskUsageOptimization=0 removes the installer's own shrink pass.
      [ "$avail_gb" -ge 340 ] || echo "WARN: only ${avail_gb}G free on /build-scratch — the FULL module set measured ~340G of buildah storage alone."
    # BOTH registries: $CI_REGISTRY for the Dockerfile's base-image pull, and
    # $INTERNAL_REGISTRY (image-registry) for the push — separate hosts, separate creds.
    - buildah login --tls-verify=$REGISTRY_TLS_VERIFY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah login -u "$IMAGE_REGISTRY_USER" -p "$IMAGE_REGISTRY_PASSWORD" "$INTERNAL_REGISTRY"
    - mkdir -p "$BUILDAH_ROOT" "$BUILDAH_RUNROOT"
    - echo "[$(date -u +%F' '%T)] buildah bud starting (xsetup install inside, expect 1-2 h)..."
    # -v bind-mounts the extracted installer BUILD-TIME only (never committed to a layer).
    # --root/--runroot put layer storage on the node-local scratch hostPath.
    - buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER"
      bud --isolation chroot --format docker
      -v /build-scratch/xilinx-2024-1-extracted:/installer:ro
      -t "$IMAGE" .
    - |
      # Push under the SAME repository path as $IMAGE (pods/broker pull via the
      # ingress name). PreferClose keeps bytes on the lab LAN; retries resume per-blob.
      DEST="docker://${INTERNAL_REGISTRY}/${IMAGE#*/}"
      set +e
      n=0
      until [ "$n" -ge 6 ]; do
        echo "=== push attempt $((n+1)) START $(date -u +%H:%M:%S) ==="
        timeout 10800 buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER" \
          push --retry 20 --retry-delay 10s \
          "$IMAGE" "$DEST"
        rc=$?
        echo "=== push attempt $((n+1)) END $(date -u +%H:%M:%S) rc=$rc ==="
        [ "$rc" -eq 0 ] && break
        n=$((n+1)); echo "push attempt $n failed (rc=$rc) — retrying in 30s (buildah resumes from uploaded blobs)..."; sleep 30
      done
      set -e
      [ "$n" -lt 6 ] || { echo "ERROR: push failed after 6 attempts"; exit 1; }
    - buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER" rmi --prune || true
    - echo "Pushed $IMAGE (via $INTERNAL_REGISTRY) at $(date -u +%F' '%T)"
  # ── ALWAYS-RUN SCRATCH RECLAIM ───────────────────────────────────────────────────────
  # Runs on SUCCESS AND FAILURE, which is the whole point: the `rmi --prune` at the end of
  # `script:` is unreachable when the build dies, and a failed `buildah bud` is exactly the
  # case that leaves the most behind (measured 224-340 GB of layer storage for the full
  # module set). /build-scratch is the node-local hostPath /var/lib/xilinx-build; nothing
  # else ever wipes it, so before this existed every failed pipeline leaked its whole layer
  # store until someone noticed the disk was full.
  #
  # WHAT IS DELETED: buildah's containers, images and layer cache, and only via buildah's
  # own subcommands — never `rm -rf $BUILDAH_ROOT`, which can leave overlay mounts behind
  # and break the next run. Order matters: `rm -a` first (a working container holds a
  # reference that makes `rmi` fail), then `rmi -a -f` (the `rmi --prune` in `script:` drops
  # only DANGLING images, so the tagged build stayed forever), then `prune -a -f` for the
  # intermediate/mount cache neither of those reaches.
  #
  # Dropping the tagged image is safe: it has already been pushed to image-registry, which is
  # its only permanent home. On the failure path there is nothing worth keeping anyway.
  #
  # WHAT IS KEPT: $EXTRACT, the extracted installer tree, guarded by .extract-done and
  # deliberately SHARED with the twin app. Deleting it would cost every subsequent build a
  # re-read of the whole tarball off NFS and defeat the flock/marker design. Reclaim it by
  # hand when the disk is genuinely tight:
  #   rm -rf /var/lib/xilinx-build/*-extracted /var/lib/xilinx-build/hyperlynx-media
  #
  # ⚠ NO `set -e` and every command `|| true`: after_script must not turn a green build red,
  # and on the failure path it must not mask the real error with a cleanup error. GitLab
  # gives after_script its own 5-min default timeout, so keep it cheap.
  after_script:
    - |
      echo "[$(date -u +%F' '%T)] scratch reclaim (job status: ${CI_JOB_STATUS:-unknown})"
      df -h /build-scratch || true
      BA="buildah --root $BUILDAH_ROOT --runroot $BUILDAH_RUNROOT --storage-driver $STORAGE_DRIVER"
      $BA rm -a || true
      $BA rmi -a -f || true
      $BA prune -a -f || true
      echo "[$(date -u +%F' '%T)] after reclaim:"
      df -h /build-scratch || true
      du -sh /build-scratch/* 2>/dev/null | sort -h || true
