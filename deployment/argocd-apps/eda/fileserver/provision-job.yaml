                          a.get("type") == "ALLOW", f"got {a.get('type')!r}")
                    # MODIFY (or FULL_CONTROL) is what permits creating files. READ would
                    # reproduce exactly the ACCESS_DENIED-on-write symptom.
                    perms = (a.get("perms") or {}).get("BASIC")
                    check(f"{want_who} filesystem ACE allows writing",
                          perms in ("MODIFY", "FULL_CONTROL"), f"BASIC={perms!r}")
                    # Without inheritance, subdirectories added later are not writable.
                    flags = (a.get("flags") or {}).get("BASIC")
                    check(f"{want_who} filesystem ACE is inherited",
                          flags == "INHERIT", f"BASIC={flags!r}")
            except Exception as exc:
                check(f"filesystem ACL on {p} readable", False, str(exc)[:80])

        print()
        if failures:
            print(f"EDA FILESERVER VERIFY FAILED — {len(failures)} gate(s):", file=sys.stderr)
            for f in failures:
                print("  " + f, file=sys.stderr)
            sys.exit(1)
        print("All EDA fileserver gates passed.")


    if __name__ == "__main__":
        main()
---
# The provisioning Job mints its own scoped TrueNAS API key and caches it in a Secret in
# THIS namespace, so it needs to read and write exactly that. Namespace-scoped Role, not a
# ClusterRole: nothing here touches any other namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eda-fileserver-provision
  namespace: eda-fileserver
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eda-fileserver-provision
  namespace: eda-fileserver
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  # get   — is there already a cached key from an earlier run?
  # create/update — cache a freshly minted one. NO list and NO watch: this Job addresses one
  # Secret by name, and the admin credential it bootstraps from lives in the same namespace,
  # so `list` would hand it the ability to read that too.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["eda-fileserver-api"]
    verbs: ["get", "update"]
  # The init container waits for the bootstrap credential to be decrypted, and the main
  # container re-reads it through this same grant when the secretKeyRef env came up empty
  # (see admin_credential(): a secretKeyRef binds at POD CREATION, so a Secret that appears
  # during the init wait never reaches the env). get on this ONE name, no list and no watch.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["truenas-admin"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eda-fileserver-provision
  namespace: eda-fileserver
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eda-fileserver-provision
subjects:
  - kind: ServiceAccount
    name: eda-fileserver-provision
    namespace: eda-fileserver
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eda-fileserver-provision
  namespace: eda-fileserver
  annotations:
    argocd.argoproj.io/hook: PreSync
    # ⚠ hook-weight, NOT sync-wave. A PreSync Job that mounts a PreSync ConfigMap fails
    # with "configmap not found" if the ConfigMap is ordered by sync-wave — hooks order
    # among themselves by hook-weight only.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # ⚠ LOW ON PURPOSE. A failed run has already spent auth attempts against the appliance's
  # 20-per-60s limit, and a retry storm turns a small error into a ten-minute lockout of
  # the whole appliance — /home included. One retry, then fail loudly.
  backoffLimit: 1
  # Bounded: an unbounded PreSync hook blocks the Application indefinitely.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: eda-fileserver-provision
      # ⚠ BOTH are required and are copied verbatim from the infra job. The appliance is
      # only reachable from its own LAN, and WITHOUT THE TOLERATION THE POD STAYS PENDING
      # FOREVER rather than failing.
      nodeSelector:
        ecc/fileserver-lan: "true"  # automatically updated from project-settings:applicationPlacements.labels.fileserverLan
      tolerations:
        - key: ecc/mesh  # automatically updated from project-settings:applicationPlacements.labels.mesh
          operator: Equal
          value: "true"
          effect: NoSchedule
      # ⚠ WAIT FOR THE DECRYPTED SECRET, do not just order the SealedSecret ahead of this
      # Job. The hook-weight on truenas-admin-sealed.yaml (-20) guarantees the SealedSecret
      # CUSTOM RESOURCE exists before this pod — it does NOT guarantee secret/truenas-admin
      # exists, because ArgoCD considers a SealedSecret synced as soon as the CR is applied,
      # while the actual Secret appears only once the sealed-secrets controller has
      # decrypted it. That is an asynchronous step this Job cannot see.
      #
      # A secretKeyRef is resolved at POD CREATION. Lose that race and the env var is simply
      # absent (`optional: true`), the script exits 1 on the "no admin credential" path, and
      # backoffLimit:1 gives it one immediate retry that is very likely to lose the race
      # again — reproducing the original deadlock intermittently, which is strictly worse
      # than reproducing it always.
      #
      # ⚠ THIS MUST QUERY THE API — a mounted `optional: true` secret volume does NOT work:
      # when the Secret is absent at pod creation the kubelet mounts an empty dir and NEVER
      # repopulates it, so a file test waits forever even after the Secret appears. Same
      # root cause as the secretKeyRef race, so it cannot be used to guard against it.
      initContainers:
        - name: wait-for-credential
          # Same image every other kubectl-running hook in this repo uses, so it is
          # already present on the lab nodes and renovate tracks it in one place.
          image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
          command:
            - sh
            - -c
            - |
              # ⚠ IF THE SCOPED KEY IS ALREADY CACHED, DO NOT WAIT FOR THE ADMIN SECRET.
              # The admin credential is only needed to MINT that key on a fresh cluster;
              # once secret/eda-fileserver-api exists the provision script never reads it.
              # Blocking on truenas-admin here would make a steady-state re-sync fail for a
              # credential it does not use.
              if kubectl get secret eda-fileserver-api -n eda-fileserver >/dev/null 2>&1; then
                echo "secret/eda-fileserver-api is cached — admin credential not needed"
                exit 0
              fi

              # Existence only — `get` on the object, never reading its contents. The Role
              # grants get on this one name, so this cannot read any other Secret here.
              #
              # ⚠ 600s, NOT 120s. hook-weight -20 orders the APPLY of the SealedSecret, but
              # secret/truenas-admin only appears once the sealed-secrets controller has
              # DECRYPTED it — an asynchronous step no hook weight can wait for. On a
              # bootstrap that gap runs to minutes, well past a 120s budget, and every retry
              # loses the same race because `hook-delete-policy: BeforeHookCreation`
              # recreates the pod each time. On a
              # fresh cluster the controller is competing with every other app's first sync,
              # so the budget has to cover a slow bootstrap, not a quiet cluster.
              i=0
              until kubectl get secret truenas-admin -n eda-fileserver >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -ge 300 ]; then
                  echo "ERROR: secret/truenas-admin did not appear after 600s." >&2
                  echo "       The SealedSecret is applied at hook-weight -20, but decryption" >&2
                  echo "       is asynchronous — check the controller actually unsealed it:" >&2
                  echo "         kubectl -n eda-fileserver get sealedsecret,secret truenas-admin" >&2
                  echo "         kubectl -n kube-system logs deploy/sealed-secrets-controller" >&2
                  echo "       A decryption failure usually means it was sealed against a" >&2
                  echo "       DIFFERENT cluster key — re-run" >&2
                  echo "       deployment/argocd-infra/truenas/sealSecrets.sh." >&2
                  exit 1
                fi
                [ $((i % 15)) -eq 1 ] && echo "waiting for secret/truenas-admin ... $((i * 2))s"
                sleep 2
              done
              echo "secret/truenas-admin is present"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: provision
          image: docker.io/library/python:3.14-alpine  # renovate: tracked by "Container image tags" regex (docker datasource)
          command: ["python3", "/src/provision.py"]
          env:
            - name: TN_HOST
              value: "fs-1.ad.base.internal" # automatically updated from project-settings:storage.fileserver.fqdn
            - name: LAB_CIDR
              value: "192.168.1.0/24" # automatically updated from project-settings:storage.fileserver.labCidr
            - name: DS_EDA_PARENT
              value: "datapool/eda" # automatically updated from project-settings:storage.fileserver.datasets.eda.parent
            - name: DS_INSTALLERS
              value: "datapool/eda/installers" # automatically updated from project-settings:storage.fileserver.datasets.eda.installers
            - name: DS_IMAGES
              value: "datapool/images" # automatically updated from project-settings:storage.fileserver.datasets.imageRegistry.dataset
            - name: DS_AI_MODELS
              value: "datapool/ai-models" # automatically updated from project-settings:storage.fileserver.datasets.aiModels.dataset
            - name: DS_MODULEFILES
              value: "datapool/eda/modulefiles" # automatically updated from project-settings:storage.fileserver.datasets.eda.moduleFiles
            - name: DS_BUILDS
              value: "datapool/eda/builds" # automatically updated from project-settings:storage.fileserver.datasets.eda.builds
            # BOOTSTRAP credential — the appliance admin, used ONLY to mint the scoped key
            # on first run (see ensure/mint_api_key). Once a key is cached in
            # secret/eda-fileserver-api this is never read again. Sealed for THIS namespace
            # by argocd-infra/truenas/sealSecrets.sh, which writes all three copies in one
            # run so a rotation cannot leave them disagreeing.
            # `optional: true` so a cluster that has not sealed it yet fails with this job's
            # own clear message rather than an unschedulable pod.
            - name: TN_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: truenas-admin, key: TRUENAS_ADMIN_USER, optional: true }
            - name: TN_ADMIN_PASS
              valueFrom:
                secretKeyRef: { name: truenas-admin, key: TRUENAS_ADMIN_PASSWORD, optional: true }
          volumeMounts:
            - { name: src, mountPath: /src }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: src
          configMap: { name: eda-fileserver-src }
---
# PostSync: assert the appliance really is in the state the PreSync job intended. The
# fileserver is not a k8s resource, so ArgoCD reports this app Synced regardless of what it
# actually looks like — this is what makes drift visible.
apiVersion: batch/v1
kind: Job
metadata:
  name: eda-fileserver-verify
  namespace: eda-fileserver
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # One retry only: a failed run has already spent auth attempts against the appliance's
  # 20-per-60s limit, whose penalty is a ten-minute cluster-wide lockout.
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        ecc/fileserver-lan: "true"  # automatically updated from project-settings:applicationPlacements.labels.fileserverLan
      tolerations:
        - key: ecc/mesh  # automatically updated from project-settings:applicationPlacements.labels.mesh
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: verify
          image: docker.io/library/python:3.14-alpine  # renovate: tracked by "Container image tags" regex (docker datasource)
          command: ["python3", "/src/verify.py"]
          env:
            - name: TN_HOST
              value: "fs-1.ad.base.internal" # automatically updated from project-settings:storage.fileserver.fqdn
            - name: DS_EDA_PARENT
              value: "datapool/eda" # automatically updated from project-settings:storage.fileserver.datasets.eda.parent
            - name: DS_INSTALLERS
              value: "datapool/eda/installers" # automatically updated from project-settings:storage.fileserver.datasets.eda.installers
            - name: DS_IMAGES
              value: "datapool/images" # automatically updated from project-settings:storage.fileserver.datasets.imageRegistry.dataset
            - name: DS_AI_MODELS
              value: "datapool/ai-models" # automatically updated from project-settings:storage.fileserver.datasets.aiModels.dataset
            - name: DS_MODULEFILES
              value: "datapool/eda/modulefiles" # automatically updated from project-settings:storage.fileserver.datasets.eda.moduleFiles
            - name: DS_BUILDS
              value: "datapool/eda/builds" # automatically updated from project-settings:storage.fileserver.datasets.eda.builds
            # The scoped key the PreSync Job minted. No admin credential in this Job.
            - name: TN_API_USER
              valueFrom:
                secretKeyRef: { name: eda-fileserver-api, key: TRUENAS_API_USER, optional: true }
            - name: TN_API_KEY
              valueFrom:
                secretKeyRef: { name: eda-fileserver-api, key: TRUENAS_API_KEY, optional: true }
          volumeMounts:
            - { name: src, mountPath: /src }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: src
          configMap: { name: eda-fileserver-src }
