    """Assert the EDA half of the fileserver is actually in the state provision.py intends.

    The appliance is NOT a k8s resource, so ArgoCD reports the app Synced regardless of what
    the fileserver really looks like. This is what turns appliance drift into a visible failure.

    Runs as a PostSync hook, AFTER provision.py's PreSync — verifying what this sync just did.
    """
    import os, sys
    sys.path.insert(0, "/src")
    from tnclient import TrueNAS

    HOST     = os.environ["TN_HOST"]
    # The scoped key the PreSync Job minted and cached. This runs PostSync, so by now it
    # exists — no admin credential here at all, which is the point of minting one.
    USER     = os.environ.get("TN_API_USER", "")
    API_KEY  = os.environ.get("TN_API_KEY", "")

    PARENT    = os.environ["DS_EDA_PARENT"]
    INSTALLERS = os.environ["DS_INSTALLERS"]
    IMAGES     = os.environ["DS_IMAGES"]
    AIMODELS   = os.environ["DS_AI_MODELS"]
    MODFILES  = os.environ["DS_MODULEFILES"]

    # Same default as provision.py — gate 4 asserts BOTH the share ACL and the filesystem
    # ACL name this group. Env-overridable so the two halves cannot drift apart.
    ACL_GROUP = os.environ.get("SMB_ACL_GROUP", "eda-developer")

    # Keep in step with provision.py SUBDIRS — check-subdirs.sh asserts both agree with
    # each app's CI.
    SUBDIRS = ("xilinx",
               "hyperlynx/2604", "hyperlynx/2604/installer")

    failures = []


    def check(label, ok, detail=""):
        print(("  PASS  " if ok else "  FAIL  ") + label + (f"  ({detail})" if detail else ""))
        if not ok:
            failures.append(label)
        return ok


    def main():
        if not API_KEY:
            print("ERROR: no TRUENAS_API_KEY — the PreSync provisioning Job should have\n"
                  "       minted and cached one in secret/eda-fileserver-api. Check its log.",
                  file=sys.stderr)
            sys.exit(1)
        with TrueNAS(HOST, USER, "", api_key=API_KEY) as tn:
            print("gate 1: datasets")
