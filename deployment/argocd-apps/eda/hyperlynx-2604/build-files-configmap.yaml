# ConfigMap carrying the eda-hyperlynx-2604 build files for the build-trigger to mirror
# into the in-cluster GitLab project deployments/infrastructure/eda/modules/hyperlynx.
# ⚠️ KEEP IN SYNC BY HAND with Dockerfile + .gitlab-ci.yml + module.yaml (regenerate after
# editing any of them). The trigger reads THIS ConfigMap, not the raw files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-hyperlynx-2604-build-files
  namespace: eda-hyperlynx-2604
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
data:
  Dockerfile: |
    # HyperLynx 2604 — RUNNABLE container-runtime module image (podman-run inside the
    # remote-desktop pod). Like every module image it is self-contained and executed as its
    # own container.
    #
    # BASE = CentOS Stream 9 (RHEL 9 family): HyperLynx is a RHEL-targeted Siemens tool, so its
    # RHEL-era libs are (mostly) present here and little side-loading is needed. Where a SONAME the tool wants is absent (e.g. libicu.so.60 — el9 ships a
    # newer ICU), we still vendor it from the staged media.
    #
    # NOT redhat/ubi9: UBI's repos are a SUBSET of RHEL and ship no xorg-x11-server-Xvfb and no
    # glibc-langpack-de, even with EPEL + CRB enabled (verified against ubi9:9.5). Xvfb is
    # mandatory here, so UBI cannot build this image. Stream 9 has all of them in stock repos.
    #
    # BUILD INPUT: the Siemens installer media lives read-only on the SMB file server
    # (install-files/hyperlynx/). The CI job extracts the tar to node-local /build-scratch and
    # bind-mounts THAT at /installer BUILD-TIME ONLY (buildah -v; never committed to a layer).
    # SIP's installer is a Java/AWT app with NO headless mode → Xvfb is mandatory even for the
    # unattended batch replay.

    # ── Stage 1: install HyperLynx from the staged media under Xvfb ──────────────────────
    # renovate: tracked by "Container image tags" regex (docker datasource)
    FROM quay.io/centos/centos:stream9 AS install
    # Xvfb + Java/AWT X libs + tools for the batch installer (all in stock Stream 9 repos;
    # epel-release + CRB are enabled for the runtime stage's motif). NOTE: bsdtar is its OWN
    # package on el9 — `libarchive` is only the library (Ubuntu bundles the CLI in
    # libarchive-tools), and without it this stage dies with 'bsdtar: command not found'.
    RUN dnf -y install epel-release \
        && dnf config-manager --set-enabled crb \
        && dnf -y install \
          xorg-x11-server-Xvfb xorg-x11-utils \
          libXext libXrender libXtst libXi \
          fontconfig glibc-langpack-en glibc-langpack-de \
          java-11-openjdk-headless \
          tar gzip which findutils bsdtar file \
        && dnf clean all

    # Install into a fixed prefix. SIP's recorded batchInstall.sh hardcodes /home/cape/... —
    # map both to the target via symlinks, same as the Ubuntu app's install initContainer.
    ENV TARGET=/opt/hyperlynx
    RUN mkdir -p /home/cape "$TARGET" \
        && ln -sfn "$TARGET" /home/cape/hyperlynx \
        && ln -sfn /installer /home/cape/hyperlynx_install
    ENV HOME=$TARGET

    # batchInstall.sh exports LC_ALL=de_DE (recorded on a German host).
    # Media at /installer (bind-mount): batchInstall.sh, HyperLynx2604_linux64.tar (+SHASUMS),
    # and the RHEL compat libs. The tar is pre-extracted on the node by the CI step (see
    # .gitlab-ci.yml) into /installer/HyperLynx2604_linux64/ so this RUN stays deterministic.
    RUN --mount=type=bind,source=.,target=/ctx \
        set -eu; \
        export LC_ALL=de_DE.UTF-8 || true; \
        # Pre-seed the SALT license server as EMPTY here (never baked): registrator.ini is
        # written at RUNTIME from the injected env, not at build. The installer only needs a
        # placeholder so it does not prompt.
        printf '[defaults]\nSALT_LICENSE_SERVER=\n' > "$TARGET/registrator.ini"; \
        export CFGR_INI="$TARGET/registrator.ini" SDD_PATCH_SKIP=1; \
        # Xvfb — poll until it accepts connections (a fixed sleep races SIP's AWT init).
        Xvfb :99 -screen 0 1600x1000x24 & XVFB_PID=$!; \
        for _ in $(seq 1 30); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done; \
        DISPLAY=:99 xdpyinfo >/dev/null 2>&1 || { echo "Xvfb never became ready" >&2; exit 1; }; \
        # /installer is a READ-ONLY bind mount, so chmod cannot work here — the CI step
        # already stages both files executable on /build-scratch. Kept non-fatal in case a
        # future media copy loses the exec bit (the share itself drops it — memory
        # smb-lab-fileserver-validation), so the real failure surfaces at exec time instead.
        chmod +x /installer/batchInstall.sh /installer/HyperLynx2604_linux64/install.aol 2>/dev/null || true; \
        [ -x /installer/batchInstall.sh ] || { echo "ERROR: batchInstall.sh is not executable" >&2; exit 1; }; \
        echo "[$(date -u +%F' '%T)] replaying SIP batch install (expect ~10-20 min)..."; \
        DISPLAY=:99 /installer/batchInstall.sh; \
        kill "$XVFB_PID" 2>/dev/null || true; \
        [ -d "$TARGET/HL2604" ] || { echo "ERROR: install finished but $TARGET/HL2604 missing" >&2; exit 1; }

    # Vendor the SONAMEs HyperLynx links that el9 may not provide (libicu.so.60 — Siemens RN
    # workaround for the DRC engine + Channel Explorer; libunistring.so.2 for HLSA). Staged in
    # the media bucket. Copy next to the binaries that link them (hlsagui.sh only puts its own
    # dir on LD_LIBRARY_PATH → needs a copy in hlsa/).
    RUN set -eu; SDD="$TARGET/HL2604/SDD_HOME"; \
        mkdir -p /tmp/compat; cd /tmp/compat; \
        if ls /installer/libicu-*.rpm >/dev/null 2>&1; then bsdtar -xf /installer/libicu-*.rpm; fi; \
        if ls /installer/libunistring2_*.deb >/dev/null 2>&1; then \
          mkdir -p uls && (cd uls && bsdtar -xf /installer/libunistring2_*.deb data.tar* && bsdtar -xf data.tar*); fi; \
        for d in "$SDD/common/amd64_linux/lib" "$SDD/i3dpa"; do \
          [ -d "$d" ] && cp -a /tmp/compat/usr/lib64/libicu*.so.60* "$d/" 2>/dev/null || true; done; \
        for d in "$SDD/common/amd64_linux/lib" "$SDD/hlsa"; do \
          [ -d "$d" ] && cp -a /tmp/compat/uls/usr/lib/x86_64-linux-gnu/libunistring.so.2* "$d/" 2>/dev/null || true; done; \
        # The copies above are best-effort per-directory, so verify the SONAMEs actually
        # landed somewhere. A missing libicu.so.60 does not fail the build — it makes the DRC
        # GUI exit SILENTLY at runtime (memory hyperlynx-linux-launch-quirks), which is far
        # more expensive to debug than failing here.
        ls "$SDD/common/amd64_linux/lib"/libicu*.so.60* >/dev/null 2>&1 \
          || { echo "ERROR: libicu.so.60 was not vendored — is libicu-*.rpm in the media?" >&2; exit 1; }; \
        ls "$SDD/common/amd64_linux/lib"/libunistring.so.2* >/dev/null 2>&1 \
          || { echo "ERROR: libunistring.so.2 was not vendored — is libunistring2_*.deb in the media?" >&2; exit 1; }; \
        rm -rf /tmp/compat

    # ── Stage 2: the runnable image ──────────────────────────────────────────────────────
    # renovate: tracked by "Container image tags" regex (docker datasource)
    FROM quay.io/centos/centos:stream9
    # HyperLynx runtime deps: Motif, GTK2/GL for the classic GUIs; Qt6 xcb deps + libgomp for
    # the DRC/HLSA Qt GUIs (libgomp is dlopen'd by hldrcqt — missing ⇒ SILENT exit 0). EPEL for
    # openmotif. NVPL not needed (no CUDA). fontconfig + locales for AWT.
    #
    # GL: HyperLynx bundles its own Qt6, which links the GLVND-SPLIT libraries
    # (libOpenGL.so.0 / libGLX.so.0), NOT the legacy libGL.so.1 that mesa-libGL provides.
    # mesa-libGL pulls in libglvnd + libglvnd-glx + libglvnd-egl as dependencies, but NOT
    # libglvnd-opengl — verified in the shipped 2604 image, which had the other three and was
    # missing exactly the one that ships libOpenGL.so.0. hldrcqt then dies at startup with
    #   "libOpenGL.so.0: cannot open shared object file"
    # so libglvnd-opengl must be named EXPLICITLY. mesa-libGL is still required for the classic
    # Motif/GTK2 GUIs, so both stay. The others are listed to pin the intent, not because they
    # are missing today.
    #
    # ⚠ dbus-x11 (for `dbus-launch`) is NOT optional here, however much it looks like desktop
    # cruft in a CLI-ish image. The DRC GUI embeds a Chromium view, and Chromium's bus.cc RETRIES
    # A SESSION BUS CONNECTION FOREVER when it cannot reach one — measured 2026-09-17: 22 of 32
    # lines in a single launch, several per second, forever. Without this package the retry can
    # never succeed because the BINARY DOES NOT EXIST; the desktop base image ships dbus and this
    # one did not, and that asymmetry is what made the errors look like harmless desktop noise
    # carried over from the desktop pod. The entrypoint starts the bus — see hyperlynx-entry.
    RUN dnf -y install epel-release \
        && dnf config-manager --set-enabled crb \
        && dnf -y install \
          motif gtk2 mesa-libGL mesa-libGLU \
          libglvnd-opengl libglvnd-glx libglvnd-egl \
          libXext libXrender libXtst libXi libxkbfile \
          libxkbcommon-x11 libwayland-server libxcrypt-compat \
          libgomp libatomic nss alsa-lib \
          xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm \
          fontconfig glibc-langpack-en glibc-langpack-de \
          dbus-x11 \
        && dnf clean all \
        && rm -rf /var/cache/dnf \
        # Assert the GL SONAMEs that are dlopen'd at RUNTIME (ldd cannot see those, so they
        # must be listed explicitly). A missing one only surfaces when a user launches the GUI.
        && for so in libOpenGL.so.0 libGLX.so.0 libGL.so.1 libEGL.so.1; do \
             ldconfig -p | grep -q "$so" \
               || { echo "ERROR: $so missing from the runtime image" >&2; exit 1; }; \
           done

    COPY --from=install /opt/hyperlynx /opt/hyperlynx
    COPY module.yaml /module.yaml

    # SYSTEM-LIBRARY DEPENDENCY GATE. The hand-written GL list above only covers libraries that
    # are dlopen'd at runtime (ldd cannot see those). Link-time misses are caught here instead
    # of one bug per release: libgomp, libicu.so.60, libunistring.so.2, libOpenGL.so.0,
    # libatomic.so.1 and libxkbfile.so.1 were each found by a user hitting "error while loading
    # shared libraries" at LAUNCH — one build cycle apiece.
    #
    # TWO THINGS MAKE THIS NON-OBVIOUS, and getting either wrong makes the gate useless:
    #
    # 1. ONLY SYSTEM LIBRARIES COUNT. HyperLynx ships its own libs (libhldrc_*, libsccz,
    #    libtrans_*, libqexp, libolh_64), bundled Intel MKL (libmkl_*, libiomp5), a bundled
    #    Python (libpython3.11) and a vendored libicuuc.so.60. Those resolve at launch through
    #    the LD_LIBRARY_PATH the vendor wrappers set, which ldd does NOT apply by default — so
    #    a naive ldd reports ~20 unresolved SONAMEs that are all fine (verified: it failed the
    #    build on 20 false positives and zero real misses).
    #
    # 2. TRANSITIVE DEPS HIDE BEHIND BUNDLED LIBS. libxkbfile.so.1 is not NEEDED by any
    #    executable — it is pulled in by a bundled Qt library. When ldd cannot resolve that
    #    bundled lib it also cannot recurse into it, so the system dep behind it stays
    #    invisible and the gate passes clean while the GUI still dies at launch.
    #
    # 3. BUT SCANNING EVERY BUNDLED .so IS ALSO WRONG. The payload ships optional backends it
    #    never loads here — Oracle (libclntsh), MySQL, ODBC, GStreamer 0.10, Python 2.7,
    #    Tcl/Tk, InfiniBand (libibverbs/libpsm2). Probing all 3527 objects reported 54
    #    "missing" SONAMEs, ~53 of them dependencies of libraries nothing ever opens. A gate
    #    that demands those be installed is just as useless as one that misses libxkbfile.
    #
    # 4. A FEW REACHABLE MISSES ARE STILL FINE. bswConsole links Intel MPI, which enumerates
    #    fabric providers (InfiniBand/verbs, EFA, PSM2, UCX) at RUNTIME and silently falls back
    #    to shared memory / TCP when a provider's library is absent — which is what this cluster
    #    uses. libnuma is in the same class. Those are listed in /tmp/optional.txt and reported
    #    but not fatal. Everything else missing FAILS the build: a Qt/X11 library really does
    #    mean "the GUI cannot start", which is the whole point of the gate.
    #
    #    Two more sit on that list for a different reason — they are NOT installable:
    #    libQt6Quick3D / libQt6Quick3DRuntimeRender are not packaged in Stream 9 at all (only
    #    Qt5 is), and libmfc.so is a Siemens-internal name, not a system library. They belong
    #    to the 3D viewport path; the 2D DRC/HLSA/BSW flows this module exists for do not need
    #    them. If a 3D view is ever required, the fix is a bundled Qt6 Quick3D from the vendor
    #    media, NOT a dnf package — so failing the build on them would just be a permanent
    #    blocker with no available remedy.
    #
    # So: walk the dependency graph by REACHABILITY from the three launched executables,
    # following only edges that actually resolve. Export the payload's own search path first so
    # bundled libs resolve and the walk can continue THROUGH them (that is what makes the
    # transitive libxkbfile visible). Unused backends are never reached, so they never appear.
    # A SONAME that stays unresolved and is not present anywhere under the payload tree is a
    # genuine system miss.
    RUN set -e; \
        find /opt/hyperlynx -name '*.so*' -printf '%f\n' 2>/dev/null | sort -u > /tmp/bundled.txt; \
        find /opt/hyperlynx -name '*.so*' -printf '%h\n' 2>/dev/null | sort -u > /tmp/libdirs.txt; \
        LD_LIBRARY_PATH="$(tr '\n' ':' < /tmp/libdirs.txt)"; export LD_LIBRARY_PATH; \
        echo "dependency gate: $(wc -l < /tmp/libdirs.txt) bundled library dirs on the probe path"; \
        printf '%s\n' \
          libibverbs.so.1 libefa.so.1 libpsm2.so.2 libucp.so.0 libnuma.so.1 \
          libQt6Quick3D.so.6 libQt6Quick3DRuntimeRender.so.6 \
          libmfc.so \
          > /tmp/optional.txt; \
        SDD=/opt/hyperlynx/HL2604/SDD_HOME; \
        : > /tmp/frontier.txt; \
        for d in "$SDD/hldrc/linux64/bin" "$SDD/hlsa" "$SDD/hlsa/linux64/bin" \
                 "$SDD/hyperlynx" "$SDD/hyperlynx/linux64/bin"; do \
          [ -d "$d" ] && find "$d" -maxdepth 1 -type f -perm -u+x >> /tmp/frontier.txt 2>/dev/null; \
        done; \
        sort -u /tmp/frontier.txt -o /tmp/frontier.txt; \
        [ -s /tmp/frontier.txt ] \
          || { echo "ERROR: dependency gate found no entry-point binaries — the payload layout changed" >&2; exit 1; }; \
        echo "dependency gate: $(wc -l < /tmp/frontier.txt) entry-point binaries"; \
        : > /tmp/seen.txt; : > /tmp/missing.txt; \
        while [ -s /tmp/frontier.txt ]; do \
          : > /tmp/next.txt; \
          while read -r f; do \
            head -c4 "$f" 2>/dev/null | grep -q ELF || continue; \
            grep -qxF "$f" /tmp/seen.txt && continue; \
            echo "$f" >> /tmp/seen.txt; \
            ldd "$f" 2>/dev/null | while read -r line; do \
              case "$line" in \
                *"not found"*) echo "${line%% *}" >> /tmp/raw.txt ;; \
                *"=>"*) p="${line#*=> }"; p="${p%% (*}"; \
                        case "$p" in /opt/hyperlynx/*) echo "$p" >> /tmp/next.txt ;; esac ;; \
              esac; \
            done; \
          done < /tmp/frontier.txt; \
          sort -u /tmp/next.txt > /tmp/frontier.txt 2>/dev/null || : > /tmp/frontier.txt; \
        done; \
        echo "dependency gate: walked $(wc -l < /tmp/seen.txt) reachable ELF objects"; \
        if [ -s /tmp/raw.txt ]; then \
          sort -u /tmp/raw.txt | while read -r so; do \
            grep -qxF "$so" /tmp/bundled.txt && continue; \
            grep -qxF "$so" /tmp/optional.txt && { echo "  optional, absent (ok): $so"; continue; }; \
            echo "$so" >> /tmp/missing.txt; \
          done; \
        fi; \
        if [ -s /tmp/missing.txt ]; then \
          echo "ERROR: SYSTEM libraries missing from the runtime image:" >&2; \
          sort -u /tmp/missing.txt >&2; \
          echo "These are not shipped by HyperLynx — add the providing package(s) above." >&2; \
          exit 1; \
        fi; \
        echo "dependency gate: no system library is missing"; \
        rm -f /tmp/missing.txt /tmp/raw.txt /tmp/bundled.txt /tmp/libdirs.txt \
              /tmp/frontier.txt /tmp/next.txt /tmp/seen.txt

    # /home/cape symlink some installed files embed (recorded batch paths).
    RUN mkdir -p /home/cape && ln -sfn /opt/hyperlynx /home/cape/hyperlynx

    # In-container launch wrappers (one per module.yaml desktop_entry command). These carry
    # the launch quirks (memory hyperlynx-linux-launch-quirks): SDD_PATCH_SKIP, QTWEBENGINE
    # sandbox off (Qt WebEngine zygote refuses root), stale single-instance socket cleanup,
    # and hlsagui's mandatory cd. Kept INSIDE the image so the module.yaml `command` is a
    # stable path regardless of the host.
    # NOTE: written with printf, NOT heredocs. buildah's Dockerfile parser consumes only the
    # FIRST heredoc in a RUN and then reads the next `cat` as a new instruction, failing with
    # `Unknown instruction: "CAT"`. \$@ / \$SDD stay escaped so they land literally in the
    # wrapper instead of being expanded at build time.
    RUN set -eu; SDD=/opt/hyperlynx/HL2604/SDD_HOME; BIN="$SDD/bin"; \
        mkdir -p "$BIN"; \
        printf '%s\n' \
          '#!/bin/bash' \
          'export SDD_PATCH_SKIP=1 QTWEBENGINE_DISABLE_SANDBOX=1' \
          '# stale single-instance socket → the GUI would exit silently' \
          'rm -f /tmp/hldrcqt_2604 2>/dev/null || true' \
          "exec bash $SDD/hldrc/linux64/bin/HyperLynxDRC \"\$@\"" \
          > "$BIN/run-drc"; \
        printf '%s\n' \
          '#!/bin/bash' \
          'export SDD_PATCH_SKIP=1 QTWEBENGINE_DISABLE_SANDBOX=1' \
          "cd $SDD/hlsa && exec ./hlsagui.sh \"\$@\"" \
          > "$BIN/run-hlsa"; \
        printf '%s\n' \
          '#!/bin/bash' \
          'export SDD_PATCH_SKIP=1' \
          "exec $SDD/hyperlynx/run_bswConsole \"\$@\"" \
          > "$BIN/run-bsw"; \
        chmod +x "$BIN/run-drc" "$BIN/run-hlsa" "$BIN/run-bsw"; \
        # Fail now if a wrapper is empty/malformed rather than at first GUI launch.
        for w in run-drc run-hlsa run-bsw; do \
          head -1 "$BIN/$w" | grep -q '^#!/bin/bash$' \
            || { echo "ERROR: $BIN/$w was not written correctly" >&2; exit 1; }; done

    # registrator.ini is (re)written at RUNTIME from the injected SALT_LICENSE_SERVER env by
    # an entrypoint shim, so the license value is NEVER baked into the image.
    #
    # ⚠ IT IS WRITTEN TO $TMPDIR, NOT TO /opt/hyperlynx. The launcher runs the container as the
    # CALLING user (`podman run --user $uid`, see remote-desktop/module-podman.sh) while the whole
    # /opt/hyperlynx tree is root-owned 0755, so a redirect into it fails with
    # `registrator.ini: Permission denied`. That failure used to be SILENT and cost a debug
    # session: the shim had no `set -e`, so the redirect failed, CFGR_INI was never exported, the
    # baked placeholder with an EMPTY SALT_LICENSE_SERVER= stayed in place, and the GUI got as far
    # as its splash screen before dying on a license error. Do not "fix" that by chmod-ing the
    # install tree or by dropping --user: a writable path is the fix.
    #
    # printf, not a heredoc — see the note above the run-* wrappers. Single-quoted lines keep
    # $SALT_LICENSE_SERVER / $@ literal so they are evaluated when the container starts.
    RUN printf '%s\n' \
          '#!/bin/bash' \
          '# Write the license file from the injected env (never baked), then exec the cmd.' \
          'set -euo pipefail' \
          'if [ -n "${SALT_LICENSE_SERVER:-}" ]; then' \
          '  CFGR_INI="${TMPDIR:-/tmp}/registrator.$(id -u).ini"' \
          "  printf '[defaults]\\nSALT_LICENSE_SERVER=%s\\n' \"\$SALT_LICENSE_SERVER\" > \"\$CFGR_INI\"" \
          '  export CFGR_INI LM_LICENSE_FILE="$SALT_LICENSE_SERVER"' \
          'else' \
          '  echo "hyperlynx-entry: SALT_LICENSE_SERVER is unset — the tool will have no license" >&2' \
          'fi' \
          '# Session bus for the DRC GUI. Chromium retries a missing bus forever (see the' \
          '# dbus-x11 note above), so start one unless the caller already shared theirs.' \
          '# Best-effort: a headless/CLI use of this image must still run if dbus is absent.' \
          'if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && command -v dbus-launch >/dev/null 2>&1; then' \
          '  eval "$(dbus-launch --sh-syntax 2>/dev/null)" || true' \
          '  export DBUS_SESSION_BUS_ADDRESS' \
          'fi' \
          'exec "$@"' \
          > /usr/local/bin/hyperlynx-entry \
        && chmod +x /usr/local/bin/hyperlynx-entry \
        && bash -n /usr/local/bin/hyperlynx-entry
    ENV LANG=en_US.UTF-8
    # The module.yaml `command`s call the run-* wrappers directly; the entrypoint shim wraps
    # them so the license file is materialised first regardless of which GUI is launched.
    ENTRYPOINT ["/usr/local/bin/hyperlynx-entry"]
  .gitlab-ci.yml: |
    # HyperLynx 2604 module image build — recover-or-rebuild.
    #
    # SOURCE OF TRUTH: this file lives in the infra repo
    # (deployment/argocd-apps/eda/hyperlynx-2604/.gitlab-ci.yml). The build-trigger
    # (postsync-build-image.yaml) MIRRORS it (+ Dockerfile + module.yaml) into the in-cluster
    # GitLab project deployments/infrastructure/eda/modules/hyperlynx; ArgoCD then TRIGGERS
    # this pipeline. Do NOT hand-edit it in GitLab — overwritten on the next mirror. Bump
    # IMAGE_TAG to force a rebuild.
    #
    # Runs on a unibi-hclab [eda] node via tags:[eda]. The Siemens media lives on the TrueNAS
    # artifacts export, beside the archive it is built into, and is mounted rw at /artifacts by
    # the [eda] runner (static PV, gitlab-runner-eda/nfs-installers-pv.yaml). No S3, no
    # node staging, no credentials in CI. buildah bind-mounts the extracted tree BUILD-TIME
    # only (never committed to a layer).
    stages: [build]

    workflow:
      auto_cancel:
        on_new_commit: interruptible

    build-hyperlynx-module:
      stage: build
      tags: [eda]                     # -> pcie-tb-s [eda] runner (gitlab-runner-token-eda)
      # ⚠ THE SHARED CI BUILD IMAGE, not quay.io/buildah/stable: buildah to BUILD plus skopeo
      # for the registry gate below, which quay's image has never shipped. Built by
      # deployment/argocd-apps/ci-build-image — read its README before changing this line.
      # ⚠ The tag must equal that app's IMAGE_TAG; remote-desktop/check-image-invariants.sh
      # fails the commit if they drift. A consumer pinned to a tag that was never built simply
      # never starts its build pod.
      image: $CI_REGISTRY/deployments/infrastructure/ci/build-image:v1.43.2-skopeo-r1
      resource_group: hyperlynx-module-build   # serialize rebuilds; distinct from xilinx/vivado
      interruptible: true
      # ── MEASURED COSTS ───────────────────────────────────────────────────────────────────
      # Phase timings from a full build:
      #     extract 9.7 GB from the SMB share   04:36 -> 04:54   ~18 min  (~9 MB/s, the share)
      #     Xvfb batch install (SIP replay)     04:56 -> 04:59   ~2m45s   <-- see below
      #     buildah bud total                   04:54 -> 05:14   ~20 min
      #     push to registry                    05:14 -> 05:30   ~16 min  (11.1 GB compressed)
      #     archive to NFS                      05:30 -> 05:36   ~6 min   (31.1 GB tar)
      #     TOTAL                                                ~60 min
      #
      # ⚠ THE XVFB INSTALL IS ~2m45s, NOT ~45 min. Three places in this repo (and a memory)
      # claimed ~45 min and the Dockerfile said ~10-20; all were wrong by an order of magnitude.
      # The install genuinely succeeded — the following step's SDD_HOME check passes, which it
      # cannot if the tree is absent. The build is dominated by the SMB media READ and the
      # registry PUSH, not by the installer.
      #
      # DISK on /build-scratch: the extracted tree is ~9.7 GB and the buildah storage for a
      # ~31 GB image is far below the Vivado figures (that build peaks around 275-450 GB), so
      # this app has never been the disk constraint. It shares the disk with Vivado though, and
      # the runner is concurrent=1, so a queued Vivado build is what delays it.
      #
      # SIZES for capacity planning:
      #     registry tag (compressed)     11.1 GB   <- what a desktop pull costs
      #     uncompressed image            31.1 GB   <- what it expands to on disk
      #     ⚠ Do not conflate the two: "31 GB push" is wrong, only 11.1 GB crosses the wire.
      #
      # 4h is generous against a measured 60 min; kept as headroom for a slow share day.
      timeout: 4h
      variables:
        FORCE_REBUILD: "0"                 # set to "1" for a ONE-SHOT rebuild of the same tag after a
                                           # Dockerfile fix (IMAGE_TAG is the user-facing module version
                                           # and must not be bumped); reset to 0 once the image publishes
        IMAGE_TAG: "2604"                  # the MODULE version (module load hyperlynx/2604); bump on Dockerfile changes
        IMAGE: $CI_REGISTRY_IMAGE:$IMAGE_TAG
        # ⚠ REPO PATH ONLY — no host, and NO :TAG. `${IMAGE#*/}` strips the host but LEAVES
        # the tag, so a /v2/<repo>/manifests/<tag> URL built from it asks for a repository
        # literally named "…/<name>:<tag>", which cannot exist -> 404 forever. The gate is
        # fail-open, so that 404 reads as "not in the registry" and rebuilds from installer
        # media every single time, silently. Measured on ecc188: the buggy form returned 404
        # and this form returned 200 against the same tag.
        # A `docker://` push destination is the opposite case — it MUST keep the tag, so those
        # still use ${IMAGE#*/}.
        IMAGE_REPO: $CI_PROJECT_PATH
        # ── recreate-survival archive on the NFS export ───────────────────────────────────
        # MOVED OFF THE SMB SHARE. Two reasons, both measured rather than assumed:
        #   - restoring 30 GB at the share's ~11.5 MB/s read took ~45 min. ⚠ MEASURED: the
        #     Xvfb batch install this is meant to save is only ~2m45s, not the ~45 min quoted
        #     for the Xilinx modules. So for HYPERLYNX the archive does
        #     NOT save a long rebuild — the whole build is ~20 min end to end. It still earns
        #     its place for the second reason below, and because a rebuild needs the installer
        #     media to be present at all;
        #   - a single long write to that share ABORTS partway
        #     ("cp: error writing '/smb/modules/hyperlynx/2604.tar.tmp': Software caused
        #     connection abort"), so the archive could fail to appear at all.
        # The TrueNAS export measured 126 MB/s read / 92 MB/s write and did not abort.
        #
        # ⚠ The first segment is the MODULE name here, while the two xilinx apps use a VENDOR
        # name (`xilinx/2024.1`). That is a real inconsistency and it is deliberate — the segment
        # is an arbitrary string. Do not "fix" either side for symmetry.
        #
        # MEDIA ONLY: container images are not archived here (the registry blob store is the
        # only copy), so what remains is purely the vendor installer media the build reads.
        MODULE_DIR: /artifacts/hyperlynx/$IMAGE_TAG
        # Installer media. Layout under it: batchInstall.sh flat, compat/*.rpm|deb,
        # hyperlynx2604/<payload>.tar — the Dockerfile reads those exact relative paths.
        MEDIA_DIR: $MODULE_DIR/installer
        # Module identity for the build trigger's recreate gate. ABSENT until now, which is why
        # this app had no share-archive skip at all: the trigger parses these out of this file
        # and asks `broker digest`. Without them it only ever checked the registry, so a recreate
        # rebuilt from installer media even with a byte-identical archive on the share.
        MODULE_NAME: "hyperlynx"
        MODULE_VERSION: "2604"
        REGISTRY_TLS_VERIFY: "true" # automatically updated from project-settings:{tls.certIssuerType,tls.registryTlsVerify}
        STORAGE_DRIVER: overlay
        BUILDAH_ROOT: /build-scratch/buildah-storage
        BUILDAH_RUNROOT: /build-scratch/buildah-run
        # ⚠ THE LAB-LOCAL REGISTRY, not GitLab's. EDA module images are published here and
        # ONLY here; GitLab's registry stays the home for everything else (remote-desktop
        # base, vLLM, …). See deployment/argocd-apps/image-registry/README.md.
        #
        # WHY: registry-preferclose only kept the CLIENT HOP on the LAN — the registry behind
        # it still wrote through to Hetzner S3 in Nuremberg, which is the ~5.3 MB/s that made
        # a 31 GB push take 16 min. image-registry stores to the TrueNAS export on the lab LAN
        # (~92 MB/s write / ~126 MB/s read), so S3 leaves the path entirely.
        #
        # ⚠ AUTHENTICATED (htpasswd) and TLS from a PRIVATE in-cluster CA. Both are
        # required, not hardening: what this registry serves is executed AS ROOT by the
        # remote-desktop broker, whose allowed() gate authorises by <repo>:<tag> and never
        # checks the CONTENT at that tag. The credential arrives as masked CI variables and
        # the CA as IMAGE_REGISTRY_CA, both published by this app's build-trigger.
        # Still ClusterIP-only — the CA is private, so an external client could not verify
        # it; never give this an ingress.
        INTERNAL_REGISTRY: image-registry.image-registry.svc.cluster.local:5000
      script:
        # Trust the image-registry CA. containers/image reads
        # /etc/containers/certs.d/<host>:<port>/*.crt automatically, so writing it here
        # means every later buildah call verifies TLS with NO per-call flag — and a missing
        # CA fails loudly at handshake instead of silently downgrading.
        - |
          mkdir -p "/etc/containers/certs.d/${INTERNAL_REGISTRY}"
          printf '%s\n' "$IMAGE_REGISTRY_CA" > "/etc/containers/certs.d/${INTERNAL_REGISTRY}/ca.crt"
          # ⚠ NOT openssl — quay.io/buildah/stable is Fedora-based and does NOT ship it
          # (verified by probing the image). python3 IS present, and a stdlib-only parse keeps
          # the fail-loud intent with no package install and no network at build time.
          python3 - "/etc/containers/certs.d/${INTERNAL_REGISTRY}/ca.crt" <<'CACHECK' \
            || { echo "ERROR: IMAGE_REGISTRY_CA is not a valid certificate"; exit 1; }
          import base64, re, sys
          raw = open(sys.argv[1], "rb").read().decode("utf-8", "replace")
          m = re.search(r"-----BEGIN CERTIFICATE-----(.+?)-----END CERTIFICATE-----", raw, re.S)
          if not m:
              sys.exit("no PEM CERTIFICATE block")
          try:
              der = base64.b64decode("".join(m.group(1).split()), validate=True)
          except Exception as exc:
              sys.exit(f"base64 decode failed: {exc}")
          # 0x30 = ASN.1 SEQUENCE, the first byte of every X.509 certificate.
          if len(der) < 64 or der[0] != 0x30:
              sys.exit("does not parse as a DER certificate")
          print(f"image-registry CA OK ({len(der)} bytes DER)")
          CACHECK
        - |
          # Recover-or-rebuild: skip if the tag already exists in the registry.
          #
          # IMAGE_TAG is the USER-FACING module version (`module load hyperlynx/2604`), so it
          # cannot be bumped just to force a rebuild after a Dockerfile fix — that would rename
          # the module. Set FORCE_REBUILD=1 (pipeline variable, or here) to rebuild the same tag
          # in place; the push overwrites it.
          if [ "${FORCE_REBUILD:-0}" = "1" ]; then
            echo "FORCE_REBUILD=1 — rebuilding $IMAGE even though it may already exist."
          # ⚠ ASK THE REGISTRY WE ACTUALLY PUSH TO — not GitLab's API.
          #
          # Do NOT query $CI_API_V4_URL/.../registry/repositories: EDA module images are
          # published to the lab-local $INTERNAL_REGISTRY, not GitLab's registry, so GitLab's
          # API reports the tag ABSENT forever — the gate would never short-circuit and EVERY
          # pipeline would rebuild from installer media (hours of Xvfb) instead of skipping.
          #
          # `skopeo inspect --raw` is how to ask. One command performs the registry's auth
          # dance, sends the Accept header for every manifest media type, and verifies TLS
          # against /etc/containers/certs.d/<host>/ca.crt — the file the step above writes,
          # which is why THAT STEP MUST STAY FIRST (enforced by
          # remote-desktop/check-image-invariants.sh). skopeo is present because this pipeline
          # now runs on the CI build image (deployment/argocd-apps/ci-build-image). It is NOT in
          # quay.io/buildah/stable — do not point this job back at that image.
          #
          # Nor buildah: `inspect` errors with 'unsupported transport "docker" for looking up
          # local images' (it only reads LOCAL storage), `manifest inspect` likewise, and `pull`
          # would download tens of GB merely to test presence. All measured, not assumed.
          #
          # ${IMAGE#*/} strips the registry host from $IMAGE, leaving repository AND tag — the
          # same derivation the push below uses, so the two can never disagree about WHICH tag
          # was checked. (A /v2/ URL is the opposite case and must NOT carry the tag.)
          #
          # Still FAIL-OPEN: anything but a clean success means "treat as absent and build",
          # which costs a rebuild, never a wrong image.
          else
            # ⚠ PRINT WHAT WENT WRONG. This gate is fail-open by design, so every failure mode
            # otherwise looks identical to "not in the registry" and costs a multi-hour rebuild
            # with no error anywhere. A discarded stderr hid three separate defects: a `skopeo`
            # that was not in the image, a CA file written after this check, and empty
            # credentials from an unprotected variable on a protected ref. skopeo's own message
            # distinguishes them (authentication required = credential, manifest unknown =
            # genuinely absent, x509 = CA, dial tcp = DNS/connect).
            #
            # Credentials empty is NOT a soft failure — it means the CI variables did not reach
            # this pipeline (see the protected=true note in this app's build trigger), so every
            # run would rebuild forever. Fail loudly instead of silently burning hours.
            if [ -z "${IMAGE_REGISTRY_USER:-}" ] || [ -z "${IMAGE_REGISTRY_PASSWORD:-}" ]; then
              echo "ERROR: IMAGE_REGISTRY_USER/PASSWORD are empty in this pipeline."
              echo "       The registry gate cannot run, so this build would restore nothing and"
              echo "       rebuild from installer media (hours) on EVERY run."
              echo "       Cause: the CI variables are published unprotected while this ref is"
              echo "       protected (CI_COMMIT_REF_PROTECTED=${CI_COMMIT_REF_PROTECTED:-unset})."
              echo "       Fix: publish them with protected=true in this app's build trigger."
              exit 1
            fi
            # ⚠ REPORT THE REF THAT WAS ACTUALLY CHECKED. $IMAGE names the GitLab registry,
            # but module images live ONLY in $INTERNAL_REGISTRY (image-registry) — printing
            # $IMAGE here claimed the tag was in a registry this gate never asked, which is
            # exactly the wrong hint to leave in a recreate post-mortem.
            _gate_ref="${INTERNAL_REGISTRY}/${IMAGE#*/}"
            set +e
            _gate_out=$(skopeo inspect --raw \
                     --creds "$IMAGE_REGISTRY_USER:$IMAGE_REGISTRY_PASSWORD" \
                     "docker://${_gate_ref}" 2>&1)
            _gate_rc=$?
            set -e
            if [ "$_gate_rc" -eq 0 ]; then
              echo "$_gate_ref already exists — skipping build."
              exit 0
            fi
            case "$_gate_out" in
              *"manifest unknown"*|*"name unknown"*|*"was not found"*)
                echo "registry gate: tag not present in $INTERNAL_REGISTRY — building." ;;
              *"authentication required"*|*"unauthorized"*)
                echo "registry gate: AUTH REJECTED by $INTERNAL_REGISTRY. The credential is wrong,"
                echo "  not the tag. Building anyway (fail-open), but the recreate-survival path is"
                echo "  NOT working — fix the credential."
                echo "  skopeo: $_gate_out" ;;
              *x509*|*certificate*)
                echo "registry gate: TLS verification failed against $INTERNAL_REGISTRY. Is"
                echo "  IMAGE_REGISTRY_CA the CA of the CURRENT cluster? A recreate mints a new one."
                echo "  skopeo: $_gate_out" ;;
              *)
                echo "registry gate: unexpected failure — treating as absent, building."
                echo "  skopeo: $_gate_out" ;;
            esac
          fi
          echo "Building $IMAGE on $(uname -m) at $(date -u +%F' '%T)..."
        - |
          # Media comes from the NFS export at /artifacts, and the tar is extracted onto
          # node-local /build-scratch rather than back onto the export — buildah binds the
          # extracted tree, and a build should not write ~10 GB onto the fileserver every run.
          # Idempotent: a previous run's extraction is reused.
          set -e
          MEDIA=$MEDIA_DIR
          [ -f "$MEDIA/batchInstall.sh" ] || {
            echo "ERROR: $MEDIA/batchInstall.sh not found — is the NFS artifacts export mounted?"
            echo "       expected layout: $MEDIA/{batchInstall.sh,compat/,hyperlynx2604/}"
            echo "       expected on the TrueNAS artifacts export at $MEDIA"
            ls -la /artifacts 2>&1 | head; exit 1; }
          TAR="$MEDIA/hyperlynx2604/HyperLynx2604_linux64.tar"
          [ -f "$TAR" ] || { echo "ERROR: media tar not found at $TAR"; exit 1; }

          avail_gb=$(df -BG --output=avail /build-scratch | tail -1 | tr -dc '0-9')
          [ "$avail_gb" -ge 80 ] || echo "WARN: only ${avail_gb}G free on /build-scratch."

          # Extract to a marker-guarded dir so a partial/aborted extraction is redone.
          SRC=/build-scratch/hyperlynx-media/HyperLynx2604_linux64
          if [ ! -f "$SRC/.extracted" ]; then
            echo "[$(date -u +%F' '%T)] extracting $(du -h "$TAR" | cut -f1) from the NFS export..."
            rm -rf "$SRC"; mkdir -p "$SRC"
            tar -xf "$TAR" -C "$SRC"
            [ -f "$SRC/install.aol" ] && chmod +x "$SRC/install.aol"
            touch "$SRC/.extracted"
            echo "[$(date -u +%F' '%T)] extraction done."
          else
            echo "media already extracted at $SRC — skipping."
          fi

          # Stage the small side files FLAT next to the extracted tree — the Dockerfile
          # expects /installer/batchInstall.sh and /installer/libicu-*.rpm,
          # /installer/libunistring2_*.deb (not a compat/ subdir). Copies are node-local and
          # writable, so the Dockerfile's chmod +x works.
          cp -f "$MEDIA/batchInstall.sh" /build-scratch/hyperlynx-media/
          cp -f "$MEDIA/compat/"*.rpm "$MEDIA/compat/"*.deb /build-scratch/hyperlynx-media/ 2>/dev/null || true
          chmod +x /build-scratch/hyperlynx-media/batchInstall.sh
          ls -la /build-scratch/hyperlynx-media/ | head
        # BOTH registries: $CI_REGISTRY for the Dockerfile's base-image pull, and
        # $INTERNAL_REGISTRY (image-registry) for the push — separate hosts, separate creds.
        - buildah login --tls-verify=$REGISTRY_TLS_VERIFY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        - buildah login -u "$IMAGE_REGISTRY_USER" -p "$IMAGE_REGISTRY_PASSWORD" "$INTERNAL_REGISTRY"
        - mkdir -p "$BUILDAH_ROOT" "$BUILDAH_RUNROOT"
        - echo "[$(date -u +%F' '%T)] buildah bud starting (Xvfb batch install inside)..."
        # -v bind-mounts the EXTRACTED media (node-local) BUILD-TIME only — never committed
        # to a layer. The Dockerfile sees the same /installer layout as before.
        - buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER"
          bud --isolation chroot --format docker
          -v /build-scratch/hyperlynx-media:/installer:ro
          -t "$IMAGE" .
        - |
          # Push under the SAME repository path as $IMAGE. The push is LAN-local to the
          # appliance (image-registry runs on a unibi-hclab node), so the long per-blob retries are
          # now belt-and-braces rather than load-bearing.
          #
          # ⚠ COMPRESSED, deliberately. Do NOT pass --disable-compression to dodge CPU stalls:
          # on the vLLM image that trade was MEASURED AS WRONG — uncompressed tripled the
          # transfer and turned a 6h push into 17h (see the warning in vllm/.gitlab-ci.yml).
          # Here it is doubly wrong: there is no WireGuard hop, and
          # image-registry has NO GARBAGE COLLECTION, so every uncompressed byte is a permanent
          # byte on the ZFS pool. The two xilinx apps have always pushed compressed.
          DEST="docker://${INTERNAL_REGISTRY}/${IMAGE#*/}"
          set +e; n=0
          until [ "$n" -ge 6 ]; do
            echo "=== push attempt $((n+1)) START $(date -u +%H:%M:%S) ==="
            timeout 7200 buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER" \
              push --retry 20 --retry-delay 10s \
              "$IMAGE" "$DEST"
            rc=$?; echo "=== push attempt $((n+1)) END $(date -u +%H:%M:%S) rc=$rc ==="
            [ "$rc" -eq 0 ] && break
            n=$((n+1)); echo "push attempt $n failed (rc=$rc) — retrying in 30s..."; sleep 30
          done
          set -e
          [ "$n" -lt 6 ] || { echo "ERROR: push failed after 6 attempts"; exit 1; }
        - buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER" rmi --prune || true
        - echo "Pushed $IMAGE (via $INTERNAL_REGISTRY) at $(date -u +%F' '%T)"
      # ── ALWAYS-RUN SCRATCH RECLAIM ───────────────────────────────────────────────────────
      # Runs on SUCCESS AND FAILURE, which is the whole point: the `rmi --prune` at the end of
      # `script:` is unreachable when the build dies, and a failed `buildah bud` is exactly the
      # case that leaves the most behind (measured 224-340 GB of layer storage for the full
      # module set). /build-scratch is the node-local hostPath /var/lib/xilinx-build; nothing
      # else ever wipes it, so before this existed every failed pipeline leaked its whole layer
      # store until someone noticed the disk was full.
      #
      # WHAT IS DELETED: buildah's containers, images and layer cache, and only via buildah's
      # own subcommands — never `rm -rf $BUILDAH_ROOT`, which can leave overlay mounts behind
      # and break the next run. Order matters: `rm -a` first (a working container holds a
      # reference that makes `rmi` fail), then `rmi -a -f` (the `rmi --prune` in `script:` drops
      # only DANGLING images, so the tagged build stayed forever), then `prune -a -f` for the
      # intermediate/mount cache neither of those reaches.
      #
      # Dropping the tagged image is safe: it has already been pushed to image-registry, which is
      # its only permanent home. On the failure path there is nothing worth keeping anyway.
      #
      # WHAT IS KEPT: $EXTRACT, the extracted installer tree, guarded by .extract-done and
      # deliberately SHARED with the twin app. Deleting it would cost every subsequent build a
      # re-read of the whole tarball off NFS and defeat the flock/marker design. Reclaim it by
      # hand when the disk is genuinely tight:
      #   rm -rf /var/lib/xilinx-build/*-extracted /var/lib/xilinx-build/hyperlynx-media
      #
      # ⚠ NO `set -e` and every command `|| true`: after_script must not turn a green build red,
      # and on the failure path it must not mask the real error with a cleanup error. GitLab
      # gives after_script its own 5-min default timeout, so keep it cheap.
      after_script:
        - |
          echo "[$(date -u +%F' '%T)] scratch reclaim (job status: ${CI_JOB_STATUS:-unknown})"
          df -h /build-scratch || true
          BA="buildah --root $BUILDAH_ROOT --runroot $BUILDAH_RUNROOT --storage-driver $STORAGE_DRIVER"
          $BA rm -a || true
          $BA rmi -a -f || true
          $BA prune -a -f || true
          echo "[$(date -u +%F' '%T)] after reclaim:"
          df -h /build-scratch || true
          du -sh /build-scratch/* 2>/dev/null | sort -h || true
  module.yaml: |
    # HyperLynx 2604 module manifest — baked into the runnable module image at
    # /module.yaml and read by the remote-desktop broker (which publishes it) + the module
    # CLI (which generates `podman run` launchers from it). `runtime: container` marks it:
    # the tool runs in ITS OWN container via podman inside the sandboxed desktop pod
    # (NOT on the desktop's own PATH).
    #
    # HyperLynx on Linux has NO single entry — three Qt/console GUIs (memory
    # hyperlynx-linux-launch-quirks): HyperLynxDRC, hlsagui.sh, run_bswConsole. Each is a
    # desktop_entry with its own in-container `command`. hyperlynx.so is a LIBRARY — never
    # an entry. All launch quirks (SDD_PATCH_SKIP, QTWEBENGINE_DISABLE_SANDBOX, RHEL compat
    # libs, stale-socket cleanup) are handled INSIDE the image (Dockerfile), not here.
    name: hyperlynx
    version: "2604"
    runtime: container
    env:
      # SIP's SALT license server — injected by the launcher as `podman run -e
      # SALT_LICENSE_SERVER=$MODULE_LICENSE_SERVER`. The VALUE is NEVER baked into the
      # image or written to git; it comes from the RUNTIME's MODULE_LICENSE_SERVER, which is fed from
      # `eda-secrets` (eda/secrets, sealed into every namespace that runs a module).
      set_from_secret:
        SALT_LICENSE_SERVER: license-server
        # ⚠ BOTH VARS, ONE VALUE. Siemens serves HyperLynx from TWO vendor daemons on the same
        # host: `saltd` (addressed by SALT_LICENSE_SERVER) and `mgcld` (addressed by MGLS —
        # Mentor Graphics Licensing System). The PRIMARY features — hypbsw/hyplsw (BoardSim and
        # LineSim SI/PI) — live on mgcld, so with SALT alone the GUI starts and then reports
        # "No licenses for HyperLynx's primary features were obtained ... License server is not
        # defined" while `salt_ok` reports the very same features as AVAILABLE. Entitlement fine,
        # address missing. Do not drop this because a SALT-only probe looks green.
        MGLS_LICENSE_FILE: license-server
    desktop_entries:
      - name: "HyperLynx DRC"
        exec: "drc"
        command: "/opt/hyperlynx/HL2604/SDD_HOME/bin/run-drc"
        categories: "Development;Engineering;"
      - name: "HyperLynx Schematic Analysis"
        exec: "hlsa"
        command: "/opt/hyperlynx/HL2604/SDD_HOME/bin/run-hlsa"
        categories: "Development;Engineering;"
      - name: "HyperLynx BoardSim Console"
        exec: "bsw"
        command: "/opt/hyperlynx/HL2604/SDD_HOME/bin/run-bsw"
        categories: "Development;Engineering;"
    # Short names on PATH, alongside the GUI tiles above — the SAME three tools and the same
    # in-container commands; only the way you invoke them differs:
    #   desktop_entries -> $HOME/.local/bin/module-hyperlynx-<exec>, which is ALWAYS on PATH.
    #                      Hence the `module-<name>-` prefix: unprefixed, those would collide
    #                      across modules and versions and could shadow a system binary in
    #                      every shell, loaded or not.
    #   cli_entries     -> $HOME/.local/module-bin/hyperlynx/2604/<name>, on PATH ONLY while
    #                      `module load hyperlynx/2604` is in effect, so a bare name is safe.
    # ⚠ Only `bsw` (run_bswConsole) is a console entry. `drc` and `hlsa` are Qt GUIs and still
    # need a DISPLAY — they are here for typing convenience, not to work in a batch job.
    cli_entries:
      - name: drc
        command: /opt/hyperlynx/HL2604/SDD_HOME/bin/run-drc
      - name: hlsa
        command: /opt/hyperlynx/HL2604/SDD_HOME/bin/run-hlsa
      - name: bsw
        command: /opt/hyperlynx/HL2604/SDD_HOME/bin/run-bsw

