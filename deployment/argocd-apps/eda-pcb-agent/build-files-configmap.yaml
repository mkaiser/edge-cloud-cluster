# ConfigMap carrying the eda-pcb-agent build files for the build-trigger to mirror.
# The embedded copies below are GENERATED from the source files in this directory
# (Dockerfile, .gitlab-ci.yml) — do NOT hand-edit them here; edit the source file and run
#   deployment/argocd-apps/remote-desktop/sync-build-files.sh deployment/argocd-apps/eda-pcb-agent
# This ConfigMap is what actually gets built (the source files are excluded from the ArgoCD
# directory source and never reach GitLab), so a stale copy silently ships the wrong image.
# Verified before every commit by scripts/environment/checkBuildFilesConfigMapDrift.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-pcb-agent-build-files
  namespace: eda-pcb-agent
  annotations:
    # PreSync at weight -1: the same wave as the trigger's RBAC, so it exists before the
    # weight-0 Job mounts it.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
data:
  Dockerfile: |
    # eda-pcb-agent — a shared, root-capable KiCad workstation for one AD account.
    #
    # ⚠ ITS OWN IMAGE, deliberately NOT remote-desktop's base. Two reasons:
    #   1. a rebuild here must never be able to take the shared LDAP desktop down, and
    #      vice versa — the two images have different bump cadences and different blast radii;
    #   2. that base is built FROM a VNC/Lmod/podman/broker image whose whole point is running
    #      EDA module images as NESTED containers under gVisor. This pod does none of that; it
    #      runs plain runc, which is what buys real setuid/FUSE for the HUMAN in the `desktop`
    #      container.
    #      ⚠ It does NOT let the AGENT `sudo apt install`, despite what this line used to claim:
    #      s6 drops the gateway to the unprivileged `hermes` user, so apt is refused there. A
    #      `kubectl exec` lands as root and will tell you otherwise — check what the GATEWAY
    #      runs as. See doc/hermes-deployments.md.
    #
    # Built on unibi-hclab-pcie-tb-s by GitLab CI (.gitlab-ci.yml, tags:[eda]), recover-or-rebuild
    # against the lab-local registry.
    #
    # ⚠ WHAT THIS IMAGE IS FOR: giving the agent a WORKING FIRST BOOT, not a frozen toolchain.
    # KiCad, wxPython and git are baked so the pod is useful the moment it starts; everything
    # after that the agent builds into $AGENT_PREFIX (~/.local) on the NFS home, which persists.
    # So resist growing this file — but note the real constraint, which is the opposite of the
    # old claim here: the agent CANNOT apt-install, so every system-level build dependency
    # (a -dev header, a shared library) HAS to be baked, because nothing else can put it there.

    # ⚠ 26.04, bumped from 24.04 on 2026-09-14 TOGETHER WITH the KiCad PPA below. Both needed a
    # rebuild and an IMAGE_TAG bump, so they were done in one pass rather than two.
    # Verified against upstream before the bump, because each was a plausible blocker:
    #   - the KiCad 9.0 PPA publishes for resolute (26.04), not only noble;
    #   - libgtk-3-0t64 still exists on resolute (3.24.52) — the `t64` suffix is a time_t
    #     transition artifact and NOT a stable name, so it was the likeliest silent break;
    #   - python3-wxgtk4.0 is present in resolute/universe (4.2.4).
    # 26.04 is a released LTS (2026-04) supported to 2031, and three cluster nodes already run it.
    # ⚠ IF THIS BUILD FAILS, suspect the base and the PPA SEPARATELY — 26.04 also moves sssd/AD,
    # xrdp, Python and locales, none of which the KiCad change is about.
    # renovate: tracked by "Container image tags" regex (docker datasource)
    FROM docker.io/library/ubuntu:26.04
    USER 0
    ENV DEBIAN_FRONTEND=noninteractive

    # ── KiCad from the PROJECT's PPA, not the Ubuntu archive ──────────────────────
    # The archive freezes KiCad per release and never moves it: 24.04 shipped 7.0.11, which is
    # two majors behind and cannot open boards saved by a newer KiCad. That gap is why
    # hermes-bootstrap-configmap.yaml carries a "build KiCad from source" skill — a workaround
    # that has never actually run.
    #
    # ⚠ PIN THE MAJOR (kicad-10.0-releases), never a rolling "latest" PPA. IMAGE_TAG is the only
    # cache key for the recover-or-rebuild gate, so an unpinned source would let two builds of
    # the SAME tag be different images — the exact failure invariant 3 exists to prevent.
    #
    # MOVED 9.0 -> 10.0 on 2026-09-19. 9.0.9 could not READ libraries authored by a newer KiCad,
    # which is not a corner case: Seeed's official XIAO library ships format 20251024 and 9.0.9
    # answered `Unable to load library`, so using the XIAO ESP32C6 symbol meant extracting it,
    # rewriting the version string and stripping three unknown tokens
    # (duplicate_pin_numbers_are_jumpers, do_not_autoplace, in_pos_files) — per vendor library,
    # every time. Reference schematics at 20251028/20260508 were rejected too, which once sent a
    # diagnosis down the wrong path because a known-good file read as a tooling fault.
    #
    # Both directions were verified in a throwaway Ubuntu 26.04 pod before this bump:
    #   - KiCad 10.0.6 OPENS the Seeed library unmodified (`sym export svg` plots every symbol).
    #   - KiCad 10.0.6 OPENS schematics written in the 9 format (20250114) — a 4-component file
    #     from kicad-sch-api exported a netlist carrying all 4 components and their libsource
    #     entries. That mattered because kicad-sch-api 0.5.6 still EMITS 20250114, so a one-way
    #     upgrade would otherwise have traded a reading problem for an authoring one.
    #   ⚠ KiCad 10 indents netlists differently, so `grep -c "(comp "` returns 0 on a perfectly
    #     good netlist. Count `(ref "` or use the `(components` block; do not read rc alone.
    #
    # ⚠ python3-wxgtk4.0 below then resolves from this PPA where it offers one. That matters:
    # wxPython IS KiCad's plugin API (see the note in the apt layer), and a KiCad linked
    # against a mismatched wxGTK fails at PLUGIN LOAD, not at build — so a green build proves
    # nothing here. Verify by loading a plugin, not by starting KiCad.
    RUN apt-get update \
     && apt-get install -y --no-install-recommends software-properties-common \
     && add-apt-repository -y ppa:kicad/kicad-10.0-releases \
     && apt-get purge -y software-properties-common \
     && apt-get autoremove -y \
     && rm -rf /var/lib/apt/lists/*

    # ── The desktop, the directory client, and KiCad ──────────────────────────────
    # One apt layer: the union is small enough that splitting it only costs cache churn.
    RUN apt-get update && apt-get install -y --no-install-recommends \
        # --- session + desktop ---
        #   xrdp/xorgxrdp is the ONLY remote protocol here (no VNC/noVNC): both humans reach
        #   this through remote-desktop's Guacamole, which speaks RDP natively.
        xrdp xorgxrdp \
        xfce4 xfce4-terminal dbus-x11 x11-utils xdg-utils \
        # --- identity: SSSD's ACTIVE DIRECTORY provider ---
        #   ⚠ sssd-ad specifically, not sssd-ldap. The AD provider reads the uidNumber AD
        #   STORES; the Authentik LDAP outpost COMPUTES uid = 5000 + pk instead, and the two
        #   diverge the moment a pk changes — at which point this pod and the fileserver
        #   disagree about the uid and the agent cannot read its own home.
        #   ⚠ Without sssd-ad there is no libsss_ad.so and the pod comes up LOOKING HEALTHY
        #   with no identity at all. See doc/ad-identity-chain.md.
        sssd-ad sssd-krb5 sssd-tools libnss-sss libpam-sss adcli krb5-user ldap-utils \
        # --- KiCad + the plugin API ---
        #   ⚠ python3-wxgtk4.0 is NOT optional garnish: KiCad's addon/plugin API IS wxPython.
        #   It is the package that could not be provided any other way here — there is no
        #   manylinux wheel for it and building it would need the full GTK/webkit toolchain.
        #   Baking it is what makes the plugin ecosystem work at all.
        kicad kicad-libraries kicad-symbols kicad-footprints python3-wxgtk4.0 \
        # --- what the agent needs to work and to bootstrap more ---
        sudo git curl wget ca-certificates locales file xz-utils unzip \
        python3-pip python3-venv \
        tmux less nano vim-tiny procps psmisc \
        # --- 3D view / rendering, and kicad-cli's headless plot path ---
        libgl1 libglu1-mesa libgtk-3-0t64 \
     && rm -rf /var/lib/apt/lists/*

    # ── kicad-sch-api: the only way to AUTHOR a schematic ─────────────────────────
    # `kicad-cli sch` can READ and export schematics but cannot create one, and the obvious
    # third-party alternatives do not work here: `pykicad` cannot emit a `lib_symbols` block at
    # all (so its output opens in KiCad showing nothing), and `kiutils` writes format 20211014,
    # which this KiCad rejects. Hand-writing the s-expression is what two agent runs tried and
    # failed at — a single wrong keyword like `(revision ...)` for `(rev ...)` is rejected with
    # nothing but `Failed to load schematic` and no line number.
    #
    # kicad-sch-api emits format 20250114 (accepted by KiCad 10) and resolves symbols out of
    # /usr/share/kicad/symbols itself, so the standard-library policy is enforced by the tool
    # rather than left to the agent's judgement. Verified in-pod: 4 components, 40 nets, 80 real
    # pins, wires supported, and a create → export → modify → re-export round trip.
    #
    # ⚠ It lives in a venv because Ubuntu is PEP 668 externally-managed, and the venv needs
    # --system-site-packages so `pcbnew` (an apt package, not a wheel) stays importable beside
    # it. Put the venv on the IMAGE, not the agent's NFS home: it pulls 78 packages / ~123 MB,
    # most of it an MCP server this use has no need for, and a run-time install would make every
    # cold start depend on PyPI being reachable.
    #
    # ⚠ Do NOT add this to PATH ahead of the system python. `pcbnew` scripts and KiCad's own
    # tooling expect /usr/bin/python3; the agent invokes this interpreter explicitly.
    # renovate: datasource=pypi depName=kicad-sch-api
    ARG KICAD_SCH_API_VERSION=0.5.6
    # ── kicad-mcp-pro: the MCP server the agent authors THROUGH ───────────────────
    #
    # Installed into the SAME venv on purpose: kicad-mcp-pro DEPENDS ON kicad-sch-api
    # (`pip show kicad-mcp-pro` lists it under Requires), so they are designed to share an
    # environment and pip resolves the pair itself. It pins fastmcp back from 4.0.5 to 3.4.7 as
    # part of that resolution — upstream's own choice, not a conflict, and kicad_sch_api still
    # imports afterwards (verified in the live venv before this was written).
    #
    # ⚠ NO SWIG. `grep -r 'import pcbnew' src/` in the upstream is ZERO and CI enforces it
    # (tests/unit/test_swig_guard.py), so the authoring path is kicad-cli + s-expressions. That
    # matters because SWIG pcbnew is removed in KiCad 11; this survives it.
    #
    # ⚠ TWO SERVERS RUN FROM THIS ONE INSTALL, on two ports — see startup-configmap.yaml.
    # `build`/`write` (:3400, 17 tools) is the only authoring path and has NO `run_erc`;
    # `review`/`readonly` (:3401, 24 tools) is the only verification path and has no write
    # tools. Running either alone reopens the failure of 2026-09-22, in opposite directions.
    # The `expert` profile is 387 tools / ~57k tokens of catalog and would eat the context
    # window before the model read a single instruction — never set it here.
    #
    # ⚠ --profile/--mode are CLI FLAGS. Exporting KICAD_MCP_PROFILE in a wrapper that does not
    # forward its environment silently yields the default profile, which looks like the server
    # "not having" the authoring tools rather than like a config error.
    # renovate: datasource=pypi depName=kicad-mcp-pro
    ARG KICAD_MCP_PRO_VERSION=3.34.8
    RUN python3 -m venv --system-site-packages /opt/kicad-py \
     && /opt/kicad-py/bin/pip install --no-cache-dir "kicad-sch-api==${KICAD_SCH_API_VERSION}" \
     && /opt/kicad-py/bin/pip install --no-cache-dir "kicad-mcp-pro==${KICAD_MCP_PRO_VERSION}" \
     && /opt/kicad-py/bin/python -c "import kicad_sch_api, pcbnew; print('kicad-sch-api + pcbnew OK')" \
     && /opt/kicad-py/bin/kicad-mcp-pro --help >/dev/null \
     && echo "kicad-mcp-pro ${KICAD_MCP_PRO_VERSION} OK"

    # UTF-8: KiCad and the agent both write non-ASCII, and a POSIX locale turns that into
    # mojibake in schematic text and tracebacks alike.
    RUN locale-gen en_US.UTF-8
    ENV LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8

    # ── Root for the agent: a sudoers drop-in, baked into THIS image only ─────────
    # ⚠ WHY NOT LDAP. The directory carries IDENTITY only (uidNumber, gidNumber, groups);
    # there is no "is root" attribute and sudo authority is a per-machine policy decision.
    # The centralised alternative (sudo-ldap + sudoRole objects) would apply on EVERY
    # AD-joined host that reads it — including remote-desktop, where unprivileged users have
    # interactive shells, and the fileserver. Identity central, authority local.
    #
    #   • NAME THE USER, never a group — `%domain users` would hand root to every AD account.
    #   • MODE 0440 — sudo SILENTLY ignores a drop-in that is group- or world-writable.
    #   • visudo -c AT BUILD TIME — a malformed drop-in locks sudo out entirely, so fail the
    #     build rather than shipping a pod nobody can escalate in.
    #
    # ⚠ This works only because the pod runs PLAIN RUNC. Under gVisor setuid is ineffective and
    # sudo fails with "effective uid is not 0" no matter how correct this file is.
    # ⚠ sudoers ships env_reset, so `sudo -E` does NOT preserve the environment without an
    # explicit SETENV tag. Pass what you need as `sudo VAR=value cmd` instead.
    RUN printf 'eda-pcb-agent ALL=(ALL) NOPASSWD: ALL\n' \
          > /etc/sudoers.d/eda-pcb-agent-nopasswd \
     && chmod 0440 /etc/sudoers.d/eda-pcb-agent-nopasswd \
     && visudo -cf /etc/sudoers.d/eda-pcb-agent-nopasswd

    # xrdp runs as root here (single shared session, no per-user privilege separation to
    # preserve) and needs these directories to exist before sesman starts.
    RUN mkdir -p /var/run/xrdp /var/log/xrdp /etc/xrdp \
     && rm -f /etc/ssh/ssh_host_* 2>/dev/null || true

    # The startup script and sssd/xrdp config are mounted from startup-configmap.yaml, not
    # baked — they carry cluster-specific values (realm, DC set) that must follow
    # project_settings.ts without an image rebuild.
    EXPOSE 3389
    CMD ["/bin/bash", "-lc", "exec /startup/startup.sh"]
  .gitlab-ci.yml: |
    # eda-pcb-agent image build — recover-or-rebuild.
    #
    # SOURCE OF TRUTH: this file lives in the infra repo
    # (deployment/argocd-apps/eda-pcb-agent/.gitlab-ci.yml). The build-trigger
    # (presync-build.yaml) MIRRORS it (+ Dockerfile) into the in-cluster GitLab project
    # deployments/infrastructure/eda/eda-pcb-agent via a git push (as .gitlab-ci.yml +
    # Dockerfile), then triggers this pipeline. Do NOT hand-edit it in GitLab — it is
    # overwritten on the next mirror.
    #
    # Only the ConfigMap reaches GitLab — the source files in the infra repo do not — so the
    # embedded/source drift check cannot run in this pipeline. Run
    # `deployment/argocd-apps/remote-desktop/sync-build-files.sh deployment/argocd-apps/eda-pcb-agent`
    # before committing (precommit does this); a stale ConfigMap silently builds the wrong file.
    #
    # Runs on the shared [eda] runner (tags:[eda] → unibi-hclab-pcie-tb-s, privileged buildah,
    # /build-scratch hostPath). No /installer bind mount — everything comes from apt.
    stages: [build]

    workflow:
      auto_cancel:
        on_new_commit: interruptible

    build-eda-pcb-agent:
      stage: build
      tags: [eda]
      # ⚠ THE SHARED CI BUILD IMAGE, not quay.io/buildah/stable: buildah to BUILD plus skopeo
      # for the registry gate below, which quay's image has never shipped. Built by
      # deployment/argocd-apps/ci-build-image — read its README before changing this line.
      # ⚠ The tag must equal that app's IMAGE_TAG; remote-desktop/check-image-invariants.sh
      # fails the commit if they drift.
      # ⚠ THE LAB-LOCAL REGISTRY, NOT $CI_REGISTRY. This job runs on a lab node, and under
      # `targetState: production` the lab cannot reach the PUBLIC registry host at all. The pull
      # is done by the KUBELET, so it fails in prepare_script before any script line runs.
      # An IP rather than the Service DNS name is correct HERE: the kubelet resolves an image
      # reference with the HOST's resolver, which knows nothing about cluster DNS, and matches
      # containerd's certs.d config by the EXACT host string. In-POD clients use the FQDN.
      image: 127.0.0.1:30500/deployments/infrastructure/ci/build-image:v1.43.2-skopeo-r1
      # Serialize on the single node: every ArgoCD (re)sync fires the PreSync trigger.
      resource_group: eda-pcb-agent-build
      interruptible: true
      # ⚠ 2h, matching remote-desktop, and the reason is the ARCHIVE not the build.
      # The image itself builds and pushes to GitLab's registry in ~4 min. The
      # recreate-surviving copy goes to image-registry, which is backed by an NFS export on the
      # TrueNAS appliance, and that write competes with every other image restore after a
      # recreate. Measured on ecc205: the cluster-registry push took 90s while the archive PATCH
      # moved 189 MB and then stalled 58m50s, killing the job at a 1h timeout — with an unrelated
      # 3.8 GB ollama blob GET taking 6h27m in the same window. The build was fine; only the
      # backup copy ran out of clock.
      timeout: 2h
      variables:
        IMAGE_TAG: r6                       # ⚠ THE TAG IS THE CACHE KEY for the gate below.
                                            # Bump ONLY when the Dockerfile's CONTENT changes —
                                            # NEVER on a subdomain change/recreate, which is
                                            # precisely when the archived image must still match.
                                            # A bump takes this workstation DOWN for the whole
                                            # build (strategy: Recreate), so land one on its own.
                                            # ⚠ image-registry has NO GC: every bump orphans a
                                            # few GB permanently.
        IMAGE: $CI_REGISTRY_IMAGE:$IMAGE_TAG
        # ⚠ REPO PATH ONLY — no host, and NO :TAG. `${IMAGE#*/}` strips the host but LEAVES the
        # tag, so a /v2/<repo>/manifests/<tag> URL built from it asks for a repository literally
        # named "…/<name>:<tag>", which cannot exist -> 404 forever. The gate is fail-open, so
        # that 404 reads as "not in the registry" and rebuilds every single time, silently.
        IMAGE_REPO: $CI_PROJECT_PATH
        # Registry TLS: prod cert is publicly trusted -> verify; staging CA is untrusted in the
        # build pod -> false. Toggled by certIssuerType via the update script.
        REGISTRY_TLS_VERIFY: "true" # automatically updated from project-settings:{tls.certIssuerType,tls.registryTlsVerify}
        # overlay on the ext4 hostPath scratch (privileged pod) — vfs would copy the tree once
        # per layer.
        STORAGE_DRIVER: overlay
        BUILDAH_ROOT: /build-scratch/buildah-storage
        BUILDAH_RUNROOT: /build-scratch/buildah-run
        # Push to the in-cluster registry Service directly, bypassing the public ingress.
        # PreferClose lands the push on the LAN-local (unibi-hclab) replica — NOT across WireGuard.
        INTERNAL_REGISTRY: registry-preferclose.gitlab.svc.cluster.local:5000
        # ⚠ THE ONE COPY THAT SURVIVES A CLUSTER RECREATE. $IMAGE above is GitLab's registry,
        # which is IN-CLUSTER and destroyed with the cluster — so after a recreate this pod would
        # sit in ImagePullBackOff until a full rebuild. image-registry is backed by the TrueNAS
        # export datapool/images (Retain), which does not go away.
        IMAGE_REGISTRY: image-registry.image-registry.svc.cluster.local:5000
        # ⚠ image-archives/, NOT deployments/... — this registry also holds the EDA module images
        # under deployments/, and those are pulled BY THE BROKER AND RUN AS ROOT, authorised by
        # <repo>:<tag> in broker.sh allowed(). A separate repository namespace means this image
        # can never be confused for a module in either direction.
        SURVIVING_IMAGE: $IMAGE_REGISTRY/image-archives/eda-pcb-agent:$IMAGE_TAG
        SURVIVING_IMAGE_REPO: image-archives/eda-pcb-agent
      script:
        # Trust the image-registry CA before anything talks to it. It serves TLS from a PRIVATE
        # in-cluster CA, so the build pod cannot verify it from the system trust store.
        # containers/image reads /etc/containers/certs.d/<host>/ca.crt, so skopeo and buildah both
        # pick this up. Writing the CA (rather than --tls-verify=false) means a wrong or missing
        # CA fails loudly at the handshake instead of silently downgrading.
        - |
          if [ -n "$IMAGE_REGISTRY_CA" ]; then
            mkdir -p "/etc/containers/certs.d/${IMAGE_REGISTRY}"
            printf '%s\n' "$IMAGE_REGISTRY_CA" > "/etc/containers/certs.d/${IMAGE_REGISTRY}/ca.crt"
            # ⚠ THE PYTHON PROGRAM MUST NOT BE INDENTED. This block is a YAML `- |` literal
            # scalar, so every line must stay indented or the scalar ends — but python treats
            # leading whitespace as an indent error on line 1. Hence a SINGLE-LINE program: there
            # is no second line to indent. (Validated with python3 because this image has no
            # openssl.)
            printf '%s' "$IMAGE_REGISTRY_CA" | python3 -c 'import base64,re,sys; raw=sys.stdin.read(); m=re.search(r"-----BEGIN CERTIFICATE-----(.+?)-----END CERTIFICATE-----", raw, re.S); sys.exit("no PEM CERTIFICATE block") if not m else None; der=base64.b64decode("".join(m.group(1).split())); sys.exit("certificate body implausibly short") if len(der)<100 else None; print("image-registry CA OK (%d bytes DER)" % len(der))' \
              || { echo "ERROR: IMAGE_REGISTRY_CA is not a valid certificate"; exit 1; }
          else
            echo "WARN: IMAGE_REGISTRY_CA is empty — the recreate-surviving copy is unavailable."
            echo "      The build still works; it just cannot restore or archive."
          fi
        - |
          # ── Recover-or-rebuild ────────────────────────────────────────────────────────
          # Three outcomes, cheapest first:
          #   1. already in GitLab's registry        -> nothing to do          (instant)
          #   2. in the recreate-surviving registry  -> copy it back           (seconds)
          #   3. neither                             -> buildah bud            (minutes)
          # `skopeo inspect --raw` — NOT curl. GitLab's registry answers /v2/ with
          # `401 + WWW-Authenticate: Bearer`, so a BASIC-auth curl returns 401 even for a tag
          # that EXISTS; the gate is fail-open, so that 401 would read as "absent" and this
          # pipeline would never once skip a build it could have skipped. skopeo performs the
          # bearer token exchange itself.
          #
          # FORCE_REBUILD=1 overrides the gate for a one-shot rebuild of the same tag.
          if [ "${FORCE_REBUILD:-0}" = "1" ]; then
            echo "FORCE_REBUILD=1 — skipping the registry gate and rebuilding $IMAGE."
          else
          set +e
          _gate_out=$(skopeo inspect --raw --tls-verify=false \
                   --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$IMAGE" 2>&1)
          _gate_rc=$?
          set -e
          if [ "$_gate_rc" -eq 0 ]; then
            echo "$IMAGE already exists — skipping build."
            # ── Archive-on-skip ────────────────────────────────────────────────────────
            # ⚠ "in GitLab's registry" does NOT imply "archived": a tag built while the archive
            # credential was broken publishes fine and is never archived — and this gate then
            # exits 0 on every later run, so nothing notices until a recreate rebuilds it from
            # scratch. Repair it here instead of waiting for the next tag bump.
            # ⚠ NEVER FATAL — the image is published and the app already works.
            if [ -n "${IMAGE_REGISTRY_CA:-}" ] && [ -n "${IMAGE_REGISTRY_USER:-}" ]; then
              set +e
              skopeo inspect --raw --creds "$IMAGE_REGISTRY_USER:$IMAGE_REGISTRY_PASSWORD" \
                "docker://$SURVIVING_IMAGE" >/dev/null 2>&1
              if [ $? -ne 0 ]; then
                echo "  the recreate-surviving copy is MISSING — archiving it now..."
                skopeo copy --retry-times 10 \
                  --src-tls-verify=false --src-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
                  --dest-creds "$IMAGE_REGISTRY_USER:$IMAGE_REGISTRY_PASSWORD" \
                  "docker://$IMAGE" "docker://$SURVIVING_IMAGE"
                if [ $? -eq 0 ]; then
                  echo "  archived $SURVIVING_IMAGE — this tag now survives a recreate."
                else
                  echo "  WARN: could not archive — the next recreate will rebuild this tag."
                fi
              else
                echo "  recreate-surviving copy is present."
              fi
              set -e
            else
              echo "  WARN: no image-registry credential — cannot confirm the surviving copy."
            fi
            exit 0
          fi
          case "$_gate_out" in
            *"manifest unknown"*|*"name unknown"*|*"was not found"*) : ;;
            *) echo "registry gate: $IMAGE not readable (fail-open, continuing):"
               echo "  skopeo: $_gate_out" ;;
          esac
          echo "$IMAGE not found in the cluster registry."

          # ── 2. Restore from the surviving registry ───────────────────────────────────
          # ⚠ NEVER FATAL. If anything here fails we fall through to the rebuild, which is slow
          # but always correct. A backup path must not redden a pipeline that would otherwise
          # have produced a working image.
          # ONE `skopeo copy`, REGISTRY TO REGISTRY: nothing is staged locally, and ONE command
          # carries BOTH credentials (--src-creds / --dest-creds), so the "credential missing on
          # the second half" failure cannot recur.
          if [ -n "${IMAGE_REGISTRY_CA:-}" ] && [ -n "${IMAGE_REGISTRY_USER:-}" ]; then
            echo "Checking the recreate-surviving registry for $SURVIVING_IMAGE ..."
            set +e
            _arc_out=$(skopeo inspect --raw \
                     --creds "$IMAGE_REGISTRY_USER:$IMAGE_REGISTRY_PASSWORD" \
                     "docker://$SURVIVING_IMAGE" 2>&1)
            _arc_rc=$?
            set -e
            if [ "$_arc_rc" -eq 0 ]; then
              echo "[$(date -u +%F' '%T)] found it — copying it back instead of rebuilding..."
              set +e
              skopeo copy --retry-times 10 \
                --src-creds "$IMAGE_REGISTRY_USER:$IMAGE_REGISTRY_PASSWORD" \
                --dest-tls-verify=false \
                --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
                "docker://$SURVIVING_IMAGE" "docker://${INTERNAL_REGISTRY}/${IMAGE#*/}"
              _restore_rc=$?
              set -e
              if [ "$_restore_rc" -eq 0 ]; then
                echo "[$(date -u +%F' '%T)] restored $IMAGE from the surviving registry."
                exit 0
              fi
              echo "WARN: restore failed (rc=$_restore_rc) — falling through to a full rebuild."
            else
              case "$_arc_out" in
                *"manifest unknown"*|*"name unknown"*|*"was not found"*)
                  echo "  not there either — this tag has never been archived." ;;
                *)
                  echo "  archive not readable — rebuilding (fail-open):"
                  echo "  skopeo: $_arc_out" ;;
              esac
            fi
          fi
          fi

          echo "$IMAGE building on $(uname -m) at $(date -u +%F' '%T)..."
        # CI_REGISTRY_* are injected by GitLab CI — no push secret needed. Log in to BOTH
        # endpoints: the login credential (JWT) is scoped per registry host.
        - buildah login --tls-verify=$REGISTRY_TLS_VERIFY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        - buildah login --tls-verify=false -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$INTERNAL_REGISTRY"
        # image-registry has its OWN credential (htpasswd) — the GitLab JWT above is scoped to
        # the GitLab host and is rejected here. Non-fatal: without it we simply do not write the
        # surviving copy.
        - |
          if [ -n "$IMAGE_REGISTRY_USER" ]; then
            buildah login -u "$IMAGE_REGISTRY_USER" -p "$IMAGE_REGISTRY_PASSWORD" "$IMAGE_REGISTRY" \
              || echo "WARN: image-registry login failed — the surviving copy will be skipped."
          fi
        - mkdir -p "$BUILDAH_ROOT" "$BUILDAH_RUNROOT"
        # ⚠ QUOTED, and the `: ` inside the message is why. An unquoted YAML scalar containing
        # ": " is parsed as a MAPPING, so this entry became a dict and GitLab rejected the whole
        # pipeline at config time with "script config should be a string or a nested array of
        # strings" — before any job ran, so there is no build log to read. Measured on ecc205.
        - 'echo "[$(date -u +%F" "%T)] buildah bud (apt - xfce + KiCad + sssd)..."'
        # NOTE: the build-trigger mirrors Dockerfile into the GitLab project under the canonical
        # name `Dockerfile`, so no -f is needed here.
        - buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER"
          bud --isolation chroot --format docker
          -t "$IMAGE" .
        - |
          # ONE push implementation, one retry policy, two destinations. Defined as a function so
          # the mandatory push and the best-effort archive push cannot drift apart.
          #   $1 = destination ref (no docker:// prefix)   $2 = label for the log
          push_image() {
            _dest="$1"; _what="$2"
            _n=0
            set +e
            until [ "$_n" -ge 6 ]; do
              echo "=== ${_what} push attempt $((_n+1)) START $(date -u +%H:%M:%S) ==="
              timeout 3600 buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER" \
                push --tls-verify=false --retry 20 --retry-delay 10s \
                "$IMAGE" "docker://${_dest}"
              _rc=$?
              echo "=== ${_what} push attempt $((_n+1)) END $(date -u +%H:%M:%S) rc=$_rc ==="
              [ "$_rc" -eq 0 ] && break
              _n=$((_n+1)); echo "${_what} push attempt $_n failed (rc=$_rc) — retrying in 30s (buildah resumes from uploaded blobs)..."; sleep 30
            done
            set -e
            [ "$_n" -lt 6 ]
          }

          # Push under the SAME repository path as $IMAGE so the stored image == the canonical
          # $IMAGE (pods pull via the ingress name).
          push_image "${INTERNAL_REGISTRY}/${IMAGE#*/}" "cluster-registry" \
            || { echo "ERROR: push failed after 6 attempts"; exit 1; }
        - |
          # ── Archive to the recreate-surviving registry ───────────────────────────────
          # ⚠ NEVER FATAL. The image is already pushed and the app already works; a failure here
          # costs a rebuild after the NEXT recreate, which is the status quo before this existed.
          if [ -n "$IMAGE_REGISTRY_USER" ] && [ -n "$IMAGE_REGISTRY_CA" ]; then
            if push_image "$SURVIVING_IMAGE" "surviving-registry"; then
              echo "Archived $SURVIVING_IMAGE — this tag now survives a cluster recreate."
            else
              echo "WARN: could not archive to the surviving registry. The build is still"
              echo "      GOOD; the next recreate will just have to rebuild this tag."
            fi
          else
            echo "WARN: no image-registry credential — skipping the recreate-surviving copy."
          fi
        - buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT" --storage-driver "$STORAGE_DRIVER" rmi --prune || true
        - echo "Pushed $IMAGE (via $INTERNAL_REGISTRY) at $(date -u +%F' '%T)"