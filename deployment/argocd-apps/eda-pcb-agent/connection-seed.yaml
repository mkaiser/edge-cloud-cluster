# PostSync: seed THIS app's Guacamole tile into remote-desktop's Guacamole database.
#
# ── WHY THE TILE LIVES HERE AND NOT IN remote-desktop/ ────────────────────────
# This app owns its own tile so that disabling it removes the tile's source with it, and so
# that nothing outside this folder has to change to add a workstation. Precedent:
# windows/connection-seed.yaml is exactly this shape — an app seeding its own tile from its
# own namespace, keying every INSERT on connection_name so two independent seeders never
# collide.
#
# ⚠ ONE DIFFERENCE FROM `windows`, AND IT MATTERS. windows runs a COMPLETELY SEPARATE
# Guacamole + CNPG cluster in its own namespace, so its seed job is not cross-namespace at
# all. Ours must reach REMOTE-DESKTOP's database, which needs the FQDN and that namespace's
# DB password (read live — see below).
#
# ⚠ THIS IS A REAL CROSS-APP RUNTIME DEPENDENCY. If remote-desktop is disabled or its
# Postgres is down, this Job fails and the two humans have no way in — the agent keeps
# working, but nobody can watch it. The app's `retry` recovers it when remote-desktop
# returns, so it needs no manual sync. Recorded in this app's README.
#
# ⚠ NO NetworkPolicy work is needed: neither remote-desktop nor its CNPG cluster has one, so
# cross-namespace 5432 is already open. If that ever changes, this Job breaks with a
# connection timeout rather than an auth error.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eda-pcb-agent-connection-seed
  namespace: eda-pcb-agent
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
# ⚠ READ THE DB PASSWORD LIVE, DO NOT SEAL A SECOND COPY. A sealed copy would silently
# diverge the moment remote-desktop's password is rotated, and the seed would then fail with
# an auth error that reads like a database outage. Pinned to that one Secret, `get` only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eda-pcb-agent-guacamole-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["remote-desktop-secrets"]   # ⚠ this one Secret, nothing else
    verbs: ["get"]                              # ⚠ get only — no list, no watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eda-pcb-agent-guacamole-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eda-pcb-agent-guacamole-db
subjects:
  - kind: ServiceAccount
    name: eda-pcb-agent-connection-seed
    namespace: eda-pcb-agent
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eda-pcb-agent-connection-seed
  namespace: eda-pcb-agent
  annotations:
    argocd.argoproj.io/hook: PostSync
    # 5: after the Authentik provider job (0), because the Guacamole group entities below
    # must match the Authentik group names that job creates.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is already covered by
  # hook-delete-policy: BeforeHookCreation, so a TTL buys nothing and COSTS the post-mortem:
  # it deletes the pod, and with it the only copy of the logs. Alloy/Loki does not save you
  # here — its pod discovery is a poll, so a short-lived Job can finish and be deleted before
  # it is ever scraped.
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: eda-pcb-agent-connection-seed
      initContainers:
        # ⚠ A SEPARATE CONTAINER PURELY TO READ THE PASSWORD. The seed itself runs in the
        # postgres image, which has psql but NO kubectl; this one has kubectl but no psql.
        # remote-desktop's equivalent needs neither hop because its Secret is in its OWN
        # namespace and reachable with a plain secretKeyRef — ours is cross-namespace, and a
        # secretKeyRef cannot cross namespaces. Writing it to a shared emptyDir is what
        # bridges the two images.
        - name: fetch-db-password
          image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              kubectl get secret remote-desktop-secrets -n remote-desktop \
                -o jsonpath='{.data.db-password}' | base64 -d > /creds/pgpassword
              if [ ! -s /creds/pgpassword ]; then
                echo "ERROR: could not read remote-desktop's Guacamole DB password." >&2
                echo "  Is the remote-desktop app deployed? This tile lives in its Guacamole." >&2
                exit 1
              fi
              chmod 0600 /creds/pgpassword
              echo "read the Guacamole DB password ($(wc -c < /creds/pgpassword) bytes)"
          volumeMounts:
            - name: creds
              mountPath: /creds
      containers:
        - name: seed
          image: docker.io/postgres:18-alpine  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            - name: RDP_USERNAME
              value: "eda-pcb-agent"
            # ⚠ The SAME value as authentik-password — it is the AD account's password. The
            # tile carries it so both humans land straight in the shared session; a shared
            # account has no per-person credential to preserve, which is exactly why this
            # differs from remote-desktop's tile (that one deliberately prompts).
            - name: RDP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eda-pcb-agent-secrets
                  key: rdp-password
          volumeMounts:
            - name: creds
              mountPath: /creds
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e
              # ⚠ FQDN, not the bare Service name: this is a cross-namespace connection.
              PGHOST=guacamole-pg-rw.remote-desktop.svc.cluster.local
              PGPORT=5432
              PGUSER=guacamole_user
              PGDB=guacamole_db
              # Written by the initContainer — this image has psql but no kubectl.
              PGPASSWORD=$(cat /creds/pgpassword)
              export PGPASSWORD
              [ -n "$PGPASSWORD" ] || { echo "ERROR: empty Guacamole DB password" >&2; exit 1; }

              echo "Waiting for the Guacamole DB..."
              i=1
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDB" >/dev/null 2>&1; do
                if [ "$i" -ge 60 ]; then
                  echo "ERROR: Guacamole DB unreachable after 5 min." >&2
                  echo "  This app's tile lives in remote-desktop's Guacamole; if that app is" >&2
                  echo "  disabled or down, this Job cannot succeed. The app's retry will" >&2
                  echo "  recover it when remote-desktop returns." >&2
                  exit 1
                fi
                echo "  try ${i}/60..."; i=$((i+1)); sleep 5
              done

              # ⚠ BOUNDED, and it FAILS rather than blocking. This is a PostSync hook, so an
              # unbounded wait blocks the whole sync forever — that once wedged remote-desktop
              # for 4+ days. Failing lets ArgoCD report it and retry later.
              for _ in $(seq 1 60); do
                psql -h "$PGHOST" -U "$PGUSER" -d "$PGDB" -c "\d guacamole_entity" >/dev/null 2>&1 && break
                echo "  schema not ready yet, retrying in 5s..."
                sleep 5
              done
              if ! psql -h "$PGHOST" -U "$PGUSER" -d "$PGDB" -c "\d guacamole_entity" >/dev/null 2>&1; then
                echo "ERROR: guacamole_entity absent after 5 min — has the Guacamole chart's initDb run?" >&2
                exit 1
              fi

              # ⚠ CREDENTIALS ARE PASSED AS psql PARAMETERS, NOT INTERPOLATED INTO THE SQL.
              # A password containing a single quote would otherwise terminate the string
              # literal early — at best a syntax error, at worst a broken tile that reads as
              # an Authentik problem. -v binds them and :'name' quotes them properly, so any
              # byte in the secret is safe. (remote-desktop's seed can use a quoted <<'SQL'
              # heredoc because it passes no credentials at all; windows' interpolates them
              # directly, which is the shape being avoided here.)
              #
              # ⚠ The heredoc is therefore QUOTED (<<'SQL'): nothing in it should be expanded
              # by the shell. The :'RDP_USERNAME' / :'RDP_PASSWORD' below are psql variables.
              psql -h "$PGHOST" -U "$PGUSER" -d "$PGDB" \
                   -v RDP_USERNAME="$RDP_USERNAME" -v RDP_PASSWORD="$RDP_PASSWORD" <<'SQL'
              -- Group entities. ⚠ These names MUST match the Authentik groups created by
              -- authentik-provider.yaml: Guacamole's openid extension maps a user's `groups`
              -- claim onto user-group names, so a mismatch silently grants nobody access.
              INSERT INTO guacamole_entity (name, type)
              VALUES ('eda-pcb-agent-users', 'USER_GROUP'), ('authentik-admins', 'USER_GROUP')
              ON CONFLICT (type, name) DO NOTHING;

              INSERT INTO guacamole_user_group (entity_id, disabled)
              SELECT entity_id, false FROM guacamole_entity
              WHERE name IN ('eda-pcb-agent-users', 'authentik-admins') AND type = 'USER_GROUP'
              ON CONFLICT (entity_id) DO NOTHING;

              -- ── MIGRATION — MUST RUN BEFORE THE INSERT BELOW ──────────────────
              -- Rename IN PLACE (UPDATE, not delete+insert) so permissions, parameters and
              -- connection history survive. The INSERT below keys on connection_name, so
              -- running it first would recreate the old tile alongside the renamed one.
              -- ⚠ The Guacamole tile and the Authentik APPLICATION of the same old name are
              -- different objects. Only this one is renamed; the Authentik application
              -- 'EDA PCB Agent' (authentik-provider.yaml) fronts the agent's DASHBOARD, not
              -- this desktop, and keeps its name.
              UPDATE guacamole_connection SET connection_name = 'PCB Agent Desktop (shared account)'
               WHERE connection_name = 'EDA PCB Agent' AND parent_id IS NULL;

              -- The tile. ⚠ parent_id IS NULL and ON CONFLICT ignores NULLs, so idempotency
              -- is WHERE NOT EXISTS rather than ON CONFLICT.
              INSERT INTO guacamole_connection (connection_name, protocol, parent_id)
              SELECT 'PCB Agent Desktop (shared account)', 'rdp', NULL
              WHERE NOT EXISTS (
                SELECT 1 FROM guacamole_connection
                WHERE connection_name = 'PCB Agent Desktop (shared account)' AND parent_id IS NULL
              );

              -- ⚠ Cross-namespace, so the hostname is the FQDN.
              -- username/password ARE set here, unlike remote-desktop's tile: this is ONE
              -- shared account, so there is no per-person credential to preserve and landing
              -- straight in the session is the point.
              -- ON CONFLICT DO UPDATE (not DO NOTHING) so a rotated password propagates —
              -- otherwise the tile would keep the old one and simply stop logging in.
              INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
              SELECT c.connection_id, p.name, p.value
              FROM guacamole_connection c
              CROSS JOIN (VALUES
                ('hostname', 'eda-pcb-agent.eda-pcb-agent.svc.cluster.local'),
                ('port', '3389'),
                ('security', 'any'),
                ('ignore-cert', 'true'),
                ('resize-method', 'display-update'),
                ('username', :'RDP_USERNAME'),
                ('password', :'RDP_PASSWORD')
              ) AS p(name, value)
              WHERE c.connection_name = 'PCB Agent Desktop (shared account)'
              ON CONFLICT (connection_id, parameter_name)
                DO UPDATE SET parameter_value = EXCLUDED.parameter_value;

              -- READ for both groups.
              INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
              SELECT e.entity_id, c.connection_id, 'READ'
              FROM guacamole_entity e
              CROSS JOIN guacamole_connection c
              WHERE e.name IN ('eda-pcb-agent-users', 'authentik-admins') AND e.type = 'USER_GROUP'
                AND c.connection_name = 'PCB Agent Desktop (shared account)'
              ON CONFLICT (entity_id, connection_id, permission) DO NOTHING;
              SQL

              echo "PCB Agent Desktop (shared account) tile seeded into remote-desktop's Guacamole."
      volumes:
        # In-memory: the DB password never touches a disk.
        - name: creds
          emptyDir:
            medium: Memory
