    ```sh
    mkdir -p /home/eda-pcb-agent/.local/share/kicad/10.0/3rdparty/plugins
    cd /home/eda-pcb-agent/.local/share/kicad/10.0/3rdparty/plugins
    git clone --depth 1 <plugin-repo-url>
    ```

    ⚠ There is no `pip3` in this image, and `python3` is the gateway's own venv — use `uv`:

    ```sh
    uv pip install --python "$(command -v python3)" <package>
    ```

    ⚠ **A plugin's Python must match KiCad's.** KiCad's plugin API IS wxPython
    (`python3-wxgtk4.0`, from the same PPA as KiCad so the two agree). A package installed
    against a different interpreter loads and then fails inside wx with an error that reads
    like a plugin bug. If a plugin imports `wx`, check it is picking up the system wxPython
    before debugging anything else.

    ⚠ **Do not build KiCad from source.** It is already installed. A source build would take
    1-3 hours, needs development headers this image does not have and you cannot install, and
    would produce an older or equal version. If a DIFFERENT version is genuinely needed, that
    is an image change (`Dockerfile` + its `IMAGE_TAG`) — say so and stop; that is a complete
    answer, not a failure.

