---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: eda-pcb-agent-secrets
  namespace: eda-pcb-agent
  # ⚠ A PreSync HOOK WITH NO hook-delete-policy. Both halves are load-bearing.
  #
  # WHY PreSync: authentik-user-job.yaml is a PreSync hook that needs ACCOUNT_PASSWORD from
  # this Secret. ArgoCD runs the PreSync phase TO COMPLETION before it starts the Sync phase,
  # so a Sync-phase credential does not merely arrive late for a PreSync consumer — it can
  # never arrive at all. The Job's initContainer waits, the wait cannot be satisfied, the
  # phase never ends, and the Sync phase that would have applied this file never runs.
  # Measured on ecc214 2026-09-17: the app sat OutOfSync for 5.5 h with the namespace holding
  # ZERO secrets and the Job burning its 5-minute wait three times over. A sync wave cannot
  # fix this — waves order resources WITHIN a phase, they never move one between phases.
  #
  # ⚠ WHY NO hook-delete-policy: there is no policy value meaning "keep", and omitting the
  # annotation is NOT the same as leaving the resource alone — for Jobs ArgoCD assumes
  # BeforeHookCreation. What makes omission safe HERE is that the default only ever deletes
  # before RE-CREATING, and this resource is re-created by the same sync that deletes it.
  # Adding an explicit policy is what would be fatal: the derived Secret carries an
  # ownerReference back to this CR with controller: true, so deleting the CR cascade-deletes
  # the Secret. eda/fileserver/truenas-admin-sealed.yaml is the same pattern, and states the
  # same rule in its own header.
  #
  # ⚠ WHAT A VANISHED SECRET COSTS, measured on ecc210 2026-09-14. A hook lives outside the
  # app's tracked state (`status: None` in .status.resources), so NOTHING restores it:
  # selfHeal sees no drift and a no-op sync runs no hooks. The pod then seeded config.yaml
  # with the LITERAL placeholder string, every model call returned HTTP 401, and hermes exits
  # 0 on a non-retryable auth error — so the dispatcher recorded "worker exited cleanly
  # without calling kanban_complete" and the whole failure read as a model/agent problem for
  # hours. A credential that can silently disappear is worse than one that fails loudly.
  #
  # ⚠ THE WAVE ORDERS THE APPLY, NOT THE DECRYPTION. Applying a SealedSecret only creates the
  # custom resource; the Secret appears whenever the sealed-secrets controller decrypts it,
  # which no wave can wait for (eda/fileserver/truenas-admin-sealed.yaml documents the same
  # trap, measured there at 113s). Consumers must tolerate that gap — the Deployment does,
  # via secretKeyRef + kubelet retry; the PreSync Job does, via its initContainer.
  #
  # -20 keeps it ahead of every other PreSync hook in this app (the earliest is -2).
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-20"
spec:
  encryptedData:
    authentik-password: 
    dashboard-password: 
    dashboard-username: ""
    litellm-key: ""
    rdp-password: ""
  template:
    metadata:
      name: eda-pcb-agent-secrets
      namespace: eda-pcb-agent
