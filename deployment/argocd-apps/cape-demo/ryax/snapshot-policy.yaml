# Snapshot/backup policy for the WHOLE CAPE demonstrator stack — SEPARATE FROM THE APP
# so it can be turned off. Modelled on deployment/argocd-apps/windows/backup-policy.yaml;
# read that file first, its rationale for the Job-not-YAML shape applies verbatim here.
#
# WHAT: takes every PVC in `ryaxns` AND `ryaxns-tools` out of Longhorn's recurring
# snapshot AND S3 backup jobs. Each volume is bound to the `no-retention` anchor job,
# which creates nothing. The action-builder nix store additionally drops to a single
# replica.
#
# ⚠ THIS HOOK BELONGS TO THE `ryax` APP BUT ALSO COVERS `ryaxns-tools`, which is the
# SCADA demo app's namespace. That is a deliberate cross-app coupling, against the
# usual self-containment rule, chosen over a second near-identical 120-line hook that
# would drift out of sync. The consequence: disabling or deleting the ryax app stops
# this policy being re-applied to the demo databases too, and they would rejoin
# `unibi-ryax` on their next reprovision. If the demos ever outlive Ryax here, split
# this into a per-app policy rather than leaving it dangling.
#
# WHY: this is a DEMONSTRATOR. Everything it stores is re-importable rather than
# authored here:
#
#   nix-store .......... a content-addressed BUILD CACHE (/nix in the action-builder).
#                        Every path is reproducible from the action source and the
#                        upstream binary cache. Restoring it from a snapshot has no
#                        advantage over rebuilding.
#   registry ........... action images, rebuilt by the action-builder from source.
#   minio / datastore .. execution artifacts and run metadata for demo workflows.
#   loki / tempo ....... observability retention windows, not state.
#   prometheus ......... 14d metrics with its own retentionSize cap.
#   grafana ............ dashboards, all provisioned from ConfigMaps in git.
#   worker-postgresql .. the Runner's node-pool registry, re-created by
#                        scripts/manageWorker.sh (which is additive and idempotent).
#   ryaxns-tools/* ..... the demo workloads' own databases (today: the IPTO SCADA
#                        anomaly detector's postgres). Demo output, regenerated by
#                        re-running the workflow — see that app's README.
#
# The workflows themselves are owned by their authors and imported through the Ryax UI,
# so they are not ours to preserve either.
#
# WHAT IT COSTS, MEASURED 2026-09-21/22 — this is not marginal:
#
#   nix-store live data ......  39 GiB   (df inside the action-builder)
#   nix-store PVC provisioned. 100 GiB
#   nix-store actualSize ..... 136 GiB   <-- EXCEEDED the provisioned size
#
# That delta was snapshot history: 10 snapshots from mesh-snapshot-6hourly (retain 8) on
# a store rewritten wholesale by every build, so each snapshot pinned a near-complete
# copy — three held 40-45 GiB each. bender has 456 GiB total and was down to 164 GiB
# free, with Ryax accounting for 165 of the 166 GiB in use.
#
# S3 backup is dropped for the same reason plus bandwidth: mesh-backup-daily would
# upload the whole working set over the university link nightly to preserve nothing.
#
# CONSEQUENCE, ACCEPTED: these volumes have NO off-site copy and no point-in-time
# history. Losing the mesh disk means re-importing the demo workflows and letting the
# next build repopulate /nix (slow — tens of minutes — but automatic and correct). If a
# Ryax volume ever holds something authored in place and worth keeping, take a one-off
# manual backup rather than re-enabling the daily job for the whole namespace.
#
# ⚠ Scope-wide alternatives are WRONG: dropping unibi-ryax from mesh-snapshot-6hourly in
# deployment/argocd-infra/longhorn-system/recurring-jobs.yaml is NODE-scoped, so it would
# also un-snapshot any non-Ryax volume that lands on those nodes. The exclusion has to be
# per-volume, which is what this Job does.
#
# HOW TO DEACTIVATE: rename to `snapshot-policy.yaml.disable`. The app runs prune: true
# and ArgoCD reports these hook objects as requiresPruning, so the
# SA/ClusterRole/ClusterRoleBinding/Job are cleaned up. Nothing Ryax needs is touched —
# the PVCs come from the chart, not this file.
#   NB: deactivating only stops the labels being RE-APPLIED. To actually restore
#   snapshots, deactivate this file AND run, per volume (dropping the anchor in the same
#   call, or the volume keeps it forever):
#     kubectl label volumes.longhorn.io -n longhorn-system <vol> --overwrite \
#       'recurring-job.longhorn.io/no-retention-' \
#       'recurring-job-group.longhorn.io/unibi-ryax=enabled'
#   ...then drop the ryaxns / ryaxns-tools exclusions from the
#   LonghornVolumeNeverBackedUp alert in
#   deployment/argocd-infra/prometheus/kube-prometheus-stack/prometheus.yaml, or the
#   volumes will be unmonitored.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ryax-snapshot-policy
  namespace: ryaxns
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ryax-snapshot-policy
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
# Cluster-scoped because the Longhorn Volume CR lives in longhorn-system, not ryaxns.
# Deliberately narrow: only `volumes`, only these verbs (patch is what `kubectl label`
# uses).
- apiGroups: ["longhorn.io"]
  resources: ["volumes"]
  verbs: ["get", "list", "patch"]
# `list` (not just `get`) because the Job discovers every PVC in each namespace rather
# than acting on one hardcoded name. Cluster-scoped, so it already reaches ryaxns-tools —
# adding a namespace to PVC_NAMESPACES needs no RBAC change. Read-only.
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ryax-snapshot-policy
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ryax-snapshot-policy
subjects:
- kind: ServiceAccount
  name: ryax-snapshot-policy
  namespace: ryaxns
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ryax-snapshot-policy
  namespace: ryaxns
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is covered by
  # hook-delete-policy: BeforeHookCreation, so a TTL buys nothing and costs the
  # post-mortem: it deletes the pod and with it the only copy of the logs. Alloy/Loki
  # does not save you here — its pod discovery is a poll, so a short-lived Job can
  # finish and be deleted before it is ever scraped.
  template:
    spec:
      serviceAccountName: ryax-snapshot-policy
      restartPolicy: Never
      # Only talks to the API server — keep it off the mesh nodes.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: snapshot-policy
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        env:
        # Space-separated. `ryaxns` is the engine; `ryaxns-tools` holds the demo
        # workloads' own databases (today: the IPTO SCADA anomaly detector's postgres).
        # Same demonstrator rationale for both — see the header.
        - name: PVC_NAMESPACES
          value: "ryaxns ryaxns-tools"
        # The anchor job bound to each volume so Longhorn does not fall back to
        # `default`. Creates nothing — see recurring-jobs.yaml.
        - name: ANCHOR_JOB
          value: "no-retention"
        # Volumes that drop to a single replica, space-separated. ONLY the nix store:
        # it is a pure build cache, so redundancy buys nothing a rebuild would not. The
        # other volumes keep the StorageClass's replica count — they hold demo state
        # that is cheap to lose but annoying to lose to a single disk failure.
        - name: SINGLE_REPLICA_PVCS
          value: "ryax-action-builder-nix-store"
        - name: SINGLE_REPLICAS
          value: "1"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu

          # RC is declared OUTSIDE both loops so a failure in either namespace still
          # fails the Job.
          RC=0

          for NS in ${PVC_NAMESPACES}; do
            # Discover every PVC in the namespace rather than naming them. The chart owns
            # which PVCs exist (ten today, and a chart bump can add more), so a hardcoded
            # list would silently leave new volumes in the snapshot group — the exact
            # failure this policy exists to prevent.
            PVCS=$(kubectl get pvc -n "${NS}" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)

            # `continue`, NOT `exit 0`. An empty namespace must not end the Job: on a
            # fresh cluster ryaxns is empty until the chart provisions, and exiting here
            # would silently skip every LATER namespace while still reporting success.
            # (Verified: the naive port processed neither ryaxns-tools volume and exited
            # 0.) Same reason the missing-namespace case is tolerated above — ryaxns-tools
            # does not exist until the SCADA app has synced at least once.
            if [ -z "${PVCS}" ]; then
              echo "── ${NS}: no PVCs yet — nothing to label; the next sync will converge."
              continue
            fi

              for PVC_NAME in ${PVCS}; do
              echo "── ${NS}/${PVC_NAME}"

              V=$(kubectl get pvc -n "${NS}" "${PVC_NAME}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)
              if [ -z "${V}" ]; then
                echo "   not bound yet — skipping; the next sync will converge."
                continue
              fi
              if ! kubectl get volumes.longhorn.io -n longhorn-system "${V}" >/dev/null 2>&1; then
                echo "   Longhorn Volume ${V} does not exist (not a Longhorn PVC?) — skipping."
                continue
              fi

              # Strip every GROUP label and bind the `no-retention` anchor job in the SAME
              # call. Both halves are load-bearing:
              #
              #   - The `default` removal, because Longhorn auto-adds
              #     recurring-job-group.longhorn.io/default to any volume left with no
              #     recurring-job label, and `default` carries snapshot-hourly plus all five
              #     backup jobs.
              #   - The anchor binding, because "no labels at all" is NOT a reachable state:
              #     strip everything and Longhorn hands the volume straight to `default`.
              #     Measured 2026-09-21 — an earlier version of this Job stripped the scope
              #     group cleanly and `default` was back within the same reconcile, leaving
              #     the volume MORE heavily snapshotted than before. `no-retention` is a
              #     snapshot-cleanup job in no group (see
              #     deployment/argocd-infra/longhorn-system/recurring-jobs.yaml): it creates
              #     nothing, so it costs no disk, but it counts as a label and keeps
              #     `default` off.
              #
              # Removing an absent label is a kubectl no-op, so this is idempotent.
              # The scope group is read from the volume rather than hardcoded: which
              # longhorn-<scope> StorageClass backs a PVC is a placement decision, and a
              # stale literal would strip a group that is not there while leaving the real
              # one enabled.
              GROUPS=$(kubectl get volumes.longhorn.io -n longhorn-system "${V}" -o json \
                | jq -r '[.metadata.labels // {} | keys[]
                          | select(startswith("recurring-job-group.longhorn.io/"))
                          | . + "-"] | join(" ")')
              # shellcheck disable=SC2086 — word splitting is intended: one arg per label.
              kubectl label volumes.longhorn.io -n longhorn-system "${V}" --overwrite \
                ${GROUPS} \
                'recurring-job-group.longhorn.io/default-' \
                "recurring-job.longhorn.io/${ANCHOR_JOB}=enabled" >/dev/null

              # Verify rather than trust: assert no GROUP label came back, since a silent
              # re-enable is the exact failure mode this policy exists to prevent. The
              # anchor job label is expected to remain and is not an error.
              REMAINING=$(kubectl get volumes.longhorn.io -n longhorn-system "${V}" -o json \
                | jq -r '[.metadata.labels // {} | keys[] | select(startswith("recurring-job-group.longhorn.io/"))] | join(",")')
              if [ -n "${REMAINING}" ]; then
                echo "   FAILED: still carries group label(s): ${REMAINING}"
                echo "   Every group here carries a snapshot or backup job."
                RC=1
                continue
              fi
              echo "   OK — in no recurring job group (anchored to ${ANCHOR_JOB})."

              # Single-replica override, for the build cache only. Same reasoning as the
              # backup exclusion: redundancy buys nothing a rebuild would not. At 3 replicas
              # the nix store occupied ~96 GiB on EACH of bender, smartmirror1 and pcie-tb-s.
              #
              # It also removes a write cost: Longhorn acks only once ALL replicas confirm,
              # and `unibi-ryax` spans both Bielefeld LANs, so every nix write was waiting on
              # a WireGuard hop to unibi-recslab.
              #
              # ⚠ NOT settable on the StorageClass. longhorn-unibi-ryax is shared by every
              # Ryax volume and its numberOfReplicas is generated per SCOPE in src/storage.ts
              # (min(3, nodes carrying the scope)) — lowering it there would also strip
              # redundancy from the other volumes.
              #
              # ⚠ A recreate provisions from the StorageClass at 3 again; this Job re-applies
              # it on every sync, which is what makes the policy survive one.
              for SR in ${SINGLE_REPLICA_PVCS}; do
                [ "${SR}" = "${PVC_NAME}" ] || continue
                CURRENT=$(kubectl get volumes.longhorn.io -n longhorn-system "${V}" -o jsonpath='{.spec.numberOfReplicas}')
                if [ "${CURRENT}" != "${SINGLE_REPLICAS}" ]; then
                  echo "   numberOfReplicas ${CURRENT} -> ${SINGLE_REPLICAS}"
                  kubectl patch volumes.longhorn.io -n longhorn-system "${V}" --type merge \
                    -p "{\"spec\":{\"numberOfReplicas\":${SINGLE_REPLICAS}}}" >/dev/null
                else
                  echo "   numberOfReplicas already ${SINGLE_REPLICAS}"
                fi
              done
              done
          done

          # Existing snapshots are NOT deleted here. Longhorn's retention only prunes on
          # the next run of the job that created them, and these volumes now have no job —
          # so history already on disk would persist forever. Purging it is a one-off
          # cleanup, done deliberately by hand; it is not made part of a hook that runs on
          # every sync. Note Longhorn ALSO snapshots on every replica rebuild, so a volume
          # that is moved between nodes acquires new ones regardless of this policy.
          echo ""
          echo "NOTE: pre-existing snapshots are not purged by this Job. To reclaim them:"
          echo "  kubectl -n longhorn-system get snapshots.longhorn.io"
          echo "  kubectl -n longhorn-system delete snapshots.longhorn.io <name>..."

          exit ${RC}
