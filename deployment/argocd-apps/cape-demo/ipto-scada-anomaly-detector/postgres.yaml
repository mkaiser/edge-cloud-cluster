# PostgreSQL for the IPTO SCADA anomaly-detector demo workflow.
#
# The Ryax workflow's `dbase` module writes its per-file anomaly scores here. Ryax
# apps are meant to be self-contained, so this database is the demo's OWN and is
# deployed alongside it rather than pointed at any shared cluster database.
#
# Connection string for the workflow (in-cluster DNS):
#   postgres://postgres:<POSTGRES_PASSWORD>@postgres.ryaxns-tools.svc.cluster.local:5432/parquet_data
#
# ⚠ NOT CloudNativePG, unlike every other database in this cluster (rallly-pg,
# xwiki, zammad, …). CNPG's operator-managed Clusters give PITR via barman S3, but
# this one has to take its credentials as-is from the workflow modules, which have
# `postgres` / a fixed password compiled into them. A plain Deployment is also what
# the demo's authors supplied. This is demo data that is regenerated by re-running
# the workflow, so there is no backup requirement to justify the conversion. If this
# ever becomes something whose loss matters, convert it to CNPG — see
# deployment/argocd-apps/rallly/postgres.yaml for the shape.
---
# ConfigMap with the init SQL script.
#
# ⚠ Runs ONCE, on an EMPTY data directory. The postgres image's entrypoint executes
# /docker-entrypoint-initdb.d only when PGDATA has no cluster yet — editing this
# file afterwards does nothing at all, and ArgoCD will report the app Synced while
# the live schema is unchanged. To apply a schema change to a running database you
# must run the SQL by hand (or delete the PVC and lose the data).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ryaxns-tools
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS parquet_entries (
      id SERIAL PRIMARY KEY,
      file VARCHAR(255) NOT NULL,
      index BIGINT NOT NULL,
      final DOUBLE PRECISION NOT NULL,
      graph DOUBLE PRECISION NOT NULL,
      temporal DOUBLE PRECISION NOT NULL,
      drift DOUBLE PRECISION NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Index on file column for faster lookups
    CREATE INDEX IF NOT EXISTS idx_parquet_entries_file ON parquet_entries(file);

    -- Index on created_at for time-based queries
    CREATE INDEX IF NOT EXISTS idx_parquet_entries_created_at ON parquet_entries(created_at);

---
# PersistentVolumeClaim for the PostgreSQL data directory.
#
# storageClassName is STATED, not left to the cluster default. The default
# (longhorn-cloud) lives on the Hetzner cloud disks, and a pod that must run beside
# the Ryax execution pods in the lab cannot attach it — the pod would sit Pending
# forever with no obvious cause. longhorn-unibi-ryax is Ryax's own scope
# (pcie-tb-s, pcie-tb-d, bender), which is exactly where the workflow runs.
#
# 2Gi, not the 10Gi the demo manifests asked for: one row per parquet entry with
# seven scalar columns is a few hundred bytes, so 10Gi is three orders of magnitude
# more than this table can plausibly reach, and the scope it is carved from is the
# same pool the action-builder and the engine's own PVCs compete for. Longhorn
# volumes can be EXPANDED online but never shrunk, so start small.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ryaxns-tools
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-unibi-ryax  # automatically updated from project-settings:applicationPlacements.ryaxStorageClass
  resources:
    requests:
      storage: 2Gi

---
# PostgreSQL Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ryaxns-tools
  labels:
    app: postgres
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the data directory is on a RWO volume,
  # so a second pod cannot attach it while the first still holds it. A rolling
  # update deadlocks — the new pod waits for a volume the old pod will not release
  # until the new one is Ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      priorityClassName: low
      # Placement is stated HERE because the Ryax admission policy that injects it
      # elsewhere is scoped to the ryaxns / ryaxns-execs namespaces by name and does
      # not reach ryaxns-tools. Without the toleration the pod is unschedulable: the
      # only nodes carrying the unibi-ryax storage scope are mesh nodes, and every
      # mesh node is tainted ecc/mesh=true:NoSchedule.
      nodeSelector:
        ecc/site: unibi-hclab  # automatically updated from project-settings:applicationPlacements.meshSite
      tolerations:
        - key: ecc/mesh  # automatically updated from project-settings:applicationPlacements.labels.mesh
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:16-alpine # renovate: datasource=docker depName=postgres
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # A SUBDIRECTORY of the mount, not the mount itself. Longhorn (like any
            # ext4 volume) presents a lost+found directory, and initdb refuses to
            # run in a non-empty directory — without this the container crash-loops
            # on "directory exists but is not empty".
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # -U postgres matches POSTGRES_USER in the secret. pg_isready exits 0 as
          # soon as the server accepts connections, which during the FIRST start is
          # while init.sql is still running — the entrypoint runs initdb against a
          # temporary local-only server. initialDelaySeconds covers that window.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init

---
# ClusterIP Service. In-cluster only, deliberately: this is a demo database with a
# fixed credential and no TLS, so it gets no Gateway route and no Ingress.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ryaxns-tools
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgres
