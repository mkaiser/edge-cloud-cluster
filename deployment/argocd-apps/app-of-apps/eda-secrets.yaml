# ArgoCD Application: the EDA licence secrets.
#
# WHY ITS OWN APP: these values are EDA concerns, not desktop ones. They lived in
# `remote-desktop-secrets` because the desktop was once the only thing that ran a module —
# which left five EDA module manifests referencing another app's secret by name, and the
# seal script recovering from an `xilinx-2026-1/xilinx-secrets-sealed.yaml` path that no
# longer exists. The desktop is now one runtime of two (the [eda-run] CI runner is the
# other), so the licence is owned here and both runtimes consume it.
#
# ⚠ IT APPLIES SECRETS INTO OTHER APPS' NAMESPACES (remote-desktop, gitlab-runner), which
# is deliberate and is the same shape image-registry uses for its credentials: "sealed HERE
# so one password cannot drift into three". A k8s Secret is namespaced and nothing in this
# cluster replicates one across namespaces — reloader restarts pods when a mounted secret
# changes, sealed-secrets-guard unsticks the controller, neither copies. So one in-memory
# value is sealed once per consumer namespace by eda/secrets/sealSecrets.sh.
#
# ⚠ THE CONSUMING APPS ONLY REFERENCE `eda-secrets` BY NAME. They do not create it, so on a
# fresh cluster this app must sync before their pods can start — hence no sync-wave games
# here and `retry` on the consumers (which they already carry for other reasons).
#
# ⚠ TWO KEYS, NOT ONE: `license-flexnet` (the full ';'-separated FlexNet list, for Vivado)
# and `license-server` (a single port@host, for HyperLynx/SALT, which cannot parse a list).
# See eda/secrets/sealSecrets.sh for why merging them breaks HyperLynx.
#
# BEFORE FIRST DEPLOY:
#   deployment/argocd-apps/eda/secrets/sealSecrets.sh
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eda-secrets
  namespace: argocd-apps
  annotations:
    # mesh tier: the licence server is on the lab LAN and every consumer runs there.
    placement.ecc/tier: mesh
spec:
  project: default
  source:
    repoURL: git@github.com:YourProject/yourGit.git
    targetRevision: main
    path: deployment/argocd-apps/eda/secrets
    directory:
      # Only the sealed files are manifests; the seal script is tooling.
      exclude: "{README.md,*.sh}"
  destination:
    server: https://kubernetes.default.svc
    # ⚠ Nominal only. Every resource here carries its OWN metadata.namespace
    # (remote-desktop / gitlab-runner) and ServerSideApply honours it. This value is what
    # ArgoCD reports as the app's destination; it does not relocate the secrets.
    namespace: argocd-apps
  syncPolicy:
    automated:
      # ⚠ prune: true is safe and wanted — a removed sealed file SHOULD delete its Secret,
      # or a rotated-away licence would linger in a namespace nothing re-seals.
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
