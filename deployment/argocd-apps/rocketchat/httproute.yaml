# Hand-written HTTPRoute: the rocketchat chart has no Gateway API support — only
# an Ingress template — so its ingress is disabled in values.yaml and the route
# lives here instead.
#
# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway);
# the HTTP→HTTPS redirect is handled once by argocd-infra/gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rocketchat
  namespace: rocketchat
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - rocketchat.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Meteor/websocket sessions are long-lived.
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        # rocketchat-rocketchat, NOT rocketchat: the chart prefixes the release
        # name (release "rocketchat" + chart "rocketchat"). A wrong backend name
        # is NOT a sync error — the route applies cleanly and reports
        # Accepted=True, only ResolvedRefs=False with "service not found", so it
        # surfaces as a 500 at request time rather than a red app.
        - name: rocketchat-rocketchat
          port: 80
