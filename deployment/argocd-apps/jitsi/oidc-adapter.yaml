# jitsi-oidc-adapter: bridges Authentik OIDC <-> Jitsi JWT token auth.
#
# Flow: prosody (TOKEN_AUTH_URL=/oidc/auth) redirects the user to this adapter,
# which runs the OIDC code flow against Authentik, then mints a Jitsi JWT signed
# with JWT_APP_SECRET (shared with prosody) and hands it back at /oidc/tokenize.
# Reachable at https://meet.<subdomain>.<domain>/oidc via the ingress below.
#
# OIDC client + JWT secret come from sealed secrets in this folder. The matching
# OAuth2 provider/application in Authentik is created by authentik-provider.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-oidc-adapter
  namespace: jitsi
  labels:
    app.kubernetes.io/name: jitsi-oidc-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jitsi-oidc-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jitsi-oidc-adapter
    spec:
      containers:
        - name: adapter
          image: ghcr.io/jitsi-contrib/jitsi-oidc-adapter:latest  # renovate: tracked by "Container image tags" regex (docker datasource)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          env:
            # Bind on all interfaces (image default HOSTNAME would be the pod name).
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "9000"
            # Authentik per-application OIDC issuer (NO trailing slash — the
            # adapter appends /.well-known/openid-configuration itself).
            - name: OIDC_ISSUER_URL
              value: "https://id.subdomain1.your-domain.tld/application/o/jitsi" # automatically updated from project-settings:{general.subdomain,general.domain}
            - name: OIDC_CLIENT_ID
              value: "jitsi"
            - name: OIDC_SCOPES
              value: "openid profile email"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jitsi-oidc-client-secret
                  key: OIDC_CLIENT_SECRET
            - name: JWT_APP_ID
              value: "jitsi"
            - name: JWT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: jitsi-jwt
                  key: JWT_APP_SECRET
            # TLS verification of Authentik's OIDC endpoints. "true" (skip) on LE
            # STAGING (untrusted CA), "false" (verify) on production. Toggled
            # automatically by scripts/environment/updateConfigFromProjectSettings.sh
            # based on certIssuerType.
            - name: ALLOW_UNSECURE_CERT
              value: "false" # automatically updated from project-settings:{tls.certIssuerType,tls.allowUnsecureCert}
            - name: AUTO_RETURN_TO_APP
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jitsi-oidc-adapter
  namespace: jitsi
  labels:
    app.kubernetes.io/name: jitsi-oidc-adapter
spec:
  selector:
    app.kubernetes.io/name: jitsi-oidc-adapter
  ports:
    - name: http
      port: 9000
      targetPort: http
---
# Routes https://meet.<tld>/oidc/* to the adapter. Same host as the web route and
# the /invite route — three HTTPRoutes share this hostname, split by path.
# Gateway API resolves the overlap by path specificity (longest PathPrefix wins),
# so /oidc beats the chart's "/" route without any ordering annotation.
#
# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jitsi-oidc-adapter
  namespace: jitsi
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - meet.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oidc
      backendRefs:
        - name: jitsi-oidc-adapter
          port: 9000
