# Jitsi Meet (jitsi-contrib/jitsi-helm) — secure video conferencing.
# Accessible at https://meet.<subdomain>.<domain>
#
# Auth: OIDC via Authentik using the jitsi-oidc-adapter (its own Deployment in
# this folder, oidc-adapter.yaml, exposed at /oidc through a second ingress).
# Prosody runs JWT token auth; after the user authenticates against Authentik
# the adapter mints a JWT signed with the shared JWT_APP_SECRET. Authenticated
# (JWT) users are moderators who open the room; guests join token-less via a
# shared link and are held in a lobby until a moderator admits them.
#
# All Authentik wiring lives in THIS folder (authentik-provider.yaml): the
# OAuth2 provider + application tile are created/removed via the Authentik API
# (PostSync / PreDelete hooks), NOT via a worker-mounted blueprint, so nothing
# jitsi-specific leaks into the authentik folder.
#
# Secrets (jitsi namespace, sealed in this folder):
#   jitsi-jwt                 key JWT_APP_SECRET     — shared prosody <-> adapter
#   jitsi-oidc-client-secret  key OIDC_CLIENT_SECRET — Authentik OIDC client secret

# Clean resource names (release name is "jitsi-meet" → fullname "jitsi-meet").
fullnameOverride: jitsi-meet

publicURL: https://meet.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}

# enableAuth=true + enableGuests=false: prosody REJECTS any token-less client on
# EVERY room. A bare room URL (no ?jwt=) therefore fails auth and the web client
# redirects to TOKEN_AUTH_URL (/oidc/auth) → forced OIDC login for all users.
# "Direct link" guests are NOT anonymous: they carry a room-scoped invite JWT
# (?jwt=<signed>) minted by the invite-minter (jitsi-invite-minter.yaml), signed
# with the same JWT_APP_SECRET, so prosody accepts them without login. Guest
# tokens carry context.user.lobby_bypass=false; OIDC tokens carry true.
enableAuth: true
enableGuests: false

# JWT token auth (validated by prosody) + lobby (knock & admit) for guests.
# Injected into every component through the shared config map.
extraCommonEnvs:
  AUTH_TYPE: jwt
  JICOFO_ENABLE_AUTH: "false"
  JWT_APP_ID: jitsi
  JWT_ACCEPTED_ISSUERS: jitsi
  JWT_ACCEPTED_AUDIENCES: jitsi
  # Scope every JWT to its `room` claim: prosody checks the token's room matches
  # the room being joined, so an invite link for roomA cannot open roomB. Both
  # the OIDC adapter and the invite-minter set `room` on the tokens they sign.
  JWT_ENABLE_DOMAIN_VERIFICATION: "true"
  TOKEN_AUTH_URL: https://meet.subdomain1.your-domain.tld/oidc/auth?state={state} # automatically updated from project-settings:{general.subdomain,general.domain}
  # Auto-enable the lobby (muc_lobby_rooms): token-less guests must knock and
  # wait; JWT-authenticated moderators bypass it and admit them.
  ENABLE_LOBBY: "1"
  # ENABLE_LOBBY only makes the lobby *available* — by default a room has NO
  # lobby until a moderator manually turns it on, so the first guest into an
  # empty room walks straight in. The lobby_autostart plugin (mounted into
  # prosody below) activates the lobby on every room at creation; it fires
  # "create-persistent-lobby-room", handled by persistent_lobby. Both modules
  # are added to the MAIN MUC component here. Safe because JWT moderators
  # bypass the lobby (whitelisted auth domain) and can admit the waiting guests.
  XMPP_MUC_MODULES: persistent_lobby,lobby_autostart
  # Disable the pre-join screen so JWT auth users skip the name prompt.
  # With OIDC auth the name comes from context.user.name in the JWT token;
  # the pre-join screen was appearing before the JWT was obtained (empty name).
  ENABLE_PREJOIN_PAGE: "false"

web:
  replicaCount: 1
  # config.js overrides (mounted at /config/custom-config.js by the chart and
  # appended to config.js by the web image). The web client does NOT derive
  # these from the prosody ENABLE_* env, so they must be set explicitly:
  #   enableUserRolesBasedOnToken — JWT users become moderators; token-less
  #                                 guests are non-moderators.
  #   enableLobbyChat / hideLobbyButton — present a working lobby UI so guests
  #                                 knock and moderators admit them.
  #   enableClosePage — guests rejected from the lobby get a clean end page.
  custom:
    configs:
      _custom_config_js: |
        config.enableUserRolesBasedOnToken = true;
        config.enableLobbyChat = true;
        config.hideLobbyButton = false;
        config.enableClosePage = true;
  # Jitsi web UI at "/". The /oidc adapter is routed by a separate ingress
  # (oidc-adapter.yaml) sharing this host.
  # Routing is an HTTPRoute in httproute.yaml beside this file. The chart's own
  # web.gateway option is deliberately NOT used: it would create a second Gateway
  # competing for :80/:443 on the control-plane nodes (see httproute.yaml).
  ingress:
    enabled: false

prosody:
  jwt:
    # Sealed in this folder (oidc/jwt secrets). Must carry key JWT_APP_SECRET.
    existingSecretName: jitsi-jwt
  # Mount the lobby_autostart prosody plugin (ConfigMap jitsi-prosody-plugins,
  # defined in prosody-lobby-autostart-plugin.yaml in this folder) onto the
  # custom plugin path so the module loaded via XMPP_MUC_MODULES is found.
  extraVolumes:
    - name: prosody-plugins-custom
      configMap:
        name: jitsi-prosody-plugins
  extraVolumeMounts:
    - name: prosody-plugins-custom
      subPath: mod_lobby_autostart.lua
      mountPath: /prosody-plugins-custom/mod_lobby_autostart.lua

# JVB: a single bridge using host UDP/10000 (opened in the Pulumi firewall,
# src/network.ts). The public IP is auto-discovered via the default STUN
# server, so the Hetzner node IP never needs hard-coding here.
jvb:
  replicaCount: 1
  service:
    enabled: false
  useHostPort: true
  UDPPort: 10000

# Coturn: STUN/TURN over UDP/3478 (opened in the Pulumi firewall) as a media
# fallback for participants on restrictive networks. TURNS (TCP/443) stays
# disabled — it would clash with the Gateway data plane already on 443.
coturn:
  enabled: true
  turn:
    transport: "udp"
  turns:
    enabled: false
  service:
    type: LoadBalancer
    ports:
      turn: 3478

# Jibri: local meeting recording onto Longhorn. Livestreaming disabled (no
# external stream key needed).
jibri:
  enabled: true
  singleUseMode: false
  replicaCount: 1
  recording: true
  livestreaming: false
  persistence:
    enabled: true
    size: 32Gi
    storageClassName: longhorn-cloud
  shm:
    enabled: true
