# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway),
# so there is no tls block here and no ssl-redirect — the HTTP→HTTPS redirect is
# handled once, cluster-wide, by argocd-infra/gateway/redirect-to-https.yaml.
# Safe to expose publicly: auth is the per-user virtual key (or OIDC on the UI).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: litellm
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - llm.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # LLM responses stream for a long time — raise the timeout well above the
      # default so streamed completions aren't cut off.
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: litellm
          port: 4000
