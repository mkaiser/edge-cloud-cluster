# Authentik OAuth2 provider + application tile for the Hermes admin dashboard —
# managed entirely from this folder via the Authentik API, so nothing
# hermes-specific lives in the authentik folder.
#
#   PostSync  job → create/update the "hermes-dashboard" OAuth2 provider + the
#                   "Hermes" application (tile, group "AI") + bind the central
#                   access-admin-only policy.
#   PreDelete job → delete the application + provider on app removal.
#
# Auth: the SCOPED provisioner token (key `token` in authentik-provisioner-token,
# this namespace) — NOT the superuser bootstrap token. The OIDC client secret
# (key client-secret) comes from hermes-oidc-client-secret in this namespace.
#
# ⚠ access-admin-only is the ONLY authorization on this app. Hermes'
# self-hosted OIDC plugin has no allowlist of its own — it treats the IDP as
# authoritative ("The IDP's own allowlist is authoritative",
# plugins/dashboard_auth/self_hosted/__init__.py) — and the dashboard can
# surface the bearer keys, which are effectively RCE credentials. Anyone the
# policy admits gets the dashboard.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-authentik
  namespace: hermes
---
# The provider/cleanup jobs read the scoped provisioner token from this
# namespace via `kubectl get secret` — grant the SA get on exactly that secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-authentik-token-read
  namespace: hermes
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-provisioner-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-authentik-token-read
  namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-authentik-token-read
subjects:
  - kind: ServiceAccount
    name: hermes-authentik
    namespace: hermes
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-authentik-provider
  namespace: hermes
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: hermes-authentik
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: provider
          image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            # The DASHBOARD host, not the API host: this provider gates
            # hermes-admin.<tld>. The API on hermes.<tld> stays bearer-key
            # authenticated and is deliberately NOT fronted by Authentik.
            #
            # The marker rewrites only the <cluster>.<basedomain> segment, so the
            # "hermes-admin." prefix and the "/auth/callback" path below survive a
            # subdomain bump. Do NOT add general.tld to the field list — that
            # switches to the whole-hostname pass and would eat the prefix.
            - name: PUBLIC_URL
              value: "https://hermes-admin.subdomain1.your-domain.tld" # automatically updated from project-settings:{general.subdomain,general.domain}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-oidc-client-secret
                  key: client-secret
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              API="http://authentik-server.authentik.svc.cluster.local/api/v3"
              TOKEN=$(kubectl get secret authentik-provisioner-token -n hermes \
                -o jsonpath='{.data.token}' | base64 -d)
              [ -z "$TOKEN" ] && { echo "ERROR: provisioner token empty"; exit 1; }
              AUTH="Authorization: Bearer ${TOKEN}"

              echo "Waiting for Authentik API..."
              i=0
              while [ "$i" -lt 60 ]; do
                curl -fsS -H "$AUTH" "$API/core/users/?username=akadmin" >/dev/null 2>&1 && break
                echo "  waiting... ($i/60)"; sleep 10; i=$((i+1))
              done
              [ "$i" -ge 60 ] && { echo "ERROR: Authentik API never ready"; exit 1; }

              first_pk() {
                curl -fsS -H "$AUTH" "$API/$1" \
                  | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print(r[0]['pk'] if r else '')"
              }

              AUTH_FLOW=$(first_pk "flows/instances/?slug=default-provider-authorization-implicit-consent")
              INVAL_FLOW=$(first_pk "flows/instances/?slug=default-provider-invalidation-flow")
              SIGN_KEY=$(first_pk "crypto/certificatekeypairs/?name=authentik%20Self-signed%20Certificate")
              echo "auth_flow=$AUTH_FLOW inval_flow=$INVAL_FLOW signing_key=$SIGN_KEY"
              [ -z "$AUTH_FLOW" ] && { echo "ERROR: authorization flow not found"; exit 1; }

              # openid/profile/email are the plugin's default scope set; groups is
              # added so the claim is available for future group-based rules.
              MAP_PKS="[]"
              for s in openid profile email groups; do
                PK=$(first_pk "propertymappings/provider/scope/?scope_name=${s}")
                [ -n "$PK" ] && MAP_PKS=$(python3 -c "import json;l=$MAP_PKS;l.append('$PK');print(json.dumps(l))")
              done
              echo "scope mapping pks: $MAP_PKS"

              # The redirect_uri MUST end in /auth/callback — the plugin rejects
              # anything else before it ever contacts the IDP
              # (_validate_redirect_uri, self_hosted/__init__.py).
              PROVIDER_PAYLOAD=$(AUTH_FLOW="$AUTH_FLOW" INVAL_FLOW="$INVAL_FLOW" \
                SIGN_KEY="$SIGN_KEY" MAP_PKS="$MAP_PKS" PUBLIC_URL="$PUBLIC_URL" \
                CLIENT_SECRET="$OIDC_CLIENT_SECRET" python3 -c "
              import json, os
              p = {
                'name': 'hermes-dashboard',
                'client_type': 'confidential',
                'client_id': 'hermes-dashboard',
                'client_secret': os.environ['CLIENT_SECRET'],
                'authorization_flow': os.environ['AUTH_FLOW'],
                'property_mappings': json.loads(os.environ['MAP_PKS']),
                'redirect_uris': [{'matching_mode': 'strict',
                                   'url': os.environ['PUBLIC_URL'] + '/auth/callback'}],
                'grant_types': ['authorization_code', 'refresh_token'],
              }
              if os.environ.get('INVAL_FLOW'): p['invalidation_flow'] = os.environ['INVAL_FLOW']
              if os.environ.get('SIGN_KEY'):   p['signing_key'] = os.environ['SIGN_KEY']
              print(json.dumps(p))
              ")

              PROV_PK=$(first_pk "providers/oauth2/?name=hermes-dashboard")
              if [ -z "$PROV_PK" ]; then
                echo "Creating OAuth2 provider 'hermes-dashboard'..."
                PROV_PK=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                  -d "$PROVIDER_PAYLOAD" "$API/providers/oauth2/" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin)['pk'])")
              else
                echo "Updating OAuth2 provider 'hermes-dashboard' (pk=$PROV_PK)..."
                curl -fsS -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
                  -d "$PROVIDER_PAYLOAD" "$API/providers/oauth2/${PROV_PK}/" >/dev/null
              fi
              echo "provider pk=$PROV_PK"

              APP_PAYLOAD=$(PROV_PK="$PROV_PK" PUBLIC_URL="$PUBLIC_URL" python3 -c "
              import json, os
              print(json.dumps({
                'name': 'Hermes',
                'slug': 'hermes',
                'provider': int(os.environ['PROV_PK']),
                'group': 'AI',
                'meta_launch_url': os.environ['PUBLIC_URL'],
                # ⚠ SELF-HOSTED, not a CDN URL. This is the project's own Hermes logo,
                # shipped in the authentik-branding ConfigMap and mounted at
                # /data/media/public/branding — see argocd-infra/authentik/branding/.
                # Authentik resolves a RELATIVE meta_icon against its media root, the same
                # way blueprint-branding.yaml references branding/logo-*.svg.
                # ⚠ Adding an image there is two steps: drop the file in branding/ AND
                # re-run branding/generate-configmap.sh — the ConfigMap is generated, so a
                # file that is not regenerated into it simply does not exist at runtime.
                # ⚠ NO BACKTICKS IN THIS BLOCK. It sits inside a DOUBLE-quoted bash
                # heredoc, so backticks are command substitution even in a Python
                # comment — the first version of this note ran robot.svg as a command
                # and logged a command-not-found error during the sync.
                # ⚠ AND NO DOUBLE QUOTES EITHER, for the same reason. This whole block is
                # the argument to python3 -c followed by a double-quoted string, so a
                # double quote anywhere in here CLOSES that string early. The previous
                # version of the line above quoted the command-not-found message
                # verbatim; bash then re-parsed the remainder and collapsed its spaces,
                # so python received a truncated program and died with a SyntaxError
                # about an unclosed brace — pointing at line 3, six lines ABOVE the
                # actual culprit. Verified by dumping what python receives.
                'meta_icon': 'branding/hermes.png',
              }))
              ")

              # Upsert by slug: PATCH the existing app (slug is the URL primary key),
              # fall back to POST only on 404. A list-query EXISTS check can return a
              # false-negative (token visibility / pagination), making the old logic
              # POST a duplicate → 400 "Application with this slug already exists".
              upsert_app() {  # $1=slug $2=name $3=payload
                local code
                code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
                  -H "$AUTH" -H "Content-Type: application/json" \
                  -d "$3" "$API/core/applications/$1/")
                if [ "$code" = "404" ]; then
                  echo "Creating application '$2'..."
                  curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                    -d "$3" "$API/core/applications/" >/dev/null
                elif [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                  echo "Updated application '$2' (slug=$1)."
                else
                  echo "ERROR: PATCH application '$1' returned HTTP $code"; exit 1
                fi
              }
              upsert_app hermes "Hermes" "$APP_PAYLOAD"

              # Access control: bind the central access-admin-only expression policy,
              # created in blueprint-apps.yaml. Idempotent — skip if already bound.
              # This is the only gate on the dashboard (see the file header), so a
              # missing policy is a HARD failure, not a warning.
              # Read the application by SLUG, not via a list query. Authentik applies
              # object-level view filtering to list endpoints: with the scoped provisioner
              # token `?slug=hermes` returns pagination.count=1 but an EMPTY results array,
              # so first_pk() yields "" for an application that plainly exists. The detail
              # endpoint has no such filter (verified: GET /core/applications/hermes/ -> 200
              # with the right pk while the list showed 0 results). This is what made the
              # first run die with "application 'hermes' not found after upsert"
              # AFTER it had just successfully created it.
              APP_PK=$(curl -fsS -H "$AUTH" "$API/core/applications/hermes/" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('pk',''))" 2>/dev/null || true)
              POL_PK=$(first_pk "policies/expression/?name=access-admin-only")
              [ -z "$APP_PK" ] && { echo "ERROR: application 'hermes' not found after upsert"; exit 1; }
              [ -z "$POL_PK" ] && { echo "ERROR: access-admin-only policy not found — refusing to leave the dashboard ungated"; exit 1; }
              BOUND=$(curl -fsS -H "$AUTH" "$API/policies/bindings/?target=${APP_PK}&page_size=100" \
                | python3 -c "import json,sys; print(','.join(b.get('policy','') for b in json.load(sys.stdin)['results'] if b.get('policy')))")
              if ! echo "$BOUND" | tr ',' '\n' | grep -qx "$POL_PK"; then
                echo "  binding access-admin-only policy to Hermes"
                curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                  -d "{\"target\":\"${APP_PK}\",\"policy\":\"${POL_PK}\",\"order\":0,\"enabled\":true}" \
                  "$API/policies/bindings/" >/dev/null
              fi

              echo "Hermes Authentik provider + tile + access binding configured."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-authentik-provider-cleanup
  namespace: hermes
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: hermes-authentik
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: cleanup
          image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              API="http://authentik-server.authentik.svc.cluster.local/api/v3"
              TOKEN=$(kubectl get secret authentik-provisioner-token -n hermes \
                -o jsonpath='{.data.token}' | base64 -d || true)
              [ -z "$TOKEN" ] && { echo "Provisioner token unavailable — skipping cleanup."; exit 0; }
              AUTH="Authorization: Bearer ${TOKEN}"

              echo "Deleting application 'hermes'..."
              curl -fsS -X DELETE -H "$AUTH" "$API/core/applications/hermes/" >/dev/null 2>&1 || true

              PROV_PK=$(curl -fsS -H "$AUTH" "$API/providers/oauth2/?name=hermes-dashboard" \
                | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print(r[0]['pk'] if r else '')" 2>/dev/null || true)
              if [ -n "$PROV_PK" ]; then
                echo "Deleting OAuth2 provider 'hermes-dashboard' (pk=$PROV_PK)..."
                curl -fsS -X DELETE -H "$AUTH" "$API/providers/oauth2/${PROV_PK}/" >/dev/null 2>&1 || true
              fi
              echo "Hermes Authentik cleanup done."
