---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-secrets
  namespace: hermes
  annotations:
    # Wave -1 for the same reason as the other two sealed files: the StatefulSet
    # consumes these keys, so they must land before its wave is health-gated.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    api-server-key: 
    dashboard-password: ""
    dashboard-username: ""
    litellm-key: 
    profile-api-server-key: 
  template:
    metadata:
      name: hermes-secrets
      namespace: hermes
