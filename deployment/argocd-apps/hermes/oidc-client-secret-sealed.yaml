---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-oidc-client-secret
  namespace: hermes
  annotations:
    # Wave -1: the StatefulSet consumes this Secret, and ArgoCD health-gates a wave
    # before starting the next one. In the same wave the sync parks on the
    # StatefulSet ("waiting for healthy state"), which can never go healthy while
    # the Secret it needs is still unapplied — a multi-hour deadlock.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      name: hermes-oidc-client-secret
      namespace: hermes
