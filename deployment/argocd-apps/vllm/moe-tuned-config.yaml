# Tuned fused-MoE kernel parameters for the Thor, generated by
# scripts/runtime/optimizeModel.sh (which takes the GPU exclusively for hours — see
# doc/llm-performance.md). vLLM ships 327 of these tables and none for this device, so
# without it the engine logs `Using default MoE config. Performance might be
# sub-optimal!` and falls back to generic parameters.
#
# ⚠ NOT portable. The filename vLLM looks for is derived from the model shape and the
# device: E is the expert count, N the shard intermediate size, both read from the model
# config at load time. It is valid for Qwen3.6-35B-A3B at TP=1 on a Thor and for nothing
# else — changing the model or the tensor-parallel size needs a fresh tuning run.
#
# ⚠ The key is NOT the filename. Kubernetes restricts ConfigMap keys to [-._a-zA-Z0-9]+
# and the real name contains '=' and ',', so it cannot be one. The stage-moe-config
# initContainer in deployment.yaml copies this to the required name.
#
# Tuned batch sizes: 1 2 4 8 16 32 64 128 256. Upstream's default list runs to 4096 and
# measured 9-14h on this hardware; the large entries buy nothing for a deployment serving
# a handful of agent sessions. Triton 3.7.1 — a Triton major bump is a reason to re-tune.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-moe-tuned-config
  namespace: vllm
data:
  tuned-moe-config.json: |
    {
        "triton_version": "3.7.1",
        "1": {
            "BLOCK_SIZE_M": 32,
            "BLOCK_SIZE_N": 256,
            "BLOCK_SIZE_K": 256,
            "GROUP_SIZE_M": 64,
            "num_warps": 8,
            "num_stages": 2
        },
        "2": {
            "BLOCK_SIZE_M": 64,
            "BLOCK_SIZE_N": 32,
            "BLOCK_SIZE_K": 64,
            "GROUP_SIZE_M": 1,
            "num_warps": 4,
            "num_stages": 2
        },
        "4": {
            "BLOCK_SIZE_M": 32,
            "BLOCK_SIZE_N": 32,
            "BLOCK_SIZE_K": 256,
            "GROUP_SIZE_M": 32,
            "num_warps": 4,
            "num_stages": 3
        },
        "8": {
            "BLOCK_SIZE_M": 32,
            "BLOCK_SIZE_N": 32,
            "BLOCK_SIZE_K": 256,
            "GROUP_SIZE_M": 64,
            "num_warps": 8,
            "num_stages": 2
        },
        "16": {
            "BLOCK_SIZE_M": 32,
            "BLOCK_SIZE_N": 128,
            "BLOCK_SIZE_K": 128,
            "GROUP_SIZE_M": 1,
            "num_warps": 8,
            "num_stages": 4
        },
        "32": {
            "BLOCK_SIZE_M": 32,
            "BLOCK_SIZE_N": 32,
            "BLOCK_SIZE_K": 256,
            "GROUP_SIZE_M": 1,
            "num_warps": 4,
            "num_stages": 2
        },
        "64": {
            "BLOCK_SIZE_M": 128,
            "BLOCK_SIZE_N": 256,
            "BLOCK_SIZE_K": 64,
            "GROUP_SIZE_M": 1,
            "num_warps": 8,
            "num_stages": 2
        },
        "128": {
            "BLOCK_SIZE_M": 32,
            "BLOCK_SIZE_N": 32,
            "BLOCK_SIZE_K": 128,
            "GROUP_SIZE_M": 1,
            "num_warps": 8,
            "num_stages": 5
        },
        "256": {
            "BLOCK_SIZE_M": 64,
            "BLOCK_SIZE_N": 256,
            "BLOCK_SIZE_K": 64,
            "GROUP_SIZE_M": 1,
            "num_warps": 8,
            "num_stages": 3
        }
    }
