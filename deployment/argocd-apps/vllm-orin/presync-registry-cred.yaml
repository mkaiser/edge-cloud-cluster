# PreSync: create the vLLM-Orin registry PULL credential — NO sealed secret.
#
# ⚠ A NEAR-COPY OF deployment/argocd-apps/vllm/presync-registry-cred.yaml, per-namespace
# because imagePullSecrets are namespaced. The two are SAFE TO RUN CONCURRENTLY: the rails
# snippet below does find-or-create on ONE shared 'registry-pull' deploy token on the
# 'deployments' group, so whichever app syncs second reuses the same token rather than
# minting a rival. The ClusterRole/ClusterRoleBinding ARE renamed (vllm-orin-registry-cred)
# — those are cluster-scoped and would otherwise be one object owned by two Applications.
#
# ⚠ The 'deployments' group is created by the THOR app's build-trigger job. This app has no
# build of its own (the image is shared), so on a fresh cluster the wait loop below is what
# makes that ordering safe — it polls for the group for 5 minutes rather than assuming it.
#
# WHY PreSync (was PostSync — deadlocked on every recreate): the Deployment consumes
# this secret via imagePullSecrets, so it can never become Healthy without it
# (ImagePullBackOff → 600s progressDeadline → sync Failed), but PostSync only fires
# AFTER the main phase is Healthy → the hook never ran (observed). PreSync
# runs before the Deployment is applied; the sibling build-trigger job proves
# GitLab/toolbox access works at PreSync time. Runs at sync-wave 1, strictly after the
# build-trigger job (wave 0) which creates the 'deployments' group.
#
# WHY not a sealed secret: a registry pull cred must exist BOTH as a Kubernetes secret
# AND as a matching credential in GitLab's DB. GitLab's DB is recreated empty on every
# cluster rebuild, and the repo seals OFFLINE (Pulumi cert) so it can't mint a live
# GitLab token — the old sealed vllm-registry-cred therefore went stale every recreate
# (wrong host + a token that no longer exists → pull 403). Instead, this PreSync job
# (like gitlab/postsync-bootstrap-gitlab-runner-secrets.yaml) runs at bootstrap with a
# live cluster: it creates a read_registry deploy token in GitLab and writes the
# dockerconfigjson secret directly into the vllm-orin ns. Self-heals on every recreate; the
# credential never lives in git.
#
# NOT root+password: GitLab has password_authentication_enabled_for_git=false, so
# root+password 401s at the registry /jwt/auth realm (verified). A group deploy token
# with read_registry is the GitLab-supported way.
#
# The registry HOST is not secret — it matches the Deployment's image ref (which
# carries the subdomain anchor, kept current by updateConfigFromProjectSettings.sh), so
# it's always correct for the current cluster.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-registry-cred
  namespace: vllm-orin
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vllm-orin-registry-cred
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
rules:
# read the GitLab root password + exec the toolbox (in the gitlab ns)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vllm-orin-registry-cred
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vllm-orin-registry-cred
subjects:
- kind: ServiceAccount
  name: vllm-registry-cred
  namespace: vllm-orin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-registry-cred
  namespace: vllm-orin
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # ⚠ must exceed the in-container 30m GitLab wait, else the deadline kills the
  # Job mid-wait and the retry budget is never spent.
  activeDeadlineSeconds: 2400
  backoffLimit: 2
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is already covered by
  # hook-delete-policy: BeforeHookCreation (the next sync deletes this Job before
  # recreating it), so a TTL buys nothing and COSTS the post-mortem: it deletes the
  # pod, and with it the only copy of the logs.
  #
  # Alloy/Loki does not save you here — its pod discovery is a poll, so a short-lived
  # Job can finish and be deleted before it is ever scraped, leaving Loki with zero
  # lines for it. A failed hook Job is exactly what you most need logs for after a
  # recreate.
  template:
    spec:
      serviceAccountName: vllm-registry-cred
      restartPolicy: OnFailure
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: registry-cred
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        env:
        # Registry host (NOT secret) — plaintext, carries the subdomain anchor.
        - name: REGISTRY_HOST
          value: "registry.gitlab.subdomain1.your-domain.tld" # automatically updated from project-settings:{general.subdomain,general.domain}
        - name: GITLAB_URL
          value: "http://gitlab-webservice-default.gitlab.svc.cluster.local:8080"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          # ⚠ MUST outlast GitLab's cold start on a cluster recreate, and MUST FAIL (not fall
          # through) when it does not. Measured 2026-08-30 (ecc186→ecc187): a 10m wait expired
          # while GitLab was still starting; the old loop then `break`ed and carried on, turning
          # "GitLab never came up" into a misleading downstream error.
          echo "Waiting for GitLab API (up to 30m)..."
          i=1
          ready=0
          while [ "$i" -le 180 ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${GITLAB_URL}/-/readiness")
            if [ "$code" = "200" ]; then ready=1; break; fi
            echo "Try ${i}/180: GitLab not ready (HTTP ${code}), retrying in 10s..."
            i=$((i + 1)); sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "ERROR: GitLab API not ready after 30m — refusing to continue." >&2
            exit 1
          fi

          # Find-or-create a read_registry deploy token named 'registry-pull' on the
          # 'deployments' group. Idempotent: reuse an existing non-revoked token's
          # username; only (re)generate the token value when creating. The group is
          # created by the vLLM build-trigger — wait for it.
          echo "Ensuring 'deployments' group + registry-pull deploy token..."
          j=1
          while [ "$j" -le 30 ]; do
            EXISTS=$(kubectl -n gitlab exec deploy/gitlab-toolbox -c toolbox -- \
              gitlab-rails runner "puts(Group.find_by_full_path('deployments') ? 'yes' : 'no')" 2>/dev/null | tail -1 | tr -d ' \r\n')
            [ "$EXISTS" = "yes" ] && break
            echo "Try ${j}/30: 'deployments' group not present yet (build-trigger creates it), retrying in 10s..."
            j=$((j + 1)); sleep 10
          done

          # rails: reuse or create the token; print "<username>\t<token>".
          DT_OUT=$(kubectl -n gitlab exec deploy/gitlab-toolbox -c toolbox -- gitlab-rails runner '
            g=Group.find_by_full_path("deployments")
            if g.nil?; STDERR.puts "ERR: deployments group missing"; exit 1; end
            u=User.find_by(admin:true)||User.find_by(username:"root")
            t=g.deploy_tokens.active.find_by(name:"registry-pull")
            if t.nil?
              res=Groups::DeployTokens::CreateService.new(g,u,{name:"registry-pull",read_registry:true,expires_at:nil}).execute
              t=res[:deploy_token]
              (STDERR.puts "ERR: #{res[:message]}"; exit 1) unless t&.persisted?
            end
            puts "#{t.username}\t#{t.token}"
          ' 2>/dev/null | tr -d "\r" | tail -1)
          DT_USER="${DT_OUT%%	*}"
          DT_TOKEN="${DT_OUT##*	}"
          if [ -z "$DT_USER" ] || [ -z "$DT_TOKEN" ] || [ "$DT_USER" = "$DT_TOKEN" ]; then
            echo "ERROR: could not obtain registry-pull deploy token: '${DT_OUT}'"
            exit 1
          fi
          echo "Deploy token ready (user=${DT_USER})."

          # Assemble the dockerconfigjson (plaintext host) and write the pull secret.
          # The base64 `auth` field is REQUIRED by skopeo/podman --authfile: their parser
          # ignores username/password and falls through to an anonymous request, which the
          # registry rejects with a misleading 403 "Requesting bearer token" even for repos
          # the token can read. containerd/kubelet is happy with either form.
          echo "Writing vllm-orin/vllm-registry-cred for ${REGISTRY_HOST}..."
          DT_AUTH=$(printf '%s:%s' "${DT_USER}" "${DT_TOKEN}" | base64 | tr -d '\n')
          DOCKERCFG="{\"auths\":{\"${REGISTRY_HOST}\":{\"username\":\"${DT_USER}\",\"password\":\"${DT_TOKEN}\",\"auth\":\"${DT_AUTH}\"}}}"
          kubectl -n vllm-orin create secret generic vllm-registry-cred \
            --type=kubernetes.io/dockerconfigjson \
            --from-literal=.dockerconfigjson="${DOCKERCFG}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "vLLM registry pull credential created."
