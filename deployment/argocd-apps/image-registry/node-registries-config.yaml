# Teach the KUBELET on lab nodes to pull from this registry, so lab images stop
# round-tripping through GitLab's S3-backed registry (~5 MB/s from the lab against
# ~126 MB/s here). Path A of plans/old/eda-registry-node-reachable.md.
#
# What it writes on each selected node, under containerd's OWN host-config directory:
#   .../certs.d/127.0.0.1:30500/image-registry-ca.crt   the private CA that signs this registry
#   .../certs.d/127.0.0.1:30500/hosts.toml              the https endpoint + that CA
#
# ⚠ NO /etc/rancher/k3s/registries.yaml, DELIBERATELY, AND IT MUST STAY THAT WAY.
# k3s expands registries.yaml into TWO destinations with DIFFERENT lifetimes
# (external/git_k3s pkg/agent/containerd/config.go, pkg/agent/templates/templates.go):
#
#   agent/etc/containerd/config.toml           configs.<host>.auth   — read at AGENT START only
#   agent/etc/containerd/certs.d/<h>/hosts.toml  endpoint + ca       — read on EVERY pull
#
# config.toml sets `config_path = ".../certs.d"`, so containerd re-reads hosts.toml on every
# resolve. Writing certs.d directly therefore takes effect with NO k3s restart — which is the
# whole point: the CA is re-minted by cert-manager on every cluster recreate, and the old
# registries.yaml route needed a serialised node-by-node k3s restart to pick it up (two lab
# nodes carry on-prem AD DCs, so that restart could never be automated safely).
#
# The CREDENTIAL is the half that cannot live here — hosts.toml has no auth field, and the
# config.toml that does is start-only. It comes from an imagePullSecret instead
# (image-registry-cred-node-sealed.yaml), keyed to host "127.0.0.1:30500". That is pure
# Kubernetes API and needs no node state at all.
#
# ⚠ WHY THIS SURVIVES A k3s RESTART. cleanContainerdHosts() deletes a certs.d directory only
# when its hosts.toml FIRST LINE equals k3s's own "# File generated by k3s. DO NOT EDIT."
# header; unmanaged directories are left alone. Our header deliberately differs, so k3s never
# clobbers it. ⚠ But that same function ALSO unconditionally RemoveAll()s the directory for
# every host named in registries.yaml before regenerating it — so re-introducing a
# registries.yaml entry for 127.0.0.1:30500 would delete this directory on every agent start.
# Keep the two mechanisms apart.
#
# ⚠ ONE FILE, TWO PATHS, and they are not interchangeable. DIR is where the hostPath is
# MOUNTED IN THIS POD; HOST_DIR is where the same directory lives on the NODE, which is the
# only path containerd can open. Writing the mount path into hosts.toml renders a `ca = [...]`
# pointing at a file that does not exist outside this pod, and every pull then fails TLS
# (measured on fs-vm, 2026-09-03).
#
# ⚠ The `server`/endpoint MUST name https explicitly. With the bare host containerd defaults
# to http against a TLS port, so every pull fails and the CA never even matters.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-registry-node-config
  namespace: image-registry
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-registry-node-config
  namespace: image-registry
spec:
  selector:
    matchLabels:
      app: image-registry-node-config
  template:
    metadata:
      labels:
        app: image-registry-node-config
    spec:
      serviceAccountName: image-registry-node-config
      # Lab nodes only. A cloud node reaching this NodePort would cross WireGuard to the
      # lab and back — the round trip this exists to remove.
      nodeSelector:
        ecc/fileserver-lan: "true"  # automatically updated from project-settings:applicationPlacements.labels.fileserverLan
      tolerations:
        - key: ecc/mesh  # automatically updated from project-settings:applicationPlacements.labels.mesh
          operator: Equal
          value: "true"
          effect: NoSchedule
        # ⚠ THE GPU TAINT TOO, or the one node that most needs this is silently skipped.
        # The GPU node carries ecc/gpu=true:NoSchedule and runs ollama — the workload
        # whose image round-trips through GitLab's S3 registry today. Without this toleration
        # the DaemonSet reports 3/3 Ready and looks complete while thor has no config at all.
        - key: ecc/gpu  # automatically updated from project-settings:applicationPlacements.labels.gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: install
          image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
          securityContext:
            # Writing under the k3s agent dir needs root on the host filesystem. No host
            # network, no host PID: this only ever writes two files.
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              HOSTPORT="127.0.0.1:30500"
              DIR="/host-certs-d/$HOSTPORT"
              HOST_DIR="/var/lib/rancher/k3s/agent/etc/containerd/certs.d/$HOSTPORT"
              CA_OUT="$DIR/image-registry-ca.crt"
              CA_HOST="$HOST_DIR/image-registry-ca.crt"
              HOSTS_OUT="$DIR/hosts.toml"
              LEGACY_REG=/host-k3s/registries.yaml

              install_files() {
                mkdir -p "$DIR"
                printf '%s\n' "$(cat /ca/ca.crt)" > "$CA_OUT.new"
                chmod 0644 "$CA_OUT.new"

                # ⚠ The first line is the header k3s matches on to decide what it may delete.
                # It MUST NOT equal k3s's own "# File generated by k3s. DO NOT EDIT." line.
                cat > "$HOSTS_OUT.new" <<TOML
              # MANAGED BY image-registry/node-registries-config.yaml — do not hand-edit.
              # Read by containerd on EVERY pull; no k3s restart is needed for changes here.
              server = "https://$HOSTPORT"

              [host."https://$HOSTPORT"]
                capabilities = ["pull", "resolve"]
                ca = ["$CA_HOST"]
              TOML
                chmod 0644 "$HOSTS_OUT.new"

                changed=0
                if ! cmp -s "$CA_OUT.new" "$CA_OUT"; then mv "$CA_OUT.new" "$CA_OUT"; changed=1; else rm -f "$CA_OUT.new"; fi
                if ! cmp -s "$HOSTS_OUT.new" "$HOSTS_OUT"; then mv "$HOSTS_OUT.new" "$HOSTS_OUT"; changed=1; else rm -f "$HOSTS_OUT.new"; fi
                if [ "$changed" = "1" ]; then
                  echo "WROTE $HOST_DIR/hosts.toml and $CA_HOST for $HOSTPORT (live — no restart needed)."
                else
                  echo "already current: $HOST_DIR/hosts.toml"
                fi

                # Migration from the old registries.yaml route. Leaving it in place is not
                # merely untidy: on the next agent start k3s would regenerate — and first
                # RemoveAll() — the certs.d directory for every host it names, deleting the
                # config written above. Only ever remove OUR OWN file.
                if [ -f "$LEGACY_REG" ] && grep -q "MANAGED BY image-registry" "$LEGACY_REG"; then
                  rm -f "$LEGACY_REG" /host-k3s/image-registry-ca.crt
                  echo "removed superseded $LEGACY_REG (config now lives in certs.d)."
                fi
                return 0
              }

              install_files || true
              # ⚠ The CA is re-minted by cert-manager on every cluster recreate, so this
              # re-checks rather than running once and exiting: a stale CA on the node fails
              # every pull with x509 UnknownAuthority, which reads like a network fault.
              while :; do
                sleep 3600
                install_files || true
              done
          volumeMounts:
            - { name: host-certs-d, mountPath: /host-certs-d }
            - { name: host-k3s, mountPath: /host-k3s }
            - { name: ca, mountPath: /ca, readOnly: true }
      volumes:
        - name: host-certs-d
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
            type: DirectoryOrCreate
        # Only so the superseded registries.yaml can be cleaned up.
        - name: host-k3s
          hostPath:
            path: /etc/rancher/k3s
            type: DirectoryOrCreate
        - name: ca
          secret:
            secretName: image-registry-ca-tls
            items:
              - { key: ca.crt, path: ca.crt }
