# Wave 5 Sync barrier: waits until k3s-upgrade-plans is Synced+Healthy, then
# actively uncordons any remaining cordoned nodes before releasing wave 6.
#
# Active uncordon is required for single-node k3s: when k3s restarts during a
# SUC upgrade job the job pod is killed before it can uncordon, leaving the node
# permanently cordoned. This barrier recovers that state automatically.
# It is also safe when the plan version <= node version (no-op upgrade): plans
# become Healthy immediately, the uncordon is a no-op, wave 6 proceeds.
#
# Wave 4 is dedicated to the k3s upgrade sequence:
#   wave 2: system-upgrade-controller (provides Plan CRD)
#   wave 4: k3s-upgrade-plans (applies Plans → SUC upgrades, cordons)
#   wave 5: this barrier (plans healthy → uncordon all nodes → release wave 6)
#   wave 6: authentik (safe to start now that nodes are Ready)
#
# ClusterRole (not Role) required: node patch (uncordon) is cluster-scoped.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wave5-barrier
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave5-barrier
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create"]
- apiGroups: ["bitnami.com"]
  resources: ["sealedsecrets"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave5-barrier
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave5-barrier
subjects:
- kind: ServiceAccount
  name: wave5-barrier
  namespace: argocd-infra
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wave5-barrier
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 3600
  # NO ttlSecondsAfterFinished — deliberately. Cleanup is already covered by
  # hook-delete-policy: BeforeHookCreation (the next sync deletes this Job before
  # recreating it), so a TTL buys nothing and COSTS the post-mortem: it deletes the
  # pod, and with it the only copy of the logs.
  #
  # Alloy/Loki does not save you here — its pod discovery is a poll, so a short-lived
  # Job can finish and be deleted before it is ever scraped, leaving Loki with zero
  # lines for it. A failed hook Job is exactly what you most need logs for after a
  # recreate.
  template:
    spec:
      serviceAccountName: wave5-barrier
      restartPolicy: Never
      containers:
      - name: barrier
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        command: ["/bin/sh", "-ec"]
        args:
        - |
          echo "Wave-5 barrier: discovering applications with sync-wave=1..."

          APPS=$(kubectl get applications -n argocd-infra -o json | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for item in data['items']:
              ann = item.get('metadata', {}).get('annotations', {})
              wave = ann.get('argocd.argoproj.io/sync-wave', '')
              tracking = ann.get('argocd.argoproj.io/tracking-id', '')
              parent = tracking.split(':')[0] if tracking else ''
              if parent == 'argocd-infra-app-of-apps' and wave == '4':
                  print(item['metadata']['name'])
          ")

          echo "Waiting for: $(echo $APPS | tr '\n' ' ')"

          MARKER="wave5-barrier-done"
          # The marker short-circuits the WAIT, never the uncordon repair below.
          # An early `exit 0` here would make the uncordon one-shot, and that is not enough:
          # SUC re-cordons on EVERY retry of a failing upgrade job, so a re-cordon landing
          # after this barrier first passed would never be repaired. On a single-node CP that
          # wedges the whole cluster with no scheduling and no barrier left to run — e.g.
          # nodes ahead of the pinned Plan version: cordon, refuse downgrade, retry forever.
          # Skipping only the wait keeps re-syncs cheap while making the repair idempotent.
          BARRIER_PASSED=""
          if kubectl get configmap "$MARKER" -n argocd-infra >/dev/null 2>&1; then
            echo "Barrier already passed (ConfigMap $MARKER exists) — skipping the wait, still re-checking cordons."
            BARRIER_PASSED="1"
          fi

          i=0
          while [ -z "$BARRIER_PASSED" ] && [ "$i" -lt 360 ]; do
            PENDING=""
            for APP in $APPS; do
              SYNC=$(kubectl get application "$APP" -n argocd-infra \
                -o jsonpath="{.status.sync.status}" 2>/dev/null || true)
              HEALTH=$(kubectl get application "$APP" -n argocd-infra \
                -o jsonpath="{.status.health.status}" 2>/dev/null || true)
              PHASE=$(kubectl get application "$APP" -n argocd-infra \
                -o jsonpath="{.status.operationState.phase}" 2>/dev/null || true)
              # Backstop for an app that reports Degraded while owning no unhealthy
              # resource. The custom HTTPRoute health check
              # (argocd-infra-self/values.yaml) already keeps a route waiting on a
              # later wave out of Degraded, but that ConfigMap only takes effect once
              # argocd-infra-self has synced — until then ArgoCD's BUILT-IN check
              # degrades the parent app and would deadlock the bootstrap:
              # longhorn-config and kube-prometheus-stack (wave 2) carry OIDC routes
              # backed by authentik-server (wave 6), so they sat Degraded with 0 of
              # 17 resources unhealthy, this barrier never released, and wave 6 could
              # never run to create the Service that would have fixed them.
              #
              # So Degraded is tolerated ONLY when the app reports no unhealthy
              # resource of its own. A crashlooping pod or a failed job still sets a
              # resource-level status and still blocks — the barrier keeps catching
              # real breakage.
              TOLERATED=""
              # NB: Degraded only. Progressing is NOT tolerated — a Progressing app is
              # genuinely still coming up, and ArgoCD blocks its own sync on Progressing
              # resources anyway, so tolerating it here would race the sync.
              if [ "$HEALTH" = "Degraded" ]; then
                UNHEALTHY=$(kubectl get application "$APP" -n argocd-infra -o json 2>/dev/null | \
                  python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              print('unknown'); sys.exit(0)
          bad = [r for r in d.get('status', {}).get('resources', [])
                 if (r.get('health') or {}).get('status') not in (None, 'Healthy')]
          print(len(bad))
          " 2>/dev/null || echo unknown)
                if [ "$UNHEALTHY" = "0" ]; then
                  TOLERATED="yes"
                fi
              fi

              if [ "$SYNC" = "Synced" ] && \
                 { [ "$HEALTH" = "Healthy" ] || [ -n "$TOLERATED" ]; } && \
                 { [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "SyncOk" ] || [ -z "$PHASE" ]; }; then
                if [ -n "$TOLERATED" ]; then
                  echo "  ${APP}: Degraded but 0 unhealthy resources (unresolved ref to a later wave) — tolerated."
                fi
              else
                PENDING="${PENDING} ${APP}(sync=${SYNC},health=${HEALTH},phase=${PHASE})"
              fi
            done

            if [ -z "$PENDING" ]; then
              echo "All argocd-infra-app-of-apps wave-4 Applications are Synced+Healthy+NotProgressing."
              break
            fi

            echo "Attempt $i/360 — waiting for:${PENDING}"
            sleep 10
            i=$((i+1))
          done

          if [ -n "$PENDING" ]; then
            echo "ERROR: timed out waiting for:${PENDING}"
            exit 1
          fi

          PRE_CORDONED=$(kubectl get configmap cordoned-before-upgrade -n argocd-infra \
            -o jsonpath='{.data.nodes}' 2>/dev/null || true)
          echo "Nodes manually cordoned before upgrade: '${PRE_CORDONED}'"

          echo "Uncordoning nodes cordoned by the upgrade (skipping manually cordoned nodes)..."
          CORDONED_NODES=$(kubectl get nodes -o jsonpath='{range .items[?(@.spec.unschedulable==true)]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
          if [ -n "$CORDONED_NODES" ]; then
            for NODE in $CORDONED_NODES; do
              if echo " ${PRE_CORDONED} " | grep -qF " ${NODE} "; then
                echo "  Skipping ${NODE} — was manually cordoned before upgrade."
              else
                kubectl uncordon "$NODE" && echo "  Uncordoned ${NODE}." || echo "  WARNING: uncordon ${NODE} failed — continuing."
              fi
            done
          else
            echo "  No cordoned nodes — nothing to do."
          fi

          echo "Waiting for all nodes to be Ready..."
          NOT_READY="1"
          i=0
          while [ "$i" -lt 60 ]; do
            NOT_READY=$(kubectl get nodes --no-headers 2>/dev/null \
              | grep -v " Ready " | wc -l | tr -d ' ')
            if [ "$NOT_READY" = "0" ]; then
              echo "All nodes Ready."
              break
            fi
            echo "  not-ready=${NOT_READY}, waiting 10s... ($i/60)"
            sleep 10
            i=$((i+1))
          done

          if [ "$NOT_READY" != "0" ]; then
            echo "ERROR: nodes did not become Ready within 10 minutes"
            exit 1
          fi

          echo "Verifying all SealedSecrets have produced their Secrets..."
          SS_MISSING="pending"
          j=0
          while [ "$j" -lt 30 ]; do
            SS_MISSING=""
            SEALED_LIST=$(kubectl get sealedsecrets --all-namespaces --no-headers 2>/dev/null \
              | awk '{print $1 "/" $2}' || true)
            for PAIR in $SEALED_LIST; do
              SS_NS="${PAIR%%/*}"
              SS_NAME="${PAIR##*/}"
              if ! kubectl get secret "$SS_NAME" -n "$SS_NS" >/dev/null 2>&1; then
                echo "  Missing: $SS_NS/$SS_NAME — deleting SealedSecret to force re-reconciliation."
                kubectl delete sealedsecret "$SS_NAME" -n "$SS_NS" --ignore-not-found || true
                SS_MISSING="${SS_MISSING} ${SS_NS}/${SS_NAME}"
              fi
            done
            if [ -z "$SS_MISSING" ]; then
              echo "All SealedSecrets have produced their Secrets."
              break
            fi
            echo "Attempt $j/30 — waiting for:${SS_MISSING}"
            sleep 10
            j=$((j+1))
          done

          if [ -n "$SS_MISSING" ]; then
            echo "ERROR: timed out — Secrets still missing:${SS_MISSING}"
            exit 1
          fi

          kubectl create configmap "$MARKER" -n argocd-infra \
            --from-literal=status=done \
            --from-literal=timestamp="$(date -Iseconds)" \
            2>/dev/null || true
          echo "All checks passed — releasing wave 6."
