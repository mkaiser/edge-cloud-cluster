# ArgoCD Application: headplane (moved from wave 14).
# Admin GUI for Headscale, accessible at https://headplane.subdomain.domain.tld/admin/
# Depends on headplane-secrets (api-key key) being seeded by the headscale App's PostSync job.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headplane
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  info:
    - name: Admin
      value: https://headplane.subdomain1.your-domain.tld/admin/ # automatically updated from project-settings:{general.subdomain,general.domain}
  sources:
    - repoURL: git@github.com:YourProject/yourGit.git
      targetRevision: main
      path: deployment/argocd-infra/headplane

  destination:
    server: https://kubernetes.default.svc
    namespace: headscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # Gateway API server-defaults (backendRefs group/kind/weight, parentRefs
      # group/kind) are API-owned; under ServerSideApply ArgoCD reads them as
      # permanent drift and the app never leaves OutOfSync.
      jqPathExpressions:
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
    - group: ""
      kind: PersistentVolumeClaim
      name: headplane-data
      namespace: headscale
      jsonPointers:
        - /spec/storageClassName
