# ArgoCD Application: sealed-secrets-guard
# Self-heal CronJob that restarts the sealed-secrets controller if any SealedSecret
# is missing its target Secret (the controller can poison itself when the k3s API
# flaps during boot). Wave 0 so the guard is running before the first SealedSecret
# (authentik-secrets, wave 6) needs unsealing. See guard.yaml for the full rationale.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-guard
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@github.com:YourProject/yourGit.git
    targetRevision: main
    path: deployment/argocd-infra/sealed-secrets-guard
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
