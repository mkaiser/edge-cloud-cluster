apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notify
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "19"
spec:
  project: default
  source:
    repoURL: git@github.com:YourProject/yourGit.git
    targetRevision: main
    path: deployment/argocd-infra/notify
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
