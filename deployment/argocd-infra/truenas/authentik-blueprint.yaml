# Authentik blueprint: TrueNAS admin UI behind a forward-auth proxy, admin-only.
#
# SHAPE: a proxy provider (mode: proxy) + application + admin-only policy binding, exactly
# like the Longhorn entry in argocd-infra/authentik/blueprint-apps.yaml. The difference is
# WHERE the outpost runs, and that difference is the whole reason this is its own file.
#
# ⚠ THIS CANNOT USE THE EMBEDDED OUTPOST, AND THAT IS NOT A PREFERENCE.
# Longhorn/Prometheus point `internal_host` at a cluster Service, so the embedded outpost
# (an authentik-server pod, in the cloud) reaches them over the pod network. TrueNAS is at
# 192.168.1.237 on the lab LAN, and CLOUD PODS CANNOT ROUTE THERE: the subnet route for
# 192.168.1.0/24 IS approved and serving, but the cloud CP never installs it — that needs
# `--accept-routes`, deliberately off because it is all-or-nothing and would also install
# 10.0.0.0/23, collapsing etcd quorum once the CP set grows past one. An embedded-outpost provider
# would deploy cleanly, report healthy, and 502 on every request.
#
# So this declares a DEDICATED, NON-EMBEDDED outpost pinned to a lab node, which reaches
# both the appliance and the on-prem DC by their literal LAN addresses — one switch hop, no
# overlay. It is now the only non-embedded outpost (the LDAP one was retired), so this file
# owns the kubernetesserviceconnection it uses.
#
# ⚠ NODE PINNING GOES THROUGH kubernetes_json_patches, BECAUSE THERE IS NO nodeSelector
# FIELD. The outpost config dataclass has no nodeSelector/tolerations (verified in
# external/git_goauthentik_authentik authentik/outposts/models.py:72-84 — the only knobs are
# replicas/namespace/ingress/service/image-pull-secrets/json-patches). Authentik's OWN
# integration test (tests/integration/test_outpost_kubernetes.py) uses
# kubernetes_json_patches keyed by reconciler name to patch the generated Deployment, and
# `deployment` is the reconciler name (controllers/k8s/deployment.py:52-53). That is the
# supported escape hatch, not a hack.
#
# ⚠ THE MESH TOLERATION IS MANDATORY. Mesh nodes are tainted ecc/mesh=true:NoSchedule, so an
# outpost pod without it stays Pending FOREVER rather than failing — the worst diagnostic
# outcome, because the provider looks configured and nothing reports an error.
#
# ⚠ SELECTED BY ecc/fileserver-lan, AND THAT WAS MEASURED, NOT ASSUMED.
# This is a LAN-membership label, derived from storage.fileserver.site — the one place the
# appliance's location is declared. It replaced an ecc/site selector that was coarser than
# "can reach 192.168.1.0/24": a node at another site could carry the site label while sitting
# on a DIFFERENT LAN, leaving the scheduler free to place the outpost somewhere every request
# 502s from — a pod Running 1/1 and completely useless, the exact silent failure a
# non-embedded outpost exists to avoid.
#
# A node whose live labels lag project_settings stays in this selector while being unable to
# reach the appliance; fix that at the SOURCE (correct `site`, re-run the mesh label pass)
# rather than working around it here ([[node-labels-lag-project-settings]]).
#
# ecc/fileserver-lan selects the appliance-LAN nodes; the GPU node among them is excluded for
# free, because it carries a SECOND taint (ecc/gpu=true:NoSchedule) that the toleration below
# deliberately does not match. Net effect: interchangeable nodes, all of them on the
# appliance's LAN by construction, and no coupling to one machine's availability — which is
# what a hostname pin costs.
#
# The AD DCs select on a capability label the same way (ecc/ad-dc, statefulset-onprem.yaml),
# with one difference: they carry a REQUIRED podAntiAffinity on hostname, because each one is
# hostNetwork and wants the real AD ports on its node. This outpost has no such constraint —
# it only needs to be SOMEWHERE on that LAN.
#
# ⚠ DO NOT pin a DC to one node by hostname, here or in statefulset-onprem.yaml. One DC means
# every SMB/NFS login at the site rides on one box, and it arms the FAULTED repair path in
# truenas/configure-job.yaml, which leaves the domain and deletes FS-1$ — that fired unattended
# on 2026-08-31. The appliance takes every on-prem DC's LAN address as a nameserver, so no
# single one is load-bearing.
#
# ⚠ ADMIN-ONLY, CONFIRMED BY THE USER. Normal users never log into TrueNAS — they touch it
# only over SMB/NFS, where the credential is their AD account. Same reasoning as the Longhorn
# binding ("no read-only mode -> admins only").
#
# ⚠ EXPECT A DOUBLE LOGIN, DELIBERATELY. The outpost authenticates the BROWSER; the admin
# then logs into TrueNAS itself. TrueNAS-side OIDC is deliberately NOT configured: it would
# make the appliance UI depend on Authentik being up, which is precisely wrong on the day you
# are debugging a broken AD join or a down cluster.
#
# ⚠ DO NOT ROUTE THE API THROUGH THIS. The provisioning talks wss:// straight to the LAN IP.
# A browser-oriented forward-auth proxy in front of a websocket API is a source of confusing
# failures.
#
# Mounted OPTIONALLY into the authentik worker (values.yaml worker.volumes, optional: true),
# the same way the GitLab blueprint is: the worker boots at wave 6, long before this app
# exists, and an absent ConfigMap must not stop it.
#
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-truenas
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  truenas.yaml: |
    version: 1
    metadata:
      name: truenas-proxy
    entries:
      # ---- proxy provider ----
      - id: provider-truenas
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: truenas
        attrs:
          mode: proxy
          external_host: https://truenas.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
          # The appliance's AD FQDN. Safe here — and ONLY here — because the outpost is
          # pinned to a node on the appliance's own LAN (see the header), where this name
          # resolves to the LAN address 192.168.1.237 and the request is one switch hop.
          # Verified 2026-09-07 from the outpost pod: `getent hosts` → 192.168.1.237.
          # ⚠ Do NOT copy this to a consumer that can run in the cloud. The AD zone
          # publishes the on-prem DC's MESH address, so off-LAN a name would drag the
          # traffic over the overlay — which is why storage.fileserver.endpoint is a literal
          # and every automated path uses it.
          # https:// because the appliance serves TLS; the cert is self-signed from its own
          # CA, hence the validation opt-out below.
          internal_host: https://fs-1.ad.base.internal # automatically updated from project-settings:storage.fileserver.fqdn
          # The appliance presents a self-signed cert from its own internal CA. Acceptable
          # ONLY because this hop is a single switch hop on the lab LAN — it never crosses
          # the university network.
          internal_host_ssl_validation: false
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      # ---- application tile ----
      - model: authentik_core.application
        identifiers:
          slug: truenas
        attrs:
          name: TrueNAS
          group: Infrastructure
          provider: !KeyOf provider-truenas
          meta_launch_url: https://truenas.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
          meta_description: >-
            File server (fs-1). Admin UI only — users reach their files over SMB/NFS with
            their AD account, not through this page.

      # ---- admin-only access ----
      # !Find, NOT !KeyOf: the policy is defined in argocd-infra/authentik/blueprint-apps.yaml
      # (id: policy-access-admin-only), a DIFFERENT blueprint. A !KeyOf can only resolve ids
      # within the same document, so it would fail to load here.
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, truenas]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, access-admin-only]]
        attrs:
          order: 0
          enabled: true

      # ---- dedicated outpost, pinned to the lab site ----
      # Declared here with its natural identifiers so this blueprint loads standalone and in
      # any order — a blueprint must not depend on another having been applied first. Keep it
      # that way: a shared declaration ties this outpost's lifetime to another blueprint's.
      - id: sc-local-kubernetes
        model: authentik_outposts.kubernetesserviceconnection
        identifiers:
          name: local-kubernetes
        attrs:
          local: true
          kubeconfig: {}
          verify_ssl: true
      - model: authentik_outposts.outpost
        identifiers:
          name: truenas
        attrs:
          type: proxy
          service_connection: !KeyOf sc-local-kubernetes
          providers:
            - !KeyOf provider-truenas
          config:
            # ⚠ TWO HOSTS, AND BOTH ARE REQUIRED. `authentik_host` is the outpost's
            # SERVER-SIDE channel (websocket + API), so the in-cluster Service is right: it
            # keeps that traffic off the public Gateway. `authentik_host_browser` is what the
            # outpost puts in the 302 it sends the USER'S BROWSER to start the auth flow.
            # Omitting it does NOT fall back to a public URL — authentik reuses
            # `authentik_host`, so the browser is redirected to
            # `http://authentik-server.authentik.svc.cluster.local/application/o/authorize/…`
            # and fails with DNS_PROBE_FINISHED_NXDOMAIN. Nothing logs an error: the outpost
            # reports healthy, /metrics is 200, the backend is reachable, and the 302 looks
            # normal in the outpost's own access log. Measured 2026-09-07 on ecc204.
            # The embedded outpost (argocd-infra/authentik/blueprint-apps.yaml) sets both to
            # the public host and so never hit this.
            authentik_host: http://authentik-server.authentik.svc.cluster.local
            authentik_host_browser: https://id.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            # Deployment/Service/HTTPRoute are created in the AUTHENTIK namespace (the
            # outpost controller's own namespace). The route therefore backs onto a
            # namespace-LOCAL Service (ak-outpost-truenas) and needs NO ReferenceGrant —
            # unlike the embedded-outpost consumers in referencegrants/, which cross into
            # `authentik` to reach authentik-server.
            kubernetes_namespace: authentik
            # ---- let the outpost controller own its own HTTPRoute ----
            # Setting parentRefs is what ENABLES the route: the HTTPRoute reconciler is a
            # no-op while this list is empty (providers/proxy/controllers/k8s/httproute.py:98-105
            # — `if not ...kubernetes_httproute_parent_refs: return True`). With it set, the
            # controller derives the hostname from external_host above and keeps the route in
            # sync, so there is no hand-written HTTPRoute here to drift out of step with the
            # provider. Field names are the Gateway API's, taken from the RouteSpecParentRefs
            # dataclass (same file, lines 25-31): name / namespace / sectionName / kind / group.
            kubernetes_httproute_parent_refs:
              - name: main
                namespace: argocd-infra
                sectionName: https-wildcard
            # ⚠ MUST disable the Ingress reconciler. Unlike the HTTPRoute one it has NO noop
            # guard (providers/proxy/controllers/k8s/ingress.py — there is no `def noop`), so
            # it would create an Ingress alongside the HTTPRoute for the same hostname. This
            # cluster routes exclusively through Gateway API; a stray Ingress is at best inert
            # and at worst a second claimant on the host.
            kubernetes_disabled_components:
              - ingress
            # See the header: no nodeSelector/tolerations field exists, so the generated
            # Deployment is patched. Both ops are `add`; on a Deployment spec neither path
            # pre-exists, and `add` on an absent object key creates it.
            #
            # ⚠ CHANGING A PATCH VALUE DOES NOT FULLY TAKE ON A LIVE OUTPOST. The controller
            # rebuilds the reference object and applies the patch to it (base.py:96-120), so
            # the DESIRED state is correct — but it pushes the result with
            # `patch_namespaced_deployment` (deployment.py:192-193), a MERGE patch, and a
            # merge patch cannot DELETE a map key. Changing this selector therefore leaves the
            # OLD key in place alongside the new one, e.g.
            #     {"ecc/fileserver-lan":"true","kubernetes.io/hostname":"<a node>"}
            # which still schedules correctly only while that node carries both labels — a
            # stale constraint that silently over-restricts a later move.
            # Fix: delete the Deployment and let the controller recreate it
            # (`kubectl delete deploy ak-outpost-truenas -n authentik`). It is rebuilt from
            # the patched reference, i.e. clean. Recreation waits for the outpost
            # reconcile interval (refresh_interval, default 5 min) — force it immediately with
            #   ak shell -c "from authentik.outposts.models import Outpost; \
            #     from authentik.outposts.tasks import outpost_controller; \
            #     outpost_controller.send(str(Outpost.objects.get(name='truenas').pk))"
            kubernetes_json_patches:
              deployment:
                - op: add
                  path: /spec/template/spec/nodeSelector
                  value:
                    # ecc/fileserver-lan states LAN membership rather than approximating it
                    # with a site name — a node at another site could carry the site label
                    # while sitting on a different LAN, unreachable from 192.168.1.0/24, which
                    # is what would force a single-hostname pin. Keep the live labels in step
                    # with project_settings — stale labels are the lag in
                    # [[node-labels-lag-project-settings]].
                    #
                    # It selects the appliance-LAN nodes, all of which reach
                    # 192.168.1.237:443. The GPU node among them carries a SECOND taint
                    # (ecc/gpu=true:NoSchedule) that the toleration below does not match, so
                    # it is excluded automatically — the GPU node repels non-GPU work by
                    # design. Net effect: this schedules only on nodes that reach the
                    # appliance, with no single-node coupling.
                    ecc/fileserver-lan: "true"  # automatically updated from project-settings:applicationPlacements.labels.fileserverLan
                - op: add
                  path: /spec/template/spec/tolerations
                  value:
                    - key: ecc/mesh  # automatically updated from project-settings:applicationPlacements.labels.mesh
                      operator: Equal
                      value: "true"
                      effect: NoSchedule
