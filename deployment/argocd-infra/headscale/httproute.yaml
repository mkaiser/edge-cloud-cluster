# Hand-written HTTPRoute: the wrenix headscale chart has no Gateway API support
# — only an Ingress template — so its ingress is disabled in the Application
# (app-of-apps/wave8-headscale.yaml) and the route lives here instead.
#
# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway);
# the HTTP→HTTPS redirect is handled once by argocd-infra/gateway.
#
# Backend: headscale.fullname collapses to `headscale` (release name contains the
# chart name), service.port.http = 8080. The chart's Ingress used the NAMED port
# "http"; Gateway API backendRefs take a numeric port only.
#
# NB: this covers only the HTTP control plane on vpn.<tld>. DERP/STUN stays on
# its own NodePort service (headscale/derp-stun-service.yaml) and deliberately
# bypasses the ingress path entirely to preserve source IPs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale
  namespace: headscale
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - vpn.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Headscale clients hold long-poll connections open — replaces the former
      # timeout-server/timeout-client: 3600s annotations.
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: headscale
          port: 8080
