# Bootstrap Job: generate and store headscale cryptographic keys on fresh cluster installs.
#
# Root cause of fresh-cluster failure: the chart's pre-install hook (headscale-keys)
# mounts the headscale Secret as a config volume at /etc/headscale. On fresh install
# this Secret doesn't exist yet (it's a Sync-phase chart resource), so the hook pod
# gets stuck at ContainerCreating, blocking the entire sync.
#
# Fix: this Job (PreSync wave -1) pre-creates the headscale-keys Secret with generated
# keys AND pre-creates an empty headscale Secret so the hook can mount it. The hook's
# upload-key container then exits immediately (wireguard.key already set). The chart's
# Sync phase overwrites the empty headscale Secret with the real rendered config.
#
# This Job is idempotent — skips key generation if headscale-keys already has wireguard.key.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-keys-bootstrap
  namespace: headscale
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-keys-bootstrap
  namespace: headscale
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-keys-bootstrap
  namespace: headscale
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headscale-keys-bootstrap
subjects:
- kind: ServiceAccount
  name: headscale-keys-bootstrap
  namespace: headscale
---
apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-keys-bootstrap
  namespace: headscale
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: headscale-keys-bootstrap
      restartPolicy: Never
      initContainers:
      - name: generate-keys
        # ⚠ KEEP THE `-debug` SUFFIX: the command below is `sh`, and upstream's release
        # image is distroless (no shell). See wave8-headscale.yaml for the full rationale.
        image: ghcr.io/juanfont/headscale:v0.29.3-debug  # renovate: tracked by "Container image tags" regex (docker datasource)
        command:
        - sh
        - -c
        - |
          set -e
          headscale generate private-key --output json > /tmp/keys/wireguard.json
          headscale generate private-key --output json > /tmp/keys/noise.json
          headscale generate private-key --output json > /tmp/keys/derp.json
          echo "Keys generated."
        volumeMounts:
        - name: keys
          mountPath: /tmp/keys
      containers:
      - name: store-keys
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        command:
        - sh
        - -c
        - |
          set -e
          NS=headscale
          SECRET=headscale-keys

          # --- Pre-create headscale secret (empty) so the chart's pre-install hook can mount it ---
          # Always runs — even when keys already exist — because headscale secret may be absent.
          # The hook mounts headscale secret at /etc/headscale (just needs it to exist).
          # upload-key exits immediately because headscale-keys.wireguard.key is already set.
          # The chart's sync phase then overwrites this empty secret with the real config.
          HS_SECRET=headscale
          if kubectl get secret $HS_SECRET -n $NS >/dev/null 2>&1; then
            echo "headscale secret already exists - skipping pre-create."
          else
            echo "Pre-creating headscale secret with placeholder config.yaml for hook mount..."
            CONFIG_B64=$(printf '# placeholder\n' | base64 -w0)
            {
              echo "apiVersion: v1"
              echo "kind: Secret"
              echo "metadata:"
              echo "  name: $HS_SECRET"
              echo "  namespace: $NS"
              echo "type: Opaque"
              echo "data:"
              echo "  config.yaml: $CONFIG_B64"
            } | kubectl apply -f -
            echo "headscale secret pre-created."
          fi

          # Idempotency: skip key generation if wireguard.key already set
          if kubectl get secret $SECRET -n $NS \
              -o jsonpath='{.data.wireguard\.key}' 2>/dev/null | grep -q .; then
            echo "Keys already exist in $SECRET - skipping."
            exit 0
          fi

          echo "Storing headscale keys in $SECRET..."

          # wireguard.key = raw hex key (strip "privkey:" prefix) — headscale expects raw hex
          WIREGUARD_KEY=$(jq -r '.private_key | split(":")[1]' /tmp/keys/wireguard.json)
          # noise.key keeps "privkey:<hex>" prefix — headscale v0.28 tailscale key library requires it
          # The Wrenix chart hook strips the prefix (designed for older headscale), so our bootstrap
          # must run first and the hook must detect the key already exists and exit without overwriting.
          NOISE_KEY=$(jq -r '.private_key' /tmp/keys/noise.json)
          DERP_KEY=$(jq -r '.private_key' /tmp/keys/derp.json)

          # Build base64-encoded values
          WG_B64=$(printf '%s' "$WIREGUARD_KEY" | base64 -w0)
          NOISE_B64=$(printf '%s' "$NOISE_KEY" | base64 -w0)
          DERP_B64=$(printf '%s' "$DERP_KEY" | base64 -w0)

          # Use kubectl create (not apply) so last-applied-configuration is NOT set with key data.
          # If we used kubectl apply here, ArgoCD's later sync of the chart's empty headscale-keys
          # Secret would three-way-merge against our last-applied and REMOVE our keys.
          # With kubectl create, there is no last-applied-configuration; ArgoCD then applies the
          # chart's empty Secret (setting last-applied=empty), and our patched keys survive all
          # subsequent syncs because strategic merge has nothing to remove.
          if ! kubectl get secret $SECRET -n $NS >/dev/null 2>&1; then
            kubectl create secret generic $SECRET -n $NS
          fi
          kubectl patch secret $SECRET -n $NS -p \
            "{\"data\":{\"wireguard.key\":\"$WG_B64\",\"noise.key\":\"$NOISE_B64\",\"derp.key\":\"$DERP_B64\"}}"

          echo "headscale-keys created successfully."

          # --- Seed headplane-secrets with cookie-secret so headplane can start before PostSync ---
          HP_SECRET=headplane-secrets
          if kubectl get secret $HP_SECRET -n $NS \
              -o jsonpath='{.data.cookie-secret}' 2>/dev/null | grep -q .; then
            echo "headplane-secrets cookie-secret already exists - skipping."
          else
            echo "Seeding headplane-secrets with cookie-secret..."
            COOKIE=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 32)
            COOKIE_B64=$(printf '%s' "$COOKIE" | base64 -w0)
            {
              echo "apiVersion: v1"
              echo "kind: Secret"
              echo "metadata:"
              echo "  name: $HP_SECRET"
              echo "  namespace: $NS"
              echo "  annotations:"
              echo "    argocd.argoproj.io/sync-options: Delete=false"
              echo "type: Opaque"
              echo "data:"
              echo "  cookie-secret: $COOKIE_B64"
            } | kubectl apply -f -
            echo "headplane-secrets cookie-secret seeded."
          fi

          # --- Seed the approval-notifier signing key ---
          # HMAC key for the approve/reject links in approval-notifier.yaml. Generated here
          # rather than sealed: it is a pure random secret with no value outside this cluster,
          # and a recreate SHOULD mint a fresh one — that invalidates every link from the
          # previous cluster, which is the desired behaviour for a bearer credential.
          # Delete=false keeps it across syncs so live links do not break on every reconcile.
          AN_SECRET=headscale-approval-notifier
          if kubectl get secret $AN_SECRET -n $NS \
              -o jsonpath='{.data.signing-key}' 2>/dev/null | grep -q .; then
            echo "approval-notifier signing-key already exists - skipping."
          else
            echo "Seeding approval-notifier signing-key..."
            SIGN_B64=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 48 | base64 -w0)
            {
              echo "apiVersion: v1"
              echo "kind: Secret"
              echo "metadata:"
              echo "  name: $AN_SECRET"
              echo "  namespace: $NS"
              echo "  annotations:"
              echo "    argocd.argoproj.io/sync-options: Delete=false"
              echo "type: Opaque"
              echo "data:"
              echo "  signing-key: $SIGN_B64"
            } | kubectl apply -f -
            echo "approval-notifier signing-key seeded."
          fi
        volumeMounts:
        - name: keys
          mountPath: /tmp/keys
          readOnly: true
      volumes:
      - name: keys
        emptyDir: {}
