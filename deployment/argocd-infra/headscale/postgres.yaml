# CloudNativePG cluster for Headscale.
# - Live data stored on longhorn
# - WAL archiving + scheduled base backups go to Hetzner S3
#   (cadence: the ScheduledBackup spec.schedule below)
# - Bootstrap: always initdb (fresh database on every new cluster)
#   For manual restore from S3, patch cluster bootstrap to use recovery mode.
#
# Image versions: https://github.com/cloudnative-pg/postgres-containers/releases
#
# DO NOT EDIT postgres.yaml directly — generated by sealSecrets.sh from this template.
---
# CNPG Cluster — sealed secrets at sync-wave -1 ensure headscale-pg-user and
# headscale-s3-secret exist before CNPG reconciles the Cluster at wave 0.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: headscale-pg
  namespace: headscale
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  priorityClassName: essential
  instances: 1 # automatically updated from project-settings:{highAvailability.enabled,highAvailability.replicas.headscalePg}
  # Spread instances across nodes when HA. enablePodAntiAffinity is flipped by
  # updateConfigFromProjectSettings.sh from general.highAvailability; preferred (soft)
  # so a single-node/HA-off cluster never wedges the extra instance Pending.
  affinity:
    enablePodAntiAffinity: false # automatically updated from project-settings:highAvailability.enabled
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  # Check https://github.com/cloudnative-pg/postgres-containers/releases for newer versions
  imageName: ghcr.io/cloudnative-pg/postgresql:18 # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql

  # Metrics for this Cluster. CNPG's instances always expose the exporter on :9187; this flag
  # is what makes CNPG create the PodMonitor that gets it scraped. Without it the databases
  # behind every app were entirely unmonitored — measured 2026-09-03: 7 live Clusters, 0
  # PodMonitors, so a DB could be unreachable, failing to archive WAL, or missing every base
  # backup with nothing to notice. Alert rules on these series live in the `cnpg` group in
  # argocd-infra/prometheus/kube-prometheus-stack/prometheus.yaml.
  monitoring:
    enablePodMonitor: true

  storage:
    storageClass: longhorn-cloud-db
    size: 4Gi

  bootstrap:
    initdb:
      database: headscale
      owner: headscale
      secret:
        name: headscale-pg-user

  backup:
    barmanObjectStore:
      destinationPath: "s3://edgecloudinfra-headscale/headscale-pg" # automatically updated from project-settings:{general.name,storage.objectStorage.buckets}
      endpointURL: "https://nbg1.your-objectstorage.com" # automatically updated from project-settings:storage.objectStorage.baseEndpoint
      s3Credentials:
        accessKeyId:
          name: headscale-s3-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: headscale-s3-secret
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"

---
# Scheduled base backup daily (WAL archiving provides PITR between base backups)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: headscale-pg-backup
  namespace: headscale
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 0 2 * * *"
  # Take a base backup as soon as this resource is CREATED, not only at the next scheduled
  # hour. ⚠ At creation — adding this field to a ScheduledBackup that already exists does
  # NOT retrofit one (verified 2026-09-03: the flag went live on all 8 clusters and no Backup
  # object appeared), so it protects every future cluster and not the one you are looking at.
  # For an existing cluster, create a Backup resource by hand.
  # WAL archiving alone cannot restore anything — PITR replays WAL ON TOP of a base backup —
  # so between cluster creation and the first scheduled run there is no recoverable copy at
  # all. Measured 2026-09-03: this cluster was 2.5 h old with 7 ScheduledBackups, ZERO Backup
  # objects and cnpg_collector_last_available_backup_timestamp at 0; the daily 02:00 schedule
  # left a ~10 h hole, and at a ~3-day recreate cadence every recreate reopens it.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: headscale-pg
