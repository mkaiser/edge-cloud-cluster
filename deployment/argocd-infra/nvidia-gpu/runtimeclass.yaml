# RuntimeClass `nvidia` — maps pods that set `runtimeClassName: nvidia` onto the containerd
# `nvidia` runtime handler that k3s templates into its config when the nvidia-container-toolkit
# is present on the host (see src/provisioning-scripts/20-install-gpu.sh). Cluster-scoped and
# node-independent: applies instantly, needs no GPU node to be Healthy.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
  annotations:
    argocd.argoproj.io/sync-wave: "2"
handler: nvidia
