# Sealed-secrets self-heal guard.
#
# WHY: on a single control-plane node the k3s API / kube-vip VIP can flap for a
# few seconds during boot. If the sealed-secrets controller is mid-reconcile of a
# SealedSecret at that moment it gets "connection refused", fails to write the
# unsealed Secret, and then — because the SealedSecret spec never changes again —
# logs "update suppressed, no changes in spec" and NEVER retries. The target
# Secret stays missing forever, the consuming pods sit in CreateContainerConfigError,
# and the whole app-of-apps stalls at that wave. A manual controller restart fixes
# it (a restart forces a full re-reconcile), so this CronJob does that automatically.
#
# WHAT: every 2 minutes, list all SealedSecrets cluster-wide and check each has its
# target Secret. If any is missing AND the controller is currently available (i.e.
# not already mid-restart), rollout-restart the controller. Self-heals any future
# flap too, not just the boot window. No-op once every SealedSecret has its Secret.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-guard
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Cluster-wide READ: see every SealedSecret and check for its target Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-guard-read
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: ["bitnami.com"]
  resources: ["sealedsecrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-guard-read
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets-guard-read
subjects:
- kind: ServiceAccount
  name: sealed-secrets-guard
  namespace: kube-system
---
# Namespaced WRITE: only allowed to read+restart the controller Deployment itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sealed-secrets-guard-restart
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["sealed-secrets-controller"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-guard-restart
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sealed-secrets-guard-restart
subjects:
- kind: ServiceAccount
  name: sealed-secrets-guard
  namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sealed-secrets-guard
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: "*/2 * * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 300
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: sealed-secrets-guard
          restartPolicy: Never
          containers:
          - name: guard
            image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 64Mi }
            command: ["/bin/sh", "-ec"]
            args:
            - |
              CTRL=sealed-secrets-controller
              NS=kube-system

              # For each SealedSecret, the produced Secret carries the same name
              # (spec.template.metadata.name, which defaults to the SealedSecret
              # name). Flag any whose target Secret is absent.
              missing=0
              while IFS='|' read -r ns name; do
                [ -z "$name" ] && continue
                if ! kubectl get secret "$name" -n "$ns" >/dev/null 2>&1; then
                  echo "MISSING target Secret: $ns/$name"
                  missing=1
                fi
              done <<EOF
              $(kubectl get sealedsecrets -A -o json \
                | jq -r '.items[] | "\(.metadata.namespace)|\(.spec.template.metadata.name // .metadata.name)"')
              EOF

              if [ "$missing" = "0" ]; then
                echo "OK: every SealedSecret has its target Secret."
                exit 0
              fi

              # Don't kick a controller that is itself still starting/restarting —
              # that would just thrash. Only restart one that is currently available
              # yet still hasn't produced the missing Secret (the poisoned state).
              avail=$(kubectl get deploy "$CTRL" -n "$NS" -o jsonpath='{.status.availableReplicas}' 2>/dev/null)
              if [ "${avail:-0}" -lt 1 ]; then
                echo "Controller not available yet (availableReplicas=${avail:-0}) — skip, will recheck next run."
                exit 0
              fi

              echo "Restarting $CTRL to force a full re-reconcile of SealedSecrets."
              kubectl rollout restart deploy/"$CTRL" -n "$NS"
