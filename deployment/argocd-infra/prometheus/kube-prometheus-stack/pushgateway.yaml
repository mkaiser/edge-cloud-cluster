# Prometheus Pushgateway — sink for the mesh active-probe CronJobs (tailscale
# ping RTT, iperf3 throughput). Those are periodic batch jobs, not continuously
# scrapable targets, so they PUSH their metrics here and Prometheus scrapes the
# gateway. kube-prometheus-stack does not bundle a pushgateway, so it is its own
# small ArgoCD Application deploying the community chart into the `prometheus`
# namespace (alongside the stack). Scraped via the "pushgateway" entry in
# prometheus.yaml additionalServiceMonitors.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-pushgateway
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: "3.8.0" # renovate: datasource=helm depName=prometheus-pushgateway registryUrl=https://prometheus-community.github.io/helm-charts
    helm:
      values: |
        # honor_labels so the pushed job/instance labels (peer, site) survive
        # scraping instead of being overwritten by the gateway's own target labels.
        extraArgs:
          - --web.enable-admin-api
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        resources:
          requests:
            cpu: "5m"
            memory: "24Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
