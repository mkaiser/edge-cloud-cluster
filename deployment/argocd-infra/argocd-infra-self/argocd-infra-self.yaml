# Self-managed INFRA ArgoCD Application.
# After the initial Pulumi bootstrap, the infra ArgoCD reconciles its own Helm release.
#   deployment/argocd-infra/argocd-infra-self/values.yaml — ArgoCD core config (server, controller, redis)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-infra-self
  namespace: argocd-infra
  annotations:
    # ArgoCD manages itself — pause automated sync briefly on upgrades to avoid
    # a mid-upgrade self-termination. Operator should manually sync for version bumps.
    argocd.argoproj.io/refresh-interval: "5m"
spec:
  project: default
  sources:
    - repoURL: git@github.com:YourProject/yourGit.git
      targetRevision: main
      ref: values
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "10.9.1" # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
      helm:
        releaseName: argocd
        valueFiles:
          - $values/deployment/argocd-infra/argocd-infra-self/values.yaml
    # Plain manifests: OIDC sealed secret
    - repoURL: git@github.com:YourProject/yourGit.git
      targetRevision: main
      path: deployment/argocd-infra/argocd-infra-self
      directory:
        exclude: '{values.yaml,argocd-infra-self.yaml,wildcard-certs.yaml,pvc.yaml,*.template,*.sh}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-infra
  # The chart renders parentRefs without group/kind; the API server defaults them to
  # gateway.networking.k8s.io/Gateway. That is a permanent, purely cosmetic OutOfSync
  # (backendRefs already carry both, so only parentRefs drifts).
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: argocd-server
      namespace: argocd-infra
      jsonPointers:
        - /spec/parentRefs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
