# Authentik blueprint: Samba AD provisioner service account (config-as-code).
#
# The identity the samba-ad provisioning Job authenticates as when it reads Authentik users
# and drives the LDAPSource sync. Deliberately its OWN account, not either existing option:
#
#   - NOT the superuser bootstrap token (AUTHENTIK_BOOTSTRAP_TOKEN). That token can do
#     anything; this Job only needs to read a user list and trigger a sync.
#   - NOT the shared OIDC provisioner token (blueprint-provisioner.yaml). That token is
#     handed to EVERY per-app OIDC job, and its own header states it deliberately excludes
#     the identity surface ("NO access to user/flow/secret WRITE, so a compromised app job
#     cannot touch the IdP's identity surface"). Widening it to satisfy this Job would hand
#     user access to every app that holds it — the exact property it exists to prevent.
#
# Cost of a third token: one more value to seal and rotate. Accepted for the isolation.
#
# PERMISSIONS — READ-ONLY on the identity surface. The Job creates accounts in SAMBA, not in
# Authentik, so it never needs to write a user here. It needs:
#   - view_user  : read the users to provision (username, pk → uidNumber, email, name)
#   - view_group : resolve the group that selects who gets provisioned
#   - view/change_ldapsource : trigger the inbound sync that stamps `distinguishedName` on
#     each user. That stamp is load-bearing — Authentik's password write-back silently
#     no-ops on any user lacking it (sources/ldap/password.py: `should_check_user` returns
#     False and logs at INFO), so the Job must be able to run the sync and then assert the
#     attribute landed.
#
# All codenames verified against the LIVE instance (2026.5.5), not assumed:
#   Permission.objects.filter(codename=..., content_type__app_label=...)
# Re-verify on a version bump with:
#   GET /api/v3/rbac/permissions/?search=ldapsource
#
# The token's plaintext comes from AD_PROVISIONER_TOKEN in the authentik-secrets bundle
# (generated by authentik/sealSecrets.sh, injected via global.envFrom → resolvable by !Env).
#
# ⚠ THIS FILE LIVES IN samba-ad/ BUT THE ConfigMap IS CREATED IN NAMESPACE authentik
# (metadata.namespace below) — the Authentik worker only reads blueprints from its own
# namespace. It is shipped by the wave13-samba-ad Application, so it must also be named
# in that Application's `include:` allowlist or it is silently never applied.
#
# Delivery: authentik/values.yaml mounts it via worker.volumes with `optional: true`
# (projected under /blueprints/apps/samba-ad), NOT via blueprints.configMaps. That list
# renders without `optional:`, so listing a wave-13 ConfigMap there would leave the
# wave-6 worker stuck in ContainerCreating. A labelled ConfigMap that is neither mounted
# nor listed is never applied and the blueprint silently does nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-ad-provisioner
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  ad-provisioner.yaml: |
    version: 1
    metadata:
      name: ad-provisioner
    entries:
      # The service account the samba-ad Job authenticates as.
      - model: authentik_core.user
        id: ad-provisioner-user
        identifiers:
          username: ad-provisioner
        attrs:
          name: "Samba AD Provisioner"
          type: service_account
          path: users/service-accounts

      # Role: read the identity surface, drive the LDAP source sync. No user writes.
      - model: authentik_rbac.role
        id: ad-provisioner-role
        identifiers:
          name: ad-provisioner
        attrs:
          permissions:
            # Read the users/groups to provision into Samba.
            - authentik_core.view_user
            - authentik_core.view_group
            # Trigger + inspect the inbound sync that stamps distinguishedName.
            - authentik_sources_ldap.view_ldapsource
            - authentik_sources_ldap.change_ldapsource

      # Group binds the role to the service account.
      - model: authentik_core.group
        id: ad-provisioner-group
        identifiers:
          name: ad-provisioner
        attrs:
          is_superuser: false
          # Service account: never a seed-user member (seed-user-group-sync.yaml).
          attributes:
            ecc/seed: none
          roles:
            - !KeyOf ad-provisioner-role
          users:
            - !KeyOf ad-provisioner-user

      # Long-lived, non-expiring API token.
      - model: authentik_core.token
        identifiers:
          identifier: ad-provisioner-token
          intent: api
          expiring: false
          user: !KeyOf ad-provisioner-user
        attrs:
          key: !Env AD_PROVISIONER_TOKEN
