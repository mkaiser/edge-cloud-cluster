---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: samba-ad-config
  namespace: samba-ad
spec:
  encryptedData:
    config.json: ""
  template:
    metadata:
      annotations:
        # Cleartext MARKER of the identity this blob was sealed with, so a
        # drift check can read it without the Pulumi key. NOT read by sambacc.
        ecc/sealed-realm: "AD.BASE.INTERNAL"
        ecc/sealed-short-domain: "ad"
      name: samba-ad-config
      namespace: samba-ad
