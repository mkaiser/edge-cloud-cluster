# TLS certificate for the CLOUD DC's LDAPS listener.
#
# WHY THIS EXISTS: Authentik's password write-back (Phase 2) sets `unicodePwd`, which AD
# refuses in the clear — it is LDAPS-only. Samba autogenerates a self-signed cert at
# provision time, but that cert is unusable for this:
#
#   subject/issuer = CN=ad-cloud-0.ad.base.internal   (self-signed, untrusted)
#   X509v3 Subject Alternative Name: DNS:ad-cloud-0.ad.base.internal   <- ONLY this
#
# Two problems, and they interact. The cert is not trusted by Authentik, AND its only SAN
# is the AD FQDN — which does not resolve in-cluster, because the CoreDNS forward for the
# AD zone is not actually loaded (the k3s CoreDNS pod mounts exactly ONE ConfigMap named
# `coredns-custom`; dns-config-job.yaml writes a separate `coredns-samba-ad` ConfigMap that
# is therefore never mounted, and `import /etc/coredns/custom/*.override` globs INSIDE the
# single mounted ConfigMap, not across ConfigMaps).
#
# So the LDAPSource connects by the k8s SERVICE name, which already resolves and is already
# open (389 + 636 verified from the authentik worker), and this cert carries that name.
#
# ⚠ BOTH SANs are required. Dropping the AD FQDN would break any client that reaches the DC
# by its directory name (that is the name in DNS and in the SRV records).
#
# ⚠ This does NOT fix the AD zone forward for pods. That is fine for Phase 2 but NOT for
# Phase 4: SSSD/Kerberos in the desktop pod needs SRV records from the AD zone. Fix the
# CoreDNS ownership question before Phase 4.
#
# SAMBA DOES NOT OVERWRITE A SUPPLIED CERT — verified on the live DC: the autogenerated
# files' mtime (09:37) predated the pod start (15:15) and survived untouched. Samba only
# autogenerates when the files are ABSENT. The `tls certfile/keyfile/cafile` paths are
# ordinary smb.conf parameters (defaults: tls/cert.pem, tls/key.pem, tls/ca.pem) and are
# pointed at this Secret via the sealed `globals` in sealSecrets.sh — which means the
# apply-global-options initContainer is what makes it take effect, since sambacc merges
# globals only at join.
#
# A DEDICATED self-signed CA, not the cluster's cert-manager ACME issuers: those are ACME
# (letsencrypt-prod/staging) and cannot issue for `.svc.cluster.local` or `.internal`, which
# are not publicly resolvable names. The `selfSigned` issuer pattern is already proven in
# this cluster by cert-manager-webhook-hetzner-selfsign — but that Issuer is Helm-owned by
# an unrelated chart, so it is NOT reused here.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: samba-ad-selfsign
  namespace: samba-ad
spec:
  selfSigned: {}
---
# Root CA for the AD TLS chain. Authentik trusts THIS (not the leaf), so the leaf can be
# rotated without re-importing anything on the Authentik side.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: samba-ad-ca
  namespace: samba-ad
spec:
  isCA: true
  commonName: samba-ad-ca
  secretName: samba-ad-ca-tls
  duration: 87600h # 10y — a private CA for an internal directory; rotation is a manual, disruptive event
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: samba-ad-selfsign
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: samba-ad-ca-issuer
  namespace: samba-ad
spec:
  ca:
    secretName: samba-ad-ca-tls
---
# The cloud DC's LDAPS leaf.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ad-cloud-tls
  namespace: samba-ad
spec:
  secretName: ad-cloud-tls
  duration: 8760h # 1y
  renewBefore: 720h # 30d
  privateKey:
    algorithm: RSA
    size: 2048
  # commonName is the AD identity; the service name lives in the SAN list. Both must be
  # present — see the header.
  #
  # ⚠ NO project-settings anchor on these two lines. The activeDirectory.adDomain anchor
  # substitutes the ZONE (ad.base.internal) over the whole dotted token, so anchoring a
  # HOST inside the zone rewrites `ad-cloud-0.ad.base.internal` down to `ad.base.internal`
  # and silently drops the hostname. The DC's FQDN is <pod>.<zone>, so it has to be spelled
  # out; a realm change means editing these by hand (and re-provisioning the domain anyway,
  # since the realm is baked into sam.ldb).
  commonName: ad-cloud-0.ad.base.internal
  dnsNames:
    # The DC's AD identity — what DNS and the SRV records point at.
    - ad-cloud-0.ad.base.internal
    # The in-cluster name Authentik's LDAPSource actually dials (headless Service →
    # <pod>.<serviceName>.<ns>.svc.cluster.local).
    - ad-cloud-0.ad-cloud.samba-ad.svc.cluster.local
    - ad-cloud-0.ad-cloud.samba-ad.svc
    - ad-cloud.samba-ad.svc.cluster.local
  issuerRef:
    name: samba-ad-ca-issuer
    kind: Issuer
