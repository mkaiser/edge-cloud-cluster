data:
  email-account-confirmation.html: |
    {% extends "email/base.html" %}
    {% load i18n %}
    {% load humanize %}
    
    {% block logo_url %}data:image/svg+xml;base64,{% endblock %}
    
    {% block content %}
    <tr>
      <td align="center">
        <h1>{% blocktrans with username=user.username %}Hi {{ username }},{% endblocktrans %}</h1>
      </td>
    </tr>
    <tr>
      <td align="center">
        <table border="0">
          <tr>
            <td align="center" style="max-width: 300px; padding: 20px 0; color: #212124;">
              {% blocktrans %}
              Please confirm your email address to complete your registration for the Edge-Cloud Cluster.
              {% endblocktrans %}
            </td>
          </tr>
          <tr>
            <td align="center" class="btn btn-primary">
              <a id="confirm" href="{{ url }}" rel="noopener noreferrer" target="_blank">{% trans 'Confirm Email' %}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    {% endblock %}
    
    {% block sub_content %}
    <tr>
      <td style="padding: 20px; font-size: 12px; color: #212124;" align="center">
        {% blocktrans with expires=expires|naturaltime %}
        If you did not request this, please ignore this email. The link is valid for {{ expires }}.
        {% endblocktrans %}
      </td>
    </tr>
    {% endblock %}
  email-password-reset.html: |
    {% extends "email/base.html" %}
    {% load i18n %}
    {% load humanize %}
    
    {% block logo_url %}data:image/svg+xml;base64,{% endblock %}
    
    {% block content %}
    <tr>
      <td align="center">
        <h1>{% blocktrans with username=user.username %}Hi {{ username }},{% endblocktrans %}</h1>
      </td>
    </tr>
    <tr>
      <td align="center">
        <table border="0">
          <tr>
            <td align="center" style="max-width: 300px; padding: 20px 0; color: #212124;">
              {% blocktrans %}
              Use the button below to set your password for the Edge-Cloud Cluster.
              {% endblocktrans %}
            </td>
          </tr>
          <tr>
            <td align="center" class="btn btn-primary">
              <a id="confirm" href="{{ url }}" rel="noopener noreferrer" target="_blank">{% trans 'Set Password' %}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    {% endblock %}
    
    {% block sub_content %}
    <tr>
      <td style="padding: 20px; font-size: 12px; color: #212124;" align="center">
        {% blocktrans with expires=expires|naturaltime %}
        If you did not request this, please ignore this email. The link is valid for {{ expires }}.
        {% endblocktrans %}
      </td>
    </tr>
    {% endblock %}
