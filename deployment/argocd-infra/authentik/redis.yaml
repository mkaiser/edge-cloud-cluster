# Redis for Authentik — official upstream image (no Bitnami).
# The goauthentik chart no longer bundles a redis subchart, so we provide one.
# Service name 'authentik-redis' matches authentik.redis.host in values.yaml.
# No auth — internal cluster traffic only (matches gitlab-redis pattern).
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  selector:
    app: authentik-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  serviceName: authentik-redis
  # Pinned to 1 even under HA (ha.authentikRedis max==1): no redis replication/sentinel
  # is wired up, so a 2nd replica would be an independent cache, not a failover. Anchor
  # kept for transparency; revisit with redis-sentinel/cluster to make this HA.
  replicas: 1 # automatically updated from project-settings:{highAvailability.enabled,highAvailability.replicas.authentikRedis}
  selector:
    matchLabels:
      app: authentik-redis
  template:
    metadata:
      labels:
        app: authentik-redis
    spec:
      priorityClassName: essential
      containers:
        - name: redis
          image: redis:8.10-alpine  # renovate: tracked by "Container image tags" regex (docker datasource)
          ports:
            - containerPort: 6379
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-cloud
        resources:
          requests:
            storage: 2Gi
