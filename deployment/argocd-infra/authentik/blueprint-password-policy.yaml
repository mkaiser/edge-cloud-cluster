# Authentik blueprint: password strength + breach-check policy (config-as-code).
#
# This blueprint ONLY defines the policy object. Attaching it is done via each
# password PromptStage's `validation_policies` M2M, in the blueprint that owns
# the stage:
#   - enrollment-prompt-first   → blueprint-enrollment.yaml
#   - recovery-prompt-password  → blueprint-recovery.yaml
# Both reference this policy with `!Find [..., [name, password-strength]]`.
#
# Why not a `policybinding` here: PolicyBinding.target is a PolicyBindingModel
# FK — it points at Flows / FlowStageBindings / Applications. A PromptStage is
# NOT a PolicyBindingModel, so binding a policy to a prompt stage via
# policybinding fails with "Invalid pk … object does not exist". Prompt-stage
# validation is a plain M2M on the stage (`validation_policies`), which is the
# mechanism the enrollment/recovery blueprints use.
#
# NOTE: this only guards the enrollment + recovery flows. Passwords set via the
# admin UI or the REST API do NOT run a flow, so PasswordPolicy is not enforced
# there — Authentik has no hook for admin/API-set passwords.
#
# Rules (per request):
#   length_min 8, ≥1 uppercase, ≥1 lowercase, ≥1 digit, ≥1 symbol   (static rules)
#   check_have_i_been_pwned: password hash must NOT appear in the HIBP breach
#     corpus (k-anonymity: only a SHA-1 prefix leaves the cluster, never the pw).
# check_static_rules must be true or length/amount_* are ignored.
# password_field must equal the prompt field_key ("password") in both flows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-password-policy
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  password-policy.yaml: |
    version: 1
    metadata:
      name: password-policy
    entries:
      - id: policy-password-strength
        model: authentik_policies_password.passwordpolicy
        identifiers:
          name: password-strength
        attrs:
          password_field: password
          check_static_rules: true
          length_min: 8
          amount_uppercase: 1
          amount_lowercase: 1
          amount_digits: 1
          amount_symbols: 1
          check_have_i_been_pwned: true
          hibp_allowed_count: 0
          error_message: >-
            Password must be at least 8 characters and include an uppercase
            letter, a lowercase letter, a digit and a symbol, and must not
            appear in a known data breach.
