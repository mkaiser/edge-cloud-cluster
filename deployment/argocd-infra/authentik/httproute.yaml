# Hand-written HTTPRoute: the authentik chart has no Gateway API templates (its
# only HTTPRoute mentions are in values comments and vendored CRDs), so its
# ingress is disabled in values.yaml and the route lives here instead.
#
# TLS terminates at the shared Gateway's wildcard listener (argocd-infra/gateway);
# the HTTP→HTTPS redirect is handled once by argocd-infra/gateway.
#
# Backend: authentik.server.fullname = <release>-<server.name> = authentik-server,
# service.servicePortHttp = 80.
#
# NB: this is the route for the Authentik UI itself (id.<tld>). It is unrelated
# to the embedded-outpost backends used by longhorn and prometheus, which point
# at an ExternalName Service in their own namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: main
      namespace: argocd-infra
      sectionName: https-wildcard
  hostnames:
    - id.subdomain1.your-domain.tld # automatically updated from project-settings:{general.subdomain,general.domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 300s
        backendRequest: 300s
      backendRefs:
        - name: authentik-server
          port: 80
