# mesh-gateway — Tailscale DaemonSet for control-plane nodes.
# Runs tailscaled in the HOST network namespace (hostNetwork: true) so a real
# tailscale0 interface appears on the host — visible to k3s and the CNI.
# CP nodes act as the gateway between the Hetzner private plane (10.0.0.0/23)
# and the headscale mesh plane (10.0.10.0/23), and repair the CNI
# VXLAN-over-WireGuard datapath (see the "VXLAN datapath repair" block below).
# Auth key comes from the headscale-preauthkey-cloud secret (k3s-cloud user)
# created by the headscale PostSync job.  State is persisted at /var/lib/tailscale
# so the node re-authenticates from stored state after pod restarts.
#
# NOTE: we bypass containerboot (the default image entrypoint) because it ignores
# TS_LOGIN_SERVER and always hits controlplane.tailscale.com. Instead we call
# tailscaled and tailscale up directly so --login-server is always respected.
#
# TLS: headscale may use a staging/private CA cert not trusted by tailscale.
# Init container reads the wildcard-tls K8s secret (argocd-infra — the cert the
# shared Gateway serves for vpn.<tld>, same LE issuer/chain) and extracts non-leaf
# certs to a shared volume.  Avoids hairpin-NAT failures that occur when the CP
# node tries to openssl-connect to its own external hostname.  The main
# container copies the certs to /usr/local/share/ca-certificates and runs
# update-ca-certificates so Go's x509.SystemCertPool picks them up.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-gateway
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-gateway
  namespace: headscale
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["headscale-preauthkey-cloud"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-gateway
  namespace: headscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-gateway
subjects:
- kind: ServiceAccount
  name: mesh-gateway
  namespace: headscale
---
# Cross-namespace read of the wildcard TLS cert (argocd-infra) so the init
# container can extract the LE CA chain. Scoped to the single secret name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-gateway-wildcard-tls
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["wildcard-tls"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mesh-gateway-wildcard-tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mesh-gateway-wildcard-tls
subjects:
- kind: ServiceAccount
  name: mesh-gateway
  namespace: headscale
---
# The metrics exporter sidecar lists nodes to map each peer's mesh IP -> k3s
# node name (so series carry the node id, not the non-unique tailscale
# HostName). Read-only, cluster-scoped (nodes are not namespaced).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-gateway-nodes-read
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mesh-gateway-nodes-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mesh-gateway-nodes-read
subjects:
- kind: ServiceAccount
  name: mesh-gateway
  namespace: headscale
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mesh-gateway
  namespace: headscale
  annotations:
    # The metrics-exporter script is read from its ConfigMap at container start. Reloader
    # (argocd-infra/reloader) rolls this DaemonSet when that content changes.
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: mesh-gateway
  template:
    metadata:
      labels:
        app: mesh-gateway
    spec:
      serviceAccountName: mesh-gateway
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
      - operator: Exists
      hostNetwork: true
      # ClusterFirstWithHostNet: use CoreDNS even with hostNetwork=true so
      # kubernetes.default.svc resolves inside the container.
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      # Extract intermediate/root CA certs from the wildcard-tls K8s secret
      # (argocd-infra). Reading from the secret avoids hairpin-NAT issues (CP node
      # reaching its own external hostname via openssl).  Writes non-leaf certs to
      # /certs/.  Cross-ns read is granted by the mesh-gateway-wildcard-tls ClusterRole.
      - name: fetch-headscale-ca
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          CHAIN=""
          i=0
          while [ "$i" -lt 30 ]; do
            CHAIN=$(kubectl get secret wildcard-tls -n argocd-infra \
              -o jsonpath='{.data.tls\.crt}' 2>/dev/null | base64 -d 2>/dev/null || true)
            echo "$CHAIN" | grep -q "BEGIN CERTIFICATE" && break
            echo "  waiting for wildcard-tls... ($i/30)"; sleep 5; i=$((i+1))
          done
          if ! echo "$CHAIN" | grep -q "BEGIN CERTIFICATE"; then
            echo "ERROR: could not read wildcard-tls cert chain"; exit 1
          fi
          # NB: with `python3 -`, stdin carries the PROGRAM (the heredoc) — piping the
          # chain on stdin as well silently read as empty ("Found 0 cert(s)") and the
          # staging CA was never imported → tailscale login x509 failure on every
          # fresh staging-cert cluster. Hand the chain over via a file instead.
          printf '%s\n' "$CHAIN" > /tmp/chain.pem
          python3 - << 'PYEOF'
          import re
          chain = open('/tmp/chain.pem').read()
          certs = re.findall(
              r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',
              chain, re.DOTALL)
          print(f"Found {len(certs)} cert(s) in wildcard-tls secret.")
          for i, cert in enumerate(certs[1:], 1):
              path = f'/certs/headscale-ca-{i:02d}.crt'
              open(path, 'w').write(cert + '\n')
              print(f"  Wrote {path}")
          if len(certs) <= 1:
              print("Only leaf cert — no intermediate CA to import (production cert or self-signed).")
          PYEOF
        volumeMounts:
        - name: ca-certs
          mountPath: /certs
      containers:
      - name: tailscale
        # renovate: datasource=docker
        image: ghcr.io/tailscale/tailscale:v1.102.3  # renovate: tracked by "Container image tags" regex (docker datasource)
        # Bypass containerboot — run tailscaled directly and authenticate with
        # tailscale up, passing --login-server explicitly so headscale is used.
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e

          # Network ranges — kept in sync with project_settings.ts by
          # scripts/environment/updateConfigFromProjectSettings.sh (anchor comments below).
          SUBNET_RANGE="10.0.0.0/23" # automatically updated from project-settings:network.subnetRange
          MESH_RANGE="10.0.10.0/23" # automatically updated from project-settings:network.meshRange
          # Cilium's VXLAN port. It MUST track project_settings.network.cni.tunnelPort — the
          # SNAT rule below matches on it, and a mismatch does not error, it just stops
          # matching (see the black-hole note there). The anchor is what keeps it tracking.
          VXLAN_PORT="8472" # automatically updated from project-settings:network.cniTunnelPort

          # Import headscale CA certs fetched by the init container.
          # update-ca-certificates updates /etc/ssl/certs/ca-certificates.crt
          # which Go's x509.SystemCertPool() reads on Linux.
          if ls /certs/headscale-ca-*.crt >/dev/null 2>&1; then
            cp /certs/headscale-ca-*.crt /usr/local/share/ca-certificates/
            update-ca-certificates 2>/dev/null || true
            echo "Imported headscale CA cert(s) into system trust store."
          else
            echo "No extra CA certs to import."
          fi

          SOCKET=/var/run/tailscale/tailscaled.sock
          STATE=/var/lib/tailscale/tailscaled.state

          # Remove stale tailscale0 interface if left from a previous pod run.
          ip link delete tailscale0 2>/dev/null || true

          # Pin the WireGuard data port to 41641 so it matches the Hetzner firewall
          # rule (src/network.ts opens inbound UDP 41641). Without --port, tailscaled
          # binds a RANDOM UDP port, so the open firewall port has nothing behind it and
          # NO direct path can form — every edge↔cloud connection falls back to the
          # DERP relay (443/tcp), which flaps and drops edge nodes to NotReady. Pinning
          # 41641 lets the firewalled port actually carry direct WireGuard.
          TS_PORT=41641 # automatically updated from project-settings:network.tailscalePort
          tailscaled --state="$STATE" --socket="$SOCKET" --port="$TS_PORT" --no-logs-no-support &
          DAEMON_PID=$!

          # Wait for daemon socket to be ready (up to 30s)
          for i in $(seq 1 30); do
            tailscale --socket="$SOCKET" status >/dev/null 2>&1 && break
            sleep 1
          done

          # Authenticate only if not already connected
          STATUS=$(tailscale --socket="$SOCKET" status --json 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('BackendState',''))" \
            2>/dev/null || echo "")
          if [ "$STATUS" != "Running" ]; then
            echo "Connecting to headscale at $TS_LOGIN_SERVER ..."
            tailscale --socket="$SOCKET" up \
              --login-server="$TS_LOGIN_SERVER" \
              --authkey="$TS_AUTHKEY" \
              --hostname="$TS_HOSTNAME" \
              --accept-dns=false \
              --advertise-routes="$SUBNET_RANGE"
              # NB: deliberately NO --accept-routes. The CP advertises 10.0.0.0/23
              # (SUBNET_RANGE) into the mesh for edge nodes, but must NOT *accept*
              # that route back: accepting it installs "10.0.0.0/23 dev tailscale0"
              # in policy table 52, which then hijacks CP→CP etcd PEER traffic
              # (10.0.0.x:2380) onto the mesh. etcd peer certs only carry the
              # private-IP/hostname SANs, so mesh-sourced peer connections (src
              # 10.0.10.x) fail TLS SAN validation -> etcd quorum collapse, whole
              # control plane goes ServiceUnavailable. CPs reach edge mesh IPs via
              # the explicit MESH_RANGE route below; they never need accept-routes.
          else
            echo "Already connected: $STATUS"
          fi

          # tailscaled (v1.96.x + headscale) does not install IPv4 peer routes
          # into the kernel routing table when another route already covers the
          # VPN prefix — e.g. Hetzner Cloud assigns 10.0.0.0/16 on enp7s0 which
          # swallows the headscale prefix 10.0.10.0/23.  Policy-routing table 52
          # (priority 5270) is checked before the main table, but tailscaled never
          # populates it with peer /32s for custom headscale prefixes.
          # Adding a /23 host-route to the main table is more specific than the
          # Hetzner /16 and therefore wins the longest-prefix-match lookup.
          ip route replace "$MESH_RANGE" dev tailscale0 2>/dev/null || true
          echo "VPN peer route installed: $MESH_RANGE dev tailscale0"

          # ── VXLAN datapath repair (cloud→edge CNI tunnel over WireGuard) ───────
          # Without this, edge→cloud pod traffic works but cloud→edge is a black
          # hole, so edge pods can't reach any ClusterIP service (CoreDNS,
          # longhorn-backend, admission webhooks). Two independent bugs.
          #
          # NEITHER IS CNI-SPECIFIC, so do not expect a CNI change to retire this
          # repair: (1) is a property of a node whose tunnel source address is on a
          # different plane than the egress interface, and (2) is a property of VXLAN
          # over userspace WireGuard. Only the device name is Cilium's (cilium_vxlan).
          #
          # 1. Source-plane mismatch. Cloud nodes have node-ip = private 10.0.0.x,
          #    and Cilium sources its tunnel from the node IP — so their VXLAN to an
          #    edge peer is sourced from 10.0.0.x but must egress tailscale0.
          #    WireGuard cryptokey routing only carries packets whose source is a
          #    mesh IP, so a 10.0.0.x-sourced packet on tailscale0 is dropped.
          #    Edge→cloud works only because the edge node's node-ip IS its mesh IP
          #    (40-join-cluster.sh sets node-ip: $MESH_VPN_IP). Fix: SNAT VXLAN
          #    (udp/8472) leaving tailscale0 to THIS node's mesh IP. POSTROUTING also
          #    covers VXLAN *forwarded* from mesh-less cloud workers (e.g. w0) that
          #    exit to the mesh via this CP gateway.
          #    The port comes from $VXLAN_PORT above, anchored to
          #    project_settings.network.cni.tunnelPort, so a port change follows Cilium.
          #    ⚠ A tunnelProtocol change does NOT: switching to geneve moves the port to
          #    6081 while cniTunnelPort still reads 8472, and this rule then silently stops
          #    matching — a black hole with no error.
          #
          # 2. Outer-checksum corruption. tx-udp-segmentation / generic checksum
          #    offload on the tunnel device leaves the VXLAN outer UDP checksum wrong
          #    for the userspace WireGuard path (no NIC fixup), so the receiver drops
          #    it as UdpInCsumErrors. Fix: disable those offloads on cilium_vxlan.
          #    (The edge side disables the same offloads in 40-join-cluster.sh.)
          MESH_IP=$(ip -4 -o addr show tailscale0 2>/dev/null \
            | grep -oE '10\.0\.10\.[0-9]+' | head -1)
          if [ -n "$MESH_IP" ]; then
            iptables -t nat -C POSTROUTING -o tailscale0 -p udp --dport "$VXLAN_PORT" \
              -j SNAT --to-source "$MESH_IP" 2>/dev/null \
              || iptables -t nat -A POSTROUTING -o tailscale0 -p udp --dport "$VXLAN_PORT" \
                   -j SNAT --to-source "$MESH_IP"
            echo "VXLAN SNAT installed: udp/$VXLAN_PORT out tailscale0 -> $MESH_IP"
          else
            echo "WARN: no tailscale0 mesh IP found; skipping VXLAN SNAT"
          fi
          # ethtool isn't in the base tailscale image; pull it (Alpine apk).
          command -v ethtool >/dev/null 2>&1 || apk add --no-cache ethtool >/dev/null 2>&1 || true
          if command -v ethtool >/dev/null 2>&1; then
            # Re-assert every 60s in the background, NOT just once: the CNI
            # recreates cilium_vxlan on every agent restart and each recreation
            # resets the offloads to ON. A single disable at startup silently
            # regresses after the next restart (rising UdpInCsumErrors, cloud→edge
            # black holes). ethtool -K is idempotent, so the loop is a no-op once
            # already off. (The edge side re-asserts via cni-offload.timer in
            # 40-join-cluster.sh — same reasoning.)
            (
              while true; do
                ethtool -K cilium_vxlan tx-udp-segmentation off \
                  tx-checksum-ip-generic off 2>/dev/null || true
                sleep 60
              done
            ) &
            echo "cilium_vxlan tx offload disable loop started (re-asserts every 60s)"
          else
            echo "WARN: ethtool unavailable; cilium_vxlan tx offload NOT disabled"
          fi

          wait $DAEMON_PID
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: headscale-preauthkey-cloud
              key: key
        - name: TS_LOGIN_SERVER
          value: "https://vpn.subdomain1.your-domain.tld" # automatically updated from project-settings:{general.subdomain,general.domain}
        - name: TS_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: tailscale-run
          mountPath: /var/run/tailscale
        - name: ca-certs
          mountPath: /certs
      # Mesh link metrics exporter (see metrics-exporter.yaml). Shares the
      # tailscaled unix socket (tailscale-run) and queries its LocalAPI on each
      # scrape. hostNetwork:true (inherited from the pod) so :9105 binds the host
      # — the mesh-gateway-metrics Service + ServiceMonitor scrape it.
      - name: metrics
        # NOT the tailscale image — it ships no python3 (its own inline python3
        # calls are masked by `|| true`). The exporter needs only python3 + the
        # shared tailscaled socket (it speaks the LocalAPI over HTTP directly, no
        # tailscale binary), so any python3 image works. alpine/k8s is already
        # used by the init container and has python3.
        image: docker.io/alpine/k8s:1.37.0  # renovate: tracked by "Container image tags" regex (docker datasource)
        command: ["python3", "/exporter/exporter.py"]
        ports:
        - name: metrics
          containerPort: 9105
        volumeMounts:
        - name: tailscale-run
          mountPath: /var/run/tailscale
        - name: mesh-metrics-exporter
          mountPath: /exporter
        resources:
          requests:
            cpu: "5m"
            memory: "24Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: tailscale-state
        hostPath:
          path: /var/lib/tailscale
          type: DirectoryOrCreate
      - name: tailscale-run
        hostPath:
          path: /var/run/tailscale
          type: DirectoryOrCreate
      - name: ca-certs
        emptyDir: {}
      - name: mesh-metrics-exporter
        configMap:
          name: mesh-metrics-exporter
