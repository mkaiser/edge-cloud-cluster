# Pod scheduling priority for graceful degradation when a tier (esp. a cloud-only
# cluster during restore) is resource-tight. Higher value wins; the scheduler admits
# important apps first and preempts lower ones. No globalDefault → unclassified pods
# get priority 0 (below "low"). See doc/cloud-mesh-architecture.md.
#
# All values sit below the Kubernetes built-ins system-cluster-critical (2e9) and
# system-node-critical, so true system components always outrank these.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform
value: 2000000
globalDefault: false
description: "Cluster platform (argocd, longhorn, cert-manager, kube-vip, ingress, sealed-secrets, coredns)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: essential
value: 1000000
globalDefault: false
description: "Essential infra everything depends on (authentik SSO, headscale mesh)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high
value: 100000
globalDefault: false
description: "Business-critical apps (gitlab, nextcloud)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: standard
value: 10000
globalDefault: false
description: "Team collaboration apps (zulip, rocketchat, xwiki)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low
value: 1000
globalDefault: false
# Never preempt others — optional apps queue (Pending) instead of evicting anything.
preemptionPolicy: Never
description: "Nice-to-have apps (rallly, jitsi, windows)."
