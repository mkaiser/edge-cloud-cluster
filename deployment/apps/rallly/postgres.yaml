# CloudNativePG cluster for Rallly (cloud-side CNPG conversion — the clean pilot
# per docs/cloud-edge-architecture.md "Databases (CNPG)"). Replaces the previous
# plain postgres:18 StatefulSet so Rallly's DB is a CNPG-managed Cluster: this is
# the prerequisite for the deferred cross-tier replica-cluster mobility (an async
# replica on an edge node + `kubectl cnpg promote` cutover) once edge nodes exist.
#
# App connects via the CNPG-managed read-write service `rallly-pg-rw` (see
# deployment.yaml DATABASE_URL). Bootstrap creates the `rallly` database + owner
# from the rallly-pg-user secret (username/password keys), with the password kept
# equal to rallly-secrets:db-password so the app and CNPG share one credential.
#
# Backup: rallly has no dedicated S3 bucket (project_settings.ts), so barman S3
# WAL archiving + scheduled backups are intentionally OMITTED here. Add a
# `rallly` bucket + barmanObjectStore (pattern: infra/authentik/postgres.yaml)
# when enabling backup/recovery — deferred alongside the edge replica cluster.
#
# DO NOT EDIT directly for the user secret — rallly-pg-user-sealed.yaml is
# generated by sealSecrets.sh; this manifest only references it.
# Image versions: https://github.com/cloudnative-pg/postgres-containers/releases
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rallly-pg
  namespace: rallly
  annotations:
    # rallly-pg-user sealed secret syncs at wave -1 (see sealSecrets.sh) so it
    # exists before CNPG reconciles this Cluster.
    argocd.argoproj.io/sync-wave: "0"
spec:
  priorityClassName: low
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18 # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql

  storage:
    storageClass: longhorn-cloud
    size: 4Gi

  bootstrap:
    initdb:
      database: rallly
      owner: rallly
      secret:
        name: rallly-pg-user

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
