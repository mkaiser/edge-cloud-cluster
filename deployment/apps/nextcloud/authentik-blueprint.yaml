# Authentik blueprint: Nextcloud OIDC provider + dashboard tile.
#
# Per-app blueprint — shipped by THIS app's ArgoCD Application into the authentik
# namespace and mounted optionally into the Authentik worker
# (deployment/infrastructure/authentik/values.yaml → worker.volumes: bp-nextcloud).
# If nextcloud is removed from the sync waves, this ConfigMap is never created
# and no Nextcloud tile appears.
#
# client_secret comes from the authentik-secrets sealed bundle (!Env). Redirect
# URIs use the cluster subdomain — rewritten by updateConfigFromProjectSettings.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-nextcloud
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  nextcloud.yaml: |
    version: 1
    metadata:
      name: app-nextcloud
    entries:
      - id: provider-nextcloud
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: nextcloud
        attrs:
          client_type: confidential
          client_id: nextcloud
          client_secret: !Env NEXTCLOUD_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://nextcloud.ecc135.cape-project.eu/apps/oidc_login/oidc
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
      - model: authentik_core.application
        identifiers:
          slug: nextcloud
        attrs:
          name: Nextcloud
          group: Office
          provider: !KeyOf provider-nextcloud
          meta_launch_url: https://nextcloud.ecc135.cape-project.eu/apps/oidc_login/oidc
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nextcloud.svg
      # Access control: only employees / employees-extended / admins (policy defined
      # in blueprint-apps.yaml, resolved cross-blueprint by name).
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, nextcloud]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, access-employee-apps]]
        attrs:
          order: 0
          enabled: true
