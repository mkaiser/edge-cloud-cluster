# PostSync Job: configure Nextcloud apps + integrations via `occ`.
# Runs after the chart sync. Installs/enables:
#   - oidc_login   → Authentik SSO (email auto-populated from OIDC claim)
#   - drawio       → diagram editor
#   - richdocuments→ Collabora Online (document editing; backend: collabora.subdomain.domain.tld...)
#   - mail         → pre-configured IMAP defaults (user enters only their mail password)
#   - files_antivirus (ClamAV) → foreseen, disabled (see TODO one-liner below)
#
# Idempotent: occ app:install is a no-op if already installed; config:* is set each run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextcloud-configure
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "12"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-configure
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "12"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-configure
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextcloud-configure
subjects:
- kind: ServiceAccount
  name: nextcloud-configure
  namespace: nextcloud
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-configure
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: nextcloud-configure
      restartPolicy: Never
      containers:
      - name: configure
        image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
        env:
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: nextcloud-oidc-client-secret
                key: client-secret
          - name: SMTP_HOST
            valueFrom:
              secretKeyRef: { name: nextcloud-smtp, key: smtp-host }
          - name: SMTP_PORT
            valueFrom:
              secretKeyRef: { name: nextcloud-smtp, key: smtp-port }
          - name: SMTP_USER
            valueFrom:
              secretKeyRef: { name: nextcloud-smtp, key: smtp-username }
          - name: SMTP_PASS
            valueFrom:
              secretKeyRef: { name: nextcloud-smtp, key: smtp-password }
        command: ["/bin/sh", "-ec"]
        args:
        - |
          NS="nextcloud"
          ISSUER="https://id.ecc135.cape-project.eu/application/o/nextcloud/"

          echo "Finding running nextcloud pod..."
          POD=""
          i=0
          while [ "$i" -lt 60 ]; do
            POD=$(kubectl get pods -n "$NS" -l app.kubernetes.io/name=nextcloud \
              --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            [ -n "$POD" ] && break
            echo "  waiting for nextcloud pod... ($i/60)"; sleep 10; i=$((i+1))
          done
          if [ -z "$POD" ]; then echo "ERROR: no running nextcloud pod"; exit 1; fi
          echo "Nextcloud pod: $POD"

          occ() { kubectl exec -n "$NS" "$POD" -c nextcloud -- php /var/www/html/occ "$@"; }

          echo "Waiting for Nextcloud to finish install..."
          i=0
          while [ "$i" -lt 60 ]; do
            if occ status 2>/dev/null | grep -q "installed: true"; then break; fi
            echo "  waiting for install... ($i/60)"; sleep 10; i=$((i+1))
          done


          # --- OIDC login (Authentik) ---
          # oidc_login reads ALL settings from system config (config.php), not app config.
          occ app:install oidc_login || true
          occ app:enable oidc_login
          occ config:system:set oidc_login_provider_url --value "$ISSUER"
          occ config:system:set oidc_login_client_id --value "nextcloud"
          occ config:system:set oidc_login_client_secret --value "$OIDC_CLIENT_SECRET"
          occ config:system:set oidc_login_auto_redirect --value false --type boolean
          occ config:system:set oidc_login_hide_password_form --value true --type boolean
          occ config:system:set oidc_login_button_text --value "Login mit Authentik"
          # Disable TLS verify for staging certs; enable for prod (trusted CA).
          CERT_ISSUER=$(kubectl get ingress -n nextcloud nextcloud \
            -o jsonpath='{.metadata.annotations.cert-manager\.io/cluster-issuer}' 2>/dev/null || echo "letsencrypt-staging")
          if [ "$CERT_ISSUER" = "letsencrypt-staging" ]; then
            occ config:system:set oidc_login_tls_verify --value false --type boolean
          else
            occ config:system:set oidc_login_tls_verify --value true --type boolean
          fi
          occ config:system:set oidc_login_scope --value "openid profile email groups"
          occ config:system:set oidc_login_disable_registration --value false --type boolean
          # Map OIDC claims; email auto-populated so Mail app email is prefilled.
          occ config:system:set oidc_login_attributes id --value "preferred_username"
          occ config:system:set oidc_login_attributes mail --value "email"
          occ config:system:set oidc_login_attributes name --value "name"
          occ config:system:set oidc_login_attributes groups --value "groups"
          occ config:system:set oidc_login_auto_create_users --value true --type boolean
          # Grant Nextcloud admin via the is_admin claim (employees-extended members).
          # NOTE: oidc_login has NO "admin group" setting; it grants admin only when
          # the is_admin attribute claim is truthy. The claim is emitted by the
          # Authentik "groups" scope mapping (blueprint-apps.yaml).
          occ config:system:set oidc_login_attributes is_admin --value "is_admin"

          # --- DrawIO ---
          occ app:install drawio || true
          occ app:enable drawio

          # --- Collabora Online (richdocuments) ---
          occ app:install richdocuments || true
          occ app:enable richdocuments
          occ config:app:set richdocuments wopi_url --value "https://collabora.ecc135.cape-project.eu"

          # --- Outgoing SMTP (host/port/credentials from nextcloud-smtp secret) ---
          occ config:system:set mail_smtpmode --value smtp
          occ config:system:set mail_smtphost --value "$SMTP_HOST"
          occ config:system:set mail_smtpport --value "$SMTP_PORT"
          occ config:system:set mail_smtpsecure --value tls
          occ config:system:set mail_smtpauth --value 1 --type integer
          occ config:system:set mail_smtpname --value "$SMTP_USER"
          occ config:system:set mail_smtppassword --value "$SMTP_PASS"
          occ config:system:set mail_from_address --value no-reply
          occ config:system:set mail_domain --value cape-project.eu

          # --- Mail app: pre-configure IMAP/SMTP defaults (user enters only password) ---
          occ app:install mail || true
          occ app:enable mail
          occ config:app:set mail installed_version --value "0.0.0" || true
          # Provisioning: auto-create a mail account on first login using OIDC email.
          # SMTP host/port come from the nextcloud-smtp secret; IMAP uses the same
          # host with the standard IMAPS port 993. User supplies only their password.
          occ config:app:set mail provisioning --value \
            "[{\"provisioningDomain\":\"cape-project.eu\",\"imapHost\":\"${SMTP_HOST}\",\"imapPort\":993,\"imapSslMode\":\"ssl\",\"imapUser\":\"%EMAIL%\",\"smtpHost\":\"${SMTP_HOST}\",\"smtpPort\":${SMTP_PORT},\"smtpSslMode\":\"tls\",\"smtpUser\":\"%EMAIL%\"}]"

          # --- Antivirus (ClamAV) — DISABLED. Enable by uncommenting + deploying ClamAV. ---
          # occ app:install files_antivirus && occ app:enable files_antivirus
          # occ config:app:set files_antivirus av_mode --value daemon
          # occ config:app:set files_antivirus av_host --value clamav.nextcloud.svc.cluster.local
          # occ config:app:set files_antivirus av_port --value 3310

          # Run the DB upgrade LAST — installing the bundled apps above (mail,
          # richdocuments, drawio) migrates their schema and sets
          # needsDbUpgrade=true, which serves a 503/adminCli page until cleared.
          # Idempotent: a no-op ("Nothing to do") when already current.
          echo "Running occ upgrade (clears any app-migration upgrade need)..."
          occ upgrade || true
          occ maintenance:mode --off 2>/dev/null || true

          echo "Nextcloud configuration complete."
