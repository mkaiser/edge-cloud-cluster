# Collabora Online (CODE) — document editing backend for Nextcloud richdocuments.
# Accessible at https://collabora.subdomain.domain.tld (referenced as wopi_url).
# Stateless; TLS terminated at the haproxy ingress (ssl.termination=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      labels:
        app: collabora
    spec:
      containers:
        - name: collabora
          image: collabora/code:26.04.1.4.1  # renovate: tracked by "Container image tags" regex (docker datasource)
          ports:
            - containerPort: 9980
          env:
            # Regex of allowed WOPI hosts (Nextcloud domain), dots escaped.
            - name: aliasgroup1
              value: "https://nextcloud\\.ecc80\\.cape-project\\.eu:443"
            - name: DONT_GEN_SSL_CERT
              value: "true"
            - name: extra_params
              value: "--o:ssl.enable=false --o:ssl.termination=true"
          readinessProbe:
            httpGet:
              path: /
              port: 9980
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9980
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  selector:
    app: collabora
  ports:
    - port: 9980
      targetPort: 9980
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabora
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    haproxy-ingress.github.io/ssl-redirect: "true"
    haproxy-ingress.github.io/timeout-server: "3600s"
    haproxy-ingress.github.io/timeout-client: "3600s"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - collabora.ecc135.cape-project.eu
      secretName: collabora-tls
  rules:
    - host: collabora.ecc135.cape-project.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabora
                port:
                  number: 9980
