# Redis for Nextcloud — official upstream image (no Bitnami).
# Replaces the chart's bundled bitnami redis subchart (redis.enabled: false).
# Service name 'nextcloud-redis' is referenced via nextcloud.extraEnv REDIS_HOST.
# No auth — internal cluster traffic only (matches gitlab-redis pattern).
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: nextcloud
spec:
  selector:
    app: nextcloud-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-redis
  namespace: nextcloud
spec:
  serviceName: nextcloud-redis
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      priorityClassName: high
      containers:
        - name: redis
          image: redis:8.8-alpine  # renovate: tracked by "Container image tags" regex (docker datasource)
          ports:
            - containerPort: 6379
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-cloud
        resources:
          requests:
            storage: 2Gi
