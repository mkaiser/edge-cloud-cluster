# Authentik blueprint: XWiki OIDC provider + SCIM provider + dashboard tile.
#
# Per-app blueprint — shipped by THIS app's ArgoCD Application into the authentik
# namespace and mounted optionally into the Authentik worker
# (deployment/infrastructure/authentik/values.yaml → worker.volumes: bp-xwiki).
# If xwiki is removed from the sync waves, this ConfigMap is never created and no
# XWiki tile (or SCIM provisioning) appears.
#
# The xwiki-oidc-admins group is defined centrally in blueprint-groups.yaml.
# client_secret / SCIM token come from the authentik-secrets sealed bundle (!Env).
# Redirect URIs / SCIM URL use the cluster subdomain — rewritten by
# updateConfigFromProjectSettings.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-xwiki
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  xwiki.yaml: |
    version: 1
    metadata:
      name: app-xwiki
    entries:
      - id: provider-xwiki
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: xwiki
        attrs:
          client_type: confidential
          client_id: xwiki
          client_secret: !Env XWIKI_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://wiki.ecc135.cape-project.eu/oidc/authenticator/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
      - model: authentik_core.application
        identifiers:
          slug: xwiki
        attrs:
          name: XWiki
          group: Office
          provider: !KeyOf provider-xwiki
          meta_launch_url: https://wiki.ecc135.cape-project.eu
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/xwiki.png
      # Access control: employees / employees-extended / admins only.
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, xwiki]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, access-employee-apps]]
        attrs:
          order: 0
          enabled: true

      # ---- XWiki SCIM (user/group provisioning) ----
      # NOTE: Nextcloud SCIM omitted — scimserviceprovider not in the NC app store for NC 33+.
      - id: provider-xwiki-scim
        model: authentik_providers_scim.SCIMProvider
        identifiers:
          name: xwiki-scim
        attrs:
          name: xwiki-scim
          url: https://wiki.ecc135.cape-project.eu/rest/scim/v2/
          token: !Env XWIKI_SCIM_TOKEN
          filter_group: !Find [authentik_core.group, [name, employees]]
          property_mappings:
            - !Find [authentik_providers_scim.scimmapping, [name, "authentik default SCIM Mapping: User"]]
          property_mappings_group:
            - !Find [authentik_providers_scim.scimmapping, [name, "authentik default SCIM Mapping: Group"]]
      - model: authentik_core.application
        identifiers:
          slug: xwiki-scim
        attrs:
          name: XWiki SCIM
          provider: !KeyOf provider-xwiki-scim
