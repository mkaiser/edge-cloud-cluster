# Authentik blueprint: Guacamole OIDC provider + dashboard tile.
#
# Per-app blueprint — shipped by THIS app's ArgoCD Application into the authentik
# namespace and mounted optionally into the Authentik worker
# (deployment/infrastructure/authentik/values.yaml → worker.volumes: bp-windows).
# If the windows app is removed from sync waves, this ConfigMap is never created,
# the optional mount stays empty, and no Windows tile appears.
#
# Guacamole uses the OpenID implicit flow (public client — no client secret).
# Access restricted to 'windows-users' group. Redirect URI uses the cluster
# subdomain — rewritten by updateConfigFromProjectSettings.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-windows
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
data:
  windows.yaml: |
    version: 1
    metadata:
      name: app-windows
    entries:
      # Access group: only members of this group can log in to Guacamole.
      # Also used as the Guacamole user group for connection assignment
      # (Guacamole maps the 'groups' OIDC claim to its internal groups).
      - id: group-windows-users
        model: authentik_core.group
        identifiers:
          name: windows-users
        attrs:
          name: windows-users

      - id: policy-access-windows
        model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: access-windows
        attrs:
          expression: |
            groups = set(request.user.groups.values_list("name", flat=True))
            return bool(groups & {"windows-users", "authentik-admins"})

      - id: provider-guacamole
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: guacamole
        attrs:
          client_type: public
          client_id: guacamole
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - implicit
            - authorization_code
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: "https://windows.ecc135.cape-project.eu"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "custom.scope-groups"]]

      - model: authentik_core.application
        identifiers:
          slug: windows
        attrs:
          name: Remote Windows Desktop
          group: Development
          provider: !KeyOf provider-guacamole
          meta_launch_url: https://windows.ecc135.cape-project.eu
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/apache-guacamole.svg

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, windows]]
          policy: !KeyOf policy-access-windows
        attrs:
          order: 0
          enabled: true
