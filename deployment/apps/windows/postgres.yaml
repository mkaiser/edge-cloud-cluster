# CloudNativePG cluster for Guacamole (windows app) — CNPG conversion (see
# docs/cloud-edge-architecture.md "Databases (CNPG)"). Replaces the previous plain
# postgres:18 StatefulSet so the DB is a CNPG-managed Cluster.
#
# EDGE-TIER: windows is edge-only (needs KVM). This DB co-locates with the VM on
# KVM-capable edge nodes — nodeSelector ecc/kvm, tolerates the edge taint, and
# uses the longhorn-edge StorageClass. It therefore only schedules once an edge
# node with ecc/kvm has joined (longhorn-edge also only exists then); until
# then the Cluster stays Pending, like the rest of the windows app.
#
# App connects via the CNPG read-write service `guacamole-pg-rw` (see values.yaml
# database.external.host and connection-seed.yaml PGHOST). Bootstrap creates the
# guacamole_db database + guacamole_user owner from the guacamole-pg-user secret
# (username/password keys); password == windows-secrets:db-password so the app and
# the connection-seed job authenticate identically.
#
# Backup: no S3 bucket for this DB; barman omitted (deferred with edge work).
# DO NOT EDIT directly for the user secret — guacamole-pg-user-sealed.yaml is
# generated by sealSecrets.sh; this manifest only references it.
# Image versions: https://github.com/cloudnative-pg/postgres-containers/releases
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: guacamole-pg
  namespace: windows
  annotations:
    # guacamole-pg-user sealed secret syncs at wave -1 (see sealSecrets.sh) so it
    # exists before CNPG reconciles this Cluster.
    argocd.argoproj.io/sync-wave: "0"
spec:
  priorityClassName: low
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18 # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql

  # Pin to KVM-capable edge nodes (windows is edge-only), tolerating the edge taint.
  affinity:
    nodeSelector:
      ecc/kvm: "true"
    tolerations:
      - key: ecc/edge
        operator: Equal
        value: "true"
        effect: NoSchedule

  storage:
    storageClass: longhorn-edge
    size: 5Gi

  bootstrap:
    initdb:
      database: guacamole_db
      owner: guacamole_user
      secret:
        name: guacamole-pg-user
