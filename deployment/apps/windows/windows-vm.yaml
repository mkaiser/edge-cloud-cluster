# dockur/windows — Windows 11 LTSC VM via QEMU with KVM acceleration.
# Requires a node labeled ecc/kvm=true (e.g. the UNIBI-lab pcie6-server
# which exposes /dev/kvm via PCIe passthrough). KVM is enabled for full speed.
# Hetzner Cloud shared VMs do not have /dev/kvm; use dedicated servers only.
#
# Port 3389 is ClusterIP-only; access via Guacamole (RDP) or Headscale VPN.
# Port 8006 (built-in web viewer) is intentionally NOT exposed via Ingress.
#
# First start: ~60-120 min to download 4.7 GB ISO and install Windows (TCG).
# Monitor progress: kubectl logs -n windows -l app=windows-vm -f
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windows-vm-storage
  namespace: windows
spec:
  accessModes:
    - ReadWriteOnce
  # Edge-only: windows needs KVM (ecc/kvm nodes) and its block disk must live
  # on edge disks, not cloud. longhorn-edge exists only when edge nodes are present;
  # until then this PVC stays Pending (windows can't run on cloud anyway).
  storageClassName: longhorn-edge
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windows-vm
  namespace: windows
  labels:
    app: windows-vm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: windows-vm
  template:
    metadata:
      labels:
        app: windows-vm
    spec:
      nodeSelector:
        ecc/kvm: "true"
      # Edge nodes are tainted ecc/edge=true:NoSchedule; tolerate it to run there.
      tolerations:
        - key: ecc/edge
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 120
      priorityClassName: low
      containers:
        - name: windows
          image: dockurr/windows:5.16  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            - name: VERSION
              value: "11l"  # Windows 11 LTSC
            - name: RAM_SIZE
              value: "4G"
            - name: CPU_CORES
              value: "2"
            - name: DISK_SIZE
              value: "36G"
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: windows-secrets
                  key: WINDOWS_USERNAME
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windows-secrets
                  key: WINDOWS_PASSWORD
            - name: KVM
              value: "Y"
          ports:
            - containerPort: 8006
              name: web
              protocol: TCP
            - containerPort: 3389
              name: rdp-tcp
              protocol: TCP
            - containerPort: 3389
              name: rdp-udp
              protocol: UDP
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - mountPath: /storage
              name: storage
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "6Gi"
              cpu: "4"
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: windows-vm-storage
---
apiVersion: v1
kind: Service
metadata:
  name: windows-vm
  namespace: windows
spec:
  selector:
    app: windows-vm
  type: ClusterIP
  ports:
    - name: rdp-tcp
      port: 3389
      protocol: TCP
      targetPort: 3389
    - name: rdp-udp
      port: 3389
      protocol: UDP
      targetPort: 3389
