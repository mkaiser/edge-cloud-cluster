# PreSync: generate gitlab-oidc-client-secret and gitlab-oidc-provider secrets.
#
# Replaces the sealed secret approach — no cluster-specific data needs to be
# encrypted and committed. The OIDC client secret is generated once and
# preserved across syncs; the provider config is rebuilt from plain env vars
# on every sync so URL changes (e.g. new cluster domain) are applied automatically.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-oidc-presync
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-oidc-presync
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["gitlab-oidc-client-secret", "gitlab-oidc-provider", "gitlab-trusted-ca"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]   # resourceNames cannot restrict create (resource has no name yet)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-oidc-presync
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-oidc-presync
subjects:
- kind: ServiceAccount
  name: gitlab-oidc-presync
  namespace: gitlab
---
# Cross-namespace read of the Authentik TLS cert (to copy its CA into
# gitlab-trusted-ca). Scoped to the single secret name, cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-oidc-presync-authentik-tls
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["authentik-tls", "authentik-secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-oidc-presync-authentik-tls
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-oidc-presync-authentik-tls
subjects:
- kind: ServiceAccount
  name: gitlab-oidc-presync
  namespace: gitlab
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-oidc-presync
  namespace: gitlab
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: gitlab-oidc-presync
      restartPolicy: OnFailure
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: oidc-presync
        image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
        env:
        - name: GITLAB_URL
          value: "https://gitlab.ecc135.cape-project.eu"
        - name: OIDC_ISSUER
          value: "https://id.ecc135.cape-project.eu/application/o/gitlab/"
        command: ["/bin/sh", "-ec"]
        args:
        - |
          NS="gitlab"

          # Use the SHARED client secret that Authentik's gitlab provider expects
          # (GITLAB_OIDC_CLIENT_SECRET in authentik-secrets). Generating a random
          # one here causes "Invalid client" at the token exchange.
          CLIENT_SECRET=$(kubectl get secret authentik-secrets -n authentik \
            -o jsonpath='{.data.GITLAB_OIDC_CLIENT_SECRET}' 2>/dev/null | base64 -d)
          if [ -z "$CLIENT_SECRET" ]; then
            echo "ERROR: could not read GITLAB_OIDC_CLIENT_SECRET from authentik-secrets"; exit 1
          fi

          # Build provider config and create/update the secret.
          # Note: printf keeps all content inside the YAML block scalar indentation.
          # (A heredoc with 0-indent terminator would prematurely end the YAML block.)
          PROVIDER=$(printf '%s\n' \
            'name: openid_connect' \
            'label: "Authentik SSO"' \
            'groups_attribute: groups' \
            'admin_groups:' \
            '  - gitlab-admins' \
            'args:' \
            '  name: openid_connect' \
            '  scope:' \
            '    - openid' \
            '    - profile' \
            '    - email' \
            '    - groups' \
            '  response_type: code' \
            "  issuer: ${OIDC_ISSUER}" \
            '  discovery: true' \
            '  client_auth_method: query' \
            '  uid_field: preferred_username' \
            '  pkce: true' \
            '  client_options:' \
            '    identifier: gitlab' \
            "    secret: ${CLIENT_SECRET}" \
            "    redirect_uri: ${GITLAB_URL}/users/auth/openid_connect/callback")

          if kubectl get secret gitlab-oidc-provider -n "$NS" &>/dev/null; then
            kubectl patch secret gitlab-oidc-provider -n "$NS" \
              --type=merge \
              -p "{\"data\":{\"provider\":\"$(echo "$PROVIDER" | base64 | tr -d '\n')\"}}"
            echo "gitlab-oidc-provider updated."
          else
            kubectl create secret generic gitlab-oidc-provider \
              -n "$NS" \
              --from-literal=provider="$PROVIDER"
            echo "gitlab-oidc-provider created."
          fi

          # --- Trust the Authentik ingress CA -------------------------------------
          # GitLab's OmniAuth openid_connect uses discovery:true, so it does backend
          # HTTPS calls to Authentik and verifies the cert. On LE staging the CA is
          # untrusted (x509: unknown authority) → login fails. Copy Authentik's TLS
          # chain (authentik-tls in the authentik namespace, signed by the same LE
          # issuer as every cluster cert) into gitlab-trusted-ca, wired into
          # global.certificates.customCAs. Harmless on prod, so no toggle needed.
          # (alpine/k8s has no openssl, so read the cert via kubectl, not s_client.)
          echo "Copying Authentik CA chain from authentik/authentik-tls ..."
          CHAIN=""
          i=0
          while [ "$i" -lt 30 ]; do
            CHAIN=$(kubectl get secret authentik-tls -n authentik \
              -o jsonpath='{.data.tls\.crt}' 2>/dev/null | base64 -d 2>/dev/null || true)
            echo "$CHAIN" | grep -q "BEGIN CERTIFICATE" && break
            echo "  waiting for authentik-tls... ($i/30)"; sleep 5; i=$((i+1))
          done
          if ! echo "$CHAIN" | grep -q "BEGIN CERTIFICATE"; then
            echo "ERROR: could not read authentik-tls cert chain"; exit 1
          fi

          # cert-manager's chain stops at an intermediate (LE-staging "Yonder Yam
          # Root YR" is itself signed by the self-signed root "Pretend Pear X1").
          # curl tolerates a non-self-signed trust anchor, but Ruby/OmniAuth
          # (GitLab login) insists on reaching the self-signed root, failing with
          # "unable to get issuer certificate". Append the LE-staging root so the
          # chain is complete. Stable public cert; harmless on prod (real ISRG
          # roots are already trusted there).
          LE_STAGING_ROOT_B64=""
          CHAIN="$CHAIN
          $(echo "$LE_STAGING_ROOT_B64" | base64 -d)"
          CA_B64=$(printf '%s\n' "$CHAIN" | base64 | tr -d '\n')
          if kubectl get secret gitlab-trusted-ca -n "$NS" &>/dev/null; then
            kubectl patch secret gitlab-trusted-ca -n "$NS" --type=merge \
              -p "{\"data\":{\"authentik-ca.crt\":\"$CA_B64\"}}"
            echo "gitlab-trusted-ca updated."
          else
            kubectl create secret generic gitlab-trusted-ca -n "$NS" \
              --from-literal=authentik-ca.crt="$CHAIN"
            echo "gitlab-trusted-ca created."
          fi
