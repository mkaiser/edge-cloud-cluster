# CronJob: enforce GitLab SSO access policy from GitOps, every 15 min:
#   - sync Authentik "gitlab-admins" ∪ "employees-extended" members → GitLab admin flag
#   - disable public self-registration (signup_enabled=false); SSO
#     auto-provisioning is unaffected.
#   - OIDC-only login: disable web password authentication (no local login form);
#     root break-glass remains via `gitlab-rails console` in the webservice pod.
#
# WHY: GitLab's OmniAuth admin_groups / groups_attribute are a SAML-only feature
# (lib/gitlab/auth/saml/config.rb). The openid_connect provider silently ignores
# them, so an OIDC user is NEVER auto-promoted to admin no matter the group claim
# (the dead admin_groups: [gitlab-admins] in gitlab-oidc-provider.yaml.template is
# kept only as documentation of intent). This job is the actual mechanism: every
# 15 min it makes the Authentik "gitlab-admins" group the source of truth for the
# GitLab admin flag — promoting members, demoting stale admins (never root/bots).
#
# A user only gets the flag once they have a GitLab account, i.e. after their first
# OIDC login (members without an account yet are skipped until then).
#
# Auth:
#   Authentik: AUTHENTIK_BOOTSTRAP_TOKEN read from authentik-secrets (authentik ns)
#   GitLab:    no token — runs `rails runner` directly in the webservice pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-sync-admins
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# Read the Authentik bootstrap token (cluster-scoped: secret lives in authentik ns).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-sync-admins-authentik-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["authentik-secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-sync-admins-authentik-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-sync-admins-authentik-secrets
subjects:
- kind: ServiceAccount
  name: gitlab-sync-admins
  namespace: gitlab
---
# Exec into the GitLab webservice pod to run rails runner.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-sync-admins
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-sync-admins
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-sync-admins
subjects:
- kind: ServiceAccount
  name: gitlab-sync-admins
  namespace: gitlab
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-sync-admins
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "*/15 * * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: gitlab-sync-admins
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          containers:
          - name: sync
            image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
            env:
            # In-cluster API call → internal Service (no dependency on public DNS).
            - name: AUTHENTIK_URL
              value: "http://authentik-server.authentik.svc.cluster.local"
            # Space-separated: union of these Authentik groups is the GitLab admin set.
            - name: AUTHENTIK_GROUPS
              value: "gitlab-admins employees-extended"
            # Authentik ingress cert is LE STAGING (untrusted CA) while testing, so
            # curl rejects it (exit 60). "-k" skips verification.
            # updateConfigFromProjectSettings.sh clears this to "" (verify) when
            # certIssuerType is letsencrypt-prod.
            - name: CURL_INSECURE
              value: "-k"
            command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache curl jq >/dev/null 2>&1

              AUTHENTIK_TOKEN=$(kubectl get secret authentik-secrets -n authentik \
                -o jsonpath='{.data.AUTHENTIK_BOOTSTRAP_TOKEN}' | base64 -d)
              [ -z "$AUTHENTIK_TOKEN" ] && { echo "ERROR: could not read AUTHENTIK_BOOTSTRAP_TOKEN"; exit 1; }

              echo "Fetching Authentik admin members (groups: $AUTHENTIK_GROUPS)..."
              ADMIN_EMAILS=""
              for GRP in $AUTHENTIK_GROUPS; do
                PAGE=1
                while true; do
                  RESP=$(curl -sf $CURL_INSECURE \
                    -H "Authorization: Bearer $AUTHENTIK_TOKEN" \
                    "$AUTHENTIK_URL/api/v3/core/users/?groups__name=${GRP}&page_size=100&page=${PAGE}")
                  BATCH=$(echo "$RESP" | jq -r '.results[].email // empty')
                  [ -z "$BATCH" ] && break
                  ADMIN_EMAILS=$(printf '%s\n%s' "$ADMIN_EMAILS" "$BATCH")
                  NEXT=$(echo "$RESP" | jq -r '.pagination.next // 0')
                  [ "$NEXT" = "0" ] || [ "$NEXT" = "null" ] && break
                  PAGE=$((PAGE + 1))
                done
              done
              ADMIN_EMAILS=$(echo "$ADMIN_EMAILS" | tr '[:upper:]' '[:lower:]' | sort -u | grep -v '^$' || true)
              echo "admin members (gitlab-admins ∪ employees-extended): $(printf '%s\n' "$ADMIN_EMAILS" | grep -c . || true)"

              # JSON array of emails — valid as a Ruby literal, passed as ARGV[0] so
              # nothing is string-interpolated into the rails script.
              EMAILS_JSON=$(printf '%s\n' "$ADMIN_EMAILS" | jq -R . | jq -s -c 'map(select(length>0))')

              WEBSERVICE_POD=$(kubectl -n gitlab get pods -l app=webservice \
                --field-selector=status.phase=Running \
                -o jsonpath='{.items[0].metadata.name}')
              [ -n "$WEBSERVICE_POD" ] || { echo "ERROR: no running GitLab webservice pod"; exit 1; }
              echo "Reconciling admin flags via rails ($WEBSERVICE_POD)..."

              # rails runner reads the script from stdin ("-"); ARGV[0] is the email
              # JSON. Authentik "gitlab-admins" is authoritative: promote members,
              # demote stale human admins, never touch root or bot accounts.
              kubectl -n gitlab exec -i "$WEBSERVICE_POD" -c webservice -- \
                /srv/gitlab/bin/rails runner - "$EMAILS_JSON" <<'RUBY'
              require 'json'
              # Block public self-registration (the /users/sign_up form). SSO
              # auto-provisioning is unaffected — omniauth allowSingleSignOn still
              # creates accounts for Authentik-known users on first login. Enforced
              # here every run so it self-heals if toggled in the admin UI.
              s = ApplicationSetting.current_without_cache
              if s && s.signup_enabled
                s.update!(signup_enabled: false)
                puts "  disabled public signup_enabled"
              end
              # OIDC-only: hide the local username/password login form (web + git).
              # Authentik is the only interactive login path. Break-glass for root:
              # `gitlab-rails console` in the webservice pod (re-enable from there).
              if s && (s.password_authentication_enabled_for_web || s.password_authentication_enabled_for_git)
                s.update!(password_authentication_enabled_for_web: false,
                          password_authentication_enabled_for_git: false)
                puts "  disabled password authentication (OIDC-only)"
              end
              emails = JSON.parse(ARGV[0]).map(&:downcase)
              emails.each do |e|
                u = User.find_by('lower(email) = ?', e)
                if u.nil?
                  puts "  skip (no account yet): #{e}"
                elsif !u.admin
                  u.admin = true
                  u.save!
                  puts "  promoted: #{u.username} (#{e})"
                end
              end
              User.where(admin: true).where.not(username: 'root').find_each do |u|
                next if u.bot?
                unless emails.include?(u.email.to_s.downcase)
                  u.admin = false
                  u.save!
                  puts "  demoted: #{u.username} (#{u.email})"
                end
              end
              puts "Done."
              RUBY

              echo "Admin sync complete."
