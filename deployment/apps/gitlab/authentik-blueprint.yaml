# Authentik blueprint: GitLab OIDC provider + dashboard tile.
#
# Per-app blueprint — shipped by THIS app's ArgoCD Application into the authentik
# namespace and mounted optionally into the Authentik worker
# (deployment/infrastructure/authentik/values.yaml → worker.volumes: bp-gitlab).
# If gitlab is removed from the sync waves, this ConfigMap is never created and no
# GitLab tile appears.
#
# The gitlab-admins group is defined centrally in blueprint-groups.yaml; the
# "groups" claim lets GitLab map admin_groups (gitlab-admins).
# NOTE: the GitLab OIDC client secret is created dynamically by
# apps/gitlab/presync-oidc-secrets.yaml, but the value still originates from the
# authentik-secrets bundle (!Env GITLAB_OIDC_CLIENT_SECRET) so both sides match.
# Redirect URI uses the cluster subdomain — rewritten by updateConfigFromProjectSettings.sh.
#
# PreSync hook (wave -2): GitLab uniquely *gates* its own main sync on the
# Authentik OIDC discovery endpoint (presync-wait-authentik-oidc.yaml, wave -1).
# If this blueprint shipped as a normal manifest it would only apply during the
# main sync — i.e. AFTER the gate that waits for the provider it creates →
# deadlock. As a PreSync hook at wave -2 it is applied before the wait job, so
# Authentik creates the provider, the gate passes, and the main sync proceeds.
# hook-delete-policy BeforeHookCreation keeps the ConfigMap in place between
# syncs (the worker mounts it optionally); it is only re-created on the next sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-gitlab
  namespace: authentik
  labels:
    goauthentik.io/blueprint: "true"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  gitlab.yaml: |
    version: 1
    metadata:
      name: app-gitlab
    entries:
      - id: provider-gitlab
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: gitlab
        attrs:
          client_type: confidential
          client_id: gitlab
          client_secret: !Env GITLAB_OIDC_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://gitlab.ecc135.cape-project.eu/users/auth/openid_connect/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
      - model: authentik_core.application
        identifiers:
          slug: gitlab
        attrs:
          name: GitLab
          group: Development
          provider: !KeyOf provider-gitlab
          meta_launch_url: https://gitlab.ecc135.cape-project.eu
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/gitlab.svg
      # Access control: employees / employees-extended / admins only.
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, gitlab]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, access-employee-apps]]
        attrs:
          order: 0
          enabled: true
