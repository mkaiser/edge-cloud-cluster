# Authentik OAuth2 provider + application tile for Jitsi — managed entirely from
# this folder via the Authentik API (same mechanism as the zulip user-sync and
# the authentik postsync-set-passwords jobs), so nothing jitsi-specific has to be
# added to the authentik folder.
#
#   PostSync  job → create/update the "jitsi" OAuth2 provider and "Jitsi Meet"
#                   application (dashboard tile, group "Communication").
#   PreDelete job → delete the application + provider when the jitsi ArgoCD app
#                   is removed (de-provisioning / tile cleanup).
#
# Both read AUTHENTIK_BOOTSTRAP_TOKEN from the authentik-secrets secret in the
# authentik namespace (RBAC below) and the OIDC client secret from the
# jitsi-oidc-client-secret sealed secret in this namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jitsi-authentik
  namespace: jitsi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jitsi-authentik-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jitsi-authentik-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jitsi-authentik-secrets
subjects:
  - kind: ServiceAccount
    name: jitsi-authentik
    namespace: jitsi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jitsi-authentik-provider
  namespace: jitsi
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: jitsi-authentik
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: provider
          image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            - name: PUBLIC_URL
              value: "https://meet.ecc135.cape-project.eu"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jitsi-oidc-client-secret
                  key: OIDC_CLIENT_SECRET
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              API="http://authentik-server.authentik.svc.cluster.local/api/v3"
              TOKEN=$(kubectl get secret authentik-secrets -n authentik \
                -o jsonpath='{.data.AUTHENTIK_BOOTSTRAP_TOKEN}' | base64 -d)
              [ -z "$TOKEN" ] && { echo "ERROR: AUTHENTIK_BOOTSTRAP_TOKEN empty"; exit 1; }
              AUTH="Authorization: Bearer ${TOKEN}"

              echo "Waiting for Authentik API..."
              i=0
              while [ "$i" -lt 60 ]; do
                curl -fsS -H "$AUTH" "$API/core/users/?username=akadmin" >/dev/null 2>&1 && break
                echo "  waiting... ($i/60)"; sleep 10; i=$((i+1))
              done
              [ "$i" -ge 60 ] && { echo "ERROR: Authentik API never ready"; exit 1; }

              # First result pk for an arbitrary list endpoint+query, else "".
              first_pk() {
                curl -fsS -H "$AUTH" "$API/$1" \
                  | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print(r[0]['pk'] if r else '')"
              }

              AUTH_FLOW=$(first_pk "flows/instances/?slug=default-provider-authorization-implicit-consent")
              INVAL_FLOW=$(first_pk "flows/instances/?slug=default-provider-invalidation-flow")
              SIGN_KEY=$(first_pk "crypto/certificatekeypairs/?name=authentik%20Self-signed%20Certificate")
              echo "auth_flow=$AUTH_FLOW inval_flow=$INVAL_FLOW signing_key=$SIGN_KEY"
              [ -z "$AUTH_FLOW" ] && { echo "ERROR: authorization flow not found"; exit 1; }

              # Resolve the default scope property-mapping PKs we want to expose.
              MAP_PKS="[]"
              for s in openid profile email; do
                PK=$(first_pk "propertymappings/provider/scope/?scope_name=${s}")
                [ -n "$PK" ] && MAP_PKS=$(python3 -c "import json;l=$MAP_PKS;l.append('$PK');print(json.dumps(l))")
              done
              echo "scope mapping pks: $MAP_PKS"

              PROVIDER_PAYLOAD=$(AUTH_FLOW="$AUTH_FLOW" INVAL_FLOW="$INVAL_FLOW" \
                SIGN_KEY="$SIGN_KEY" MAP_PKS="$MAP_PKS" PUBLIC_URL="$PUBLIC_URL" \
                CLIENT_SECRET="$OIDC_CLIENT_SECRET" python3 -c "
              import json, os
              p = {
                'name': 'jitsi',
                'client_type': 'confidential',
                'client_id': 'jitsi',
                'client_secret': os.environ['CLIENT_SECRET'],
                'authorization_flow': os.environ['AUTH_FLOW'],
                'property_mappings': json.loads(os.environ['MAP_PKS']),
                'redirect_uris': [{'matching_mode': 'strict',
                                   'url': os.environ['PUBLIC_URL'] + '/oidc/tokenize'}],
                'grant_types': ['authorization_code', 'refresh_token'],
              }
              if os.environ.get('INVAL_FLOW'): p['invalidation_flow'] = os.environ['INVAL_FLOW']
              if os.environ.get('SIGN_KEY'):   p['signing_key'] = os.environ['SIGN_KEY']
              print(json.dumps(p))
              ")

              PROV_PK=$(first_pk "providers/oauth2/?name=jitsi")
              if [ -z "$PROV_PK" ]; then
                echo "Creating OAuth2 provider 'jitsi'..."
                PROV_PK=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                  -d "$PROVIDER_PAYLOAD" "$API/providers/oauth2/" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin)['pk'])")
              else
                echo "Updating OAuth2 provider 'jitsi' (pk=$PROV_PK)..."
                curl -fsS -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
                  -d "$PROVIDER_PAYLOAD" "$API/providers/oauth2/${PROV_PK}/" >/dev/null
              fi
              echo "provider pk=$PROV_PK"

              APP_PAYLOAD=$(PROV_PK="$PROV_PK" PUBLIC_URL="$PUBLIC_URL" python3 -c "
              import json, os
              print(json.dumps({
                'name': 'Jitsi Meet',
                'slug': 'jitsi',
                'provider': int(os.environ['PROV_PK']),
                'group': 'Communication',
                'meta_launch_url': os.environ['PUBLIC_URL'],
                'meta_icon': 'https://cdn.jsdelivr.net/gh/selfhst/icons/png/jitsi-meet.png',
              }))
              ")

              EXISTS=$(curl -fsS -H "$AUTH" "$API/core/applications/?slug=jitsi&superuser_full_list=true" \
                | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print('yes' if r else '')")
              if [ -z "$EXISTS" ]; then
                echo "Creating application 'Jitsi Meet'..."
                curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                  -d "$APP_PAYLOAD" "$API/core/applications/" >/dev/null
              else
                echo "Updating application 'Jitsi Meet'..."
                curl -fsS -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
                  -d "$APP_PAYLOAD" "$API/core/applications/jitsi/" >/dev/null
              fi

              # ---- access control: restrict the app to employee groups ----
              # (employees / employees-extended / admins). Once ≥1 binding exists,
              # Authentik denies everyone not matched, so external users can't enter.
              APP_PK=$(first_pk "core/applications/?slug=jitsi&superuser_full_list=true")
              # Fetch all existing bindings for THIS app once to avoid the
              # ?target=&group= cross-target false-positive bug (the filter
              # matches group bindings on ANY app, not just this target).
              BOUND_GROUPS=$(curl -fsS -H "$AUTH" "$API/policies/bindings/?target=${APP_PK}&page_size=100" \
                | python3 -c "import json,sys; print(','.join(b['group'] for b in json.load(sys.stdin)['results'] if b.get('group')))")
              bind_group() {
                gpk=$(first_pk "core/groups/?name=$1")
                if [ -z "$gpk" ]; then echo "  group '$1' not found yet — skip"; return; fi
                exists=$(echo "$BOUND_GROUPS" | tr ',' '\n' | grep -qx "$gpk" && echo yes || true)
                if [ -z "$exists" ]; then
                  echo "  binding group '$1' to Jitsi (order $2)"
                  curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                    -d "{\"target\":\"${APP_PK}\",\"group\":\"${gpk}\",\"order\":$2,\"enabled\":true}" \
                    "$API/policies/bindings/" >/dev/null
                fi
              }
              ord=0
              for g in employees employees-extended authentik-admins; do
                bind_group "$g" "$ord"; ord=$((ord+1))
              done

              echo "Jitsi Authentik provider + tile + access bindings configured."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jitsi-authentik-provider-cleanup
  namespace: jitsi
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: jitsi-authentik
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: cleanup
          image: docker.io/alpine/k8s:1.36.1  # renovate: tracked by "Container image tags" regex (docker datasource)
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              API="http://authentik-server.authentik.svc.cluster.local/api/v3"
              TOKEN=$(kubectl get secret authentik-secrets -n authentik \
                -o jsonpath='{.data.AUTHENTIK_BOOTSTRAP_TOKEN}' | base64 -d || true)
              [ -z "$TOKEN" ] && { echo "Authentik token unavailable — skipping cleanup."; exit 0; }
              AUTH="Authorization: Bearer ${TOKEN}"

              echo "Deleting application 'jitsi'..."
              curl -fsS -X DELETE -H "$AUTH" "$API/core/applications/jitsi/" >/dev/null 2>&1 || true

              PROV_PK=$(curl -fsS -H "$AUTH" "$API/providers/oauth2/?name=jitsi" \
                | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; print(r[0]['pk'] if r else '')" 2>/dev/null || true)
              if [ -n "$PROV_PK" ]; then
                echo "Deleting OAuth2 provider 'jitsi' (pk=$PROV_PK)..."
                curl -fsS -X DELETE -H "$AUTH" "$API/providers/oauth2/${PROV_PK}/" >/dev/null 2>&1 || true
              fi
              echo "Jitsi Authentik cleanup done."
