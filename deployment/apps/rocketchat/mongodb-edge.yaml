# Edge MongoDB member for Rocket.Chat — the cross-site half of rs0.
#
# This is the MongoDB analog of the deferred CNPG cross-tier replica cluster: a
# second rs0 member that runs on the EDGE tier so Rocket.Chat's data is replicated
# cloud↔edge and the app can move tiers. Cutover = elect this member PRIMARY
# (priority reconfig / rs.stepDown) — the Mongo equivalent of `kubectl cnpg promote`.
# See docs/cloud-edge-architecture.md "How to migrate a flex app cloud↔edge".
#
# EDGE-TIER placement: pinned to edge nodes via the edge node-role label + a
# toleration for the edge taint, on the longhorn-edge StorageClass. (No ecc/kvm
# — that's only for the windows VM; a Mongo member just needs to be ON an edge node.)
# Therefore it only schedules once an edge node has joined (longhorn-edge also only
# exists then); until then this StatefulSet stays Pending and rs0 keeps running on
# the cloud member alone. The rs-init Job adds this member to rs0 when it is present.
#
# replicas: 0 until edge node joins — keeps ArgoCD health check green (a Pending pod
# from an unresolvable PVC blocks the entire rocketchat Helm sync). Scale to 1 via
# `kubectl scale statefulset rocketchat-mongodb-edge -n rocketchat --replicas=1`
# after `make provision-edge` succeeds and longhorn-edge disk tag exists.
#
# Same keyfile/auth as the cloud member (shared rocketchat-mongodb secret).
---
apiVersion: v1
kind: Service
metadata:
  name: rocketchat-mongodb-edge
  namespace: rocketchat
  labels:
    app.kubernetes.io/name: rocketchat-mongodb-edge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rocketchat-mongodb-edge
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketchat-mongodb-edge
  namespace: rocketchat
  labels:
    app.kubernetes.io/name: rocketchat-mongodb-edge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: rocketchat-mongodb-edge
  replicas: 0  # scale to 1 after edge node joins (see comment above)
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketchat-mongodb-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketchat-mongodb-edge
    spec:
      # Pin to an edge node (label set by the on-premise join) + tolerate the edge
      # taint. NO ecc/kvm — a Mongo member doesn't need KVM, just an edge node.
      nodeSelector:
        node-role.kubernetes.io/edge: edge
      tolerations:
        - key: ecc/edge
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: prepare-keyfile
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - cp /secret/keyfile /keyfile/keyfile && chmod 400 /keyfile/keyfile && chown 999:999 /keyfile/keyfile
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: keyfile-secret
              mountPath: /secret
            - name: keyfile
              mountPath: /keyfile
      priorityClassName: standard
      containers:
        - name: mongodb
          image: mongo:8.3  # renovate: tracked by "Container image tags" regex (docker datasource)
          args:
            - --replSet
            - rs0
            - --bind_ip_all
            - --auth
            - --keyFile
            - /keyfile/keyfile
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rocketchat-mongodb
                  key: mongodb-root-password
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
          readinessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: keyfile-secret
          secret:
            secretName: rocketchat-mongodb
            items:
              - key: mongodb-keyfile
                path: keyfile
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-edge
        resources:
          requests:
            storage: 16Gi
