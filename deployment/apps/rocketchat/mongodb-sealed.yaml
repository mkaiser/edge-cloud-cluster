---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rocketchat-mongodb
  namespace: rocketchat
  annotations:
    # Must exist BEFORE the mongodb StatefulSet (wave -2): its pod mounts this
    # secret's keyfile at boot. ArgoCD blocks on each wave being Healthy before the
    # next, so the secret must land in an earlier wave or the StatefulSet never
    # starts → wave never completes → secret never applied (deadlock).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  encryptedData:
    mongodb-keyfile: 
    mongodb-password: 
    mongodb-root-password: 
  template:
    metadata:
      name: rocketchat-mongodb
      namespace: rocketchat
