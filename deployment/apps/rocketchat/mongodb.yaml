# Self-managed MongoDB for Rocket.Chat — a single-node replica set (rs0) on the
# official mongo image. Replaces the chart's bundled bitnami MongoDB, which is
# unmaintained and being removed from the Rocket.Chat chart (see forum post
# "moving from bitnami to official mongodb chart"). Rocket.Chat requires a replica
# set (change streams), so even one node runs with --replSet.
#
# Auth is enabled (keyfile for the replica set + SCRAM users). Root + app-user
# passwords and the keyfile come from the sealed rocketchat-mongodb secret. The
# rs-init Job initiates the replica set and creates the rocketchat user; it is
# idempotent and retries until mongod is up. Rocket.Chat connects via the sealed
# rocketchat-mongodb-uri secret (existingMongodbSecret, key mongo-uri).
---
apiVersion: v1
kind: Service
metadata:
  name: rocketchat-mongodb
  namespace: rocketchat
  labels:
    app.kubernetes.io/name: rocketchat-mongodb
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rocketchat-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketchat-mongodb
  namespace: rocketchat
  labels:
    app.kubernetes.io/name: rocketchat-mongodb
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: rocketchat-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketchat-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketchat-mongodb
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        # Keyfile from the secret is owned root:root; mongod requires it owned by
        # the running user (999) with mode 0400. Copy + chown into an emptyDir.
        - name: prepare-keyfile
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - cp /secret/keyfile /keyfile/keyfile && chmod 400 /keyfile/keyfile && chown 999:999 /keyfile/keyfile
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: keyfile-secret
              mountPath: /secret
            - name: keyfile
              mountPath: /keyfile
      priorityClassName: standard
      containers:
        - name: mongodb
          image: mongo:8.3  # renovate: tracked by "Container image tags" regex (docker datasource)
          args:
            - --replSet
            - rs0
            - --bind_ip_all
            - --auth
            - --keyFile
            - /keyfile/keyfile
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rocketchat-mongodb
                  key: mongodb-root-password
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
          readinessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: keyfile-secret
          secret:
            secretName: rocketchat-mongodb
            items:
              - key: mongodb-keyfile
                path: keyfile
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-cloud
        resources:
          requests:
            storage: 16Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rocketchat-mongodb-rs-init
  namespace: rocketchat
  annotations:
    # Sync hook (NOT PostSync): the replica set must be initiated DURING the sync
    # phase, because the RocketChat Deployments cannot reach Healthy until rs0 has a
    # PRIMARY — and a PostSync hook only fires after the app is Healthy, deadlocking.
    # A Sync hook runs alongside the manifests, decoupled from app health.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Must run AFTER the mongodb StatefulSet (wave -2) is up but BEFORE the
    # RocketChat Deployments (wave 0, chart default) start — they can't reach a
    # PRIMARY until rs0 is initiated. Wave -1 places it exactly between.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      priorityClassName: standard
      containers:
        - name: rs-init
          image: mongo:8.3  # renovate: tracked by "Container image tags" regex (docker datasource)
          env:
            - name: HOST
              value: rocketchat-mongodb-0.rocketchat-mongodb.rocketchat.svc.cluster.local
            # Edge member (cross-site half of rs0; see mongodb-edge.yaml). Added to
            # rs0 as votes:0/priority:0 (replicate-only) when resolvable (i.e. an edge
            # node has joined); skipped otherwise. Replicate-only keeps the cloud
            # member's election majority while the (intermittent) edge is offline —
            # cutover temporarily raises votes+priority to promote the edge member.
            - name: EDGE_HOST
              value: rocketchat-mongodb-edge-0.rocketchat-mongodb-edge.rocketchat.svc.cluster.local
            - name: ROOT_PW
              valueFrom:
                secretKeyRef:
                  name: rocketchat-mongodb
                  key: mongodb-root-password
            - name: APP_PW
              valueFrom:
                secretKeyRef:
                  name: rocketchat-mongodb
                  key: mongodb-password
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for mongod on ${HOST}..."
              for i in $(seq 1 60); do
                mongosh --quiet --host "$HOST" -u root -p "$ROOT_PW" --authenticationDatabase admin \
                  --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break
                # Before the replica set is initiated, auth may not be usable yet;
                # also try the localhost-exception path against the member directly.
                mongosh --quiet --host "$HOST" --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break
                echo "  waiting... ($i/60)"; sleep 5
              done

              echo "Initiating replica set rs0 (idempotent)..."
              mongosh --quiet --host "$HOST" -u root -p "$ROOT_PW" --authenticationDatabase admin --eval "
                try { rs.status(); print('replica set already initiated'); }
                catch (e) {
                  rs.initiate({_id:'rs0', members:[{_id:0, host:'${HOST}:27017'}]});
                  print('rs.initiate done');
                }
              " || mongosh --quiet --host "$HOST" --eval "
                rs.initiate({_id:'rs0', members:[{_id:0, host:'${HOST}:27017'}]});
              "

              echo "Waiting for PRIMARY..."
              for i in $(seq 1 60); do
                STATE=$(mongosh --quiet --host "$HOST" -u root -p "$ROOT_PW" --authenticationDatabase admin \
                  --eval 'try{print(db.hello().isWritablePrimary)}catch(e){print("false")}' 2>/dev/null || echo false)
                [ "$STATE" = "true" ] && { echo "PRIMARY ready."; break; }
                echo "  not primary yet... ($i/60)"; sleep 5
              done

              echo "Creating rocketchat user (idempotent)..."
              APP_PW="$APP_PW" mongosh --quiet --host "$HOST" -u root -p "$ROOT_PW" --authenticationDatabase admin --eval "
                const pw = process.env.APP_PW;
                const db = db.getSiblingDB('rocketchat');
                if (db.getUser('rocketchat')) { db.updateUser('rocketchat', {pwd: pw, roles:[{role:'readWrite', db:'rocketchat'}]}); print('user updated'); }
                else { db.createUser({user:'rocketchat', pwd: pw, roles:[{role:'readWrite', db:'rocketchat'}]}); print('user created'); }
              "
              echo "MongoDB replica set + rocketchat user ready."

              # --- Cross-site: add the edge member to rs0 when it exists ---------------
              # The edge StatefulSet (mongodb-edge.yaml) only schedules once an edge node
              # has joined; until then EDGE_HOST does not resolve, so we skip without
              # failing. Added with priority 0.5 (cloud member is 1) so cloud stays
              # PRIMARY by default; cutover raises this member's priority to promote it.
              echo "Checking for edge member ${EDGE_HOST}..."
              if getent hosts "$EDGE_HOST" >/dev/null 2>&1 || mongosh --quiet --host "$EDGE_HOST" --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
                echo "Edge member resolvable — adding to rs0 (idempotent)..."
                EDGE_HOST="$EDGE_HOST" mongosh --quiet --host "$HOST" -u root -p "$ROOT_PW" --authenticationDatabase admin --eval "
                  const edge = process.env.EDGE_HOST + ':27017';
                  const cfg = rs.conf();
                  if (cfg.members.some(m => m.host === edge)) { print('edge member already in rs0'); }
                  else {
                    const nextId = Math.max(...cfg.members.map(m => m._id)) + 1;
                    // votes:0 + priority:0 so the cloud member keeps election majority
                    // (1-of-1 voting) when the edge is offline — edge nodes are
                    // intermittent, so a voting edge member would strand rs0 without a
                    // PRIMARY whenever the edge disconnects. Cutover (see runbook)
                    // temporarily raises votes+priority to promote the edge member.
                    cfg.members.push({_id: nextId, host: edge, priority: 0, votes: 0});
                    rs.reconfig(cfg);
                    print('edge member added to rs0 (votes:0, priority:0 — replicate-only)');
                  }
                " || echo "WARN: failed to add edge member (will retry on next sync)."
              else
                echo "No edge member yet (EDGE_HOST not resolvable) — rs0 stays single-member. This is expected until an edge node joins."
              fi
